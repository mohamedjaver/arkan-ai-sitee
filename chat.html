<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>ARKAN Chat — محادثات العملاء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/supabase.js"></script>
<script src="vendor/pdf.min.js"></script>
<style>
:root{--bg:#F5F7F6;--card:#fff;--txt:#0E0F0C;--sub:#60645F;--brd:#E2E5E1;
 --pri:#0B57D0;--dark:#082B60;--ok:#168A52;--warn:#B76A00;--dgr:#C93636;--neu:#EEF1EE}
*{touch-action:manipulation;box-sizing:border-box;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer}
/* رأس */
#hd{background:var(--card);border-bottom:1px solid var(--brd);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
 display:flex;align-items:center;gap:10px;flex-shrink:0}
#hd .av{width:38px;height:38px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;
 justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
#hd .tt{flex:1;min-width:0}
#hd .tt b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hd .tt small{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px}
#hd .tt small .d{width:7px;height:7px;border-radius:50%;background:#b6bdb6}
#hd .tt small.on .d{background:var(--ok)}
.hbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--brd);background:var(--card);
 display:flex;align-items:center;justify-content:center;color:var(--txt)}
.hbtn svg{width:19px;height:19px}
/* قوائم */
#views{flex:1;min-height:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none;flex-direction:column}
.pane.on{display:flex}
#convList{padding:12px 14px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.conv{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:13px 14px;display:flex;gap:12px;
 align-items:center;transition:background .15s}
.conv:active{background:var(--neu)}
.conv .av{width:44px;height:44px;border-radius:50%;background:var(--neu);color:var(--dark);font-weight:700;
 display:flex;align-items:center;justify-content:center;flex-shrink:0}
.conv .in{flex:1;min-width:0}
.conv .nm{font-weight:600;font-size:15px}
.conv .lm{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .tm{font-size:11px;color:var(--sub);flex-shrink:0;align-self:flex-start;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--sub);padding:48px 24px;font-size:14px;line-height:2}
/* الشات */
#msgs{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;background:var(--neu);color:var(--sub);border-radius:999px;padding:4px 14px;font-size:11px;margin:8px 0 4px}
.bub{max-width:82%;border-radius:16px;padding:9px 12px;font-size:14.5px;line-height:1.7;position:relative;
 word-break:break-word;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.bub.me{align-self:flex-start;background:var(--pri);color:#fff;border-bottom-left-radius:5px}
.bub.them{align-self:flex-end;background:var(--card);border:1px solid var(--brd);border-bottom-right-radius:5px}
.bub .mt{display:flex;gap:5px;align-items:center;justify-content:flex-end;font-size:10px;opacity:.75;margin-top:3px;
 font-variant-numeric:tabular-nums}
.bub.me .mt{color:#DCE8FF}
.bub.them .mt{color:var(--sub)}
.bub img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px;cursor:pointer}
.bub .fl{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.14);border-radius:10px;padding:9px;
 text-decoration:none;color:inherit;margin-bottom:3px}
.bub.them .fl{background:var(--neu)}
.bub .fl svg{width:22px;height:22px;flex-shrink:0}
.bub .fl b{font-size:12.5px;word-break:break-all}
.rc{margin-top:6px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.9}
.bub.them .rc{background:#F0F6FF;border:1px solid #D9E7FB}
.rc b{font-variant-numeric:tabular-nums}
.rc .ar{display:inline-flex;align-items:center;gap:5px;background:var(--dark);color:#fff;border:0;border-radius:8px;
 padding:5px 11px;font-size:11.5px;margin-top:5px}
.rc .ar.done{background:var(--ok)}
/* الإدخال */
#bar{flex-shrink:0;background:var(--card);border-top:1px solid var(--brd);
 padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
#txt{flex:1;border:1px solid var(--brd);border-radius:20px;background:var(--bg);padding:11px 15px;font-size:15px;
 resize:none;max-height:110px;min-height:44px;outline:0}
#txt:focus{border-color:var(--pri)}
.ibtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--brd);background:var(--card);
 display:flex;align-items:center;justify-content:center;color:var(--sub);flex-shrink:0}
.ibtn.send{background:var(--pri);border-color:var(--pri);color:#fff}
.ibtn svg{width:20px;height:20px}
/* نوافذ */
.sheet{position:fixed;inset:0;background:rgba(14,15,12,.45);display:none;align-items:flex-end;justify-content:center;z-index:90}
.sheet.on{display:flex}
.sheet .in{background:var(--card);border-radius:20px 20px 0 0;width:min(560px,100%);max-height:80vh;overflow:auto;
 padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--brd);margin:6px auto 14px}
.sheet h3{margin:0 0 12px;font-size:18px}
.fld{width:100%;height:52px;border:1px solid var(--brd);border-radius:12px;padding:0 14px;font-size:15px;margin-bottom:10px;outline:0;background:var(--card)}
.fld:focus{border-color:var(--pri)}
.wb{width:100%;height:48px;border-radius:12px;border:0;background:var(--pri);color:#fff;font-size:15px;font-weight:600;margin-top:4px}
.wb.sec{background:var(--card);border:1px solid var(--brd);color:var(--txt)}
.codebox{background:var(--neu);border:1px dashed var(--brd);border-radius:12px;padding:12px;text-align:center;
 font-size:13px;margin:10px 0;word-break:break-all;direction:ltr}
#toast{pointer-events:none;position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);
 background:var(--dark);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;opacity:0;transition:.25s;z-index:99;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
#prog{pointer-events:none;position:fixed;top:0;left:0;height:3px;background:var(--pri);width:0;transition:width .3s;z-index:99}
/* تسجيل صوتي */
#recBar{display:none;flex:1;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--dgr);
 border-radius:20px;padding:0 14px;height:44px}
#recBar.on{display:flex}
#recBar .rd{width:10px;height:10px;border-radius:50%;background:var(--dgr);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
#recT{font-size:14px;font-variant-numeric:tabular-nums;color:var(--dgr);font-weight:600;flex:1}
#recBar button{border:0;background:none;font-size:13px;font-weight:600;padding:6px 4px}
#recCancel{color:var(--sub)}
body.rec #txt{display:none}
body.rec .ibtn.att{display:none}
/* مشغل الصوت */
.au{display:flex;align-items:center;gap:10px;min-width:190px;padding:2px 0}
.au .pl{width:36px;height:36px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bub.me .au .pl{background:rgba(255,255,255,.22);color:#fff}
.bub.them .au .pl{background:var(--neu);color:var(--dark)}
.au .pl svg{width:16px;height:16px}
.au .tr{flex:1;height:4px;border-radius:4px;background:rgba(127,127,127,.3);position:relative;cursor:pointer}
.au .tr i{position:absolute;inset-inline-start:0;top:0;bottom:0;border-radius:4px;background:currentColor;width:0}
.bub.me .au .tr i{background:#fff}
.bub.them .au .tr i{background:var(--pri)}
.au .du{font-size:11px;font-variant-numeric:tabular-nums;opacity:.8}
/* ═══ Telegram layer ═══ */
.avc0{background:linear-gradient(135deg,#0B57D0,#3E8BFF)!important;color:#fff!important}
.avc1{background:linear-gradient(135deg,#7C3AED,#B07CFF)!important;color:#fff!important}
.avc2{background:linear-gradient(135deg,#0E9F6E,#3DDC97)!important;color:#fff!important}
.avc3{background:linear-gradient(135deg,#D97706,#F5B84C)!important;color:#fff!important}
.avc4{background:linear-gradient(135deg,#DC2626,#F87171)!important;color:#fff!important}
.avc5{background:linear-gradient(135deg,#0891B2,#4DD6EE)!important;color:#fff!important}
.bub{box-shadow:0 1px 2px rgba(14,15,12,.06);animation:bpop .16s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bpop{from{transform:scale(.92) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.bub.me{background:linear-gradient(135deg,#0B57D0,#2F7BFF);border-bottom-left-radius:6px}
.bub.them{border-bottom-right-radius:6px}
.bub.me::after{content:'';position:absolute;bottom:0;inset-inline-end:auto;left:-6px;
 border:7px solid transparent;border-right-color:#0B57D0;border-bottom:0;border-left:0}
.bub.them::after{content:'';position:absolute;bottom:0;right:-6px;
 border:7px solid transparent;border-left-color:var(--card);border-bottom:0;border-right:0}
.bub.err{opacity:.6}
.day{position:sticky;top:6px;z-index:2;backdrop-filter:blur(6px);background:rgba(238,241,238,.85)}
.conv{transition:transform .12s,background .15s}
.conv:active{transform:scale(.985)}
.ub{min-width:22px;height:22px;border-radius:11px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;
 display:flex;align-items:center;justify-content:center;padding:0 6px;margin-top:4px}
/* زر متحول مايك↔إرسال */
#sendB{display:none;transition:transform .15s}
body.has-txt #sendB,body.rec #sendB{display:flex;animation:morph .18s cubic-bezier(.2,.9,.3,1.25)}
body.has-txt #micB,body.rec #micB{display:none}
@keyframes morph{from{transform:scale(.6) rotate(-30deg)}to{transform:none}}
.ibtn:active{transform:scale(.9)}
.ibtn.send{background:linear-gradient(135deg,#0B57D0,#2F7BFF);box-shadow:0 3px 10px rgba(11,87,208,.3)}
/* مؤشر الكتابة */
#hSubT .ty{color:var(--pri);font-weight:600}
.tybub{align-self:flex-end;background:var(--card);border:1px solid var(--brd);border-radius:16px;
 border-bottom-right-radius:6px;padding:12px 16px;display:none;gap:4px}
.tybub.on{display:flex}
.tybub i{width:7px;height:7px;border-radius:50%;background:#9aa39a;animation:ty 1.2s infinite}
.tybub i:nth-child(2){animation-delay:.15s}.tybub i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-5px);opacity:1}}
/* بطاقة مستند بأسلوب واتساب */
.dcard{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:12px;
 padding:10px 12px;text-decoration:none;color:inherit;min-width:225px;max-width:100%;margin-bottom:3px}
.bub.them .dcard{background:var(--neu)}
.dic{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
 color:#fff;font-size:10.5px;font-weight:800;flex-shrink:0;letter-spacing:.03em}
.dic.pdf{background:#E03E3E}.dic.xls{background:#168A52}.dic.doc{background:#0B57D0}.dic.oth{background:#60645F}
.dcard .din{flex:1;min-width:0}
.dcard .din b{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
.dcard .din small{font-size:10.5px;opacity:.75;font-variant-numeric:tabular-nums}
.dcard .ddl{width:30px;height:30px;border-radius:50%;border:1.5px solid currentColor;opacity:.7;
 display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dcard .ddl svg{width:14px;height:14px}
.bub .up{font-size:10.5px;opacity:.85}
.dprev{display:block;width:100%;max-height:170px;object-fit:cover;object-position:top;
 border-radius:12px 12px 0 0;margin-bottom:-8px;border:1px solid var(--brd);border-bottom:0;background:#fff;cursor:pointer}
.dprev+.dcard{border-radius:0 0 12px 12px}
/* شبكة الإرفاق */
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:6px 0 4px}
.ait{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;font-size:12px;color:var(--txt);font-weight:500}
.ait .ic{width:56px;height:56px;border-radius:50%;background:var(--card);border:1px solid var(--brd);
 display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(14,15,12,.06)}
.ait .ic svg{width:24px;height:24px}
.ait.c1 .ic{color:#0B57D0}.ait.c2 .ic{color:#168A52}.ait.c3 .ic{color:#E03E3E}.ait.c4 .ic{color:#7C3AED}
/* بطاقة طلب تحويل */
.treq{min-width:225px;border-radius:12px;overflow:hidden;margin-bottom:3px;border:1px solid rgba(255,255,255,.25)}
.bub.them .treq{border-color:var(--brd)}
.treq .th2{background:rgba(255,255,255,.15);padding:7px 12px;font-size:11px;font-weight:700;letter-spacing:.02em}
.bub.them .treq .th2{background:var(--neu);color:var(--dark)}
.treq .bd2{padding:10px 12px;background:rgba(255,255,255,.08)}
.bub.them .treq .bd2{background:#fff}
.treq .am{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.treq .rt{font-size:12px;opacity:.85;margin-top:2px}
.treq .nt{font-size:12px;margin-top:6px;opacity:.9}
.treq a{display:inline-flex;margin-top:8px;background:var(--dark);color:#fff;text-decoration:none;
 border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600}
.bub.me .treq a{background:#fff;color:var(--pri)}
/* دخول المالك — وسط الشاشة */
#shPin{align-items:center!important;background:rgba(8,43,96,.55);backdrop-filter:blur(8px)}
#shPin .in{border-radius:22px;max-width:360px;width:calc(100% - 40px);padding:26px 22px calc(26px + env(safe-area-inset-bottom)*0);
 animation:pinIn .25s cubic-bezier(.2,.9,.3,1.15);text-align:center}
@keyframes pinIn{from{transform:scale(.92) translateY(14px);opacity:0}to{transform:none;opacity:1}}
#shPin .grab{display:none}
.pin-logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#0B57D0,#2F7BFF);
 color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center;
 margin:0 auto 14px;box-shadow:0 8px 22px rgba(11,87,208,.35)}
#shPin h3{text-align:center;font-size:20px;margin:0 0 4px}
#shPin p{text-align:center}
#pinIn{text-align:center;font-size:26px;letter-spacing:14px;font-weight:700;direction:ltr;height:60px;
 border-radius:14px;border:1.5px solid var(--brd)}
#pinIn:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(11,87,208,.1)}
#shPin .wb{height:52px;border-radius:14px;font-size:16px;box-shadow:0 6px 16px rgba(11,87,208,.28)}
.bio-btn{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--brd);background:var(--card);
 color:var(--txt);font-size:15px;font-weight:600;margin-top:10px;display:flex;align-items:center;
 justify-content:center;gap:9px}
.bio-btn svg{width:24px;height:24px;color:var(--pri)}
.bio-btn:active{background:var(--neu)}
#pinErr{min-height:18px;font-size:12.5px;color:var(--dgr);font-weight:600;margin-top:8px}
/* العارض الداخلي */
#dvw{position:fixed;inset:0;z-index:120;background:#0E0F0C;display:none;flex-direction:column}
#dvw.on{display:flex}
#dvw .h{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
 background:rgba(14,15,12,.92);color:#fff;flex-shrink:0}
#dvw .h b{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:right}
#dvw .h button,#dvw .h a{width:38px;height:38px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
 background:none;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
#dvw .h svg{width:19px;height:19px}
#dvw .b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;display:flex;flex-direction:column;
 gap:10px;align-items:center}
#dvw .b canvas,#dvw .b img{max-width:100%;border-radius:8px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#dvw .ld{color:#9aa;font-size:13px;padding:40px 0}
.ddl.opened{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
</style>
</head>
<body>
<div id="prog"></div>
<header id="hd">
  <button class="hbtn" id="backB" style="display:none" onclick="showList()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
  <div class="av" id="hAv">A</div>
  <div class="tt"><b id="hName">ARKAN Chat</b><small id="hSub"><span class="d"></span><span id="hSubT">جارٍ الاتصال…</span></small></div>
  <button class="hbtn" id="newB" style="display:none" onclick="openNew()" title="محادثة جديدة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="hbtn" id="infoB" style="display:none" onclick="openInfo()" title="بيانات المحادثة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
</header>

<div id="views">
  <div class="pane" id="pList"><div id="convList"></div></div>
  <div class="pane" id="pChat">
    <div id="msgs"></div>
    <div id="bar">
      <div id="recBar"><span class="rd"></span><span id="recT">0:00</span>
        <button id="recCancel" onclick="recStop(false)">إلغاء</button></div>
      <button class="ibtn att" onclick="document.getElementById('camI').click()" title="الكاميرا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V9a1 1 0 011-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </button>
      <button class="ibtn att" onclick="document.getElementById('shAtt').classList.add('on')" title="إرفاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.5l-8.5 8.5a5.5 5.5 0 01-7.8-7.8L13 5a3.7 3.7 0 015.2 5.2l-8.2 8.2a1.8 1.8 0 01-2.6-2.6L15 8.3"/></svg>
      </button>
      <textarea id="txt" rows="1" placeholder="اكتب رسالة…"></textarea>
      <button class="ibtn" id="micB" onclick="recToggle()" title="رسالة صوتية">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
      </button>
      <button class="ibtn send" id="sendB" onclick="recActive?recStop(true):sendText()" title="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="transform:scaleX(-1)"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </div>
  </div>
</div>
<input type="file" id="fi" accept="image/*,.pdf" multiple hidden>
<input type="file" id="camI" accept="image/*" capture="environment" hidden>
<input type="file" id="phI" accept="image/*" multiple hidden>
<input type="file" id="dcI" accept=".pdf,application/pdf" multiple hidden>

<!-- شبكة الإرفاق -->

  <div class="in"><div class="grab"></div>

const SB_URL='https://vyxzlazwpbstigcqvizb.supabase.co';

const toast=t=>{const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2400);};

/* ── تشفير: مفتاح المحادثة = SHA-256(code|conv_id) — الخادم يخزن نصًا مشفرًا فقط ── */
async function convKey(code,cid){
  const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code+'|'+cid));
  return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
}
async function enc(txt){
  if(!KEY)return txt;
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,new TextEncoder().encode(txt));
  const b=new Uint8Array(iv.length+ct.byteLength);b.set(iv);b.set(new Uint8Array(ct),12);
  return 'enc1:'+btoa(String.fromCharCode(...b));
}
async function dec(s){
  if(!s||!s.startsWith('enc1:'))return s;
  try{
    const b=Uint8Array.from(atob(s.slice(5)),c=>c.charCodeAt(0));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},KEY,b.slice(12));
    return new TextDecoder().decode(pt);
  }catch(e){return '🔒 تعذر فك التشفير';}
}
async function sha(s){
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

}
function pinGo(){

/* ═══ Face ID عبر WebAuthn ═══ */
async function bioAvailable(){
  try{return window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}
  catch(e){return false;}
}
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const u64b=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function bioSetup(){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:'ARKAN Chat',id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'owner@arkan',displayName:'مالك ARKAN'},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},
      timeout:60000}});
    localStorage.setItem('arkan_chat_bio',b64u(cred.rawId));
    toast('فُعّل Face ID لهذا الجهاز');
  }catch(e){toast('لم يُفعّل Face ID');}
}
async function bioLogin(){
  const id=localStorage.getItem('arkan_chat_bio');
  if(!id)return;
  try{
    await navigator.credentials.get({publicKey:{
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      rpId:location.hostname,
      allowCredentials:[{type:'public-key',id:u64b(id),transports:['internal']}],
      userVerification:'required',timeout:60000}});
    pinOk();
  }catch(e){$('pinErr').textContent='لم يكتمل Face ID — استخدم الرمز';}
}

/* ── تحميل ── */
async function boot(){

  if(IS_OWNER){ $('newB').style.display='flex'; await loadConvs(); showList(); listenConvs(); }
  else{

    if(error||!data){$('hName').textContent='رابط غير صالح';$('hSubT').textContent='تحقق من الرابط مع ARKAN';return;}
    await openConv(data);
  }
}
let UNREAD={};
async function loadConvs(){
  const {data}=await sb.from('conversations').select('*').order('last_at',{ascending:false,nullsFirst:false});
  CONVS=data||[];
  try{
    const {data:u}=await sb.from('messages').select('conv_id').eq('seen',false).eq('sender',IS_OWNER?'client':'owner');
    UNREAD={};(u||[]).forEach(r=>UNREAD[r.conv_id]=(UNREAD[r.conv_id]||0)+1);
  }catch(e){}
  renderConvs();
}
function renderConvs(){
  $('convList').innerHTML=CONVS.length?CONVS.map(c=>`
    <div class="conv" onclick='openConvId("${c.id}")'>
      <div class="av ${avc(c.client_name)}">${esc((c.client_name||'?')[0])}</div>
      <div class="in"><div class="nm">${esc(c.client_name)}</div>
      <div class="lm">${esc(c.last_msg||'محادثة جديدة')}</div></div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="tm">${c.last_at?new Date(c.last_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}</div>
        ${UNREAD[c.id]?`<div class="ub">${UNREAD[c.id]}</div>`:''}
      </div>
    </div>`).join(''):
    `<div class="empty">لا محادثات بعد<br>اضغط + لإنشاء محادثة عميل وتوليد رابط دعوة مشفّر</div>`;
}

async function createConv(){
  const name=$('nName').value.trim(); if(!name)return toast('أدخل اسم العميل');
  const code=[...crypto.getRandomValues(new Uint8Array(9))].map(b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
  const {data,error}=await sb.from('conversations').insert({client_name:name,client_code:code}).select().single();
  if(error)return toast('خطأ: '+error.message);
  CONVS.unshift(data);renderConvs();
  const link=location.origin+location.pathname+'?c='+code;
  $('nOut').innerHTML=`<div class="codebox">${link}</div>
    <button class="wb" onclick="shareLink('${link}','${esc(name)}')">مشاركة الرابط عبر واتساب</button>
    <button class="wb sec" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('نُسخ الرابط'))">نسخ الرابط</button>`;
}

/* ── فتح محادثة ── */
async function openConvId(id){const c=CONVS.find(x=>x.id===id);if(c)await openConv(c);}
async function openConv(c){
  CONV=c; KEY=await convKey(c.client_code,c.id); LASTDAY='';
  $('hName').textContent=IS_OWNER?c.client_name:'ARKAN — التسويات الدولية';
  $('hAv').textContent=(IS_OWNER?c.client_name:'A')[0].toUpperCase();$('hAv').className='av '+avc(IS_OWNER?c.client_name:'ARKAN');
  $('backB').style.display=IS_OWNER?'flex':'none';
  $('infoB').style.display='flex';
  $('pList').classList.remove('on');$('pChat').classList.add('on');
  $('msgs').innerHTML='<div class="tybub" id="tyBub"><i></i><i></i><i></i></div>';
  const {data}=await sb.from('messages').select('*').eq('conv_id',c.id).order('created_at');
  for(const m of (data||[]))await renderMsg(m,false);
  scrollEnd(true); markSeen(data||[]);
  if(SUB)sb.removeChannel(SUB);
  SUB=sb.channel('m_'+c.id).on('postgres_changes',
    {event:'INSERT',schema:'public',table:'messages',filter:'conv_id=eq.'+c.id},
    async p=>{if(RENDERED.has(p.new.id))return;await renderMsg(p.new,true);scrollEnd();markSeen([p.new]);})
   .on('postgres_changes',
    {event:'UPDATE',schema:'public',table:'messages',filter:'conv_id=eq.'+c.id},
    p=>{const el=document.querySelector(`[data-mid="${p.new.id}"] .tick`);if(el&&p.new.seen)el.textContent='✓✓';})
   .on('broadcast',{event:'typing'},p=>{if(p.payload&&p.payload.who!==ME)tyShow();})
   .subscribe();
}

/* ── الرسائل ── */
function scrollEnd(now){const m=$('msgs');m.scrollTo({top:m.scrollHeight,behavior:now?'auto':'smooth'});}
function dayLbl(ts){
  const d=new Date(ts),t=new Date(),y=new Date(Date.now()-864e5);
  if(d.toDateString()===t.toDateString())return 'اليوم';
  if(d.toDateString()===y.toDateString())return 'أمس';
  return d.toLocaleDateString('en-GB');
}
async function renderMsg(m,live){
  const lbl=dayLbl(m.created_at);
  if(lbl!==LASTDAY){LASTDAY=lbl;const tb0=$('tyBub');const dh=`<div class="day">${lbl}</div>`;
    if(tb0)tb0.insertAdjacentHTML('beforebegin',dh);else $('msgs').insertAdjacentHTML('beforeend',dh);}
  const mine=m.sender===ME;
  const time=new Date(m.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  let inner='';
  if(m.kind==='text'){ inner=esc(await dec(m.body)).replace(/\n/g,'<br>'); }
  else if(m.kind==='image'){ inner=`<img src="${esc(m.file_url)}" loading="lazy" onclick="openDocViewer('${esc(m.file_url)}','${esc(m.file_name||'صورة')}')">${m.body?esc(await dec(m.body)):''}`; }
  else if(m.kind==='treq'&&m.meta&&m.meta.treq){ inner=treqHTML(m.meta.treq); }
  else if(m.kind==='audio'){
    const d=(m.meta&&m.meta.dur)||0;
    inner=`<div class="au">
      <button class="pl" onclick="auPlay(this,'${esc(m.file_url)}')">${AU_PLAY}</button>
      <span class="tr"><i></i></span>
      <span class="du" data-d="${recFmt(d)}">${recFmt(d)}</span></div>`;
  }
  else{ const mm=m.meta||{}; inner=docCardHTML(m.file_name||'ملف',m.file_url,mm.size||0,mm.thumb||'',mm.pages||0); }
  /* بيانات الإيصال المقروءة */
  const meta=m.meta||{};
  if(meta.amount){
    const archived=!!meta.archived;
    inner+=`<div class="rc">قراءة Gemini: <b>${(+meta.amount).toLocaleString('en-US')} ${esc(meta.currency||'')}</b>
      ${meta.bank?' · '+esc(meta.bank):''}${meta.reference?' · مرجع <b dir="ltr">'+esc(meta.reference)+'</b>':''}
      ${IS_OWNER?`<br><button class="ar ${archived?'done':''}" data-arc="${m.id}" onclick="archiveReceipt('${m.id}')" ${archived?'disabled':''}>${archived?'أُرشف في مركز المطابقة ✓':'إضافة للأرشيف والمطابقة'}</button>`:''}</div>`;
  }
  const tick=mine?`<span class="tick">${m.seen?'✓✓':'✓'}</span>`:'';
  const tb=$('tyBub');
  const html=`<div class="bub ${mine?'me':'them'}" data-mid="${m.id}">${inner}<div class="mt">${time} ${tick}</div></div>`;
  if(tb)tb.insertAdjacentHTML('beforebegin',html);else $('msgs').insertAdjacentHTML('beforeend',html);
  if(!live)return;
}
async function markSeen(list){
  const ids=list.filter(m=>m.sender!==ME&&!m.seen).map(m=>m.id);
  if(ids.length)await sb.from('messages').update({seen:true}).in('id',ids);
}

/* ── الإرسال ── */
const RENDERED=new Set();
async function pdfPreview(file){
  try{
    if(!window.pdfjsLib)return null;
    pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:1});
    const scale=Math.min(2,720/vp.width);
    const v2=page.getViewport({scale});
    const cv=document.createElement('canvas');cv.width=v2.width;cv.height=v2.height;
    await page.render({canvasContext:cv.getContext('2d'),viewport:v2}).promise;
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.82));
    return {blob,pages:pdf.numPages};
  }catch(e){return null;}
}
function fsize(b){return b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';}
function extCls(n){n=String(n||'').toLowerCase();
  if(n.endsWith('.pdf'))return['pdf','PDF'];
  if(/\.(xls|xlsx|csv)$/.test(n))return['xls','XLS'];
  if(/\.(doc|docx)$/.test(n))return['doc','DOC'];
  return['oth','FILE'];}
function docCardHTML(name,url,size,prev,pages){
  const [c,l]=extCls(name);
  const meta=[pages?(pages+' صفحة'):'',size?fsize(size):'',l].filter(Boolean).join(' · ');
  const op=url&&OPENED.has(url);
  const act=url?`onclick="openDocViewer('${esc(url)}','${esc(name)}')"`:'';
  return (prev?`<img class="dprev" src="${esc(prev)}" loading="lazy" ${act}>`:'')+
   `<a class="dcard" data-durl="${esc(url||'')}" ${act} style="cursor:pointer">
    <span class="dic ${c}">${l}</span>
    <span class="din"><b>${esc(name)}</b><small>${meta}</small></span>
    <span class="ddl${op?' opened':''}">${op
      ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M7 11l5 5 5-5"/></svg>'}</span></a>`;
}
function pushBub(tid,inner,st){
  const time=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const html=`<div class="bub me" data-mid="${tid}">${inner}<div class="mt"><span class="up">${st||''}</span> ${time} <span class="tick">🕓</span></div></div>`;
  const tb=$('tyBub');
  if(tb)tb.insertAdjacentHTML('beforebegin',html);else $('msgs').insertAdjacentHTML('beforeend',html);
  scrollEnd();
  return {
    ok(id){const el=document.querySelector(`[data-mid="${tid}"]`);if(!el)return;
      el.dataset.mid=id;el.querySelector('.tick').textContent='✓';
      const u=el.querySelector('.up');if(u)u.remove();RENDERED.add(id);},
    st(t){const el=document.querySelector(`[data-mid="${tid}"] .up`);if(el)el.textContent=t;},
    err(){const el=document.querySelector(`[data-mid="${tid}"]`);if(!el)return;
      el.classList.add('err');el.querySelector('.tick').textContent='⚠ لم تُرسل';}
  };
}
async function sendText(){
  const t=$('txt').value.trim(); if(!t||!CONV)return;
  $('txt').value='';$('txt').style.height='auto';document.body.classList.remove('has-txt');
  /* ظهور فوري */
  const tid='tmp_'+Date.now();
  const time=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  $('msgs').insertAdjacentHTML('beforeend',
    `<div class="bub me" data-mid="${tid}">${esc(t).replace(/\n/g,'<br>')}<div class="mt">${time} <span class="tick">🕓</span></div></div>`);
  scrollEnd();
  const body=await enc(t);
  const hash=await sha(CONV.id+'|'+body+'|'+Date.now());
  const {data,error}=await sb.from('messages').insert({conv_id:CONV.id,sender:ME,kind:'text',body,hash}).select().single();
  const el=document.querySelector(`[data-mid="${tid}"]`);
  if(error){if(el){el.classList.add('err');el.querySelector('.tick').textContent='⚠ لم تُرسل';}return;}
  if(el){el.dataset.mid=data.id;el.querySelector('.tick').textContent='✓';}
  RENDERED.add(data.id);
  sb.from('conversations').update({last_msg:t.slice(0,60),last_at:new Date().toISOString()}).eq('id',CONV.id).then(()=>{});
}
$('txt').addEventListener('input',function(){

});

$('txt').addEventListener('paste',async e=>{
  const items=[...(e.clipboardData&&e.clipboardData.items||[])].filter(i=>i.kind==='file');
  if(!items.length)return;
  e.preventDefault();
  for(const it of items){const f=it.getAsFile();if(f)await sendFile(f);}
});
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText();}});

$('fi').addEventListener('change',async e=>{
  for(const f of e.target.files)await sendFile(f);
  e.target.value='';
});
async function sendFile(f){
  if(!CONV)return;
  if(f.size>15*1024*1024)return toast('الملف أكبر من 15MB');
  const isImg=/^image\//.test(f.type);
  const tid='tmp_'+Date.now()+Math.random().toString(36).slice(2,5);
  /* ظهور فوري قبل الرفع */
  const localUrl=isImg?URL.createObjectURL(f):null;
  const isPdf=/pdf$/i.test(f.name)||f.type==='application/pdf';
  let pv=null;
  if(isPdf)pv=await pdfPreview(f);
  const localPrev=pv?URL.createObjectURL(pv.blob):'';
  const b=pushBub(tid,isImg?`<img src="${localUrl}">`:docCardHTML(f.name,null,f.size,localPrev,pv?pv.pages:0),'جارٍ الرفع…');
  prog(15);
  const path=CONV.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'.'+(f.name.split('.').pop()||'bin');
  let up=await sb.storage.from('chat').upload(path,f,{contentType:f.type||'application/octet-stream'});
  if(up.error)up=await sb.storage.from('chat').upload(path,f);
  prog(60);
  if(up.error){prog(100);b.err();return toast('فشل الرفع: '+up.error.message);}
  const url=sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
  let meta={size:f.size};
  if(pv){
    meta.pages=pv.pages;
    try{
      const tp=CONV.id+'/th_'+Date.now()+'.jpg';
      const tu=await sb.storage.from('chat').upload(tp,pv.blob,{contentType:'image/jpeg'});
      if(!tu.error)meta.thumb=sb.storage.from('chat').getPublicUrl(tp).data.publicUrl;
    }catch(e){}
  }
  const gk=localStorage.getItem('gemKey');
  if(isImg&&gk){ b.st('قراءة Gemini…'); try{ const g=await geminiLite(f,gk); if(g)meta=Object.assign(meta,g); }catch(e){} }
  prog(85);
  const hash=await sha(CONV.id+'|'+path);
  const {data,error}=await sb.from('messages').insert({conv_id:CONV.id,sender:ME,kind:isImg?'image':'file',
    body:'',file_url:url,file_name:f.name,meta,hash}).select().single();
  if(error){prog(100);b.err();return;}
  b.ok(data.id);
  /* استبدال المعاينة المحلية بفقاعة كاملة (لعرض قراءة Gemini للمالك) */
  if(meta.amount){const el=document.querySelector(`[data-mid="${data.id}"]`);if(el){el.remove();RENDERED.delete(data.id);await renderMsg(data,true);RENDERED.add(data.id);scrollEnd();}}
  sb.from('conversations').update({last_msg:isImg?'صورة إيصال':f.name,last_at:new Date().toISOString()}).eq('id',CONV.id).then(()=>{});
  prog(100);
}
/* ═══ رسائل صوتية ═══ */
let recActive=false,recMR=null,recChunks=[],recT0=0,recTimer=null,recMime='';
function recFmt(sec){return Math.floor(sec/60)+':'+String(Math.floor(sec%60)).padStart(2,'0');}
async function recToggle(){
  if(recActive)return recStop(true);
  if(!CONV)return;
  if(!navigator.mediaDevices||!window.MediaRecorder)return toast('التسجيل غير مدعوم في هذا المتصفح');
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){return toast('اسمح بالوصول للميكروفون من إعدادات الموقع');}
  recMime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  recMR=new MediaRecorder(stream,recMime?{mimeType:recMime}:undefined);
  recChunks=[];
  recMR.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  recMR.start(250);
  recActive=true;recT0=Date.now();
  document.body.classList.add('rec');
  document.getElementById('recBar').classList.add('on');
  document.getElementById('micB').style.display='none';
  recTimer=setInterval(()=>{
    const sec=(Date.now()-recT0)/1000;
    document.getElementById('recT').textContent=recFmt(sec);
    if(sec>=120)recStop(true); /* حد دقيقتين */
  },250);
}
function recStop(send){
  if(!recActive)return;
  recActive=false;clearInterval(recTimer);
  const dur=Math.round((Date.now()-recT0)/1000);
  const mr=recMR;
  mr.onstop=async()=>{
    mr.stream.getTracks().forEach(t=>t.stop());
    document.body.classList.remove('rec');
    document.getElementById('recBar').classList.remove('on');
    document.getElementById('micB').style.display='flex';
    if(!send||dur<1||!recChunks.length)return;
    const blob=new Blob(recChunks,{type:recMime||'audio/mp4'});
    await sendVoice(blob,dur);
  };
  mr.stop();
}
async function sendVoice(blob,dur){
  const tid='tmp_'+Date.now();
  const localUrl=URL.createObjectURL(blob);
  const b=pushBub(tid,`<div class="au">
      <button class="pl" onclick="auPlay(this,'${localUrl}')">${AU_PLAY}</button>
      <span class="tr"><i></i></span>
      <span class="du" data-d="${recFmt(dur)}">${recFmt(dur)}</span></div>`,'جارٍ الرفع…');
  prog(20);
  const ext=/mp4/.test(blob.type)?'m4a':'webm';
  const path=CONV.id+'/vn_'+Date.now()+'.'+ext;
  let up=await sb.storage.from('chat').upload(path,blob,{contentType:blob.type||'audio/mp4'});
  if(up.error)up=await sb.storage.from('chat').upload(path,blob);
  if(up.error)up=await sb.storage.from('chat').upload(path,new File([blob],'voice.'+ext,{type:'application/octet-stream'}));
  prog(70);
  if(up.error){prog(100);b.err();return toast('فشل رفع الصوت: '+up.error.message);}
  const url=sb.storage.from('chat').getPublicUrl(path).data.publicUrl;
  const hash=await sha(CONV.id+'|'+path);
  const {data,error}=await sb.from('messages').insert({conv_id:CONV.id,sender:ME,kind:'audio',
    body:'',file_url:url,file_name:'voice.'+ext,meta:{dur,size:blob.size},hash}).select().single();
  if(error){prog(100);b.err();return toast('فشل حفظ الرسالة: '+error.message);}
  b.ok(data.id);
  sb.from('conversations').update({last_msg:'رسالة صوتية · '+recFmt(dur),last_at:new Date().toISOString()}).eq('id',CONV.id).then(()=>{});
  prog(100);
}

function treqHTML(t){

    <div class="bd2">
      <div class="am">${(+t.amount).toLocaleString('en-US')} ${esc(t.from)}</div>

/* ═══ العارض الداخلي + حالة المفتوح ═══ */
const OPENED=new Set(JSON.parse(localStorage.getItem('arkan_opened')||'[]'));
function markOpened(u){
  if(!u||OPENED.has(u))return;
  OPENED.add(u);
  localStorage.setItem('arkan_opened',JSON.stringify([...OPENED].slice(-500)));
}
async function openDocViewer(url,name){
  markOpened(url);
  /* حدّث أيقونة البطاقة فورًا */
  document.querySelectorAll(`[data-durl="${CSS.escape(url)}"] .ddl`).forEach(el=>el.classList.add('opened'));
  const dv=$('dvw'),bd=$('dvwB');
  $('dvwT').textContent=name||'';
  $('dvwDl').href=url;
  bd.innerHTML='<div class="ld">جارٍ التحميل…</div>';
  dv.classList.add('on');
  const isPdf=/\.pdf(\?|$)/i.test(url)||/pdf/i.test(name||'');
  try{
    if(isPdf&&window.pdfjsLib){
      pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';
      const buf=await (await fetch(url)).arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      bd.innerHTML='';
      const n=Math.min(pdf.numPages,25);
      for(let i=1;i<=n;i++){
        const page=await pdf.getPage(i);
        const vp=page.getViewport({scale:1});
        const scale=Math.min(2.4,(bd.clientWidth-24)/vp.width*window.devicePixelRatio);
        const v2=page.getViewport({scale});
        const cv=document.createElement('canvas');
        cv.width=v2.width;cv.height=v2.height;
        cv.style.width=Math.min(bd.clientWidth-24,v2.width/window.devicePixelRatio)+'px';
        bd.appendChild(cv);
        await page.render({canvasContext:cv.getContext('2d'),viewport:v2}).promise;
      }
      if(pdf.numPages>n)bd.insertAdjacentHTML('beforeend','<div class="ld">…'+(pdf.numPages-n)+' صفحات إضافية — نزّل الملف كاملًا</div>');
    } else {
      bd.innerHTML=`<img src="${esc(url)}">`;
    }
  }catch(e){
    bd.innerHTML='<div class="ld">تعذر العرض — استخدم زر التنزيل أعلاه</div>';
  }
}
let curAu=null;
function auPlay(btn,url){
  const wrap=btn.closest('.au');
  const bar=wrap.querySelector('.tr i'),du=wrap.querySelector('.du');
  if(curAu&&curAu._btn!==btn){curAu.pause();}
  let au=btn._au;
  if(!au){
    au=new Audio(url);btn._au=au;au._btn=btn;
    au.addEventListener('timeupdate',()=>{
      if(au.duration)bar.style.width=(au.currentTime/au.duration*100)+'%';
      du.textContent=recFmt(au.currentTime);
    });
    au.addEventListener('ended',()=>{btn.innerHTML=AU_PLAY;bar.style.width='0';du.textContent=du.dataset.d;});
    au.addEventListener('pause',()=>{btn.innerHTML=AU_PLAY;});
    au.addEventListener('play',()=>{btn.innerHTML=AU_PAUSE;});
    wrap.querySelector('.tr').addEventListener('click',e=>{
      if(!au.duration)return;
      const r=e.currentTarget.getBoundingClientRect();
      /* RTL: النسبة من اليمين */
      au.currentTime=au.duration*(1-(e.clientX-r.left)/r.width);
    });
  }
  curAu=au;
  au.paused?au.play():au.pause();
}
const AU_PLAY='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const AU_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

async function geminiLite(file,key){
  const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file);});
  const req={contents:[{parts:[{inline_data:{mime_type:file.type,data:b64}},
    {text:'استخرج من هذا الإيصال البنكي JSON فقط بلا أي نص آخر: {"amount":0,"currency":"","bank":"","reference":"","date":"","sender":"","beneficiary":""}'}]}],
    generationConfig:{temperature:0,maxOutputTokens:300}};
  for(const m of ['gemini-2.5-flash','gemini-2.0-flash','gemini-1.5-flash']){
    try{
      const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),
        {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
      if(!r.ok)continue;
      const j=await r.json();
      const t=(j.candidates?.[0]?.content?.parts?.[0]?.text||'').replace(/```json|```/g,'').trim();
      const p=JSON.parse(t);
      if(p&&p.amount)return p;
    }catch(e){}
  }
  return null;
}

/* ── الأرشفة: كتابة مباشرة في IndexedDB الخاص بالأرشيف ── */
async function archiveReceipt(mid){
  const {data:m}=await sb.from('messages').select('*').eq('id',mid).single();
  if(!m||!m.meta)return;
  try{
    const blob=await (await fetch(m.file_url)).blob();
    const thumb=await makeThumb(blob);
    const rec={id:'chat_'+mid,fileName:m.file_name||'chat_receipt.jpg',uploadedAt:Date.now(),
      blob,thumb,engine:'gemini',ocrConfidence:85,ocrText:'',
      parsed:{amount:+m.meta.amount||0,currency:m.meta.currency||'',bank:m.meta.bank||'',
        reference:m.meta.reference||'',date:m.meta.date||'',sender:m.meta.sender||'',beneficiary:m.meta.beneficiary||''},
      rtype:'customer',party:CONV.client_name||'',
      smartName:(m.meta.bank||'RCPT')+'_'+(m.meta.amount||'')+'_'+(m.meta.currency||''),
      audit:[{ts:Date.now(),action:'وصل عبر ARKAN Chat من '+(CONV.client_name||'عميل')+' — بصمة '+String(m.hash||'').slice(0,12)}]};
    await new Promise((res,rej)=>{
      const rq=indexedDB.open('arkanArchive',2);
      rq.onerror=()=>rej(rq.error);
      rq.onsuccess=()=>{const db=rq.result;
        const tx=db.transaction('docs','readwrite');
        tx.objectStore('docs').put(rec);
        tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>rej(tx.error);};
    });
    const meta2=Object.assign({},m.meta,{archived:true});
    await sb.from('messages').update({meta:meta2}).eq('id',mid);
    const b=document.querySelector(`[data-arc="${mid}"]`);
    if(b){b.textContent='أُرشف في مركز المطابقة ✓';b.classList.add('done');b.disabled=true;}
    toast('أُضيف للأرشيف كدفعة زبون — افتح مركز المطابقة');
  }catch(e){toast('تعذر الأرشفة: '+e.message);}
}
function makeThumb(blob){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');const s=140/Math.max(img.width,img.height);
      c.width=img.width*s;c.height=img.height*s;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.7));URL.revokeObjectURL(img.src);};
    img.onerror=()=>res('');
    img.src=URL.createObjectURL(blob);
  });
}
