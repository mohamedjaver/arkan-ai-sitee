<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>الدخول — ARKAN Rates</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="arkan-icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,500..900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Public+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071D49;--primary:#003B8F;--primary-2:#0058D9;--accent:#00B5FF;--ice:#EAF5FF;
  --success:#00C853;--danger:#E53935;
  --txt:#102A43;--txt-2:#486581;--txt-3:#7A93AD;--stroke:#D9E5F2;--page:#F7FAFD;
  --r:18px;
  --disp:'IBM Plex Sans Arabic','Archivo',sans-serif;
  --body:'IBM Plex Sans Arabic','Public Sans',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
html[lang]:not([lang=ar]){--disp:'Archivo','IBM Plex Sans Arabic',sans-serif;--body:'Public Sans','IBM Plex Sans Arabic',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:clip}
body{font-family:var(--body);color:var(--txt);min-height:100dvh;display:grid;place-items:center;padding:22px;
  background:linear-gradient(180deg,#FFFFFF 0%,#EEF6FF 100%)}
.card{width:100%;max-width:440px;background:#fff;border-radius:26px;overflow:hidden;
  box-shadow:0 30px 80px -30px rgba(16,42,67,.22);border:1px solid #D9E5F2}
.head{position:relative;background:linear-gradient(135deg,#003B8F,#006BFF);
  color:#fff;padding:30px 24px 26px;text-align:center;overflow:hidden}
.head::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(360px 180px at 80% -20%, rgba(0,181,255,.4), transparent 70%)}
.head .mark{width:60px;height:60px;margin:0 auto 12px;position:relative;z-index:1;
  filter:drop-shadow(0 10px 24px rgba(0,181,255,.5))}
.head b{display:block;font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 125;
  font-weight:900;font-size:21px;letter-spacing:.08em;position:relative;z-index:1}
.head span{font-size:13px;color:rgba(234,245,255,.8);position:relative;z-index:1}
.lang{position:absolute;top:14px;inset-inline-end:14px;z-index:2;display:flex;gap:2px;
  background:rgba(255,255,255,.1);border:1px solid rgba(0,181,255,.4);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;color:rgba(234,245,255,.7);cursor:pointer;
  font:700 11px var(--disp);padding:5px 9px;border-radius:999px;transition:all .18s}
.lang button.on{background:var(--accent);color:var(--ink)}
.tabs{display:flex;border-bottom:1.5px solid var(--stroke);background:var(--page)}
.tabs button{flex:1;padding:16px;border:0;background:none;font:700 15px var(--disp);
  color:var(--txt-3);cursor:pointer;border-bottom:3px solid transparent;transition:all .18s}
.tabs button.on{color:var(--primary);border-color:var(--primary-2);background:#fff}
.body{padding:24px}
.f{margin-bottom:16px}
.f label{display:block;font-size:13px;font-weight:700;color:var(--txt-2);margin-bottom:7px}
.f input{width:100%;border:1.5px solid var(--stroke);border-radius:14px;padding:14px 16px;
  font:500 15.5px var(--body);outline:none;color:var(--txt);background:var(--page);
  transition:border-color .18s, box-shadow .18s}
.f input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,181,255,.15);background:#fff}
.pin{font-family:var(--mono) !important;letter-spacing:.35em;text-align:center;font-size:19px !important}
.go{width:100%;border:0;border-radius:16px;padding:16px;
  background:linear-gradient(135deg,#0056D6,#0099FF);color:#fff;
  font:700 16px var(--disp);cursor:pointer;margin-top:4px;
  box-shadow:0 14px 30px -10px rgba(0,88,217,.55), inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .18s, box-shadow .22s}
.go:hover{transform:translateY(-1px);box-shadow:0 20px 40px -12px rgba(0,88,217,.65)}
.go:active{transform:scale(.985)}
.alt{margin-top:16px;text-align:center;font-size:13.5px;color:var(--txt-2)}
.alt a{color:var(--primary);font-weight:700;text-decoration:none}
.msg{display:none;margin-bottom:16px;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:600}
.msg.err{display:block;background:rgba(229,57,53,.09);color:var(--danger);border:1px solid rgba(229,57,53,.25)}
.msg.ok{display:block;background:rgba(0,200,83,.1);color:#00893C;border:1px solid rgba(0,200,83,.3)}
.pinbox{display:none;background:var(--ice);border:1.5px dashed var(--accent);border-radius:16px;
  padding:18px;text-align:center;margin-bottom:16px;font-weight:700;color:var(--txt-2);font-size:13.5px}
.pinbox .p{font:600 32px var(--mono);color:var(--primary);letter-spacing:.3em;margin-top:6px}
.foot{padding:0 24px 24px;text-align:center;font-size:13px}
.foot a{color:var(--primary);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="lang" id="langSeg">
      <button data-l="ar">عربي</button><button data-l="fr">FR</button><button data-l="en">EN</button><button data-l="pt">PT</button>
    </div>
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <defs><linearGradient id="lg" x1="8" y1="56" x2="56" y2="8">
        <stop offset="0" stop-color="#0058D9"/><stop offset="1" stop-color="#00B5FF"/></linearGradient></defs>
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#071D49"/>
      <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#lg)" stroke-width="2.5"/>
      <path d="M14 46 L32 14 L50 46" stroke="url(#lg)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M20 40 C26 30, 38 30, 44 40" stroke="#EAF5FF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="20" cy="40" r="3.4" fill="#00B5FF"/><circle cx="44" cy="40" r="3.4" fill="#00B5FF"/>
    </svg>
    <b>ARKAN RATES</b><span data-i="tagline"></span>
  </div>
  <div class="tabs">
    <button id="tL" class="on" data-i="tab_login"></button>
    <button id="tR" data-i="tab_reg"></button>
  </div>
  <div class="body">
    <div class="msg" id="msg"></div>
    <div class="pinbox" id="pinbox"><span data-i="pin_save"></span><div class="p" id="pinval"></div></div>

    <form id="fL" onsubmit="return false">
      <div class="f"><label data-i="phone"></label><input id="lPhone" inputmode="tel" placeholder="36295050"></div>
      <div class="f"><label data-i="pin"></label><input id="lPin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••"></div>
      <button class="go" id="bL"></button>
      <div class="alt"><span data-i="forgot"></span> <a href="https://wa.me/22236295050?text=%D9%86%D8%B3%D9%8A%D8%AA%20%D8%B1%D9%85%D8%B2%20PIN" data-i="wa"></a></div>
    </form>

    <form id="fR" style="display:none" onsubmit="return false">
      <div class="f"><label data-i="name"></label><input id="rName" placeholder="محمد ولد أحمد"></div>
      <div class="f"><label data-i="phone"></label><input id="rPhone" inputmode="tel" placeholder="36295050"></div>
      <button class="go" id="bR"></button>
      <div class="alt" data-i="terms"></div>
    </form>
  </div>
  <div class="foot"><a href="index.html" data-i="back"></a></div>
</div>

<script>
/* i18n — display labels only; account logic untouched below */
const I18N={
ar:{tagline:"منصّة الصرف والتسويات الدولية",tab_login:"تسجيل الدخول",tab_reg:"حساب جديد",
  phone:"رقم الهاتف (واتساب)",pin:"الرمز السرّي PIN",name:"الاسم الكامل",
  bL:"دخول",bL_wait:"جارٍ الدخول…",bR:"إنشاء الحساب",bR_wait:"جارٍ الإنشاء…",
  forgot:"نسيت الرمز؟",wa:"راسلنا واتساب",terms:"بإنشائك حساباً توافق على شروط الخدمة",
  pin_save:"رمزك السرّي — احفظه",back:"← العودة للموقع",
  e_login:"أدخل الهاتف والرمز (4 أرقام)",e_wrong:"الهاتف أو الرمز غير صحيح",e_conn:"تعذّر الاتصال — جرّب لاحقاً أو راسلنا واتساب",
  ok_in:"تم الدخول ✓",e_reg:"أدخل الاسم ورقم هاتف صحيح",ok_exists:"الحساب موجود — استخدم دخول",
  ok_created:"تم إنشاء حسابك ✓ سيتم تفعيله بعد المراجعة",e_create:"تعذّر الإنشاء الآن — راسلنا واتساب لإنشاء حسابك"},
fr:{tagline:"Plateforme de change et règlements internationaux",tab_login:"Connexion",tab_reg:"Nouveau compte",
  phone:"Téléphone (WhatsApp)",pin:"Code PIN",name:"Nom complet",
  bL:"Se connecter",bL_wait:"Connexion…",bR:"Créer le compte",bR_wait:"Création…",
  forgot:"Code oublié ?",wa:"Écrivez-nous sur WhatsApp",terms:"En créant un compte, vous acceptez les conditions du service",
  pin_save:"Votre code PIN — conservez-le",back:"← Retour au site",
  e_login:"Entrez le téléphone et le code (4 chiffres)",e_wrong:"Téléphone ou code incorrect",e_conn:"Connexion impossible — réessayez ou contactez-nous sur WhatsApp",
  ok_in:"Connecté ✓",e_reg:"Entrez un nom et un numéro valides",ok_exists:"Compte existant — utilisez Connexion",
  ok_created:"Compte créé ✓ Il sera activé après vérification",e_create:"Création impossible — contactez-nous sur WhatsApp"},
en:{tagline:"International exchange & settlement platform",tab_login:"Sign in",tab_reg:"New account",
  phone:"Phone (WhatsApp)",pin:"PIN code",name:"Full name",
  bL:"Sign in",bL_wait:"Signing in…",bR:"Create account",bR_wait:"Creating…",
  forgot:"Forgot PIN?",wa:"Message us on WhatsApp",terms:"By creating an account you agree to the terms of service",
  pin_save:"Your PIN — save it",back:"← Back to site",
  e_login:"Enter phone and PIN (4 digits)",e_wrong:"Incorrect phone or PIN",e_conn:"Connection failed — try again or message us on WhatsApp",
  ok_in:"Signed in ✓",e_reg:"Enter a valid name and phone number",ok_exists:"Account exists — use Sign in",
  ok_created:"Account created ✓ It will be activated after review",e_create:"Could not create — message us on WhatsApp"},
pt:{tagline:"Plataforma de câmbio e liquidações internacionais",tab_login:"Entrar",tab_reg:"Nova conta",
  phone:"Telefone (WhatsApp)",pin:"Código PIN",name:"Nome completo",
  bL:"Entrar",bL_wait:"Entrando…",bR:"Criar conta",bR_wait:"Criando…",
  forgot:"Esqueceu o PIN?",wa:"Fale connosco no WhatsApp",terms:"Ao criar uma conta, você aceita os termos do serviço",
  pin_save:"Seu PIN — guarde-o",back:"← Voltar ao site",
  e_login:"Insira o telefone e o PIN (4 dígitos)",e_wrong:"Telefone ou PIN incorreto",e_conn:"Falha de ligação — tente novamente ou fale connosco no WhatsApp",
  ok_in:"Sessão iniciada ✓",e_reg:"Insira um nome e número válidos",ok_exists:"Conta existente — use Entrar",
  ok_created:"Conta criada ✓ Será ativada após revisão",e_create:"Não foi possível criar — fale connosco no WhatsApp"}};
let T=I18N.ar;
function setLang(l){
  T=I18N[l]||I18N.ar;
  localStorage.setItem('arkan_lang',l);
  document.documentElement.lang=l;
  document.documentElement.dir=(l==='ar')?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(el=>{const k=el.dataset.i;if(T[k]!==undefined)el.textContent=T[k];});
  document.getElementById('bL').textContent=T.bL;
  document.getElementById('bR').textContent=T.bR;
  document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
}
document.querySelectorAll('#langSeg button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
setLang(localStorage.getItem('arkan_lang')||'ar');
</script>

<script type="module">
import * as ARKAN from './arkan-core.js'; window.ARKAN=ARKAN;
const $=id=>document.getElementById(id);
const next=new URLSearchParams(location.search).get('next')||'account.html';
const msg=(t,ok)=>{const m=$('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');};
$('tL').onclick=()=>{ $('tL').classList.add('on');$('tR').classList.remove('on');$('fL').style.display='';$('fR').style.display='none'; };
$('tR').onclick=()=>{ $('tR').classList.add('on');$('tL').classList.remove('on');$('fR').style.display='';$('fL').style.display='none'; };

// جلسة قائمة → دخول مباشر
if(ARKAN.getSession()){ location.replace(next); }

$('bL').onclick=async()=>{
  const p=$('lPhone').value.trim(), pin=$('lPin').value.trim();
  if(!p||pin.length<4) return msg(T.e_login);
  $('bL').textContent=T.bL_wait;
  try{
    const u=await ARKAN.clientLogin(p,pin);
    if(!u){ msg(T.e_wrong); $('bL').textContent=T.bL; return; }
    msg(T.ok_in,1); location.replace(next);
  }catch(e){ msg(T.e_conn); $('bL').textContent=T.bL; }
};

$('bR').onclick=async()=>{
  const name=$('rName').value.trim(), phone=ARKAN.normPhone($('rPhone').value);
  if(name.length<3||phone.length<7) return msg(T.e_reg);
  $('bR').textContent=T.bR_wait;
  try{
    await ARKAN.ready;
    if(!ARKAN.firebaseOK) throw 0;
    const {doc,getDoc,setDoc,serverTimestamp}=ARKAN.fb;
    const ref=doc(ARKAN.db,'users',phone);
    const snap=await getDoc(ref);
    let pin;
    if(snap.exists()){ pin=snap.data().pin; msg(T.ok_exists,1); }
    else{
      pin=ARKAN.makePin();
      await setDoc(ref,{name,phone,pin,ref:ARKAN.makeRef(),balance:0,role:'client',status:'pending',createdAt:serverTimestamp()});
    }
    $('pinval').textContent=pin; $('pinbox').style.display='block';
    ARKAN.saveSession(phone,pin);
    msg(T.ok_created,1);
    setTimeout(()=>location.replace(next),2600);
  }catch(e){ msg(T.e_create); $('bR').textContent=T.bR; }
};
</script>
<script src="arkan-ai.js" defer></script>
</body>
</html>
