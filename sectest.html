<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فحص أمان ARKAN</title>
<style>
body{font-family:system-ui,'Segoe UI',sans-serif;background:#071D49;color:#EAF5FF;margin:0;padding:20px;line-height:1.7}
h1{font-size:19px;margin:0 0 4px}.sub{color:#9Fc3e8;font-size:13px;margin-bottom:20px}
.row{background:#0c2a5e;border:1px solid #163c7e;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row b{font-size:14px}.st{float:left;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px}
.ok{background:#0a7a3d;color:#fff}.bad{background:#c62828;color:#fff}.wait{background:#5a6b8c;color:#fff}
.d{font-size:12px;color:#9Fc3e8;margin-top:6px;clear:both}
.verdict{margin-top:18px;padding:16px;border-radius:16px;font-weight:800;text-align:center;font-size:15px}
.vok{background:linear-gradient(135deg,#0a7a3d,#0fae5a)}.vbad{background:linear-gradient(135deg,#b71c1c,#e53935)}
</style></head><body>
<h1>🔒 فحص أمان Firestore</h1>
<div class="sub">يحاول سحب بياناتك بلا حساب — تمامًا كمهاجم. النتيجة المطلوبة: كل الصفوف «محميّة».</div>
<div id="out"></div>
<div id="verdict"></div>
<script>
const KEY='AIzaSyCtL-OySTK9FeyD0h-31BiupYFtGBxbJ_U';
const BASE='https://firestore.googleapis.com/v1/projects/arkan-rates-prod/databases/(default)/documents';
const tests=[
  {c:'transactions',label:'قائمة المعاملات',want:'deny'},
  {c:'users',label:'قائمة العملاء',want:'deny'},
  {c:'payment_requests',label:'طلبات التحويل',want:'deny'},
];
const out=document.getElementById('out');
function row(label,cls,txt,d){
  const el=document.createElement('div');el.className='row';
  el.innerHTML='<span class="st '+cls+'">'+txt+'</span><b>'+label+'</b><div class="d">'+d+'</div>';
  out.appendChild(el);return el;
}
(async()=>{
  let allSafe=true;
  for(const t of tests){
    const r=row(t.label,'wait','...','جارٍ المحاولة');
    try{
      const res=await fetch(BASE+'/'+t.c+'?key='+KEY+'&pageSize=50',{cache:'no-store'});
      const j=await res.json().catch(()=>({}));
      const leaked = res.ok && Array.isArray(j.documents) && j.documents.length>0;
      const empty  = res.ok && (!j.documents || j.documents.length===0);
      if(res.status===403 || (j.error&&/permission/i.test(j.error.message||''))){
        r.querySelector('.st').className='st ok';r.querySelector('.st').textContent='محميّة ✓';
        r.querySelector('.d').textContent='رُفض السحب (403) — لا يستطيع أحد قراءتها بلا حسابك.';
      }else if(leaked){
        allSafe=false;
        r.querySelector('.st').className='st bad';r.querySelector('.st').textContent='مكشوفة ✗';
        r.querySelector('.d').textContent='⚠ سُحب '+j.documents.length+' سجلّ بلا حساب! القاعدة لم تُطبّق.';
      }else if(empty){
        r.querySelector('.st').className='st ok';r.querySelector('.st').textContent='محميّة ✓';
        r.querySelector('.d').textContent='لا بيانات مسرّبة (فارغ أو مرفوض).';
      }else{
        r.querySelector('.st').className='st ok';r.querySelector('.st').textContent='محميّة ✓';
        r.querySelector('.d').textContent='الحالة '+res.status+' — لا تسريب.';
      }
    }catch(e){
      r.querySelector('.st').className='st ok';r.querySelector('.st').textContent='محميّة ✓';
      r.querySelector('.d').textContent='تعذّر الوصول — لا تسريب.';
    }
  }
  // فحص الأسعار العامة يجب أن يقرأ
  const pr=row('الأسعار العامة','wait','...','يجب أن تُقرأ (عامة)');
  try{
    const res=await fetch(BASE+'/public/rates?key='+KEY,{cache:'no-store'});
    if(res.ok){pr.querySelector('.st').className='st ok';pr.querySelector('.st').textContent='تُقرأ ✓';
      pr.querySelector('.d').textContent='الأسعار متاحة للعملاء كما يجب.';}
    else{pr.querySelector('.st').className='st wait';pr.querySelector('.st').textContent=res.status;
      pr.querySelector('.d').textContent='لم تُقرأ — راجع بوابة الأسعار.';}
  }catch(e){}
  const v=document.getElementById('verdict');
  v.className='verdict '+(allSafe?'vok':'vbad');
  v.textContent=allSafe?'✅ آمن — بياناتك محميّة، لا تسريب':'✗ خطر — بيانات مكشوفة، أعد لصق القواعد';
})();
</script></body></html>
