<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script>if(location.protocol==="http:"&&location.hostname.indexOf("lbdal")>-1)location.replace(location.href.replace("http:","https:"));</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2F70">
<title>BDL — الصرف والتسويات الدولية</title>
<meta name="description" content="Currency exchange and cross-border settlement between Mauritania, Angola, China and the Gulf.">
<link rel="icon" href="favicon.svg?v=bdl5" type="image/svg+xml">
<link rel="icon" href="arkan-icon-512.png?v=bdl5">
<link rel="manifest" href="site-manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BDL">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=bdl5">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400..900;125,500..900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   BDL DESIGN SYSTEM v2 — "Institutional Blue"
   ============================================================ */
:root{
  --ink:#0B2F70; --primary:#003B8F; --primary-2:#0058D9; --accent:#0058D9;
  --ice:#DCEEFF; --white:#FFFFFF;
  --success:#00C853; --warning:#F9A825; --danger:#E53935;
  --gold-1:#F3D583; --gold-2:#C9992E;
  --txt:#102A43; --txt-2:#486581; --txt-3:#7A93AD;
  --stroke:#D8E8F8; --page:#F3F9FF;
  --r:999px; --r-lg:26px; --r-sm:12px; --grad-bai:linear-gradient(135deg,#0058D9 0%,#0058D9 55%,#0058D9 100%);
  --sh-card:0 12px 40px rgba(0,58,143,.08);
  --sh-pop:0 24px 60px -26px rgba(0,86,214,.18);
  --sh-navy:0 30px 70px -30px rgba(0,59,143,.4);
  --disp:'Archivo','IBM Plex Sans Arabic','Public Sans',system-ui,sans-serif;
  --body:'Public Sans','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
html[lang=ar]{--disp:'IBM Plex Sans Arabic','Archivo',sans-serif;--body:'IBM Plex Sans Arabic','Public Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{max-width:100%;overflow-x:clip}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--txt);line-height:1.65;background:linear-gradient(180deg,#F3F9FF 0%,#EAF4FF 35%,#E1F0FF 70%,#D8EBFF 100%) fixed;
  -webkit-font-smoothing:antialiased;font-size:16px}
a{color:inherit;text-decoration:none}
img,svg,canvas{display:block;max-width:100%}
.wrap{max-width:1220px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono)}
::selection{background:var(--accent);color:var(--ink)}

h1,h2,h3,.disp{font-family:var(--disp)}
html[lang]:not([lang=ar]) h1, html[lang]:not([lang=ar]) h2, html[lang]:not([lang=ar]) h3{font-variation-settings:'wdth' 118}
.eyebrow{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--primary-2);display:inline-flex;align-items:center;gap:10px}
html[lang=ar] .eyebrow{letter-spacing:0;font-size:14px}
.eyebrow::before{content:"";width:26px;height:2px;background:var(--accent);border-radius:0}
.sec-h2{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:-.02em;overflow-wrap:break-word;
  line-height:1.15;color:var(--ink);margin:14px 0 12px}
html[lang=ar] .sec-h2{letter-spacing:0}
.sec-sub{font-size:clamp(15.5px,2vw,18px);color:var(--txt-2);max-width:60ch}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--disp);font-weight:700;font-size:15.5px;border:0;cursor:pointer;
  padding:15px 28px;border-radius:0;transition:transform .18s cubic-bezier(.2,.9,.3,1.4),box-shadow .22s,background .22s;
  will-change:transform}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-primary{background:var(--grad-bai);color:#fff;
  box-shadow:0 12px 28px -10px rgba(13,71,181,.5), inset 0 1px 0 rgba(255,255,255,.28)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(0,86,214,.45), 0 0 0 6px rgba(0,153,255,.15), inset 0 1px 0 rgba(255,255,255,.25)}
.btn-gold{background:var(--grad-bai);color:#fff;
  box-shadow:0 14px 32px -10px rgba(13,71,181,.5), inset 0 1px 0 rgba(255,255,255,.3)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 20px 44px -12px rgba(0,163,255,.5), 0 0 0 6px rgba(0,163,255,.15)}
.btn-ghost-dark{background:#FFFFFF;border:0;color:#003B8F;box-shadow:0 10px 26px -12px rgba(2,14,40,.45)}
.btn-ghost-dark:hover{background:#EAF5FF;box-shadow:0 14px 32px -12px rgba(0,153,255,.5);transform:translateY(-2px)}

/* ---------- language switcher ---------- */
#wChip{position:static!important;box-shadow:none!important;margin-inline-end:10px}
.lang{display:flex;background:rgba(255,255,255,.08);border:1.5px solid rgba(0,181,255,.4);
  border-radius:0;padding:3px;gap:2px}
.lang button{border:0;background:transparent;color:rgba(234,245,255,.75);cursor:pointer;
  font:700 12.5px var(--disp);padding:7px 12px;border-radius:0;transition:all .18s;letter-spacing:.04em}
.lang button.on{background:linear-gradient(135deg,#0058D9,#0058D9);color:#fff}
.lang button:not(.on):hover{color:#fff}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(7,29,73,.86);backdrop-filter:blur(18px);
  padding-top:env(safe-area-inset-top,0px);
  border-bottom:1px solid rgba(0,181,255,.16)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:76px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:42px;height:42px;flex:none;filter:drop-shadow(0 6px 16px rgba(0,181,255,.4))}
.brand .wm{display:flex;flex-direction:column;line-height:1}
.brand .wm b{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 125;font-weight:900;
  font-size:19px;letter-spacing:.08em;color:#fff}
.brand .wm span{font-family:'Archivo',sans-serif;font-weight:700;font-size:9.5px;letter-spacing:.42em;color:var(--accent);margin-top:3px}
.nav .links{display:flex;gap:26px;margin-inline-start:22px;font-size:14.5px;font-weight:600;color:rgba(234,245,255,.75)}
.nav .links a{position:relative;padding:6px 0;transition:color .18s}
.nav .links a::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:0;height:2px;background:var(--accent);border-radius:0;transition:width .22s}
.nav .links a:hover{color:#fff}.nav .links a:hover::after{width:100%}
.nav .sp{flex:1}
.nav .btn{padding:11px 20px;font-size:14px}
.nav-toggle{display:none;width:44px;height:44px;border-radius:0;border:1.5px solid rgba(255,255,255,.3);
  background:transparent;color:#fff;cursor:pointer;font-size:20px}
.mmenu{display:none;position:fixed;inset:calc(76px + env(safe-area-inset-top,0px)) 0 auto 0;z-index:59;background:#0B2F70;
  border-bottom:1px solid rgba(0,181,255,.25);padding:18px 24px 26px}
.mmenu.open{display:block}
.mmenu a{display:block;padding:14px 4px;font-weight:700;color:#EAF5FF;font-size:17px;border-bottom:1px solid rgba(255,255,255,.08)}

/* ---------- hero ---------- */
.hero{position:relative;background:
  linear-gradient(180deg,#0B2F70 0%,#062165 58%,#003B8F 100%);
  color:#fff;overflow:hidden;padding:74px 0 0}
.hero .grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;position:relative;z-index:2}
.pill{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:700;
  color:#EAF5FF;border:1px solid rgba(0,181,255,.5);background:rgba(0,181,255,.12);
  border-radius:0;padding:9px 18px;backdrop-filter:blur(6px)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 5px rgba(0,200,83,.18);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-size:clamp(30px,6vw,68px);font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:24px 0 20px;max-width:16ch;color:#fff;overflow-wrap:break-word;hyphens:auto}
html[lang=pt] .hero h1,html[lang=fr] .hero h1{font-size:clamp(27px,5.2vw,56px);letter-spacing:-.01em;max-width:15ch}
html[lang=pt] .hero .lede,html[lang=fr] .hero .lede{font-size:clamp(15px,2vw,18px)}
html[lang=pt] .sec-h2,html[lang=fr] .sec-h2{font-size:clamp(24px,4vw,40px);overflow-wrap:break-word}
html[lang=ar] .hero h1{color:#fff;letter-spacing:0;line-height:1.25;font-size:clamp(34px,5.4vw,60px)}
.hero h1 em{font-style:normal;background:linear-gradient(92deg,#7FDBFF 0%,#00B5FF 55%,#5FB9FF 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{color:rgba(234,245,255,.87);font-size:clamp(16px,2.1vw,19.5px);max-width:52ch;margin-bottom:32px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.trust{display:flex;flex-wrap:wrap;gap:10px 22px;margin:34px 0 0;padding:0;list-style:none}
.trust li{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:rgba(234,245,255,.8)}
.trust svg{width:16px;height:16px;color:#0058D9;flex:none}

/* converter */
.xcard{background:#FCFEFF;border-radius:0;box-shadow:var(--sh-navy);
  padding:28px;color:var(--txt);position:relative}
.xcard::before{content:"";position:absolute;inset:0;border-radius:0;padding:1.5px;
  background:linear-gradient(140deg,rgba(0,181,255,.85),rgba(0,88,217,.15) 40%,rgba(0,181,255,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.xcard .xh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.xcard .xh b{font-family:var(--disp);font-size:17px;font-weight:800;color:var(--ink)}
.xtag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--primary-2);
  background:var(--ice);border-radius:0;padding:6px 12px;white-space:nowrap}
.xfield{background:#FFFFFF;border:1.5px solid #D5E5F8;border-radius:0;
  padding:20px 20px;display:flex;align-items:center;gap:14px;transition:border-color .18s, box-shadow .18s}
.xfield:focus-within{border-color:#0058D9;box-shadow:0 0 0 4px rgba(0,153,255,.18)}
.xfield .lab{font-size:12px;font-weight:700;color:var(--txt-3)}
.xfield input{border:0;background:transparent;outline:0;width:100%;min-width:0;
  font-family:var(--mono);font-weight:700;font-size:34px;color:var(--ink);direction:ltr;text-align:start}
.xfield .cur{font-family:'Archivo',sans-serif;font-weight:800;font-size:18px;color:#12213D;
  background:#F0F3F8;border:1px solid rgba(10,86,184,.10);border-radius:999px;padding:10px 16px 10px 18px;white-space:nowrap}
.xswap{display:grid;place-items:center;margin:-8px auto;position:relative;z-index:2;
  width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#fff;border:4px solid #fff;cursor:pointer;box-shadow:0 10px 24px -8px rgba(0,88,217,.55);
  transition:transform .25s}
.xswap:hover{transform:rotate(180deg)}
.xmeta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--txt-2);margin:16px 2px;flex-wrap:wrap;gap:6px}
.xmeta b{color:var(--ink);font-family:var(--mono);direction:ltr;unicode-bidi:embed}
.xcard .btn{width:100%}

/* ---------- globe ---------- */
.network{position:relative;z-index:1;margin-top:56px;padding-bottom:0}
.netcard{position:relative;border-radius:0;overflow:hidden;
  background:linear-gradient(135deg,#003B8F,#006BFF);
  box-shadow:0 30px 70px -30px rgba(0,59,143,.45)}
.nethead{display:flex;align-items:center;gap:14px;padding:20px 26px 0;position:relative;z-index:3}
.nethead .k{font-family:'Archivo',sans-serif;font-weight:800;font-size:11px;letter-spacing:.26em;color:var(--accent)}
.nethead h3{font-family:var(--disp);font-weight:800;font-size:19px;color:#fff}
.nethead .live{margin-inline-start:auto;display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(234,245,255,.7)}
.nethead .live .d{width:8px;height:8px;border-radius:50%;background:var(--success);animation:pulse 1.6s infinite}
#globe{width:100%;height:460px;display:block}
.netcard{position:relative}
.txfeed{position:absolute;left:18px;bottom:18px;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;z-index:3}
[dir=rtl] .txfeed{left:auto;right:18px}
.txchip{display:flex;align-items:center;gap:9px;background:rgba(6,22,58,.72);border:1px solid rgba(0,181,255,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:12px;padding:8px 13px;
  font:600 12.5px var(--mono);color:#EAF5FF;direction:ltr;white-space:nowrap;
  opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;box-shadow:0 6px 22px rgba(0,0,0,.28)}
.txchip.on{opacity:1;transform:translateY(0)}
.txchip .d2{width:7px;height:7px;border-radius:50%;background:#38E08D;box-shadow:0 0 8px #38E08D;flex:none}
.txchip b{color:#8FD4FF;font-weight:700}
.feed{position:absolute;inset-inline-start:26px;bottom:26px;z-index:3;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.feed .chip{display:inline-flex;align-items:center;gap:10px;background:rgba(7,29,73,.72);
  border:1px solid rgba(0,181,255,.35);backdrop-filter:blur(10px);border-radius:0;
  padding:9px 16px;font-size:13px;color:#EAF5FF;font-weight:600;opacity:0;transform:translateY(8px);
  animation:chipin .45s forwards;direction:ltr}
.feed .chip .ok{width:18px;height:18px;border-radius:50%;background:var(--success);display:grid;place-items:center;flex:none}
.feed .chip .ok svg{width:10px;height:10px;color:#fff}
.feed .chip b{font-family:var(--mono);color:#9FE3FF;font-weight:600}
@keyframes chipin{to{opacity:1;transform:none}}
.netstats{position:relative;z-index:2;background:rgba(7,30,79,.35);
  border-top:1px solid rgba(255,255,255,.14);display:grid;grid-template-columns:repeat(4,1fr)}
.netstats .st{padding:22px 26px;border-inline-end:1px solid rgba(0,181,255,.12)}
.netstats .st:last-child{border-inline-end:0}
.netstats .v{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 120;font-weight:900;
  font-size:clamp(22px,3vw,32px);color:#fff;letter-spacing:-.01em;direction:ltr}
[dir=rtl] .netstats .v{text-align:right}
.netstats .v i{font-style:normal;color:var(--accent)}
.netstats .l{font-size:12.5px;font-weight:600;color:rgba(234,245,255,.6);margin-top:4px}

/* ---------- sections ---------- */
section{padding:88px 0}
#markets{background:#F3F9FF}
#dash{background:#EDF6FF}
#ai{background:#F8FCFF}
.sec-head{margin-bottom:44px}

/* market */
.market-card{background:#FCFEFF;border:1px solid var(--stroke);border-radius:0;
  box-shadow:var(--sh-card);overflow:hidden}
.mrow{display:grid;grid-template-columns:1.6fr 1fr 1fr;align-items:center;gap:16px;
  padding:20px 28px;border-bottom:1px solid var(--stroke);transition:background .15s}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--page)}
.mrow.hd{padding:14px 28px;background:var(--ice);font-size:12px;font-weight:800;color:var(--primary)}
.pair{display:flex;align-items:center;gap:14px}
.pair .ic{width:42px;height:42px;border-radius:0;background:linear-gradient(135deg,var(--ice),#fff);
  border:1px solid var(--stroke);display:grid;place-items:center;flex:none;
  font-family:'Archivo',sans-serif;font-weight:900;font-size:11px;color:var(--primary)}
.pair b{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ink);direction:ltr;unicode-bidi:embed}
.pair span{display:block;font-size:12.5px;color:var(--txt-3);font-weight:600}
.price{font-family:var(--mono);font-weight:600;font-size:18px;color:var(--ink);direction:ltr;unicode-bidi:embed}
[dir=rtl] .price{text-align:right}
.sub2{font-family:var(--mono);font-size:13.5px;color:var(--txt-2);direction:ltr;unicode-bidi:embed}
[dir=rtl] .sub2{text-align:right}
.upd{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--txt-2);
  background:#fff;border:1px solid var(--stroke);border-radius:0;padding:8px 16px;box-shadow:var(--sh-card)}
.upd .d{width:8px;height:8px;border-radius:50%;background:var(--success)}
.upd b{font-family:var(--mono);color:var(--ink)}

/* steps */
.steps-band{background:linear-gradient(135deg,#003B8F,#006BFF);color:#fff;position:relative;overflow:hidden}
.steps-band::before{content:none}
.steps-band .eyebrow{color:var(--accent)}
.steps-band .sec-h2{color:#fff}
.steps-band .sec-sub{color:rgba(234,245,255,.75)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;position:relative;margin-top:52px}
.steps::before{content:"";position:absolute;top:31px;left:8%;right:8%;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent) 15%,var(--accent) 85%,transparent);opacity:.4}
.step{position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(0,181,255,.22);
  border-radius:0;padding:54px 24px 26px;backdrop-filter:blur(6px);transition:transform .22s,border-color .22s}
.step:hover{transform:translateY(-4px);border-color:var(--accent)}
.step .n{position:absolute;top:0;inset-inline-start:24px;transform:translateY(-50%);
  width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--primary-2),var(--accent));color:#fff;
  font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;border:5px solid #0D4FBF;
  box-shadow:0 12px 28px -8px rgba(0,181,255,.6)}
.step h4{font-family:var(--disp);font-weight:800;font-size:18px;margin-bottom:8px}
.step p{font-size:14.5px;color:rgba(234,245,255,.72);line-height:1.7}

/* balances */
.balances{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:8px}
.bal{background:#FCFEFF;border:1px solid var(--stroke);border-radius:0;padding:26px;
  box-shadow:var(--sh-card);position:relative;overflow:hidden;transition:transform .22s,box-shadow .22s}
.bal:hover{transform:translateY(-6px);box-shadow:var(--sh-pop)}
.bal::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--primary-2),var(--accent))}
.bal .cur{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--txt-2)}
.bal .cur .cc{width:34px;height:34px;border-radius:0;background:var(--ice);display:grid;place-items:center;
  font-family:'Archivo',sans-serif;font-weight:900;font-size:11px;color:var(--primary)}
.bal .amt{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 118;font-weight:900;
  font-size:clamp(24px,2.6vw,32px);color:var(--ink);letter-spacing:-.01em;margin:14px 0 6px;direction:ltr}
[dir=rtl] .bal .amt{text-align:right}

/* visa */
.visa{background:#EEF7FF}
.visa .grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.card3d{perspective:1200px}
.vcard{position:relative;aspect-ratio:1.586;border-radius:0;padding:28px;color:#fff;direction:ltr;text-align:left;
  background:
    radial-gradient(500px 260px at 85% -20%, rgba(0,181,255,.5), transparent 60%),
    linear-gradient(135deg,#0B2F70 0%,#003B8F 55%,#0058D9 100%);
  box-shadow:var(--sh-navy);transform:rotateY(-9deg) rotateX(4deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column}
.card3d:hover .vcard{transform:rotateY(0) rotateX(0)}
.vcard::after{content:"";position:absolute;inset:0;border-radius:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.12) 45%,transparent 60%);pointer-events:none}
.vcard .row1{display:flex;justify-content:space-between;align-items:flex-start}
.vcard .chip{width:46px;height:34px;border-radius:0;background:linear-gradient(135deg,var(--gold-1),var(--gold-2))}
.vcard .num{font-family:var(--mono);font-size:clamp(17px,2.4vw,22px);letter-spacing:.14em;margin:auto 0 18px;font-weight:600}

.walletsec{background:linear-gradient(180deg,#0B2F70 0%,#0A2A66 100%);color:#EAF5FF;position:relative;overflow:hidden}

.wkard{position:relative;border-radius:0;padding:26px;direction:ltr;text-align:left;

  transition:transform .5s cubic-bezier(.2,.8,.2,1);color:#fff}
.card3d:hover .wkard{transform:rotateY(0) rotateX(0)}
.wkard::after{content:"";position:absolute;inset:0;border-radius:0;

.wkard .row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}

.wkard .tdot{width:7px;height:7px;border-radius:50%;background:#5CFFB1;box-shadow:0 0 10px #5CFFB1;animation:wpulse 2s infinite}
@keyframes wpulse{50%{opacity:.4}}
.wkard .tsym{width:38px;height:38px;border-radius:50%;background:#26A17B;display:grid;place-items:center;font-weight:800;font-size:19px;font-family:Arial}
.wkard .wlbl{font-size:11px;letter-spacing:.14em;color:rgba(234,245,255,.65);font-family:var(--mono)}
.wkard .wamt{font-family:var(--mono);font-size:clamp(30px,4vw,40px);font-weight:700;letter-spacing:-.5px;margin:4px 0 22px}
.wkard .wamt small{font-size:16px;color:#7FE3C1;font-weight:600;margin-left:8px}
.wkard .waddr{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);border-radius:0;padding:10px 14px;font-family:var(--mono);font-size:12.5px;letter-spacing:.05em}
.race{margin-top:26px;display:grid;gap:14px}
.race .rrow{display:grid;gap:7px}
.race .rmeta{display:flex;justify-content:space-between;font-size:12.5px;color:rgba(234,245,255,.75)}
.race .rmeta b{color:#fff;font-weight:600}
.race .rbar{height:9px;border-radius:0;background:rgba(255,255,255,.08);overflow:hidden}
.race .rfill{height:100%;border-radius:0}
.race .bank .rfill{width:96%;background:rgba(234,245,255,.28)}
.race .ark .rfill{width:7%;background:linear-gradient(90deg,#26A17B,#5CFFB1);box-shadow:0 0 14px rgba(92,255,177,.55)}
.race .ark .rmeta b{color:#5CE0B8}
@media (max-width:900px){.walletsec .grid{grid-template-columns:1fr;gap:40px}}
.vfeat{list-style:none;margin:26px 0 30px;display:grid;gap:14px}
.vfeat li{display:flex;gap:14px;align-items:flex-start;font-size:15.5px;color:var(--txt)}
.vfeat .tick{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid var(--stroke);
  display:grid;place-items:center;color:var(--success);box-shadow:var(--sh-card)}
.vfeat .tick svg{width:13px;height:13px}
.vprice{display:flex;align-items:baseline;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.vprice b{font-family:'Archivo','IBM Plex Sans Arabic',sans-serif;font-weight:900;font-size:clamp(34px,4vw,44px);color:var(--ink);letter-spacing:-.02em;direction:ltr;unicode-bidi:embed}
.vprice span{font-weight:600;color:var(--txt-2)}

/* ai */
.ai-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:8px}
.ai-card{background:#FCFEFF;border:1px solid var(--stroke);border-radius:0;padding:30px;
  box-shadow:var(--sh-card);transition:transform .22s,box-shadow .22s,border-color .22s}

.ai-card .ic{width:54px;height:54px;border-radius:0;display:grid;place-items:center;color:#fff;

.ai-card .ic svg{width:26px;height:26px}
.ai-card h4{font-family:var(--disp);font-weight:800;font-size:19px;color:var(--ink);margin-bottom:8px}
.ai-card p{font-size:15px;color:var(--txt-2)}

/* footer */
footer{background:#0B2F70;color:#EAF5FF;padding:56px 0 42px;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;

.f-grid{display:flex;flex-wrap:wrap;align-items:center;gap:20px 34px}

.f-copy{width:100%;margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);

  .balances{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  #globe{height:340px}
  .feed{inset-inline-start:16px;bottom:16px}
}

}

body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;

/* ═══ الأسعار المتدرجة المنشورة من لوحة التسوية (جملة/متوسط/تجزئة) ═══ */
let TIERS={}, TIER_TS=null;
async function loadTiers(){
  let d=null;
  /* 1) السحابة (منشور بلا رمز) */
  try{
    const FS='https://firestore.googleapis.com/v1/projects/arkan-rates-prod/databases/(default)/documents/public/rates?key=AIzaSyCtL-OySTK9FeyD0h-31BiupYFtGBxbJ_U';
    const c=await fetch(FS+'&t='+Date.now(),{cache:'no-store'});
    if(c.ok){ const j=await c.json();
      const raw=j.fields&&j.fields.json&&j.fields.json.stringValue;
      if(raw) d=JSON.parse(raw); }
  }catch(e){}
  /* 2) الملف الثابت احتياطًا */
  try{
    if(!d){ const r=await fetch('rates-data.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)return; d=await r.json(); }
    (d.r||[]).forEach(x=>{ if(x.ccy) TIERS[x.ccy]=x; });
    TIER_TS=d.date||null;
    const u=document.getElementById('updDate'); if(u&&TIER_TS)u.textContent=TIER_TS;
    calc(); renderMarket();
  }catch(e){}
}
/* يختار الشريحة حسب حجم مبلغ العميل بالعملة الأجنبية */
function tierFor(ccy,fx){
  const t=TIERS[ccy]; if(!t)return null;
  const thr=+t.thr||0, thrM=+t.thrM||0;

const fmt=(n,d=2)=>(+n||0).toLocaleString('en-US',{maximumFractionDigits:d});

function R(){ // units per 1 USD — مشتقة من أسعار لبدال المنشورة (تشمل الهامش)
  const t=c=>(TIERS[c]&&+TIERS[c].r>0)?+TIERS[c].r:null;   /* MRO لكل وحدة */
  const usd=t('USDT')||RATES.usd_mro;                       /* MRO لكل دولار */
  const per=(c,fb)=>t(c)?usd/t(c):fb;
  return {USD:1,USDT:1,
    MRU:usd/10,
    AOA:per('AOA',RATES.usd_mro/RATES.aoa_mro),
    EUR:per('EUR',RATES.usd_mro/RATES.eur_mro),
    CNY:per('CNY',RATES.usd_cny), AED:per('AED',RATES.usd_aed),
    NGN:per('NGN',RATES.usd_ngn), EGP:per('EGP',RATES.usd_egp)};
}

function renderMarket(){

  const pub=(c,tier)=>{ const x=TIERS[c]; if(!x)return null; const v=+(x[tier]||x.r); return v>0? v/10 : null; };
  const has=c=>!!TIERS[c];
  const mruPer=c=>pub(c,'r');                    /* سعر التجزئة المعروض في الجدول */
  const wPer=c=>pub(c,'w');
  const rows=[];
  /* USD → MRU */
  rows.push(['USD','MRU', has('USD')?mruPer('USD'):r.MRU, has('USD')?`${fmt(mruPer('USD')*10,1)} MRO`:`${fmt(RATES.usd_mro,1)} MRO`]);
  /* EUR → MRU */
  rows.push(['EUR','MRU', has('EUR')?mruPer('EUR'):r.MRU/r.EUR, has('EUR')?`${fmt(mruPer('EUR')*10,1)} MRO`:`${fmt(RATES.eur_mro,1)} MRO`]);
  /* AOA → MRU (منشور غالبًا) */
  if(has('AOA')) rows.push(['AOA','MRU', mruPer('AOA'), `1000 Kz = ${fmt(1000*mruPer('AOA'),0)} MRU`]);
  /* MRU → AOA */
  const aoaPerMru = has('AOA') ? 1/mruPer('AOA') : (r.AOA/r.MRU);
  rows.push(['MRU','AOA', aoaPerMru, `1000 MRU = ${fmt(1000*aoaPerMru,0)} Kz`]);
  /* USD/EUR → AOA (اشتقاق من الأسعار المنشورة إن توفرت) */
  const usdMru = has('USD')?mruPer('USD'):r.MRU;
  const eurMru = has('EUR')?mruPer('EUR'):r.MRU/r.EUR;
  rows.push(['USD','AOA', usdMru*aoaPerMru, `1 USD = ${fmt(usdMru*aoaPerMru,0)} Kz`]);
  rows.push(['EUR','AOA', eurMru*aoaPerMru, `1 EUR = ${fmt(eurMru*aoaPerMru,0)} Kz`]);
  /* CNY / AED / USDT */
  if(has('CNY')) rows.push(['CNY','MRU', mruPer('CNY'), `${fmt(mruPer('CNY')*10,1)} MRO`]);
  else rows.push(['CNY','MRU', r.MRU/r.CNY, `${fmt(RATES.usd_mro/RATES.usd_cny,1)} MRO`]);
  if(has('AED')) rows.push(['AED','MRU', mruPer('AED'), `${fmt(mruPer('AED')*10,1)} MRO`]);
  else rows.push(['AED','MRU', r.MRU/r.AED, `${fmt(RATES.usd_mro/RATES.usd_aed,1)} MRO`]);
  if(has('USDT')) rows.push(['USDT','MRU', mruPer('USDT'), `${fmt(mruPer('USDT')*10,1)} MRO`]);

  else rows.push(['NGN','MRU', r.MRU/r.NGN, `1000 ₦ = ${fmt(1000*(RATES.usd_mro/10)/RATES.usd_ngn,0)} MRU`]);
  if(has('EGP')) rows.push(['EGP','MRU', mruPer('EGP'), `${fmt(mruPer('EGP')*10,2)} MRO`]);
  else rows.push(['EGP','MRU', r.MRU/r.EGP, `${fmt(RATES.usd_mro/RATES.usd_egp,2)} MRO`]);
  const wsNote={ar:'جملة',fr:'Gros',en:'Whsl',pt:'Grosso'}[LANG]||'جملة';

(function(){

  ];
  const CORRIDORS=[[3,0],[4,0],[3,1],[4,1],[5,2],[7,2],[3,10],[4,9],[6,1],[3,8],[4,11],[5,10],[3,4],[3,12],[12,1],[3,13],[13,1],[12,0]];

  resize(); addEventListener('resize',resize);

  const TILT=-0.42;
  function proj(lat,lon,rot){
    const la=lat*Math.PI/180, lo=lon*Math.PI/180+rot;
    let x=Math.cos(la)*Math.sin(lo), y=Math.sin(la), z=Math.cos(la)*Math.cos(lo);
    const y2=y*Math.cos(TILT)-z*Math.sin(TILT);
    const z2=y*Math.sin(TILT)+z*Math.cos(TILT);
    return {x:cx+x*Rr, y:cy-y2*Rr, z:z2};
  }
  function slerpPt(a,b,t,rot){
    const A=[a[1]*Math.PI/180,a[2]*Math.PI/180], B=[b[1]*Math.PI/180,b[2]*Math.PI/180];
    const v1=[Math.cos(A[0])*Math.sin(A[1]),Math.sin(A[0]),Math.cos(A[0])*Math.cos(A[1])];
    const v2=[Math.cos(B[0])*Math.sin(B[1]),Math.sin(B[0]),Math.cos(B[0])*Math.cos(B[1])];
    const dot=Math.max(-1,Math.min(1,v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2]));
    const om=Math.acos(dot), so=Math.sin(om)||1e-6;
    const k1=Math.sin((1-t)*om)/so, k2=Math.sin(t*om)/so;

    const lo=Math.atan2(x,z)+rot, la=Math.asin(Math.max(-1,Math.min(1,y/lift)));

  let rot=0.35, last=0;
  const particles=CORRIDORS.map(c=>({c,t:Math.random(),sp:0.0016+Math.random()*0.0016}));

  function frame(ts){

        if(p.z>0){ if(!vis){ctx.moveTo(p.x,p.y);vis=true;} else ctx.lineTo(p.x,p.y);} else vis=false;

    }

      const a=CITIES[pt.c[0]],b=CITIES[pt.c[1]];
      const p=slerpPt(a,b,pt.t,rot);
      if(p.z>0){

    const r=ROUTES[Math.floor(Math.random()*ROUTES.length)];
    let amt=rnd(r[3][0],r[3][1]);
    amt=amt>100000?Math.round(amt/10000)*10000:amt>1000?Math.round(amt/100)*100:Math.round(amt);
    const el=document.createElement('div');el.className='txchip';
    el.innerHTML='<span class="d2"></span><span>'+r[0]+' → '+r[1]+'</span><b>'+amt.toLocaleString('en-US')+' '+r[2]+'</b>';
    feed.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
    setTimeout(()=>{el.classList.remove('on');setTimeout(()=>el.remove(),550);},5200);
    while(feed.children.length>3)feed.firstChild.remove();
  }
  pushTx(); setTimeout(pushTx,1300);
  setInterval(pushTx,2600+Math.random()*900);
})();

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{loadTiers();});
else loadTiers();
setInterval(loadTiers,180000);
