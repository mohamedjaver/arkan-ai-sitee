<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F9FF">
<title>ARKAN Intelligence Archive</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="arkan-icon-512.png">
<link rel="manifest" href="manifest.json">

<script src="vendor/pdf.min.js"></script>

<style>
/* ═══════════════════════════════════════════════════════════
   ARKAN INTELLIGENCE ARCHIVE v2 — Premium Banking System
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg1:#F3F9FF;--bg2:#EAF4FF;--bg3:#E1F0FF;--bg4:#D8EBFF;
  --card:#FCFEFF;--cardline:#D8E8F8;
  --acc:#0058D9;--acc2:#00A2FF;--deep:#003B8F;--navy:#041B4A;
  --txt:#102A43;--dim:#486581;--faint:#8FA6C0;
  --green:#00C853;--red:#E53935;--warn:#FFB300;--cyan:#00D4E8;--orange:#FF8A3D;
  --sh:0 12px 40px rgba(0,58,143,.08);
  --shH:0 22px 54px rgba(0,86,214,.14);
  --grad:linear-gradient(135deg,#0058D9,#00A2FF);
  --ff:'IBM Plex Sans Arabic',sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:clip}
body{font-family:var(--ff);color:var(--txt);min-height:100vh;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 35%,var(--bg3) 70%,var(--bg4) 100%) fixed}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.04;
  background-image:linear-gradient(#003B8F 1px,transparent 1px),linear-gradient(90deg,#003B8F 1px,transparent 1px);
  background-size:44px 44px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
.mono{font-family:var(--mono)}
a{color:inherit;text-decoration:none}
::selection{background:var(--acc2);color:#fff}

/* ── header ── */
header{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  background:rgba(252,254,255,.88);border-bottom:1px solid var(--cardline)}
.hd{display:flex;align-items:center;gap:12px;padding:12px 16px;max-width:1180px;margin:0 auto}
.hd .mark{width:40px;height:40px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,153,255,.35))}
.hd .tt{line-height:1.15}
.hd .tt b{font-family:'Archivo',var(--ff);font-variation-settings:'wdth' 125;font-weight:900;
  font-size:15px;letter-spacing:.06em;color:var(--navy)}
.hd .tt b span{color:var(--acc2)}
.hd .tt small{display:block;font-size:9.5px;letter-spacing:.3em;color:var(--faint);font-weight:600}
.hd .sp{flex:1}
.gchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  border-radius:999px;padding:7px 13px;border:1px solid var(--cardline);background:#fff;color:var(--dim);cursor:pointer;
  transition:transform .18s}
.gchip:active{transform:scale(.95)}
.gchip .d{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.gchip.on{border-color:rgba(0,200,83,.4);color:#0A7A3D;background:#F0FCF5}
.gchip.on .d{background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── search ── */
.searchbar{padding:12px 16px 0;max-width:1180px;margin:0 auto;position:relative;z-index:2}
.sfield{display:flex;align-items:center;gap:10px;background:#FFF;border:1.5px solid #D5E5F8;
  border-radius:18px;padding:13px 16px;transition:border-color .18s,box-shadow .18s;box-shadow:var(--sh)}
.sfield:focus-within{border-color:#0099FF;box-shadow:0 0 0 4px rgba(0,153,255,.16)}
.sfield svg{width:19px;height:19px;color:var(--acc);flex:none}
.sfield input{border:0;outline:0;flex:1;font:500 15px var(--ff);color:var(--txt);background:transparent;min-width:0}
.sfield input::placeholder{color:var(--faint)}
.sfield .ai{flex:none;border:0;cursor:pointer;border-radius:12px;padding:8px 13px;font:700 12px var(--ff);
  background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(0,88,217,.3);transition:filter .18s,transform .18s}
.sfield .ai:hover{filter:brightness(1.08)}
.sfield .ai:active{transform:scale(.95)}
.hint{font-size:11px;color:var(--faint);margin:8px 4px 0;line-height:1.7}

/* ── tabs ── */
.vtabs{display:flex;align-items:center;gap:8px;padding:14px 16px 4px;max-width:1180px;margin:0 auto}
.vt{border:1px solid var(--cardline);background:#fff;color:var(--dim);border-radius:999px;
  padding:9px 18px;font:700 13px var(--ff);cursor:pointer;transition:all .2s}
.vt.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(0,88,217,.3)}
.vt:not(.on):hover{border-color:#0099FF;color:var(--deep)}

/* ── KPI dashboard ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--cardline);border-radius:20px;padding:16px;
  border-top:3px solid var(--acc2);box-shadow:0 8px 24px rgba(0,58,143,.06);
  transition:transform .25s,box-shadow .25s;animation:rise .4s both}
.kpi:hover{transform:translateY(-4px);box-shadow:var(--shH)}
.kpi.g{border-top-color:var(--green)}.kpi.c{border-top-color:var(--cyan)}
.kpi.o{border-top-color:var(--orange)}.kpi.b{border-top-color:var(--acc)}
.kpi .k{font-size:11px;font-weight:600;color:var(--dim)}
.kpi .v{font-family:var(--mono);font-weight:600;font-size:clamp(19px,2.4vw,26px);color:var(--navy);margin-top:6px;direction:ltr;text-align:right}
.kpi .s{font-size:10.5px;color:var(--faint);margin-top:3px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ── upload zone ── */
.uz{position:relative;border-radius:26px;padding:2px;background:linear-gradient(135deg,rgba(0,162,255,.5),rgba(0,88,217,.15) 45%,rgba(0,212,232,.45));
  margin:6px 0 16px;transition:transform .25s}
.uz.drag{transform:scale(1.012)}
.uz .in{border-radius:24px;background:var(--card);padding:26px 20px;text-align:center;
  border:1.5px dashed rgba(0,153,255,.35);transition:background .2s,border-color .2s}
.uz.drag .in{background:#EFF8FF;border-color:#00A2FF}
.uz .ic{width:62px;height:62px;margin:0 auto 12px;border-radius:20px;display:grid;place-items:center;
  background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(0,88,217,.35);animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.uz .ic svg{width:28px;height:28px}
.uz h3{font-size:16.5px;font-weight:700;color:var(--navy)}
.uz p{font-size:12.5px;color:var(--dim);margin:6px 0 14px}
.uz .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;cursor:pointer;border-radius:16px;padding:13px 22px;font:700 14px var(--ff);
  transition:transform .18s,filter .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 10px 24px rgba(0,88,217,.35)}
.btn-p:hover{filter:brightness(1.08);box-shadow:0 14px 30px rgba(0,162,255,.4)}
.btn-s{background:#EDF6FF;color:var(--deep);border:1px solid #BFD9F7}
.btn-s:hover{background:#E2F0FF;border-color:#0099FF}
.btn-d{background:#FDEBEA;color:var(--red);border:1px solid #F5C6C4}

/* ── filter chips ── */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--cardline);background:#fff;color:var(--dim);border-radius:999px;
  padding:8px 15px;font:600 12.5px var(--ff);cursor:pointer;transition:all .18s;white-space:nowrap}
.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.chip:not(.on):hover{border-color:#0099FF;color:var(--deep)}

/* ── insights ── */
.insights{background:linear-gradient(135deg,#003B8F,#006BFF);border-radius:24px;padding:18px 20px;color:#fff;
  margin-bottom:16px;box-shadow:0 18px 44px rgba(0,59,143,.3);display:none}
.insights.show{display:block;animation:rise .4s both}
.insights h4{display:flex;align-items:center;gap:9px;font-size:14px;margin-bottom:10px}
.insights h4 svg{width:18px;height:18px;color:#7FE3FF}
.insights .it{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;padding:7px 0;color:rgba(234,245,255,.92);
  border-top:1px solid rgba(255,255,255,.12);cursor:pointer}
.insights .it:hover{color:#fff}
.insights .it .b{flex:none;width:7px;height:7px;border-radius:50%;background:#7FE3FF;margin-top:6px}

/* ── timeline ── */
.tl-group{margin-bottom:8px}
.tl-head{display:flex;align-items:center;gap:12px;padding:16px 4px 12px;position:relative}
.tl-head .dot{width:13px;height:13px;border-radius:50%;background:var(--grad);flex:none;
  box-shadow:0 0 0 4px rgba(0,153,255,.15)}
.tl-head b{font-size:15px;color:var(--navy)}
.tl-head span{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.tl-head .ln{flex:1;height:1.5px;background:linear-gradient(90deg,rgba(0,153,255,.35),transparent)}
.tl-docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;
  padding-inline-start:6px;border-inline-start:2px solid rgba(0,153,255,.18);margin-inline-start:6px;padding-bottom:6px}

/* ── doc card ── */
.doc{display:flex;gap:13px;background:var(--card);border:1px solid var(--cardline);border-radius:22px;
  padding:14px;box-shadow:0 8px 26px rgba(0,58,143,.06);cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:rise .35s both}
.doc:hover{transform:translateY(-5px);border-color:rgba(0,153,255,.45);box-shadow:var(--shH)}
.doc .th{width:74px;height:92px;flex:none;border-radius:14px;background:#EDF3FA center/cover no-repeat;
  border:1px solid var(--cardline);position:relative;overflow:hidden}
.doc .th.pdf::after{content:"PDF";position:absolute;bottom:5px;left:5px;background:var(--red);color:#fff;
  font:700 8.5px var(--mono);padding:2px 6px;border-radius:6px}
.doc .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.doc .nm{font-size:13.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc .amt{font-family:var(--mono);font-weight:600;font-size:19px;color:var(--deep);margin:4px 0 2px;direction:ltr;text-align:right}
.doc .amt small{font-size:12px;color:var(--acc2);font-weight:600}
.doc .mt{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:10.5px;color:var(--dim);margin-top:auto;padding-top:6px}
.doc .mt span{display:inline-flex;align-items:center;gap:4px}
.badges{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:5px}
.bdg{font:700 9px var(--ff);border-radius:8px;padding:3px 7px}
.bdg.dup{background:#FDEBEA;color:var(--red)}
.bdg.rev{background:#FFF6E0;color:#9A6B00}
.bdg.ok{background:#EAFBF1;color:#0A7A3D}
.bdg.chain{background:#E5F7FF;color:#0071A8}
.conf{position:relative;width:40px;height:40px;flex:none;align-self:flex-end}
.conf svg{transform:rotate(-90deg)}
.conf .t{position:absolute;inset:0;display:grid;place-items:center;font:600 10px var(--mono);color:var(--deep)}

/* ── empty state ── */
.empty{text-align:center;padding:56px 20px;color:var(--dim);animation:rise .4s both}
.empty .art{width:120px;height:120px;margin:0 auto 16px;border-radius:36px;display:grid;place-items:center;
  background:linear-gradient(135deg,#EDF6FF,#FFFFFF);border:1px solid var(--cardline);box-shadow:var(--sh)}
.empty .art svg{width:54px;height:54px;color:#9CC4F0}
.empty b{font-size:16px;color:var(--navy);display:block;margin-bottom:6px}
.empty p{font-size:12.5px;line-height:1.8}

/* ── modal (preview) ── */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(4,27,74,.55);backdrop-filter:blur(10px);
  padding:14px;overflow-y:auto}
.modal.on{display:block}
.mbox{max-width:1040px;margin:16px auto;background:var(--card);border-radius:26px;overflow:hidden;
  border:1px solid var(--cardline);box-shadow:0 44px 120px rgba(2,14,40,.5);animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(14px)}to{opacity:1;transform:none}}
.mh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--cardline);
  background:linear-gradient(180deg,#FFFFFF,#F6FAFF)}
.mh b{font-size:14.5px;color:var(--navy);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .x{border:0;background:#EDF6FF;color:var(--deep);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:15px}
.mgrid{display:grid;grid-template-columns:1.05fr .95fr;gap:0}
.mview{position:relative;background:#0B1E42;min-height:380px;display:grid;place-items:center;overflow:hidden}
.mview img{max-width:100%;max-height:74vh;transition:transform .25s;transform-origin:center;will-change:transform}
.mtools{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;
  background:rgba(4,27,74,.75);backdrop-filter:blur(10px);border:1px solid rgba(0,162,255,.4);
  border-radius:999px;padding:7px}
.mtools button{border:0;background:transparent;color:#BFE4FF;width:38px;height:38px;border-radius:50%;
  cursor:pointer;display:grid;place-items:center;transition:background .15s}
.mtools button:hover{background:rgba(0,162,255,.25);color:#fff}
.mtools svg{width:18px;height:18px}
.mdata{padding:18px;max-height:74vh;overflow-y:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f{background:#F6FAFF;border:1px solid var(--cardline);border-radius:14px;padding:10px 12px}
.f.w{grid-column:1/-1}
.f .k{font-size:10px;color:var(--faint);font-weight:600}
.f .v{font-size:13.5px;font-weight:600;color:var(--txt);margin-top:3px;word-break:break-all;direction:ltr;text-align:right;font-family:var(--mono)}
.f .v.ar{direction:rtl;text-align:right;font-family:var(--ff)}
.flags{margin:12px 0}
.flag{display:flex;gap:9px;align-items:flex-start;font-size:12px;padding:9px 12px;border-radius:12px;margin-bottom:7px}
.flag.h{background:#FDEBEA;color:#9C2A25}
.flag.m{background:#FFF6E0;color:#8A5F00}
.flag.l{background:#EAFBF1;color:#0A7A3D}
.mact{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.mact .btn{flex:1;min-width:130px;padding:12px 10px;font-size:12.5px}
.audit{margin-top:14px;border-top:1px dashed var(--cardline);padding-top:10px}
.audit .a{font-size:10.5px;color:var(--faint);padding:3px 0;font-family:var(--mono);direction:ltr;text-align:right}

/* ── chains ── */
.chaincard{background:var(--card);border:1px solid var(--cardline);border-radius:24px;padding:18px;
  margin-bottom:14px;box-shadow:var(--sh);animation:rise .35s both}
.chaincard h4{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--navy);margin-bottom:14px}
.chaincard h4 .mono{color:var(--acc);font-size:12px}
.chainflow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.cstep{flex:none;width:150px;background:#F6FAFF;border:1px solid var(--cardline);border-radius:16px;
  padding:12px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.cstep:hover{transform:translateY(-3px);border-color:#0099FF}
.cstep .cc{font:700 11px var(--ff);color:var(--acc);margin-bottom:5px}
.cstep .ca{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--navy);direction:ltr}
.cstep .cd{font-size:10px;color:var(--faint);margin-top:4px}
.carrow{flex:none;align-self:center;padding:0 6px;color:var(--acc2)}
.carrow svg{width:20px;height:20px}

/* ── stats ── */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.statcard{background:var(--card);border:1px solid var(--cardline);border-radius:24px;padding:18px;box-shadow:var(--sh)}
.statcard h4{font-size:13px;color:var(--navy);margin-bottom:12px}
.statcard canvas{width:100%;height:170px}
.toplist .tr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #EDF3FA;font-size:12.5px}
.toplist .tr:last-child{border-bottom:0}
.toplist .tr b{flex:1;color:var(--txt)}
.toplist .tr .bar{flex:2;height:7px;border-radius:4px;background:#EDF3FA;overflow:hidden}
.toplist .tr .bar i{display:block;height:100%;border-radius:4px;background:var(--grad)}
.toplist .tr span{font-family:var(--mono);font-size:11.5px;color:var(--dim);direction:ltr}

/* ── toast queue ── */
#tq{position:fixed;bottom:calc(104px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.tqi{background:#fff;border:1px solid var(--cardline);border-radius:16px;padding:11px 14px;
  box-shadow:0 18px 40px rgba(0,58,143,.18);animation:rise .3s both}
.tqi .l{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--txt);margin-bottom:7px}
.tqi .l span:last-child{color:var(--acc);font-family:var(--mono);font-size:11px}
.tqi .p{height:6px;border-radius:4px;background:#EDF3FA;overflow:hidden}
.tqi .p i{display:block;height:100%;border-radius:4px;background:var(--grad);transition:width .3s;width:0}

/* barcode modal (shared pattern) */
#bcModal{display:none;position:fixed;inset:0;z-index:900;align-items:center;justify-content:center;
  background:rgba(4,27,74,.6);backdrop-filter:blur(12px);padding:22px}
#bcModal.on{display:flex}
#bcModal .bx{background:#fff;border-radius:22px;padding:24px 20px 18px;max-width:380px;width:100%;text-align:center;
  border:1.5px solid rgba(0,153,255,.5);box-shadow:0 40px 100px rgba(2,14,40,.5)}
#bcModal svg{width:100%;height:auto}
#bcModal .rf{font:600 13px var(--mono);color:var(--deep);margin:8px 0 14px;direction:ltr}

@media (max-width:820px){
  .mgrid{grid-template-columns:1fr}
  .mview{min-height:280px}
  .mview img{max-height:44vh}
  .mdata{max-height:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── وضع التحديد الجماعي ── */
.vt.selmode{background:#FDEBEA;color:#C62828;border-color:#F5C6C4}
.doc .ck{position:absolute;top:10px;inset-inline-start:10px;width:26px;height:26px;border-radius:50%;
  border:2px solid #BFD9F7;background:#fff;display:none;place-items:center;z-index:2;
  transition:all .18s;box-shadow:0 4px 10px rgba(16,42,67,.12)}
.doc .ck svg{width:14px;height:14px;color:#fff;opacity:0}
body.selecting .doc .ck{display:grid}
body.selecting .doc:hover{transform:none}
.doc.picked{border-color:#0099FF;box-shadow:0 0 0 3px rgba(0,153,255,.25), var(--sh)}
.doc.picked .ck{background:var(--grad);border-color:transparent}
.doc.picked .ck svg{opacity:1}
#selbar{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:calc(96px + env(safe-area-inset-bottom));
  z-index:250;display:flex;gap:10px;align-items:center;background:#041B4A;border:1px solid rgba(0,162,255,.4);

/* ═══════════════════════════════════════════════════════════
   DB — same database as before: zero data loss

let DB=null;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('arkanArchive',2);
  r.onupgradeneeded=e=>{const db=e.target.result;
    if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'id'});
    if(!db.objectStoreNames.contains('settlements'))db.createObjectStore('settlements',{keyPath:'id'});};
  r.onsuccess=e=>{DB=e.target.result;res();};r.onerror=rej;});}
const putDoc=d=>new Promise((res,rej)=>{const tx=DB.transaction('docs','readwrite');tx.objectStore('docs').put(d);tx.oncomplete=res;tx.onerror=rej;});
const allDocs=()=>new Promise(res=>{const out=[];const c=DB.transaction('docs','readonly').objectStore('docs').openCursor();
  c.onsuccess=e=>{const cu=e.target.result;if(cu){out.push(cu.value);cu.continue();}else res(out.sort((a,b)=>(b.uploadedAt||0)-(a.uploadedAt||0)));};});
const delDoc=id=>new Promise(res=>{const tx=DB.transaction('docs','readwrite');tx.objectStore('docs').delete(id);tx.oncomplete=res;});

let CACHE=[], FILTER={}, QUERY='', VIEW='arch';
let SORT=localStorage.getItem('arkan_sort')||'rc_desc';
function setSort(v){SORT=v;localStorage.setItem('arkan_sort',v);renderTimeline();}
/* الطابع الزمني الفعّال للإيصال: تاريخه المقروء (+وقته) وإلا وقت الرفع */
function effTs(d){
  const p=d.parsed||{};
  if(p.date&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)){
    let t='12:00:00';
    if(p.time&&/^\d{1,2}:\d{2}/.test(p.time))t=p.time.length<=5?p.time+':00':p.time;
    const ts=Date.parse(p.date+'T'+t);
    if(!isNaN(ts))return ts;
  }
  return d.uploadedAt||0;
}
function sortDocs(docs){
  const s=[...docs];
  switch(SORT){
    case 'rc_asc':  s.sort((a,b)=>effTs(a)-effTs(b)); break;
    case 'up_desc': s.sort((a,b)=>(b.uploadedAt||0)-(a.uploadedAt||0)); break;
    case 'up_asc':  s.sort((a,b)=>(a.uploadedAt||0)-(b.uploadedAt||0)); break;
    case 'amt_desc':s.sort((a,b)=>((b.parsed?.amount)||0)-((a.parsed?.amount)||0)); break;
    case 'amt_asc': s.sort((a,b)=>((a.parsed?.amount)||0)-((b.parsed?.amount)||0)); break;
    default:        s.sort((a,b)=>effTs(b)-effTs(a)); /* rc_desc */
  }
  return s;
}
const $=id=>document.getElementById(id);

/* ═══ Gemini engine — shared key with settlement ('gemKey') ═══ */
const getKey=()=>localStorage.getItem('gemKey')||'';
function promptKey(){

const GEM_SCHEMA=`{"transaction_id":"","reference":"","bank":"","amount":0,"currency":"","date":"YYYY-MM-DD","time":"","country":"","beneficiary":"","sender":"","wallet_address":"","iban":"","swift":"","fee":0,"exchange_rate":"","status":"","institution":"","branch":"","notes":"","doc_type":"","quality":{"cropped":false,"blurry":false,"edited_suspicion":false,"missing_corners":false,"issues":""},"confidence":0}`;
async function geminiExtract(b64,mime,modelChain){
  const key=getKey(); if(!key)throw new Error('NOKEY');
  const prompt=`أنت محرك OCR مالي مؤسسي. اقرأ هذا المستند (قد يكون بالعربية أو الفرنسية أو الإنجليزية أو البرتغالية أو الصينية): إيصال بنكي، تحويل، كشف حساب، إيصال كريبتو، SWIFT، أو فاتورة.
اقرأ كل حرف ثم افهم المعنى واستخرج JSON فقط بلا أي نص آخر وبهذه البنية حرفيًا:
${GEM_SCHEMA}
- amount رقم فقط بلا فواصل، وأضف حقلاً "amount_verbatim" فيه نص المبلغ حرفيًا كما هو مكتوب في المستند (مثل "Kz 8 780 000,00").
- ⚠️ المبلغ هو قيمة حقل Montante/المبلغ/Total/Valor فقط (مثل: Kz 8 000 000,00 → 8000000). لا تضع أبدًا في amount أرقام Movimento أو Número de Operação أو Transacção أو CHAVE أو PIN أو Conta/IBAN — هذه أرقام تعريفية تذهب في transaction_id/reference.
- تجاهل تمامًا أرقام التذييل القانوني (Capital Social، NIF، الهواتف).
- الكوانزا الأنغولية: AOA (تظهر كـ Kz أو KZ أو AKZ). الأوقية: MRU (أو UM). انتبه للفواصل الأوروبية 1.234.567,89 والمسافات 8 000 000,00.
- قيّم جودة الصورة في quality (مقصوصة؟ ضبابية؟ أثر تعديل؟ زوايا ناقصة؟).
- confidence: ثقتك 0-100 في دقة المبلغ والمرجع.`;
  const body={contents:[{parts:[{text:prompt},{inline_data:{mime_type:mime||'image/jpeg',data:b64}}]}],
    generationConfig:{temperature:0,responseMimeType:'application/json'}};
  let j=null,ok=false,last='';
  for(const m of (modelChain||['gemini-2.5-flash','gemini-2.0-flash','gemini-flash-latest'])){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+key,
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    j=await r.json().catch(()=>({}));
    if(r.ok){ok=true;break;}
    last=(j.error&&j.error.message)||('HTTP '+r.status);
    if(r.status!==429&&r.status!==404&&r.status!==503)throw new Error(last);
  }
  if(!ok)throw new Error(last||'Gemini unavailable');
  const t=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(p=>p.text||'').join('');
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

/* ═══ Tesseract fallback (vendor-first, same pattern as before) ═══ */
let worker=null,_wi=null;
async function getWorker(){
  if(worker)return worker; if(_wi)return _wi;
  _wi=(async()=>{
    let local=false;
    try{const r=await fetch('vendor/eng.traineddata.gz',{method:'HEAD'});local=r.ok;}catch(e){}
    const w=local
      ? await Tesseract.createWorker('eng',1,{workerPath:'vendor/worker.min.js',corePath:'vendor/',langPath:'vendor',workerBlobURL:false,gzip:true})
      : await Tesseract.createWorker('eng',1,{corePath:'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.0/tesseract-core-simd.wasm.js',langPath:'https://tessdata.projectnaptha.com/4.0.0'});
    worker=w;return w;})();
  return _wi;
}
const BANKS=['BAI','BIC','ATLANTICO','ATLÂNTICO','BCI','BFA','BPM','BMCI','BNM','SGM','BANKILY','SEDAD','MASRVI','BINANCE','HTX','OKX','BYBIT','KEYSTONE','SBM','ORABANK'];
function stripFooter(t){
  // قص تذييل البنك القانوني (Capital Social Kz 157 545 000 000 وغيره) قبل أي استخراج
  const m=t.search(/CAPITAL\s+SOCIAL|REGISTO\s+NO\s+BNA|CONSERVAT[ÓO]RIA|SOCIEDADE\s+ABERTA|LINHA\s+DE\s+ATENDIMENTO|CASO\s+NECESSITE/i);
  return m>80? t.slice(0,m) : t;
}
function parseNum(s){
  s=String(s).trim();
  s=s.replace(/[\u202F\u2009]/g,' ');
  if(/,\d{2}$/.test(s)) s=s.replace(/[ .\u00A0]/g,'').replace(',','.');      // 8 000 000,00 · 18.000.000,00
  else if(/\.\d{2}$/.test(s)) s=s.replace(/[ ,\u00A0]/g,'');                 // 1,392,076.00
  else s=s.replace(/[ ,.\u00A0]/g,'');                                        // أعداد صحيحة مجمّعة
  const n=parseFloat(s); return isFinite(n)?n:0;
}
const AMT_LBL=/MONTANTE|MONTANT|TOTAL|VALOR|IMPORT[ÂA]NCIA|AMOUNT|المبلغ|القيمة|المجموع/i;
const CUR_TOK=/\bKZ\b|\bAKZ\b|\bAOA\b|\bMRU\b|\bUM\b|\bUSDT\b|\bUSD\b|\bEUR\b|\$|€|أوقية|كوانزا/i;
const ID_LBL=/MOVIMENTO|OPERA[ÇC][ÃA]O|TRANSAC[ÇC]|TRANSFER[ÊE]NCIA\s+ATRIBU|CONTA|IBAN|CHAVE|\bPIN\b|N[ºO°]|NIF|TEL|SWIFT|REF|رقم\s+العملية|الحساب/i;
function localParse(rawText){
  const text=stripFooter(rawText||'');
  const T=text.toUpperCase();
  const p={};
  p.bank=BANKS.find(b=>T.includes(b))||'';
  const cur=T.match(/\b(USDT|USD|AOA|MRU|EUR|CNY|AED|AKZ|KZ|UM)\b/);
  p.currency=cur?({KZ:'AOA',AKZ:'AOA',UM:'MRU'}[cur[1]]||cur[1]):'';
  /* ── القاعدة 1: المبلغ الملتصق بالعملة (قبلها أو بعدها) — أقوى إشارة ── */
  const NUM='((?:\\d[\\d \\u00A0\\u202F\\u2009.,]*)?\\d)';
  const CURS=[['KZ|AKZ|AOA','AOA'],['MRU|\\bUM\\b|أوقية','MRU'],['USDT','USDT'],['USD|\\$','USD'],['EUR|€','EUR']];
  let anchored=[];
  for(const [pat,cc] of CURS){
    for(const m of T.matchAll(new RegExp('(?:'+pat+')\\s*[:\\-]?\\s*'+NUM,'g')))
      anchored.push({v:parseNum(m[1]),cc,dec:/[.,]\d{2}$/.test(m[1].trim())});
    for(const m of T.matchAll(new RegExp(NUM+'\\s*(?:'+pat+')(?![A-Z])','g')))
      anchored.push({v:parseNum(m[1]),cc,dec:/[.,]\d{2}$/.test(m[1].trim())});
  }
  anchored=anchored.filter(x=>x.v>0&&x.v<1e12);
  if(anchored.length){
    anchored.sort((x,y)=>(y.dec-x.dec)||(y.v-x.v));   /* الصيغة النقدية ,00 أولاً ثم الأكبر */
    p.amount=anchored[0].v; p.currency=anchored[0].cc;
    p._anchored=true;
  }
  /* ── القاعدة 2 (احتياط): تسجيل نقاط حسب سياق السطر ── */
  const lines=text.split(/\n+/);
  let best=null;
  if(!p._anchored)
  for(const line of lines){
    const L=line.toUpperCase();
    for(const m of line.matchAll(/(\d+(?:[ .,\u00A0\u202F\u2009]\d{3})+(?:[.,]\d{2})?|\d+[.,]\d{2}|\d{4,}|\d{1,3})/g)){
      const tok=m[1]; const v=parseNum(tok);
      if(!(v>0&&v<1e12)) continue;
      let score=0;
      if(AMT_LBL.test(L)) score+=6;
      if(CUR_TOK.test(L)) score+=4;
      if(/[.,]\d{2}$/.test(tok)) score+=3;                       // صيغة نقدية ,00
      if(/[ .,\u00A0]\d{3}/.test(tok)) score+=2;                 // فواصل آلاف
      if(ID_LBL.test(L)) score-=8;                                // سطر أرقام تعريفية
      if(!/[ .,\u00A0\u202F\u2009]/.test(tok)&&!/[.,]\d{2}$/.test(tok)&&tok.length>=9) score-=7; // 7084610234 ونحوه
      if(v>=1e9&&!AMT_LBL.test(L)) score-=4;
      if(score>0&&(!best||score>best.score||(score===best.score&&v>best.v))) best={v,score};
    }
  }
  if(!p._anchored) p.amount=best?best.v:0;
  /* ── المرجع: Movimento / Número de Operação / Transacção أولاً ── */
  const ref=T.match(/(?:MOVIMENTO|N[ÚU]MERO\s+DE\s+OPERA[ÇC][ÃA]O|N[ÚU]MERO\s+DE\s+TRANSFER[ÊE]NCIA(?:\s+ATRIBU[ÍI]DO)?|TRANSAC[ÇC][ÃA]O|N[ºO°]\s*DE\s*TRANSFER[ÊE]NCIA|REF(?:ER[ÊE]NCIA)?|TXID|TX|HASH)[:\s#.]*([A-Z0-9\-]*\d[A-Z0-9\-]{3,29})/);
  p.reference=ref?ref[1]:'';
  p.transaction_id=p.reference;
  const w=T.match(/\bT[A-Z0-9]{33}\b/); p.wallet_address=w?w[0]:'';
  const ib=T.match(/\bAO\d{2}[ .]?[\d .]{15,30}\b|\b[A-Z]{2}\d{2}[A-Z0-9]{10,30}\b/); p.iban=ib?ib[0].replace(/ /g,''):'';
  const swm=T.match(/SWIFT[:\s]*([A-Z]{6}[A-Z0-9]{2}(?:[A-Z0-9]{3})?)/); p.swift=swm?swm[1]:'';
  const dt=T.match(/\b(20\d{2}[-\/.]\d{1,2}[-\/.]\d{1,2}|\d{1,2}[-\/.]\d{1,2}[-\/.]20\d{2})\b/);
  if(dt){const parts=dt[1].split(/[-\/.]/);p.date=parts[0].length===4?`${parts[0]}-${parts[1].padStart(2,'0')}-${parts[2].padStart(2,'0')}`:`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;}
  const ben=text.match(/(?:Benefici[áa]rio|Destinat[áa]rio|PARA)[:\s]*\n?\s*(?:Nome[:\s]*)?([A-ZÀ-Ú][A-ZÀ-Ú .]{5,40})/i);
  if(ben)p.beneficiary=ben[1].trim();
  const snd=text.match(/(?:Ordenante|\bDE\b)[:\s]*\n?\s*(?:Nome[:\s]*)?([A-ZÀ-Ú][A-ZÀ-Ú .]{5,40})/i);
  if(snd)p.sender=snd[1].trim();
  p.doc_type=/USDT|TRC20|TXID|HASH|BINANCE|HTX|OKX/.test(T)?'crypto':(/SWIFT\s+COPY|MT103/.test(T)?'swift':'bank');
  return p;
}
/* ═══ حراسة مشتركة: المبلغ لا يساوي أبدًا رقم العملية — تنطبق على Gemini والمحلي ═══ */
function verbatimCheck(p){
  if(p&&p.amount_verbatim){
    const v=parseNum(String(p.amount_verbatim).replace(/[^\d .,\u00A0\u202F\u2009]/g,' ').trim());
    if(v>0&&Math.abs(v-(+p.amount||0))>0.01){ p.amount=v; p._fixedByVerbatim=true; }
  }
  return p;
}
function crossGuard(p,rawText){
  const digits=x=>String(x==null?'':x).replace(/\D/g,'');
  const amtD=digits(Math.round(+p.amount||0));
  const ids=[p.reference,p.transaction_id].map(digits).filter(Boolean);
  if(amtD.length>=7&&ids.includes(amtD)){
    p._amountWasId=p.amount; p.amount=0;
  }
  if((+p.amount||0)>=1e9&&rawText){
    const t=stripFooter(rawText).toUpperCase();
    if(!AMT_LBL.test(t)||!t.includes(amtD.slice(0,6))){ /* keep */ }
  }
  return p;
}

/* ═══ Step 1: image enhancement ═══ */
async function fileToCanvas(file){
  if((file.type||'').includes('pdf')||/\.pdf$/i.test(file.name)){
    const buf=await file.arrayBuffer();
    const pdf=await pdfjsLib.getDocument({data:buf}).promise;
    const pg=await pdf.getPage(1);
    const vp=pg.getViewport({scale:2});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    return {cv,pages:pdf.numPages,isPdf:true};
  }
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'}).catch(()=>null);
  const img=bmp||await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
  cv.getContext('2d').drawImage(img,0,0);
  return {cv,pages:1,isPdf:false};
}
function enhance(cv){
  // upscale small captures
  let src=cv;
  if(Math.min(cv.width,cv.height)<1000){
    const k=1000/Math.min(cv.width,cv.height);
    const c2=document.createElement('canvas');c2.width=Math.round(cv.width*k);c2.height=Math.round(cv.height*k);
    const cx=c2.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(cv,0,0,c2.width,c2.height);src=c2;
  }
  // percentile contrast stretch + mild shadow lift
  const cx=src.getContext('2d');
  const d=cx.getImageData(0,0,src.width,src.height);
  const px=d.data, hist=new Uint32Array(256);
  for(let i=0;i<px.length;i+=4){hist[(px[i]*299+px[i+1]*587+px[i+2]*114)/1000|0]++;}
  const total=px.length/4;let lo=0,hi=255,acc=0;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>total*0.015){lo=i;break;}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>total*0.015){hi=i;break;}}
  const rng=Math.max(1,hi-lo);
  for(let i=0;i<px.length;i+=4){
    for(let c=0;c<3;c++){px[i+c]=Math.max(0,Math.min(255,(px[i+c]-lo)*255/rng));}
  }
  cx.putImageData(d,0,0);
  return src;
}
const thumbOf=cv=>{const t=document.createElement('canvas');const k=170/cv.height;
  t.width=Math.round(cv.width*k);t.height=170;
  t.getContext('2d').drawImage(cv,0,0,t.width,t.height);
  return t.toDataURL('image/jpeg',0.72);};
async function sha256(buf){const h=await crypto.subtle.digest('SHA-256',buf);
  return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ═══ Verification engine ═══ */
function verify(rec){
  const flags=[]; const p=rec.parsed||{};
  if(rec.dupHash)flags.push(['h','⚠ ملف مكرر تمامًا (نفس البصمة الرقمية)']);
  const sameRef=p.reference&&CACHE.find(d=>d.id!==rec.id&&(d.parsed?.reference)===p.reference);
  if(sameRef)flags.push(['h','مرجع مكرر — نفس المرجع في «'+(sameRef.smartName||sameRef.fileName)+'»']);
  const sameAmt=p.amount&&p.date&&CACHE.find(d=>d.id!==rec.id&&d.parsed?.amount===p.amount&&d.parsed?.currency===p.currency&&d.parsed?.date===p.date);
  if(sameAmt)flags.push(['m','مبلغ وتاريخ مطابقان لمستند آخر — تحقق من التكرار']);
  const sameW=p.wallet_address&&CACHE.filter(d=>d.id!==rec.id&&d.parsed?.wallet_address===p.wallet_address).length;
  if(sameW>=3)flags.push(['l','محفظة متكررة ('+sameW+' مستندات) — مورد معروف']);
  const q=p.quality||{};
  if(q.blurry)flags.push(['m','الصورة ضبابية — قد تكون القراءة ناقصة']);
  if(q.cropped||q.missing_corners)flags.push(['m','الصورة مقصوصة أو زوايا ناقصة']);
  if(q.edited_suspicion)flags.push(['h','🚨 اشتباه تعديل على المستند — مراجعة يدوية إلزامية']);
  if(p._amountWasId)flags.push(['h','🚨 الرقم المقروء كمبلغ ('+fmt(p._amountWasId,0)+') هو رقم العملية نفسه — صُفّر المبلغ، أدخله يدويًا أو أعد التحليل بـ Gemini']);
  if(!p.amount)flags.push(['m','لم يُقرأ مبلغ — راجع يدويًا']);
  rec.fraud={flags:flags.map(f=>[f[0]==='h'?'high':f[0]==='m'?'med':'low',f[1]]),
    level:flags.some(f=>f[0]==='h')?'high':flags.some(f=>f[0]==='m')?'med':'low',
    score:flags.some(f=>f[0]==='h')?70:flags.some(f=>f[0]==='m')?35:5};
  rec.needsReview=(rec.ocrConfidence||0)<90||rec.fraud.level==='high';
  return rec;
}
function smartName(p){
  const parts=[];
  if(p.doc_type==='crypto')parts.push('كريبتو'); else if(p.doc_type==='swift')parts.push('SWIFT'); else parts.push('إيصال');
  if(p.bank)parts.push(p.bank);
  if(p.amount)parts.push(fmt(p.amount,0)+' '+(p.currency||''));
  if(p.date)parts.push(p.date);
  return parts.join(' · ')||'مستند';
}

/* ═══ Memory / chain linking ═══ */
function autoLink(rec){
  const p=rec.parsed||{};rec.links=rec.links||[];
  for(const d of CACHE){
    if(d.id===rec.id)continue;
    const dp=d.parsed||{};
    if((p.reference&&dp.reference===p.reference)||
       (p.wallet_address&&dp.wallet_address===p.wallet_address)||
       (p.amount&&dp.amount===p.amount&&dp.currency===p.currency&&Math.abs((d.uploadedAt||0)-(rec.uploadedAt||0))<72*3600e3)){
      if(!rec.links.includes(d.id))rec.links.push(d.id);
    }
  }
  if(rec.links.length&&!rec.chainId){
    const linked=CACHE.find(d=>rec.links.includes(d.id)&&d.chainId);
    rec.chainId=linked?linked.chainId:('CH-'+Date.now().toString(36).toUpperCase());
  }
}

async function processFile(file){
  if(!file)return;
  const tid='f'+Date.now()+Math.random().toString(36).slice(2,6);
  tq(tid,file.name||'مستند');
  let rec={id:tid,fileName:file.name||'pasted.jpg',mime:file.type,size:file.size,uploadedAt:Date.now(),audit:[]};
  try{
    tqSet(tid,8,'البصمة الرقمية…');
    const buf=await file.arrayBuffer();
    rec.hash=await sha256(buf);
    rec.dupHash=!!CACHE.find(d=>d.hash===rec.hash);

    tqSet(tid,22,'تجهيز الصورة…');
    const {cv,pages,isPdf}=await fileToCanvas(file);
    const ecv=enhance(cv);
    rec.thumb=thumbOf(ecv); rec.isPdf=isPdf; rec.pages=pages; rec.blob=file;

    tqSet(tid,42,'قراءة Gemini AI…');
    let p=null, engine='gemini';
    try{
      const b64=ecv.toDataURL('image/jpeg',0.9).split(',')[1];
      p=await geminiExtract(b64,'image/jpeg');
      rec.ocrConfidence=Math.min(100,Math.max(0,+p.confidence||0));
    }catch(ge){
      engine='local';
      rec.geminiError=(ge&&ge.message)||'?';
      tqSet(tid,55,'محرك محلي (Tesseract)…');
      try{
        const w=await getWorker();
        const {data}=await w.recognize(ecv);
        rec.ocrText=data.text||''; rec.ocrConfidence=Math.round(data.confidence||0);
        p=localParse(rec.ocrText);
      }catch(te){ p={}; rec.ocrConfidence=0; rec.needsReview=true; }
    }
    rec.engine=engine;
    rec.parsed=crossGuard(verbatimCheck(Object.assign({amount:0,currency:'',bank:''},p)), rec.ocrText||'');
    if(rec.geminiError)audit(rec,'Gemini تعذّر ('+rec.geminiError+') → المحرك المحلي');
    rec.smartName=smartName(rec.parsed);
    audit(rec,'أُنشئ · محرك: '+engine+' · ثقة '+(rec.ocrConfidence||0)+'%');

    tqSet(tid,80,'التحقق والذاكرة…');
    verify(rec);
    autoLink(rec);
    if(rec.chainId)audit(rec,'رُبط بسلسلة '+rec.chainId);

    await putDoc(rec);
    CACHE.unshift(rec);
    tqSet(tid,100, rec.parsed.amount?('✓ '+fmt(rec.parsed.amount)+' '+(rec.parsed.currency||'')+' · '+(rec.ocrConfidence||0)+'%'):'✓ حُفظ'+(rec.needsReview?' — يحتاج مراجعة':''));
    renderAll();
  }catch(err){
    console.error(err);
    tqSet(tid,100,'✗ '+(err.message||'تعذّرت المعالجة'));
  }
  tqEnd(tid,2600);
}

/* ═══ Natural-language search ═══ */
function nlFilter(q,docs){
  q=q.trim(); if(!q)return docs;
  const Q=q.toUpperCase();
  let out=docs;
  const gt=Q.match(/(?:فوق|أكثر من|>|ABOVE)\s*\$?([\d,]+)/); 
  if(gt){const n=parseFloat(gt[1].replace(/,/g,''));out=out.filter(d=>(d.parsed?.amount||0)>=n);}
  const lt=Q.match(/(?:تحت|أقل من|<|BELOW)\s*\$?([\d,]+)/);
  if(lt){const n=parseFloat(lt[1].replace(/,/g,''));out=out.filter(d=>(d.parsed?.amount||0)<=n);}
  const cur=Q.match(/\b(USDT|USD|AOA|MRU|EUR|CNY|AED)\b/); if(cur)out=out.filter(d=>(d.parsed?.currency)===cur[1]);
  const bank=BANKS.find(b=>Q.includes(b)); if(bank)out=out.filter(d=>((d.parsed?.bank||'')+(d.ocrText||'')).toUpperCase().includes(bank));
  if(/اليوم|TODAY/.test(Q)){const t=new Date().toDateString();out=out.filter(d=>new Date(d.uploadedAt).toDateString()===t);}
  if(/أمس|YESTERDAY/.test(Q)){const y=new Date(Date.now()-864e5).toDateString();out=out.filter(d=>new Date(d.uploadedAt).toDateString()===y);}
  if(/هذا الشهر|THIS MONTH/.test(Q)){const m=new Date().getMonth(),yy=new Date().getFullYear();
    out=out.filter(d=>{const dd=new Date(d.uploadedAt);return dd.getMonth()===m&&dd.getFullYear()===yy;});}
  if(/مراجعة|REVIEW/.test(Q))out=out.filter(d=>d.needsReview);
  if(/مكرر|DUPLICATE/.test(Q))out=out.filter(d=>(d.fraud?.flags||[]).some(f=>/مكرر/.test(f[1])));
  if(/أنغولا|ANGOLA/.test(Q))out=out.filter(d=>/AOA/.test(d.parsed?.currency||'')||/ANGOLA|LUANDA/i.test((d.ocrText||'')+(d.parsed?.country||'')));
  if(/كريبتو|CRYPTO/.test(Q))out=out.filter(d=>(d.parsed?.doc_type)==='crypto'||d.classification==='crypto');
  // free text残り
  const free=q.replace(/(فوق|أكثر من|تحت|أقل من|اليوم|أمس|هذا الشهر|مراجعة|مكرر|أنغولا|كريبتو)/g,'').replace(/[\d,$><]/g,'').trim();
  if(free.length>1){const F=free.toUpperCase();
    out=out.filter(d=>((d.smartName||'')+(d.fileName||'')+(d.ocrText||'')+JSON.stringify(d.parsed||{})).toUpperCase().includes(F));}
  return out;
}

/* ═══ Rendering ═══ */
function confRing(v){
  v=Math.max(0,Math.min(100,v||0));
  const col=v>=95?'#00C853':v>=90?'#00A2FF':v>=75?'#FFB300':'#E53935';
  const C=2*Math.PI*16, off=C*(1-v/100);
  return `<div class="conf"><svg width="40" height="40"><circle cx="20" cy="20" r="16" fill="none" stroke="#EDF3FA" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg><span class="t">${v}%</span></div>`;
}
function groupKey(ts){
  const d=new Date(ts), now=new Date();
  const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
  const diff=(day(now)-day(d))/864e5;
  if(diff===0)return['0','اليوم'];
  if(diff===1)return['1','أمس'];
  if(diff<7)return['2','هذا الأسبوع'];
  if(diff<14)return['3','الأسبوع الماضي'];
  if(d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear())return['4','هذا الشهر'];

function animCount(el,to,suffix=''){
  const dur=700,st=performance.now();
  function step(t){const k=Math.min(1,(t-st)/dur);
    el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3))),0)+suffix;
    if(k<1)requestAnimationFrame(step);}
  requestAnimationFrame(step);
}

async function upgradeAll(auto){
  if(!getKey()){ if(auto)return; return promptKey(); }
  const targets=CACHE.filter(d=>d.blob&&!d.verifiedByUser&&(d.engine!=='gemini'||(d.ocrConfidence||0)<90));
  if(!targets.length){toast0('كل المستندات مقروءة بـ Gemini بثقة عالية ✓');return;}
  if(!auto&&!confirm('ترقية قراءة '+targets.length+' مستند عبر Gemini الأقوى؟ (يستغرق ~'+Math.ceil(targets.length*2.5)+' ثانية)'))return;
  if(auto)toast0('🤖 '+targets.length+' قراءة قديمة — تُرقّى تلقائيًا عبر Gemini…');
  const tid='up'+Date.now(); tq(tid,'ترقية القراءات بذكاء Gemini');
  let done=0,fixed=0;
  for(const rec of targets){
    try{
      const {cv}=await fileToCanvas(rec.blob);
      const ecv=enhance(cv);
      const b64=ecv.toDataURL('image/jpeg',0.9).split(',')[1];
      const oldAmt=rec.parsed?.amount;
      const p=await geminiExtract(b64,'image/jpeg',['gemini-2.5-flash','gemini-2.5-pro','gemini-2.0-flash']);
      rec.history=rec.history||[];rec.history.push({ts:Date.now(),parsed:rec.parsed,conf:rec.ocrConfidence});
      rec.parsed=crossGuard(verbatimCheck(Object.assign({},rec.parsed,p)), rec.ocrText||'');
      rec.ocrConfidence=Math.min(100,+p.confidence||rec.ocrConfidence);
      rec.engine='gemini'; rec.smartName=smartName(rec.parsed);
      verify(rec); autoLink(rec);
      if(rec.parsed.amount!==oldAmt)fixed++;
      audit(rec,'ترقية جماعية عبر Gemini · ثقة '+rec.ocrConfidence+'%'+(rec.parsed.amount!==oldAmt?' · صُحّح المبلغ':''));
      await putDoc(rec);
    }catch(e){ audit(rec,'فشلت الترقية: '+(e.message||'?')); }
    done++; tqSet(tid,Math.round(done/targets.length*100),done+'/'+targets.length+' · صُحّح '+fixed);
    await new Promise(r=>setTimeout(r,900)); /* احترام حدود الخدمة */
  }
  tqSet(tid,100,'✓ اكتملت الترقية — صُحّح '+fixed+' مبلغ');
  tqEnd(tid,3500); renderAll();
}

  if(refD&&amtD===refD)checks.push(['h','🚨 المبلغ يساوي المرجع — تحقق']);
  const dup=CACHE.find(d=>d.id!==CUR.id&&d.parsed?.amount===amt&&d.parsed?.currency===p.currency&&d.parsed?.date===p.date);
  if(dup)checks.push(['m','⚠ مستند آخر بنفس المبلغ والتاريخ: '+(dup.smartName||dup.fileName)]);
  verify(CUR);
  CUR.needsReview=false;
  CUR.fraud.flags=[...checks,...CUR.fraud.flags.filter(f=>!/لم يُقرأ مبلغ|رقم العملية نفسه/.test(f[1]))];
  audit(CUR,'تصحيح يدوي: '+fmt(old||0)+' → '+fmt(amt)+' '+p.currency+' · فُحص ✓');
  autoLink(CUR);
  await putDoc(CUR);
  renderAll(); openDoc(CUR.id);
  toast0(txt&&txt.includes(amtD)?'✓ حُفظ — والمبلغ مطابق للنص':'✓ حُفظ التصحيح');
}

/* ═══ تصدير صورة عالية الجودة (HD) — PDF يُصيَّر بدقة 4x حتى 3 صفحات مدموجة ═══ */
async function downloadHD(id){
  const d=CACHE.find(x=>x.id===id); if(!d?.blob){toast0('لا يوجد ملف أصلي');return;}
  const base=(d.smartName||d.fileName||'ARKAN').replace(/[\\/:*?"<>|·]+/g,'_').slice(0,60);
  try{
    if(d.isPdf){
      toast0('تصيير PDF بجودة عالية…');
      if(!window.pdfjsLib)throw new Error('محرك PDF غير محمّل');
      const buf=await d.blob.arrayBuffer();
      const pdf=await pdfjsLib.getDocument({data:buf}).promise;
      const n=Math.min(pdf.numPages,3);
      const cvs=[];
      for(let i=1;i<=n;i++){
        const pg=await pdf.getPage(i);
        const vp=pg.getViewport({scale:4});
        const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        cvs.push(cv);
      }
      const W=Math.max(...cvs.map(c=>c.width)), H=cvs.reduce((s,c)=>s+c.height,0);
      const out=document.createElement('canvas');out.width=W;out.height=H;
      const cx=out.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,W,H);
      let y=0;cvs.forEach(c=>{cx.drawImage(c,(W-c.width)/2,y);y+=c.height;});
      await new Promise(res=>out.toBlob(b=>{
        const a2=document.createElement('a');a2.href=URL.createObjectURL(b);
        a2.download=base+'_HD.png';a2.click();
        setTimeout(()=>URL.revokeObjectURL(a2.href),4000);res();
      },'image/png'));
      toast0('✓ صورة HD ('+W+'×'+H+')');
    }else{
      /* الصور: الأصل نفسه هو الأعلى جودة — يُنزَّل بلا أي إعادة ضغط */
      const a2=document.createElement('a');
      a2.href=URL.createObjectURL(d.blob);
      const ext=(d.fileName.match(/\.[a-z0-9]+$/i)||['.jpg'])[0];
      a2.download=base+'_HD'+ext; a2.click();
      setTimeout(()=>URL.revokeObjectURL(a2.href),4000);
      toast0('✓ الصورة الأصلية بجودتها الكاملة');
    }
  }catch(e){ toast0('✗ '+(e.message||'تعذّر التصدير')); }
}

  await delDoc(id);CACHE=CACHE.filter(d=>d.id!==id);closeDoc();renderAll();toast0('حُذف ✓');

/* ═══ Stats view ═══ */
function bar(ctx,labels,vals,cols){
  const W=ctx.canvas.width=ctx.canvas.offsetWidth*2, H=ctx.canvas.height=340;
  ctx.scale(1,1);ctx.clearRect(0,0,W,H);
  const max=Math.max(...vals,1), n=vals.length, bw=Math.min(64,(W-40)/n*0.6);
  vals.forEach((v,i)=>{
    const x=20+(W-40)*(i+0.5)/n, h=(H-70)*v/max, y=H-40-h;
    const g=ctx.createLinearGradient(0,y,0,H-40);
    g.addColorStop(0,cols[i%cols.length]);g.addColorStop(1,cols[i%cols.length]+'55');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.roundRect(x-bw/2,y,bw,h,8);ctx.fill();
    ctx.fillStyle='#486581';ctx.font='600 20px IBM Plex Mono';ctx.textAlign='center';
    ctx.fillText(labels[i],x,H-14);
    ctx.fillStyle='#102A43';ctx.font='600 19px IBM Plex Mono';
    ctx.fillText(fmt(v,0),x,y-8);
  });
}
function renderStats(){
  const vol={};CACHE.forEach(d=>{const p=d.parsed||{};if(p.amount&&p.currency)vol[p.currency]=(vol[p.currency]||0)+p.amount;});
  const banks={};CACHE.forEach(d=>{const b=d.parsed?.bank;if(b)banks[b]=(banks[b]||0)+1;});
  const days={};for(let i=13;i>=0;i--){const dd=new Date(Date.now()-i*864e5);days[dd.toLocaleDateString('en-GB',{day:'2-digit'})]=0;}
  CACHE.forEach(d=>{const k=new Date(d.uploadedAt).toLocaleDateString('en-GB',{day:'2-digit'});
    if(Date.now()-d.uploadedAt<14*864e5&&k in days)days[k]++;});
  const topB=Object.entries(banks).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxB=topB[0]?.[1]||1;
  $('v_stats').innerHTML=`<div class="statgrid">
    <div class="statcard"><h4>📊 الحجم حسب العملة</h4><canvas id="c1"></canvas></div>
    <div class="statcard"><h4>📈 مستندات آخر 14 يوم</h4><canvas id="c2"></canvas></div>
    <div class="statcard"><h4>🏦 أكثر البنوك والمنصات</h4><div class="toplist">${
      topB.map(([b,n])=>`<div class="tr"><b>${esc(b)}</b><span class="bar"><i style="width:${n/maxB*100}%"></i></span><span>${n}</span></div>`).join('')||'<div class="tr"><b>لا بيانات بعد</b></div>'
    }</div></div>
  </div>`;
  const e1=Object.entries(vol).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(e1.length)bar($('c1').getContext('2d'),e1.map(x=>x[0]),e1.map(x=>x[1]),['#0058D9','#00D4E8','#00C853','#FF8A3D','#00A2FF']);
  bar($('c2').getContext('2d'),Object.keys(days),Object.values(days),['#00A2FF']);
}
