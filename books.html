<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0B2F70">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>دفاتري — BDL</title>
<link rel="icon" href="favicon.svg?v=bdl7">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=bdl7">
<link rel="manifest" href="site-manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="bdl-brand.js?v=1"></script>
<script src="arkan-gate.js?v=4"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<style>
/* books.html — Build 1209 «دفاتري v2» — كامل خدمات CashBook على BDL */
:root{--navy:#0B2F70;--blue:#0A56B8;--ink:#0B2447;--mut:#5C7699;--line:#D7E2F2;--soft:#E3ECF7;--bg:#F4F8FD;--card:#FFFFFF;--good:#0B7A3B;--bad:#B00020;--amber:#8A6100;--amberbg:#FFF6E0;--goodbg:#E8F6EE;--badbg:#FBE9EC;--hdr1:#0B2F70;--hdr2:#0A56B8}
[data-theme=dark]{--ink:#E6EEFA;--mut:#8FA6C6;--line:#1F3556;--soft:#16294A;--bg:#0A1730;--card:#0F2142;--amberbg:#2A2410;--goodbg:#0F2A1D;--badbg:#2C121A}
*,*::before,*::after{box-sizing:border-box}
:root{--r-card:16px;--r-btn:12px;--r-sm:8px;--r-pill:999px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0}
[hidden]{display:none!important}
.g{color:var(--good)}.r{color:var(--bad)}.z{color:var(--mut)}
.top{background:linear-gradient(160deg,var(--hdr1) 0%,var(--hdr2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.top .r1{display:flex;align-items:center;gap:10px}
.top .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .brand img{width:30px;height:30px}
.top .brand b{font-size:15px;font-weight:700}
.top .brand small{display:block;font-size:10.5px;opacity:.8;font-weight:500}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg,.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{margin-top:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);padding:14px 16px}
.hero .lbl{font-size:11px;opacity:.85}
.hero .big{font-size:30px;font-weight:800;margin-top:4px;line-height:1.1;letter-spacing:-.5px}
.hero .big small{font-size:12px;font-weight:600;opacity:.85;margin-inline-start:6px}
.hero .row{display:flex;margin-top:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.hero .row div{flex:1}
.hero .row div+div{border-inline-start:1px solid rgba(255,255,255,.18);padding-inline-start:12px}
.hero .row small{display:block;font-size:10.5px;opacity:.8}
.hero .row b{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
.hero .row .g{color:#9CF0BE}.hero .row .r{color:#FFB3B8}
.ccyt{margin-top:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:6px}
.ccyt .h,.ccyt .l{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:8px;padding:6px 0}
.ccyt .h{font-size:10px;opacity:.75}
.ccyt .l{border-top:1px solid rgba(255,255,255,.10);font-size:12.5px}
.ccyt .l .c{display:flex;align-items:center;gap:7px;font-family:Inter,sans-serif;font-weight:800}
.ccyt .l .c .fl{width:20px;height:20px}
.ccyt .l b{font-family:Inter,sans-serif;font-weight:800;text-align:left;white-space:nowrap;display:block;direction:ltr}
.ccyt .l .g{color:#9CF0BE}.ccyt .l .r{color:#FFB3B8}
.pf{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#0B7A3B,#0A5C2E);color:#fff;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:0 8px 20px rgba(11,122,59,.25);border-radius:16px}
.pf .ic2{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;flex:none}
.pf .ic2 svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pf .m{flex:1;min-width:0}.pf .m b{display:block;font-size:14px}.pf .m small{font-size:11px;opacity:.85}
.pf .v{text-align:left}.pf .v b{display:block;font-family:Inter,sans-serif;font-size:17px;font-weight:800;white-space:nowrap;direction:ltr}.pf .v small{font-size:10px;opacity:.85}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px calc(150px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);height:44px;padding:0 12px}
.search svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;outline:0;font-size:14px;background:transparent;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chips button,.chip{border:1px solid var(--line);background:var(--card);height:32px;padding:0 13px;font-size:12px;font-weight:700;color:var(--mut);flex:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chips button.on,.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.sec b{font-size:13px;font-weight:700}
.sec small{font-size:11px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);padding:14px}
.empty{background:var(--card);border:1px dashed var(--line);padding:28px 18px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.skel{background:linear-gradient(90deg,var(--soft),var(--card),var(--soft));background-size:200% 100%;animation:sk 1.1s linear infinite;height:66px;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
.note{background:var(--amberbg);border:1px solid #F0DFA8;color:var(--amber);font-size:12px;font-weight:700;padding:10px 12px;margin-bottom:10px;line-height:1.6}
.bk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);padding:12px 14px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.av{width:42px;height:42px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none;position:relative}
.av.sup{background:#0B7A3B}.av.cash{background:#5C7699}
.av .fl{position:absolute;bottom:-4px;inset-inline-start:-4px;width:16px!important;height:16px!important;border:1.5px solid var(--card)}
.bk .m{flex:1;min-width:0}
.bk .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .s{font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .b{text-align:left;flex:none}
.bk .b b{display:block;font-size:14px;font-weight:800}
.bk .b small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.tag{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;background:var(--soft);color:var(--mut);vertical-align:middle}
.tabs{position:fixed;bottom:0;inset-inline:0;z-index:70;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:transparent;height:58px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--navy)}
[data-theme=dark] .tabs button.on{color:#7FB2FF}
.tabs button.on::before{content:"";position:absolute;top:0;inset-inline:22%;height:3px;background:var(--navy)}
[data-theme=dark] .tabs button.on::before{background:#7FB2FF}
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));inset-inline-start:50%;transform:translateX(50%);z-index:60;background:var(--navy);color:#fff;border:0;height:48px;padding:0 20px;font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(11,47,112,.35);display:inline-flex;align-items:center;gap:8px}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}
.upd button{margin-inline-start:auto;border:0;background:var(--blue);color:#fff;height:34px;padding:0 14px;font-weight:700}
.ov{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .hd{background:linear-gradient(160deg,var(--hdr1),var(--hdr2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.ov .hd .r1{display:flex;align-items:center;gap:8px}
.ov .hd .nm{flex:1;min-width:0;cursor:pointer}
.ov .hd .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .hd .nm small{font-size:11px;opacity:.85}
.sum{margin:10px 14px 0;background:var(--card);border:1px solid var(--line);box-shadow:0 2px 12px rgba(11,36,71,.06)}
.sum .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.sum .row.net{padding:16px;border-bottom:1px solid var(--line)}
.sum .row.net .lb{font-size:17px;font-weight:800;color:var(--ink)}
.sum .row.net .lb small{display:inline-block;margin-inline-start:8px;font-size:11px;font-weight:700;color:var(--mut);background:var(--soft);padding:2px 8px;vertical-align:middle}
.sum .row.net b{font-size:21px;font-weight:800;letter-spacing:-.2px;white-space:nowrap}
.sum .row.io{padding:9px 16px}
.sum .row.io+.row.io{padding-top:0;padding-bottom:12px}
.sum .row.io .lb{font-size:14px;font-weight:600;color:var(--ink)}
.sum .row.io b{font-size:16px;font-weight:700;white-space:nowrap}
.sum .lnk{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-top:1px solid var(--line);color:var(--blue);font-weight:800;font-size:14px;cursor:pointer}
[data-theme=dark] .sum .lnk{color:#6FB4FF}
.tools{background:var(--card);border-bottom:1px solid var(--line);padding:8px 14px 0}
.tools .chips{padding:0 0 8px}
.tools .search{height:40px;margin-bottom:8px}
.list{flex:1;overflow-y:auto;padding:8px 14px calc(150px + env(safe-area-inset-bottom))}
.day{font-size:11px;color:var(--mut);font-weight:700;margin:10px 2px 6px;display:flex;justify-content:space-between}
.en{background:var(--card);border:1px solid var(--soft);padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center;cursor:pointer}
.en .bar{width:4px;align-self:stretch;flex:none}
.en .bar.in{background:var(--good)}.en .bar.out{background:var(--bad)}
.en .m{flex:1;min-width:0}
.en .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en .x{font-size:10.5px;color:var(--mut);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.en .a{text-align:left;flex:none}
.en .a b{display:block;font-size:14px;font-weight:800}
.en .a small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.en .rc{width:34px;height:34px;object-fit:cover;border:1px solid var(--line);flex:none}
.btm{position:fixed;bottom:0;inset-inline:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);z-index:130;align-items:center}
.btm button{flex:1;border:0;height:50px;font-size:14px;font-weight:700;color:#fff}
.btm .in{background:var(--good)}.btm .out{background:var(--bad)}
.btm .mic{flex:none;width:50px;background:var(--navy);display:inline-flex;align-items:center;justify-content:center}
.btm .mic.rec{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.coach{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));inset-inline-start:14px;z-index:131;border:0;background:linear-gradient(120deg,#0A56B8,#0B2F70);color:#fff;height:40px;padding:0 14px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(11,47,112,.35)}
.coach svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2}
.bs{position:fixed;inset:0;background:rgba(11,36,71,.5);z-index:200;display:none;align-items:flex-end}
.bs.on{display:flex}
.bs .bx{background:var(--card);width:100%;max-width:640px;margin:0 auto;padding:6px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bs .bx{animation:none}}
.bs .grab{width:40px;height:4px;background:var(--line);margin:6px auto 12px}
.bs .ttl{font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.bs .sub{font-size:11.5px;color:var(--mut);margin:3px 0 12px}
.f{margin-bottom:10px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px}
.f input,.f select,.f textarea,.pick{width:100%;height:46px;border:1.5px solid var(--line);padding:0 12px;font-size:15px;font-weight:600;background:var(--card);outline:0}
.f textarea{height:auto;padding:10px 12px;resize:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
.f .big{height:60px;font-size:28px;font-weight:800;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--line)}
.seg button{flex:1;height:42px;border:0;background:var(--card);font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.cta{width:100%;border:0;height:50px;font-size:14.5px;font-weight:700;color:#fff;background:var(--navy);margin-top:4px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.cta.in{background:var(--good)}.cta.out{background:var(--bad)}.cta.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
[data-theme=dark] .cta.ghost{color:#7FB2FF;border-color:#7FB2FF}
.cta:disabled{opacity:.55}
.it{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:var(--bg);margin-bottom:6px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--ink);text-align:start}
.it.red{background:var(--badbg);color:var(--bad)}
.it small{margin-inline-start:auto;font-size:11px;color:var(--mut);font-weight:600;text-align:left}
.it .ic{color:var(--mut);flex:none}
.pick{display:flex;align-items:center;gap:10px;cursor:pointer;text-align:start}
.pick .fl{width:26px;height:26px}
.pick .cc{font-family:Inter,sans-serif;font-weight:800;font-size:14px}
.pick .cn{font-size:12px;color:var(--mut);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl{border-radius:50%!important;object-fit:cover;background:var(--soft);flex:none;display:inline-block}
.cur{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:10px 4px;border-bottom:1px solid var(--soft);text-align:start}
.cur .fl{width:34px;height:34px}
.cur b{font-family:Inter,sans-serif;font-size:14px;display:block}
.cur small{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.cur .chk{margin-inline-start:auto;color:var(--good);font-weight:800}
.att{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);padding:10px 12px;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;background:var(--card)}
.att img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line)}
.att .st{flex:1}
.att .st b{display:block;color:var(--ink)}
.att .st small{font-weight:600;font-size:11px}
.att.ok{border-style:solid;border-color:var(--good)}
.att.rd{border-color:var(--amber);background:var(--amberbg)}
.sugg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sugg button{border:1px solid var(--line);background:var(--card);height:28px;padding:0 10px;font-size:11.5px;font-weight:700;color:var(--mut)}
.sugg button.on{background:var(--soft);color:var(--navy);border-color:var(--navy)}
.radio{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--card)}
.radio.on{border-color:var(--navy);background:var(--soft)}
.radio .dot{width:18px;height:18px;border:2px solid var(--mut);border-radius:50%!important;flex:none;display:flex;align-items:center;justify-content:center}
.radio.on .dot{border-color:var(--navy)}
.radio.on .dot::after{content:"";width:9px;height:9px;background:var(--navy);border-radius:50%!important}
.radio b{display:block;font-size:13.5px}
.radio small{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--soft)}
.mem .av{width:36px;height:36px;font-size:13px}
.mem .m{flex:1;min-width:0}
.mem .m b{display:block;font-size:13px}
.mem .m small{font-size:11px;color:var(--mut)}
.mem select{height:34px;border:1px solid var(--line);font-size:12px;font-weight:700;background:var(--card);padding:0 6px}
.act{padding:9px 0;border-bottom:1px solid var(--soft);font-size:12.5px}
.act small{display:block;color:var(--mut);font-size:10.5px;margin-top:2px}
.msg{padding:10px 12px;margin-bottom:8px;max-width:88%;font-size:13px;line-height:1.6}
.msg.q{background:var(--navy);color:#fff;margin-inline-start:auto}
.msg.a{background:var(--soft)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);font-size:13px}
.kv b{font-weight:700}
.prog{height:6px;background:var(--soft);margin:8px 0}
.prog div{height:100%;background:var(--good)}
.toast{position:fixed;bottom:calc(130px + env(safe-area-inset-bottom));inset-inline:14px;z-index:400;background:var(--ink);color:var(--card);padding:12px 14px;font-size:13px;font-weight:700;text-align:center;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad);color:#fff}.toast.good{background:var(--good);color:#fff}
.lock{position:fixed;inset:0;z-index:900;background:var(--navy);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lock.on{display:flex}
.lock input{width:180px;height:56px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:28px;text-align:center;letter-spacing:12px;outline:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}

/* ---- هندسة الزوايا: بطاقات وأزرار مدوّرة، أفاتار دائري، شرائح كبسولية، شريط سفلي مسطّح ---- */
.ib,.fab,.cta,.btm button,.upd button,.seg,.seg button:first-child,.seg button:last-child,.f input,.f select,.f textarea,.pick,.search,.tools .search,.mem select{border-radius:var(--r-btn)}
.seg{overflow:hidden}
.hero,.card,.sum,.bk,.en,.empty,.skel,.note,.radio,.att,.it,.msg,.toast,.upd{border-radius:var(--r-card)}
.en,.it{border-radius:var(--r-btn)}
.chips button,.chip,.sugg button,.tag,.coach,.btm .mic,.fab{border-radius:var(--r-pill)}

  return '<img class="fl '+(cls||'')+'" src="'+u+'" alt="" loading="lazy" data-ccy="'+esc(ccy)+'" onerror="flagErr(this)">';}

var JWT=null,SESSION=null,ME={phone:'',name:'',uid:''},PROFILE=null;

var V2=true;

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,k){var t=$('#toast');t.textContent=m;t.className='toast on'+(k?' '+k:'');clearTimeout(t._h);t._h=setTimeout(function(){t.className='toast';},2600);}
function fmt(n,ccy){n=+n||0;var d=ccy&&CUR[ccy]?CUR[ccy].dp:2;if(Math.abs(n)%1===0)d=0;return n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d});}
function H(extra){var h={apikey:ANON,Authorization:'Bearer '+(JWT&&JWT.token||ANON),'Content-Type':'application/json'};if(extra)for(var k in extra)h[k]=extra[k];return h;}
function iso(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayISO(){return iso();}
function hm(d){d=d||new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function rel(x){if(!x)return 'لا قيود بعد';var s=(Date.now()-new Date(x).getTime())/1000;if(s<60)return 'الآن';if(s<3600)return 'قبل '+Math.floor(s/60)+' د';if(s<86400)return 'قبل '+Math.floor(s/3600)+' س';if(s<86400*30)return 'قبل '+Math.floor(s/86400)+' يوم';return String(x).slice(0,10);}
function dayLabel(d){var t=todayISO();if(d===t)return 'اليوم';if(d===iso(new Date(Date.now()-86400000)))return 'أمس';try{return new Date(d+'T00:00:00').toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return d;}}
function firstName(){return String(ME.name||'').trim().split(' ')[0]||'';}
function prettyPhone(p){return String(p||'').replace(/^(222|244)(\d+)/,'+$1 $2');}
async function sbq(path,opt){opt=opt||{};var r=await fetch(SB+path,{method:opt.method||'GET',headers:H(opt.headers),body:opt.body?JSON.stringify(opt.body):undefined});
  if(r.status===401){localStorage.removeItem('arkan_sb_jwt');location.replace('account.html?next=books.html');throw new Error('session');}
  if(!r.ok){var t=await r.text();var e=new Error(t.slice(0,160));e.status=r.status;e.body=t;throw e;}
  if(r.status===204)return null;var tx=await r.text();return tx?JSON.parse(tx):null;}
function colMissing(e){return e&&e.body&&/column|PGRST204/.test(e.body);}
function tableMissing(e){return e&&(e.status===404||/PGRST205|does not exist/.test(e.body||''));}

/* ---------- الجلسة والقفل ---------- */
(function boot(){
  try{JWT=JSON.parse(localStorage.getItem('arkan_sb_jwt')||'null');}catch(e){}
  try{SESSION=JSON.parse(localStorage.getItem('arkan_session')||'null');}catch(e){}
  var now=Math.floor(Date.now()/1000);
  if(!JWT||!JWT.token||(JWT.exp&&JWT.exp<now+60)){location.replace('account.html?next=books.html');return;}
  ME.uid=JWT.user_id||'';ME.phone=String(JWT.phone||SESSION&&SESSION.phone||'').replace(/\D/g,'');ME.name=String(SESSION&&SESSION.name||'').trim();
  if(localStorage.getItem('bdl_theme')==='dark')document.documentElement.dataset.theme='dark';
  var pin=localStorage.getItem('bdl_pin');
  if(pin){$('#lock').classList.add('on');var li=$('#lockPin');setTimeout(function(){li.focus();},100);
    li.addEventListener('input',async function(){if(this.value.length===4){var h=await sha(this.value);if(h===pin){$('#lock').classList.remove('on');start();}else{$('#lockErr').textContent='رمز غير صحيح';this.value='';}}});}
  else start();
})();
async function sha(s){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bdl:'+s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
async function start(){loadProfile();await loadBooks();var qb=new URLSearchParams(location.search).get('book');if(qb&&BOOKS){var b=BOOKS.find(function(x){return x.id===qb;});if(b)openBook(b);}}
async function loadProfile(){
  try{var r=await sbq('/bdl_profiles?select=*&uid=eq.'+ME.uid);PROFILE=r&&r[0]||null;}catch(e){if(tableMissing(e))V2=false;PROFILE=null;}
  if(PROFILE){if(PROFILE.name)ME.name=PROFILE.name;if(PROFILE.business_name)$('#bizName').textContent=PROFILE.business_name;}
}
async function saveProfile(patch){
  var body=Object.assign({},PROFILE||{},patch,{uid:ME.uid,phone:ME.phone});delete body.updated_at;
  try{var r=await sbq('/bdl_profiles?on_conflict=uid',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=representation'},body:body});PROFILE=r&&r[0]||body;
    if(PROFILE.name){ME.name=PROFILE.name;var s=SESSION||{};s.name=PROFILE.name;localStorage.setItem('arkan_session',JSON.stringify(s));}
    $('#bizName').textContent=PROFILE.business_name||'حسابات الزبائن والموردين والصندوق';return true;}
  catch(e){toast('لم يُحفظ: '+(tableMissing(e)?'نفّذ bdl-books-v2.sql أولًا':e.message),'bad');return false;}
}

document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;showTab(b.dataset.t);});
function showTab(t){['Books','Reports','Settings'].forEach(function(k){$('#tab'+k).hidden=k!==t;});
  [].forEach.call(document.querySelectorAll('.tabs button'),function(x){x.classList.toggle('on',x.dataset.t===t);});
  $('#fab').hidden=t!=='Books';window.scrollTo(0,0);if(t==='Reports')renderReports();if(t==='Settings')renderSettings();}

/* ---------- الدفاتر ---------- */
function meta(b){var m={kind:b.kind||'',phone:b.phone||'',note:b.note||'',currency:b.currency||'AOA'};
  var mm=/^\[k=(\w*);p=([\d+]*)\]\s?/.exec(m.note||'');if(mm){m.kind=m.kind||mm[1];m.phone=m.phone||mm[2];m.note=m.note.replace(mm[0],'');}
  m.kind=m.kind||'customer';return m;}
function isOwner(b){return !b.owner_id||b.owner_id===ME.uid;}
function roleOf(b){return b.my_role||(isOwner(b)?'owner':'viewer');}
function netOf(b){var bal=b.bal||{},ks=Object.keys(bal);if(!ks.length)return null;ks.sort(function(a,c){return Math.abs(bal[c].net)-Math.abs(bal[a].net);});return {ccy:ks[0],net:+bal[ks[0]].net||0,more:ks.length-1};}
function balText(kind,net){if(kind==='cash')return {t:net>=0?'في الصندوق':'عجز',c:net>=0?'':'r'};if(net<0)return {t:'مستحق لك',c:'g'};if(net>0)return {t:'عليك له',c:'r'};return {t:'متعادل',c:'z'};}
async function loadBooks(){
  try{BOOKS=await sbq('/bdl_books_summary?select=*&order=updated_at.desc&limit=500');if(BOOKS.length&&!('my_role' in BOOKS[0]))V2=false;}
  catch(e){BOOKS=BOOKS||[];if(tableMissing(e)){renderBooks();$('#books').innerHTML='<div class="note">جداول الدفاتر غير مفعّلة بعد. نفّذ ملف bdl-books-v2.sql في Supabase مرة واحدة ثم أعد التحميل.</div>';return;}toast('تعذّر تحميل الدفاتر: '+e.message,'bad');}

  html+='<button class="chip '+(F.side!=='all'?'on':'')+'" data-f="side">'+(F.side==='all'?'نوع الحركة':F.side==='in'?'وارد فقط':'صادر فقط')+' ▾</button>';
  if(ccys.length>1)html+='<button class="chip '+(F.ccy!=='ALL'?'on':'')+'" data-f="ccy">'+(F.ccy==='ALL'?'العملة':F.ccy)+' ▾</button>';

function filterSheet(k){
  var opts=[],title='';
  if(k==='range'){title='المدة';opts=[['all','كل الوقت'],['today','اليوم'],['yesterday','أمس'],['week','هذا الأسبوع'],['month','هذا الشهر'],['lastmonth','الشهر الماضي'],['custom','فترة مخصصة']];}
  if(k==='side'){title='نوع الحركة';opts=[['all','الكل'],['in','وارد (+)'],['out','صادر (−)']];}
  if(k==='ccy'){title='العملة';opts=[['ALL','الكل']].concat(uniq('ccy').map(function(c){return [c,c+' — '+(CUR[c]?CUR[c].name:'')];}));}
  if(k==='method'){title='طريقة الدفع';opts=[['ALL','الكل']].concat(METHODS);}
  if(k==='source'){title='المصدر';opts=[['ALL','الكل'],['manual','يدوي'],['settle','كونسول التسوية'],['ops','عمليات الكوانزا']];}
  if(k==='cat'){title='الفئة';opts=[['ALL','الكل']].concat(uniq('category').map(function(c){return [c,c];}));}
  if(k==='party'){title='جهة الاتصال';opts=[['ALL','الكل']].concat(uniq('party').map(function(c){return [c,c];}));}
  if(k==='by'){title='العضو';var ph={};uniq('created_by_phone').forEach(function(p){ph[p]=1;});MEMBERS.forEach(function(m){ph[m.phone]=1;});ph[ME.phone]=1;opts=[['ALL','الكل']].concat(Object.keys(ph).map(function(p){return [p,nameOfPhone(p)];}));}
  var cur=F[k];
  sheet2(title,'',opts.map(function(o){return '<div class="radio '+(o[0]===cur?'on':'')+'" data-v="'+esc(o[0])+'"><div class="dot"></div><div><b>'+esc(o[1])+'</b></div></div>';}).join('')+
    (k==='range'?'<div id="rngC" style="'+(F.range==='custom'?'':'display:none')+'"><div class="grid2"><div class="f"><label>من</label><input type="date" id="rFrom" class="num" value="'+F.from+'"></div><div class="f"><label>إلى</label><input type="date" id="rTo" class="num" value="'+F.to+'"></div></div><button class="cta" id="rApply">تطبيق</button></div>':''));
  if(k==='range')$('#rApply').onclick=function(){F.range='custom';F.from=$('#rFrom').value;F.to=$('#rTo').value;bs2Close();renderEntries();};
  $('#bs2A').onclick=function(e){var r=e.target.closest('.radio');if(!r)return;var v=r.dataset.v;
    if(k==='range'&&v==='custom'){[].forEach.call($('#bs2A').querySelectorAll('.radio'),function(x){x.classList.toggle('on',x===r);});$('#rngC').style.display='';return;}
    F[k]=v;bs2Close();renderEntries();};
}
function advFilters(){

  var val=function(k){if(k==='range')return rangeLabel();if(k==='side')return {all:'الكل',in:'وارد',out:'صادر'}[F.side];if(k==='method')return F.method==='ALL'?'الكل':METHOD_L[F.method];if(k==='by')return F.by==='ALL'?'الكل':nameOfPhone(F.by);return F[k]==='ALL'?'الكل':F[k];};
  sheet('الفلاتر','اضغط أي فلتر لتغييره',['range','side','method','cat','party','by'].map(function(k){return '<button class="it" data-f="'+k+'">'+L[k]+'<small>'+esc(val(k))+'</small></button>';}).join('')+'<button class="cta ghost" id="fReset">إعادة تعيين الكل</button>');

function renderEntries(){
  if(!BK)return;var m=meta(BK);renderFilterChips();
  var run={},tin={},tout={};
  EN.forEach(function(e){var a=+e.amount||0;run[e.ccy]=(run[e.ccy]||0)+(e.side==='in'?a:-a);e._run=run[e.ccy];if(e.side==='in')tin[e.ccy]=(tin[e.ccy]||0)+a;else tout[e.ccy]=(tout[e.ccy]||0)+a;});
  var list=filtered();
  var sc=F.ccy!=='ALL'?F.ccy:(Object.keys(run).sort(function(a,b){return Math.abs(run[b])-Math.abs(run[a]);})[0]||m.currency);
  var net=run[sc]||0,bt=balText(m.kind,net);
  var fin=0,fout=0;list.forEach(function(e){if(e.ccy!==sc)return;if(e.side==='in')fin+=+e.amount;else fout+=+e.amount;});
  var isAll=F.range==='all'&&F.side==='all'&&F.method==='ALL'&&F.cat==='ALL'&&F.party==='ALL'&&F.by==='ALL'&&!F.q;
  var fi=isAll?(tin[sc]||0):fin,fo=isAll?(tout[sc]||0):fout;
  $('#ovSum').innerHTML='<div class="row net"><span class="lb">صافي الرصيد<small>'+esc(sc)+(bt.t?' · '+bt.t:'')+'</small></span><b class="'+(net<0?'r':net>0?'g':'')+'">'+(net<0?'-':'')+fmt(Math.abs(net),sc)+'</b></div>'+
    '<div class="row io"><span class="lb">إجمالي الوارد (+)'+(isAll?'':' <span class="z">· المعروض</span>')+'</span><b class="g">'+fmt(fi,sc)+'</b></div>'+
    '<div class="row io"><span class="lb">إجمالي الصادر (−)'+(isAll?'':' <span class="z">· المعروض</span>')+'</span><b class="r">'+fmt(fo,sc)+'</b></div>'+
    '<span class="lnk" id="sumRep">عرض التقارير <span>‹</span></span>';
  $('#sumRep').onclick=function(){reportSheet(BK);};
  var box=$('#entries');
  if(!list.length){box.innerHTML='<div class="empty" style="margin-top:8px"><b>'+(EN.length?'لا قيود ضمن هذا العرض':'لا قيود بعد')+'</b>'+(EN.length?'غيّر الفلاتر أو البحث':'اضغط «نقدي وارد» أو «نقدي صادر»، أو استخدم الميكروفون: «قبضت 2000 من أحمد نقداً».')+'</div>';return;}
  var html='<div class="day" style="justify-content:center">عرض '+list.length+' حركة</div>',last='',dayTot={};
  list.forEach(function(e){var k=e.entry_date+'|'+e.ccy;dayTot[k]=(dayTot[k]||0)+(e.side==='in'?+e.amount:-e.amount);});
  list.slice().reverse().forEach(function(e){
    if(e.entry_date!==last){last=e.entry_date;var dt=Object.keys(dayTot).filter(function(k){return k.indexOf(e.entry_date+'|')===0;}).map(function(k){var v=dayTot[k],c=k.split('|')[1];return (v>=0?'+':'−')+fmt(Math.abs(v),c)+' '+c;}).join(' · ');
      html+='<div class="day"><span>'+dayLabel(e.entry_date)+'</span><span class="num">'+dt+'</span></div>';}
    var rc=e.receipt_url?'<img class="rc" src="'+esc(e.receipt_url)+'" alt="" loading="lazy">':'';
    var title=e.party||e.note||e.category||(e.side==='in'?'وارد':'صادر');
    var sub=[];if(e.party&&e.note)sub.push(esc(e.note));if(e.source&&e.source!=='manual')sub.push('<span class="tag" style="background:var(--soft);color:var(--navy)">'+(e.source==='settle'?'تسوية':'عملية')+'</span>');else if(e.category)sub.push('<span class="tag">'+esc(e.category)+'</span>');if(e.method)sub.push('<span class="tag">'+METHOD_L[e.method]+'</span>');if(e.ref)sub.push('<span class="num">'+esc(e.ref)+'</span>');
    var by=(!e.created_by_phone||e.created_by_phone===ME.phone)?'بواسطتك':'بواسطة '+esc(e.created_by_name||nameOfPhone(e.created_by_phone));
    var tm=e.entry_time?String(e.entry_time).slice(0,5):(e.created_at?hm(new Date(e.created_at)):'');
    sub.push('<span>'+by+(tm?' · <span class="num">'+tm+'</span>':'')+'</span>');
    html+='<div class="en" data-id="'+e.id+'"><div class="bar '+e.side+'"></div>'+rc+'<div class="m"><div class="t">'+esc(title)+'</div><div class="x">'+sub.join(' ')+'</div><div class="x"><span>الرصيد: <span class="num">'+fmt(e._run,e.ccy)+' '+esc(e.ccy)+'</span></span></div></div>'+
      '<div class="a"><b class="num '+(e.side==='in'?'g':'r')+'">'+(e.side==='in'?'+':'−')+fmt(e.amount,e.ccy)+'</b><small>'+esc(e.ccy)+'</small></div></div>';
  });
  box.innerHTML=html;

var RC={file:null,url:null,ref:null};
function entrySheet(side,e,pre){
  pre=pre||{};RC={file:null,url:null,ref:null};var m=meta(BK),synced=!!(e&&e.source&&e.source!=='manual'),ro=MYROLE==='viewer'||synced;
  var title=e?(synced?(e.source==='settle'?'قيد من كونسول التسوية':'قيد من عملية كوانزا'):ro?'تفاصيل القيد':'تعديل القيد'):(side==='in'?(m.kind==='cash'?'نقدي وارد إلى الصندوق':'نقدي وارد — قبضت من '+BK.name):(m.kind==='cash'?'نقدي صادر من الصندوق':'نقدي صادر — دفعت إلى '+BK.name));
  var ccy=e?e.ccy:(pre.ccy||m.currency||'AOA');var cats=CAT_SUGG[m.kind].concat(uniq('category')).filter(function(v,i,a){return a.indexOf(v)===i;}).slice(0,10);
  var parties=uniq('party').slice(0,8);var curCat=e?e.category:pre.category,curM=e?(e.method||'cash'):(pre.method||'cash');
  sheet(esc(title),e?'':'يُحفظ فورًا ويظهر في الرصيد',

    '<div class="grid2"><div class="f"><label>العملة</label>'+curPickHTML('eCur',ccy)+'</div><div class="f"><label>التاريخ</label><input id="eDate" type="date" class="num" value="'+(e?e.entry_date:todayISO())+'" '+(ro?'disabled':'')+'></div></div>'+
    '<div class="f"><label>طريقة الدفع</label><div class="sugg" id="eMeth">'+METHODS.map(function(x){return '<button type="button" data-v="'+x[0]+'" class="'+(curM===x[0]?'on':'')+'">'+x[1]+'</button>';}).join('')+'</div></div>'+

    '<div class="f"><label>الفئة</label><input id="eCat" value="'+esc(curCat||'')+'" placeholder="اكتب أو اختر" maxlength="40" '+(ro?'disabled':'')+'><div class="sugg" id="eCatS">'+cats.map(function(c){return '<button type="button" data-v="'+esc(c)+'" class="'+(curCat===c?'on':'')+'">'+esc(c)+'</button>';}).join('')+'</div></div>'+
    (e||ro?'':'<div class="att" id="att"><div class="st"><b>تصوير الإيصال أو اختياره</b><small>يُقرأ المبلغ والمرجع تلقائيًا ويُرفض المكرر</small></div></div>')+
    (e&&e.receipt_url?'<a href="'+esc(e.receipt_url)+'" target="_blank" class="att ok"><img src="'+esc(e.receipt_url)+'" alt=""><div class="st"><b>الإيصال المرفق</b><small>اضغط للعرض</small></div></a>':'')+
    '<div class="f"><label>البيان / ملاحظة</label><input id="eNote" value="'+esc(e?e.note:(pre.note||''))+'" placeholder="مثال: بضاعة، دفعة، تحويل…" maxlength="140" '+(ro?'disabled':'')+'></div>'+
    (ro?'':'<button class="cta '+side+'" id="eSave">'+(e?'حفظ التعديل':(side==='in'?'تسجيل الوارد':'تسجيل الصادر'))+'</button>')+
    (e&&!ro?'<button class="it red" id="eDel" style="margin-top:8px;justify-content:center">حذف القيد</button>':'')+
    (synced?'<div class="note">هذا القيد مُزامَن تلقائيًا من '+(e.source==='settle'?'كونسول التسوية':'عمليات الكوانزا')+' (المرجع '+esc(e.ref||'')+'). يُعدَّل أو يُحذف من مصدره فقط.'+(isOwner(BK)?' <a href="settle-v2.html" style="color:var(--blue);font-weight:700">افتح التسوية ›</a>':'')+'</div>':'')+(e?'<div class="sub" style="margin-top:10px">أُضيف '+((!e.created_by_phone||e.created_by_phone===ME.phone)?'بواسطتك':'بواسطة '+esc(e.created_by_name||nameOfPhone(e.created_by_phone)))+' · '+new Date(e.created_at).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'})+'</div>':''));

async function uploadFile(file,folder){
  var path=folder+'/'+ME.uid+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+(/pdf/i.test(file.type)?'.pdf':'.jpg');
  var r=await fetch(SBU+'/storage/v1/object/receipts/'+path,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+JWT.token,'Content-Type':file.type||'image/jpeg','x-upsert':'true'},body:file});
  if(!r.ok){var t=await r.text();throw new Error(/Bucket not found|not_found/i.test(t)?'مجلد التخزين غير مفعّل — نفّذ bdl-books-v2.sql في Supabase':/row-level|policy|Unauthorized|403/i.test(t+r.status)?'لا صلاحية رفع — نفّذ bdl-books-v2.sql (سياسة avatars)':'فشل الرفع ('+r.status+')');}
  var s=await fetch(SBU+'/storage/v1/object/sign/receipts/'+path,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:60*60*24*365*5})});
  if(!s.ok)throw new Error('تعذّر توقيع الرابط');var j=await s.json();return SBU+'/storage/v1'+j.signedURL;
}

function arDigits(s){return String(s).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d);}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d);});}
function parseVoice(t){
  var s=arDigits(t).replace(/[،,]/g,'');var side=/(دفعت|أعطيت|اعطيت|صادر|سلمت|سلّمت|صرفت|خرج)/.test(s)?'out':'in';
  var mm=/(\d+(?:\.\d+)?)\s*(ألف|الف|مليون)?/.exec(s);var amt=mm?parseFloat(mm[1])*(mm[2]?(/مليون/.test(mm[2])?1e6:1e3):1):'';
  var ccy=/دولار/.test(s)?'USD':/يورو/.test(s)?'EUR':/أوقية|اوقية/.test(s)?'MRU':/كوانزا/.test(s)?'AOA':/يوان/.test(s)?'CNY':/درهم/.test(s)?'AED':/تيثر/.test(s)?'USDT':meta(BK).currency;
  var method=/نقد/.test(s)?'cash':/تحويل|بنك/.test(s)?'transfer':/بينانس/.test(s)?'binance':/بطاقة|كارت/.test(s)?'card':'cash';
  var pm=/(?:من|إلى|الى|لـ)\s+([^\d]{2,30}?)(?:\s+(?:نقد|تحويل|بنك|بينانس|بطاقة|عن|مقابل)|$)/.exec(s);var party=pm?pm[1].trim():'';
  var cm=/(?:عن|مقابل|بسبب)\s+(.{2,40})$/.exec(s);var cat=cm?cm[1].trim():'';
  toast('سمعت: «'+t+'»');entrySheet(side,null,{amount:amt,ccy:ccy,method:method,party:party,category:cat,note:t});
}

function ask(q){q=(q||'').trim();if(!q)return;var ch=$('#chat');ch.innerHTML+='<div class="msg q">'+esc(q)+'</div>';$('#cQ').value='';ch.innerHTML+='<div class="msg a">'+answer(q)+'</div>';ch.scrollTop=ch.scrollHeight;}
function answer(q){
  var s=arDigits(q).toLowerCase();var m=meta(BK);
  var period=/اليوم/.test(s)?'today':/أمس|امس/.test(s)?'yesterday':/الأسبوع|الاسبوع/.test(s)?'week':/الشهر الماضي/.test(s)?'lastmonth':/الشهر/.test(s)?'month':'all';
  var saved=F;F=Object.assign({},F0,{range:period});var L=filtered();F=saved;
  var PL=RL[period];
  var byC=function(list,side){var o={};list.forEach(function(e){if(side&&e.side!==side)return;o[e.ccy]=(o[e.ccy]||0)+(side?+e.amount:(e.side==='in'?+e.amount:-e.amount));});return o;};
  var show=function(o){var ks=Object.keys(o);if(!ks.length)return '<b>0</b>';return ks.map(function(c){return '<span class="num">'+fmt(o[c],c)+' '+c+'</span>';}).join(' · ');};
  var meth=null;METHODS.forEach(function(x){if((x[0]==='cash'&&/نقد/.test(s))||(x[0]==='transfer'&&/تحويل/.test(s))||(x[0]==='card'&&/بطاقة/.test(s))||(x[0]==='binance'&&/بينانس|usdt/.test(s)))meth=x[0];});
  if(/حسب طريقة|طرق الدفع|وسائل الدفع/.test(s)){var g={};L.forEach(function(e){var k=METHOD_L[e.method||'other']+' '+e.ccy;g[k]=(g[k]||0)+(e.side==='in'?+e.amount:-e.amount);});var ks=Object.keys(g);return ks.length?'صافي الحركة حسب طريقة الدفع ('+PL+'):<br>'+ks.map(function(k){return esc(k)+': <span class="num">'+fmt(g[k])+'</span>';}).join('<br>'):'لا حركات في '+PL+'.';}
  if(/حسب الفئة|الفئات/.test(s)){var gc={};L.forEach(function(e){if(e.side!=='out')return;var k=(e.category||'بدون فئة')+' '+e.ccy;gc[k]=(gc[k]||0)+ +e.amount;});var kc=Object.keys(gc).sort(function(a,b){return gc[b]-gc[a];});return kc.length?'المصروفات حسب الفئة ('+PL+'):<br>'+kc.map(function(k){return esc(k)+': <span class="num">'+fmt(gc[k])+'</span>';}).join('<br>'):'لا مصروفات في '+PL+'.';}
  if(/أكبر|اكبر|أعلى|اعلى/.test(s)){var mx=null;L.forEach(function(e){if(!mx||+e.amount>+mx.amount)mx=e;});return mx?'أكبر حركة ('+PL+'): '+(mx.side==='in'?'وارد':'صادر')+' <span class="num">'+fmt(mx.amount,mx.ccy)+' '+mx.ccy+'</span> بتاريخ '+mx.entry_date+(mx.party?' — '+esc(mx.party):'')+(mx.note?' — '+esc(mx.note):''):'لا حركات في '+PL+'.';}
  if(/كم (عدد|حركة|حركات)|عدد الحركات/.test(s))return 'عدد الحركات '+PL+': <b class="num">'+L.length+'</b> (وارد '+L.filter(function(e){return e.side==='in';}).length+' / صادر '+L.filter(function(e){return e.side==='out';}).length+').';
  if(meth){var LM=L.filter(function(e){return (e.method||'other')===meth;});return 'معاملات '+METHOD_L[meth]+' ('+PL+'): وارد '+show(byC(LM,'in'))+' · صادر '+show(byC(LM,'out'))+' · العدد <b class="num">'+LM.length+'</b>.';}
  var cm=/(?:على|علي|في|لـ)\s+([^\s؟?]{2,20})/.exec(s);
  if(/أنفقت|انفقت|صرفت|دفعت|مصروف/.test(s)){var LO=L.filter(function(e){return e.side==='out';});if(cm&&!/^(هذا|الشهر|الأسبوع|اليوم)/.test(cm[1])){var kw=cm[1];var LK=LO.filter(function(e){return [e.category,e.note,e.party].join(' ').toLowerCase().indexOf(kw)>-1;});return LK.length?'أنفقت على «'+esc(kw)+'» '+PL+': '+show(byC(LK,'out'))+' في '+LK.length+' حركة.':'لا مصروفات مسجّلة تحت «'+esc(kw)+'» '+PL+'. المصروفات الكلية: '+show(byC(LO,'out'))+'.';}return 'إجمالي الصادر '+PL+': '+show(byC(LO,'out'))+' في '+LO.length+' حركة.';}
  if(/قبضت|استلمت|وارد|دخل/.test(s)){var LI=L.filter(function(e){return e.side==='in';});return 'إجمالي الوارد '+PL+': '+show(byC(LI,'in'))+' في '+LI.length+' حركة.';}
  if(/رصيد|صافي|كم (لي|له|عليه|علي)/.test(s)){var all={};EN.forEach(function(e){all[e.ccy]=(all[e.ccy]||0)+(e.side==='in'?+e.amount:-e.amount);});var parts=Object.keys(all).map(function(c){var bt=balText(m.kind,all[c]);return bt.t+' <span class="num">'+fmt(Math.abs(all[c]),c)+' '+c+'</span>';});return 'الرصيد الحالي: '+(parts.join(' · ')||'0')+(period!=='all'?'<br>صافي حركة '+PL+': '+show(byC(L)):'');}
  var pn=/من\s+([^\s؟?]{2,20})/.exec(s);if(pn){var LP=L.filter(function(e){return [e.party,e.note].join(' ').toLowerCase().indexOf(pn[1])>-1;});if(LP.length)return 'حركات «'+esc(pn[1])+'» '+PL+': وارد '+show(byC(LP,'in'))+' · صادر '+show(byC(LP,'out'))+' · '+LP.length+' حركة.';}

  if(RT==='all')return {head:['التاريخ','الوقت','الجهة','البيان','الفئة','طريقة الدفع','وارد','صادر','العملة','الرصيد','بواسطة'],rows:list.map(function(e){run[e.ccy]=(run[e.ccy]||0)+(e.side==='in'?+e.amount:-e.amount);return [e.entry_date,e.entry_time?String(e.entry_time).slice(0,5):'',e.party||'',e.note||'',e.category||'',METHOD_L[e.method||'other'],e.side==='in'?+e.amount:'',e.side==='out'?+e.amount:'',e.ccy,run[e.ccy],e.created_by_name||nameOfPhone(e.created_by_phone)];})};
  var key=RT==='daily'?function(e){return e.entry_date;}:RT==='party'?function(e){return e.party||'بدون جهة';}:RT==='cat'?function(e){return e.category||'بدون فئة';}:function(e){return METHOD_L[e.method||'other'];};
  var g={};list.forEach(function(e){var k=key(e)+'|'+e.ccy;g[k]=g[k]||{k:key(e),ccy:e.ccy,tin:0,tout:0,n:0};if(e.side==='in')g[k].tin+=+e.amount;else g[k].tout+=+e.amount;g[k].n++;});
  var lbl={daily:'اليوم',party:'الجهة',cat:'الفئة',method:'طريقة الدفع'}[RT];
  return {head:[lbl,'العملة','وارد','صادر','الصافي','عدد الحركات'],rows:Object.keys(g).sort().map(function(k){var x=g[k];return [x.k,x.ccy,x.tin,x.tout,x.tin-x.tout,x.n];})};
}
function exportXLS(b){

  var R=reportRows(filtered());var wb=XLSX.utils.book_new();var ws=XLSX.utils.aoa_to_sheet([R.head].concat(R.rows));ws['!cols']=R.head.map(function(h){return {wch:h.length>6?18:12};});
  XLSX.utils.book_append_sheet(wb,ws,b.name.slice(0,28).replace(/[\\/?*\[\]:]/g,' '));XLSX.writeFile(wb,'تقرير-'+b.name+'-'+todayISO()+'.xlsx');
}

function shrinkImage(file,max){return new Promise(function(res){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height));var cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(function(b){res(b||file);},'image/jpeg',.86);};im.onerror=function(){res(file);};im.src=URL.createObjectURL(file);});}

  sheet('ملفك الشخصي','الاسم، رقم الجوال، البريد الإلكتروني','<div class="f"><label>الاسم</label><input id="pName" value="'+esc(ME.name)+'" maxlength="60"></div><div class="f"><label>رقم الجوال</label><input class="num" value="'+prettyPhone(ME.phone)+'" disabled></div><div class="f"><label>البريد الإلكتروني</label><input id="pEmail" type="email" inputmode="email" value="'+esc(p.email||'')+'"></div><div class="grid2"><div class="f"><label>المدينة</label><input id="pCity" value="'+esc(p.city||'')+'"></div><div class="f"><label>الدولة</label><select id="pCountry"><option value="">—</option>'+[['MR','موريتانيا'],['AO','أنغولا'],['CN','الصين'],['MA','المغرب'],['SN','السنغال'],['ML','مالي'],['AE','الإمارات'],['other','أخرى']].map(function(x){return '<option value="'+x[0]+'" '+(p.country===x[0]?'selected':'')+'>'+x[1]+'</option>';}).join('')+'</select></div></div><button class="cta" id="pSave">حفظ</button>');

function bizForm(){var p=PROFILE||{};
  sheet('إعدادات النشاط التجاري','يظهر اسم النشاط في رأس التقارير ورسائل واتساب','<div class="f"><label>اسم النشاط التجاري</label><input id="bzName" value="'+esc(p.business_name||'')+'" maxlength="80" placeholder="مثال: محل النور للإلكترونيات"></div><div class="f"><label>نوع النشاط</label><select id="bzType"><option value="">—</option>'+['تجارة عامة','تجارة تجزئة','تجارة جملة','استيراد وتصدير','صرافة وتحويلات','خدمات','مطعم / مقهى','نقل ولوجستيك','بناء ومقاولات','زراعة وثروة حيوانية','أخرى'].map(function(x){return '<option '+(p.business_type===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select></div><button class="cta" id="bzSave">حفظ</button>');
  $('#bzSave').onclick=async function(){this.disabled=true;if(await saveProfile({business_name:$('#bzName').value.trim()||null,business_type:$('#bzType').value||null})){bsClose();toast('تم الحفظ','good');renderSettings();}else this.disabled=false;};}
async function teamSheet(){
  var M=[];try{M=await sbq('/bdl_book_members?select=*,bdl_books(name)&order=created_at.desc&limit=300');}catch(e){}
  var mine=M.filter(function(x){return x.owner_id===ME.uid;}),ofOthers=(BOOKS||[]).filter(function(b){return !isOwner(b);});
  sheet('فريق العمل','إضافة، إزالة أو تغيير الدور يتم من داخل كل دفتر (زر الأعضاء)',
    '<div class="sec" style="margin-top:0"><b>أعضاء في دفاترك</b><small>'+mine.length+'</small></div>'+(mine.length?mine.map(function(x){return '<div class="mem"><div class="av cash">'+esc(String(x.name||x.phone).charAt(0))+'</div><div class="m"><b>'+esc(x.name||prettyPhone(x.phone))+'</b><small>'+esc(x.bdl_books&&x.bdl_books.name||'')+' · '+ROLE_L[x.role]+'</small></div></div>';}).join(''):'<div class="empty">لم تشارك أي دفتر بعد. افتح دفترًا واضغط زر الأعضاء في الأعلى.</div>')+
    '<div class="sec"><b>دفاتر مشتركة معك</b><small>'+ofOthers.length+'</small></div>'+(ofOthers.length?ofOthers.map(function(b){return '<button class="it" data-b="'+b.id+'">'+esc(b.name)+'<small>'+ROLE_L[roleOf(b)]+'</small></button>';}).join(''):'<div class="empty">لا دفاتر مشتركة معك</div>'));
  $('#bsA').onclick=function(e){var b=e.target.closest('[data-b]');if(!b)return;var bk=BOOKS.find(function(x){return x.id===b.dataset.b;});if(bk){bsClose();showTab('Books');openBook(bk);}};
}
function pinSheet(){var has=!!localStorage.getItem('bdl_pin');
  sheet('رمز الدخول','رمز من 4 أرقام يُطلب عند فتح دفاتري على هذا الجهاز',(has?'<button class="cta ghost" id="pinOff">إزالة الرمز</button>':'')+'<div class="f" style="margin-top:10px"><label>'+(has?'رمز جديد':'الرمز')+'</label><input id="pin1" class="num big" inputmode="numeric" maxlength="4" placeholder="••••"></div><div class="f"><label>تأكيد الرمز</label><input id="pin2" class="num big" inputmode="numeric" maxlength="4" placeholder="••••"></div><button class="cta" id="pinSave">حفظ الرمز</button>');
  if(has)$('#pinOff').onclick=function(){localStorage.removeItem('bdl_pin');bsClose();toast('أُزيل الرمز');renderSettings();};
  $('#pinSave').onclick=async function(){var a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4}$/.test(a)){toast('4 أرقام','bad');return;}if(a!==b){toast('الرمزان غير متطابقين','bad');return;}localStorage.setItem('bdl_pin',await sha(a));bsClose();toast('تم تفعيل الرمز','good');renderSettings();};}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
