<style>
/* ============================================================
   books.html — Build 1208
   دفاتري: دفتر نقد لكل مستخدم مسجّل في BDL (زبائن/موردون/صندوق)
   هوية BDL: كحلي #0B2F70، زوايا حادة، بلا رموز تعبيرية، أرقام Inter
   ============================================================ */
:root{
  --navy:#0B2F70;--blue:#0A56B8;--ink:#0B2447;--mut:#5C7699;--line:#D7E2F2;--soft:#E3ECF7;
  --bg:#F4F8FD;--good:#0B7A3B;--bad:#B00020;--amber:#8A6100;--amberbg:#FFF6E0;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Inter",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.num{font-family:"Inter",sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:0;height:0}

/* ---------- الرأس ---------- */
.top{background:linear-gradient(160deg,#0B2F70 0%,#0A56B8 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.top .r1{display:flex;align-items:center;gap:10px}
.top .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.top .brand img{width:30px;height:30px}
.top .brand b{font-size:15px;font-weight:700;letter-spacing:.2px}
.top .brand small{display:block;font-size:10.5px;opacity:.8;font-weight:500}
.top .who{font-size:11.5px;opacity:.9;text-align:left;line-height:1.35}
.top .who b{display:block;font-size:12.5px;font-weight:700}
.ib{border:0;background:rgba(255,255,255,.14);color:#fff;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* بطاقة الموقف العام — العنصر الوحيد الذي يُسمح له بالبروز */
.hero{margin-top:14px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);padding:14px 16px}
.hero .lbl{font-size:11px;opacity:.85}
.hero .big{font-size:26px;font-weight:800;margin-top:4px;line-height:1.1}
.hero .big small{font-size:12px;font-weight:600;opacity:.85;margin-inline-start:6px}
.hero .row{display:flex;gap:0;margin-top:12px;border-top:1px solid rgba(255,255,255,.18);padding-top:10px}
.hero .row div{flex:1}
.hero .row div+div{border-inline-start:1px solid rgba(255,255,255,.18);padding-inline-start:12px}
.hero .row small{display:block;font-size:10.5px;opacity:.8}
.hero .row b{font-size:14px;font-weight:700}
.hero .row .g{color:#9CF0BE}.hero .row .r{color:#FFB3B8}

/* ---------- البحث والقائمة ---------- */
.wrap{max-width:640px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);height:44px;padding:0 12px}
.search svg{width:17px;height:17px;stroke:var(--mut);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;outline:0;font-size:14px;background:transparent;color:var(--ink);min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px}
.chips button{border:1px solid var(--line);background:#fff;height:32px;padding:0 13px;font-size:12px;font-weight:700;color:var(--mut);flex:none}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px}
.sec b{font-size:13px;font-weight:700}
.sec small{font-size:11px;color:var(--mut)}

.bk{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);padding:12px 14px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bk:active{background:#F8FAFF}
.av{width:42px;height:42px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex:none}
.av.sup{background:#0B7A3B}.av.cash{background:#5C7699}
.bk .m{flex:1;min-width:0}
.bk .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .s{font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .b{text-align:left;flex:none}
.bk .b b{display:block;font-size:14px;font-weight:800}
.bk .b small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.g{color:var(--good)}.r{color:var(--bad)}.z{color:var(--mut)}

.empty{background:#fff;border:1px dashed var(--line);padding:28px 18px;text-align:center;color:var(--mut);font-size:13px;line-height:1.7}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));inset-inline-start:50%;transform:translateX(50%);z-index:60;background:var(--navy);color:#fff;border:0;height:50px;padding:0 22px;font-size:14px;font-weight:700;box-shadow:0 10px 26px rgba(11,47,112,.35);display:inline-flex;align-items:center;gap:8px}
[dir=rtl] .fab{transform:translateX(50%)}
.fab svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4}

/* ---------- شاشة الدفتر ---------- */
.ov{position:fixed;inset:0;background:var(--bg);z-index:120;display:none;flex-direction:column}
.ov.on{display:flex}
.ov .hd{background:linear-gradient(160deg,#0B2F70,#0A56B8);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
.ov .hd .r1{display:flex;align-items:center;gap:10px}
.ov .hd .nm{flex:1;min-width:0}
.ov .hd .nm b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .hd .nm small{font-size:11px;opacity:.85}
.sum{display:flex;gap:0;margin-top:12px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22)}
.sum div{flex:1;padding:9px 10px}
.sum div+div{border-inline-start:1px solid rgba(255,255,255,.18)}
.sum small{display:block;font-size:10px;opacity:.85}
.sum b{display:block;font-size:14px;font-weight:800;margin-top:2px}
.tools{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px 0}
.tools .chips{padding:0 0 8px}
.tools .search{height:40px;margin-bottom:8px}
.list{flex:1;overflow-y:auto;padding:8px 14px calc(96px + env(safe-area-inset-bottom))}
.day{font-size:11px;color:var(--mut);font-weight:700;margin:10px 2px 6px}
.en{background:#fff;border:1px solid var(--soft);padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.en .bar{width:4px;align-self:stretch;flex:none}
.en .bar.in{background:var(--good)}.en .bar.out{background:var(--bad)}
.en .m{flex:1;min-width:0}
.en .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en .t.none{color:var(--mut);font-weight:500}
.en .x{font-size:10.5px;color:var(--mut);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.en .a{text-align:left;flex:none}
.en .a b{display:block;font-size:14px;font-weight:800}
.en .a small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.en .rc{width:34px;height:34px;object-fit:cover;border:1px solid var(--line);flex:none}
.btm{position:fixed;bottom:0;inset-inline:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:130}
.btm button{flex:1;border:0;height:50px;font-size:14px;font-weight:700;color:#fff}
.btm .in{background:var(--good)}.btm .out{background:var(--bad)}

/* ---------- الألواح السفلية ---------- */
.bs{position:fixed;inset:0;background:rgba(11,36,71,.5);z-index:200;display:none;align-items:flex-end}
.bs.on{display:flex}
.bs .bx{background:#fff;width:100%;max-width:640px;margin:0 auto;padding:6px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bs .bx{animation:none}}
.bs .grab{width:40px;height:4px;background:var(--line);margin:6px auto 12px}
.bs .ttl{font-size:15px;font-weight:700}
.bs .sub{font-size:11.5px;color:var(--mut);margin:3px 0 12px}
.f{margin-bottom:10px}
.f label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;height:46px;border:1.5px solid var(--line);padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);background:#fff;outline:0}
.f textarea{height:auto;padding:10px 12px;resize:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue)}
.f .big{height:60px;font-size:28px;font-weight:800;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;border:1.5px solid var(--line)}
.seg button{flex:1;height:42px;border:0;background:#fff;font-size:12.5px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.cta{width:100%;border:0;height:50px;font-size:14.5px;font-weight:700;color:#fff;background:var(--navy);margin-top:4px}
.cta.in{background:var(--good)}.cta.out{background:var(--bad)}
.cta:disabled{opacity:.55}
.it{display:flex;align-items:center;gap:12px;width:100%;height:48px;border:0;background:var(--bg);margin-bottom:6px;padding:0 14px;font-size:13.5px;font-weight:700;color:var(--ink);text-align:start}
.it.red{background:#FFF5F5;color:var(--bad)}
.it small{margin-inline-start:auto;font-size:11px;color:var(--mut);font-weight:600}
.att{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);padding:10px 12px;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--mut);cursor:pointer;background:#fff}
.att img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line)}
.att .st{flex:1}
.att .st b{display:block;color:var(--ink)}
.att .st small{font-weight:600;font-size:11px}
.att.ok{border-style:solid;border-color:var(--good)}
.att.rd{border-color:var(--amber);background:var(--amberbg)}
.note{background:var(--amberbg);border:1px solid #F0DFA8;color:var(--amber);font-size:12px;font-weight:700;padding:10px 12px;margin-bottom:10px;line-height:1.6}

/* ---------- تنبيهات ---------- */
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));inset-inline:14px;z-index:400;background:var(--ink);color:#fff;padding:12px 14px;font-size:13px;font-weight:700;text-align:center;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;max-width:560px;margin:0 auto}
.toast.on{opacity:1;transform:none}
.toast.bad{background:var(--bad)}.toast.good{background:var(--good)}
.skel{background:linear-gradient(90deg,#EEF3FA,#F8FAFF,#EEF3FA);background-size:200% 100%;animation:sk 1.1s linear infinite;height:66px;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
</style>
</head>
<body>

<header class="top">
  <div class="r1">
    <a class="ib" href="index.html" aria-label="الرئيسية"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></a>
    <div class="brand"><img src="favicon.svg?v=bdl5" alt=""><div><b>دفاتري</b><small>حسابات الزبائن والموردين والصندوق</small></div></div>
    <div class="who" id="who"></div>
    <button class="ib" id="btnMore" aria-label="المزيد"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </div>
  <div class="hero" id="hero">
    <div class="lbl">صافي الموقف عبر كل الدفاتر</div>
    <div class="big num" id="hBig">—</div>
    <div class="row">
      <div><small>مستحق لك</small><b class="g num" id="hDue">—</b></div>
      <div><small>عليك</small><b class="r num" id="hOwe">—</b></div>
      <div><small>الدفاتر</small><b class="num" id="hN">—</b></div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="ابحث بالاسم أو رقم الهاتف" autocomplete="off"></div>
  <div class="chips" id="kindChips">
    <button data-k="all" class="on">الكل</button>
    <button data-k="customer">الزبائن</button>
    <button data-k="supplier">الموردون</button>
    <button data-k="cash">الصندوق</button>
  </div>
  <div class="sec"><b>الدفاتر</b><small id="secN"></small></div>
  <div id="books"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>دفتر جديد</button>

<!-- شاشة الدفتر -->
<section class="ov" id="ov">
  <div class="hd">
    <div class="r1">
      <button class="ib" id="ovBack" aria-label="رجوع"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      <div class="nm"><b id="ovName"></b><small id="ovSub"></small></div>
      <button class="ib" id="ovMenu" aria-label="خيارات الدفتر"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
    </div>
    <div class="sum num" id="ovSum"></div>
  </div>
  <div class="tools">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="eq" placeholder="ابحث في البيان أو المرجع" autocomplete="off"></div>
    <div class="chips" id="rangeChips">
      <button data-r="all" class="on">الكل</button><button data-r="today">اليوم</button><button data-r="week">هذا الأسبوع</button><button data-r="month">هذا الشهر</button>
    </div>
    <div class="chips" id="sideChips" style="padding-top:0">
      <button data-s="all" class="on">قبض ودفع</button><button data-s="in">قبض فقط</button><button data-s="out">دفع فقط</button>
      <span id="ccyChips" style="display:contents"></span>
    </div>
  </div>
  <div class="list" id="entries"></div>
  <div class="btm"><button class="in" id="btnIn">قبضت</button><button class="out" id="btnOut">دفعت</button></div>
</section>

<!-- لوح سفلي عام -->
<div class="bs" id="bs"><div class="bx"><div class="grab"></div><div class="ttl" id="bsT"></div><div class="sub" id="bsS"></div><div id="bsA"></div></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="rcFile" accept="image/*,application/pdf" capture="environment" hidden>
<canvas id="pdfCv" hidden></canvas>

<script src="arkan-read.js" defer></script>
<script>
'use strict';
/* ============================================================
   الجلسة: نفس رمز Supabase الذي تصدره Railway لكل مستخدم (owner أو زبون)
   RLS في bdl_books/bdl_book_entries تضمن أن كل مستخدم يرى دفاتره فقط
   ============================================================ */
var SBU='https://vyxzlazwpbstigcqvizb.supabase.co';
var SB=SBU+'/rest/v1';
var ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5eHpsYXp3cGJzdGlnY3F2aXpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5MTU5OTcsImV4cCI6MjEwMTQ5MTk5N30.fxMt_jH4z8t7uVnFLLHyNobu6zsgu_ZwVGLibuqWj38';
var CCYS=['AOA','MRU','USD','EUR','CNY','USDT','AED'];
var KIND_L={customer:'زبون',supplier:'مورد',cash:'صندوق'};
var JWT=null, SESSION=null;
var BOOKS=null, KIND='all', Q='';
var BK=null, EN=[], RANGE='all', SIDE='all', CCY='ALL', EQ='';
var COLS_OK=true; /* هل أعمدة kind/phone موجودة في القاعدة؟ */

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,k){var t=$('#toast');t.textContent=m;t.className='toast on'+(k?' '+k:'');clearTimeout(t._h);t._h=setTimeout(function(){t.className='toast';},2600);}
function fmt(n,d){n=+n||0;if(d==null)d=Math.abs(n)%1?2:0;return n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function H(extra){var h={apikey:ANON,Authorization:'Bearer '+(JWT&&JWT.token||ANON),'Content-Type':'application/json'};if(extra)for(var k in extra)h[k]=extra[k];return h;}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function rel(iso){
  if(!iso)return 'لا قيود بعد';
  var s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<60)return 'الآن';if(s<3600)return 'قبل '+Math.floor(s/60)+' د';
  if(s<86400)return 'قبل '+Math.floor(s/3600)+' س';if(s<86400*30)return 'قبل '+Math.floor(s/86400)+' يوم';
  return String(iso).slice(0,10);
}
function dayLabel(d){var t=todayISO();if(d===t)return 'اليوم';var y=new Date(Date.now()-86400000);var yi=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');if(d===yi)return 'أمس';return d;}

/* ---------- الجلسة ---------- */
(function boot(){
  try{JWT=JSON.parse(localStorage.getItem('arkan_sb_jwt')||'null');}catch(e){}
  try{SESSION=JSON.parse(localStorage.getItem('arkan_session')||'null');}catch(e){}
  var now=Math.floor(Date.now()/1000);
  if(!JWT||!JWT.token||(JWT.exp&&JWT.exp<now+60)){
    location.replace('account.html?next=books.html');return;
  }
  var nm=String(SESSION&&SESSION.name||'').trim().split(' ')[0];
  var ph=String(JWT.phone||SESSION&&SESSION.phone||'').replace(/\D/g,'');
  $('#who').innerHTML=(nm?'<b>'+esc(nm)+'</b>':'')+'<span class="num">'+esc(ph.replace(/^(222|244)/,'$1 '))+'</span>';
  loadBooks();
})();

/* ---------- الدفاتر ---------- */
function meta(b){
  /* kind/phone من الأعمدة إن وُجدت، وإلا من note المشفّر [k=customer;p=2223…] */
  var m={kind:b.kind||'',phone:b.phone||'',note:b.note||''};
  var mm=/^\[k=(\w*);p=([\d+]*)\]\s?/.exec(m.note||'');
  if(mm){m.kind=m.kind||mm[1];m.phone=m.phone||mm[2];m.note=m.note.replace(mm[0],'');}
  m.kind=m.kind||'customer';
  return m;
}
function netOf(b){ /* أهم عملة بحسب الحجم */
  var bal=b.bal||{},ks=Object.keys(bal);if(!ks.length)return null;
  ks.sort(function(a,c){return Math.abs(bal[c].net)-Math.abs(bal[a].net);});
  return {ccy:ks[0],net:+bal[ks[0]].net||0,more:ks.length-1};
}
/* دلالة الرصيد: للزبون/المورد الصافي = قبضت − دفعت ؛ سالب = مستحق لك (أعطيته أكثر) */
function balText(kind,net){
  if(kind==='cash')return {t:net>=0?'في الصندوق':'عجز',c:net>=0?'':'r'};
  if(net<0)return {t:'مستحق لك',c:'g'};
  if(net>0)return {t:'عليك له',c:'r'};
  return {t:'متعادل',c:'z'};
}
async function loadBooks(){
  try{
    var r=await fetch(SB+'/bdl_books_summary?select=*&order=updated_at.desc&limit=500',{headers:H()});
    if(r.status===401){localStorage.removeItem('arkan_sb_jwt');location.replace('account.html?next=books.html');return;}
    if(!r.ok){
      var txt=await r.text();
      if(r.status===404||/PGRST205|relation/.test(txt)){BOOKS=[];renderBooks();
        $('#books').innerHTML='<div class="note">جداول الدفاتر غير مفعّلة بعد في القاعدة. نفّذ ملف bdl-books.sql في Supabase مرة واحدة ثم أعد التحميل.</div>';return;}
      throw new Error(txt);
    }
    BOOKS=await r.json();
    if(BOOKS.length&&!('kind' in BOOKS[0]))COLS_OK=false;
  }catch(e){toast('تعذّر تحميل الدفاتر: '+e.message,'bad');BOOKS=BOOKS||[];}
  renderBooks();
}
function renderBooks(){
  var box=$('#books');var q=Q.trim().toLowerCase();
  var list=(BOOKS||[]).filter(function(b){
    var m=meta(b);
    if(KIND!=='all'&&m.kind!==KIND)return false;
    if(q&&!(String(b.name||'').toLowerCase().indexOf(q)>-1||String(m.phone||'').indexOf(q.replace(/\D/g,''))>-1&&q.replace(/\D/g,'')))return false;
    return true;
  });
  $('#secN').textContent=list.length?list.length+' دفتر':'';
  /* الموقف العام لكل العملات */
  var due={},owe={},cash={};
  (BOOKS||[]).forEach(function(b){var m=meta(b),bal=b.bal||{};
    Object.keys(bal).forEach(function(c){var n=+bal[c].net||0;
      if(m.kind==='cash'){cash[c]=(cash[c]||0)+n;return;}
      if(n<0)due[c]=(due[c]||0)+(-n);else if(n>0)owe[c]=(owe[c]||0)+n;});});
  function top(o){var ks=Object.keys(o);if(!ks.length)return '0';ks.sort(function(a,b){return o[b]-o[a];});return ks.slice(0,2).map(function(c){return fmt(o[c])+' '+c;}).join(' / ');}
  var netAll={};[due,owe].forEach(function(o,i){Object.keys(o).forEach(function(c){netAll[c]=(netAll[c]||0)+(i?-o[c]:o[c]);});});
  var nk=Object.keys(netAll).sort(function(a,b){return Math.abs(netAll[b])-Math.abs(netAll[a]);});
  $('#hBig').innerHTML=nk.length?fmt(netAll[nk[0]])+'<small>'+nk[0]+(nk.length>1?' +'+(nk.length-1):'')+'</small>':'0';
  $('#hBig').style.color=nk.length&&netAll[nk[0]]<0?'#FFB3B8':'#fff';
  $('#hDue').textContent=top(due);$('#hOwe').textContent=top(owe);$('#hN').textContent=(BOOKS||[]).length;
  if(!list.length){
    box.innerHTML='<div class="empty"><b>'+(BOOKS&&BOOKS.length?'لا نتائج':'ابدأ دفترك الأول')+'</b>'+(BOOKS&&BOOKS.length?'جرّب اسمًا أو رقمًا آخر':'دفتر لكل زبون أو مورد، أو صندوق لنقدك اليومي. كل قيد يُحفظ سحابيًا ويُرفض التكرار.')+'</div>';return;
  }
  box.innerHTML=list.map(function(b){
    var m=meta(b),n=netOf(b),bt=n?balText(m.kind,n.net):{t:'لا قيود بعد',c:'z'};
    var ini=String(b.name||'?').trim().charAt(0).toUpperCase();
    return '<div class="bk" data-id="'+b.id+'"><div class="av '+(m.kind==='supplier'?'sup':m.kind==='cash'?'cash':'')+'">'+esc(ini)+'</div>'+
      '<div class="m"><div class="n">'+esc(b.name)+'</div><div class="s">'+KIND_L[m.kind]+(m.phone?' · <span class="num">'+esc(m.phone)+'</span>':'')+' · '+rel(b.last_entry_at)+'</div></div>'+
      '<div class="b"><b class="num '+bt.c+'">'+(n?fmt(Math.abs(n.net))+' '+n.ccy:'—')+'</b><small>'+bt.t+(n&&n.more?' +'+n.more:'')+'</small></div></div>';
  }).join('');
}

function inRange(d){
  if(RANGE==='all')return true;var t=todayISO();

  if(RANGE==='week'){var n=new Date(),day=(n.getDay()+1)%7;/* الأسبوع يبدأ السبت */var s=new Date(n);s.setDate(n.getDate()-day);var si=s.getFullYear()+'-'+String(s.getMonth()+1).padStart(2,'0')+'-'+String(s.getDate()).padStart(2,'0');return d>=si;}
  return true;
}

    if(e.side==='in')tin[e.ccy]=(tin[e.ccy]||0)+a;else tout[e.ccy]=(tout[e.ccy]||0)+a;});

  /* الملخص: العملة المختارة أو الأكبر */
  var sc=CCY!=='ALL'?CCY:(Object.keys(run).sort(function(a,b){return Math.abs(run[b])-Math.abs(run[a]);})[0]||'');
  var net=run[sc]||0,bt=balText(m.kind,net);

var RC={file:null,url:null,ref:null,fp:null};
function entrySheet(side,e){
  RC={file:null,url:null,ref:null,fp:null};
  var kind=meta(BK).kind;
  var title=side==='in'?(kind==='cash'?'إيداع في الصندوق':'قبضت من '+BK.name):(kind==='cash'?'سحب من الصندوق':'دفعت إلى '+BK.name);

    (e?'':'<div class="att" id="att"><div class="st"><b>تصوير الإيصال أو اختياره</b><small>يُقرأ المبلغ والمرجع تلقائيًا ويُرفض المكرر</small></div></div>')+
    '<div class="f"><label>البيان</label><input id="eNote" value="'+esc(e?e.note:'')+'" placeholder="مثال: بضاعة، دفعة، تحويل…" maxlength="140"></div>'+
    '<button class="cta '+side+'" id="eSave">'+(e?'حفظ التعديل':(side==='in'?'تسجيل القبض':'تسجيل الدفع'))+'</button>'+
    (e?'<button class="it red" id="eDel" style="margin-top:8px;justify-content:center">حذف القيد</button>':''));
  setTimeout(function(){$('#eAmt').focus();},60);
  if(!e){$('#att').onclick=function(){$('#rcFile').value='';$('#rcFile').click();};}
  $('#eSave').onclick=async function(){
    var amt=parseFloat(String($('#eAmt').value).replace(/[^\d.]/g,''));

    this.disabled=true;
    var body={book_id:BK.id,side:side,amount:amt,ccy:$('#eCcy').value,note:$('#eNote').value.trim()||null,entry_date:$('#eDate').value||todayISO()};
    try{
      if(!e){
        /* رفض التكرار بمرجع الإيصال داخل الدفتر */
        if(RC.ref){var d=EN.find(function(x){return x.ref&&x.ref===RC.ref;});if(d){throw new Error('هذا الإيصال مسجّل مسبقًا في '+d.entry_date+' بمبلغ '+fmt(d.amount)+' '+d.ccy);}}
        if(RC.file){var up=await uploadReceipt(RC.file);if(up)body.receipt_url=up;}
        if(RC.ref)body.ref=RC.ref;
      }
      var r;
      if(e)r=await fetch(SB+'/bdl_book_entries?id=eq.'+e.id,{method:'PATCH',headers:H(),body:JSON.stringify(body)});
      else r=await fetch(SB+'/bdl_book_entries',{method:'POST',headers:H(),body:JSON.stringify(body)});
      if(!r.ok){var tx=await r.text();
        if(/receipt_url|ref/.test(tx)&&/column/.test(tx)){delete body.receipt_url;delete body.ref;
          r=await fetch(SB+'/bdl_book_entries'+(e?'?id=eq.'+e.id:''),{method:e?'PATCH':'POST',headers:H(),body:JSON.stringify(body)});
          if(!r.ok)throw new Error((await r.text()).slice(0,120));}
        else if(r.status===409)throw new Error('مرجع الإيصال مسجّل مسبقًا');
        else throw new Error(tx.slice(0,120));}
      bsClose();toast(e?'تم التعديل':(side==='in'?'سُجّل القبض':'سُجّل الدفع'),'good');
      await loadEntries();loadBooks();
    }catch(err){toast(err.message,'bad');this.disabled=false;}

    if(!confirm('حذف هذا القيد؟'))return;
    var r=await fetch(SB+'/bdl_book_entries?id=eq.'+e.id,{method:'DELETE',headers:H()});
    if(!r.ok){toast('لم يُحذف','bad');return;}

$('#rcFile').addEventListener('change',async function(){

    var p=await Promise.race([ArkanRead.readAmount(f),new Promise(function(_,rej){setTimeout(function(){rej(new Error('انتهت المهلة'));},45000);})]);
    var cy=String(p.ccy||'').toUpperCase().replace('KZ','AOA');
    if(p.amount){$('#eAmt').value=p.amount;}
    if(CCYS.indexOf(cy)>-1)$('#eCcy').value=cy;
    if(p.date&&/^\d{4}-\d{2}-\d{2}$/.test(p.date))$('#eDate').value=p.date;
    RC.ref=p.txn||null;
    var n=$('#eNote');if(!n.value){n.value=[p.bank,p.name].filter(Boolean).join(' — ');}
    var dup=RC.ref&&EN.find(function(x){return x.ref===RC.ref;});
    att.className='att '+(dup?'rd':'ok');
    att.innerHTML='<img src="'+RC.url+'" alt=""><div class="st"><b>'+(dup?'مكرر: مسجّل في '+dup.entry_date:(p.amount?'قُرئ: '+fmt(p.amount)+' '+(cy||''):'لم يُقرأ المبلغ — أدخله يدويًا'))+'</b><small>'+(RC.ref?'المرجع '+esc(RC.ref):'بلا مرجع')+(p.eng?' · '+p.eng:'')+'</small></div>';
  }catch(err){
    att.className='att rd';att.innerHTML='<img src="'+RC.url+'" alt=""><div class="st"><b>تعذّرت القراءة — أدخل المبلغ يدويًا</b><small>'+esc(err.message)+'</small></div>';
  }
});
async function uploadReceipt(file){
  try{
    var uid=JWT.user_id||'u';var path='books/'+uid+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+(/pdf/i.test(file.type)?'.pdf':'.jpg');
    var r=await fetch(SBU+'/storage/v1/object/receipts/'+path,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+JWT.token,'Content-Type':file.type||'image/jpeg','x-upsert':'true'},body:file});
    if(!r.ok)return null;
    var s=await fetch(SBU+'/storage/v1/object/sign/receipts/'+path,{method:'POST',headers:H(),body:JSON.stringify({expiresIn:60*60*24*365*5})});
    if(!s.ok)return null;var j=await s.json();return SBU+'/storage/v1'+j.signedURL;
  }catch(e){return null;}
}

/* ---------- كشف حساب PDF (Canvas → jsPDF لدعم العربية) ---------- */
function statementPDF(){
  var JS=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;if(!JS){toast('مولّد PDF لم يُحمّل بعد','bad');return;}
  var m=meta(BK),rows=EN.filter(function(e){return inRange(e.entry_date)&&(SIDE==='all'||e.side===SIDE)&&(CCY==='ALL'||e.ccy===CCY);});
  var W=1240,rowH=54,top=250,H_=top+rows.length*rowH+170;
  var cv=$('#pdfCv');cv.width=W;cv.height=H_;var c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,W,H_);c.direction='rtl';c.textAlign='right';
  c.fillStyle='#0B2F70';c.fillRect(0,0,W,120);
  c.fillStyle='#fff';c.font='700 34px "IBM Plex Sans Arabic",sans-serif';c.fillText('كشف حساب — '+BK.name,W-50,58);
  c.font='500 20px "IBM Plex Sans Arabic",sans-serif';c.fillText(KIND_L[m.kind]+(m.phone?'  ·  '+m.phone:'')+'  ·  '+todayISO(),W-50,96);
  c.textAlign='left';c.font='800 30px Inter,sans-serif';c.fillText('BDL',50,70);
  var run={},tin={},tout={};EN.forEach(function(e){var a=+e.amount;run[e.ccy]=(run[e.ccy]||0)+(e.side==='in'?a:-a);e._run=run[e.ccy];});
  c.fillStyle='#0B2447';c.textAlign='right';
  var cols=[W-50,W-330,W-720,W-940,W-1100];
  c.fillStyle='#EEF3FA';c.fillRect(30,top-44,W-60,40);c.fillStyle='#5C7699';c.font='700 19px "IBM Plex Sans Arabic",sans-serif';
  ['التاريخ','البيان','قبض','دفع','الرصيد'].forEach(function(t,i){c.fillText(t,cols[i],top-16);});
  c.font='600 20px "IBM Plex Sans Arabic",sans-serif';
  rows.forEach(function(e,i){var y=top+i*rowH+34;
    if(i%2){c.fillStyle='#F8FAFF';c.fillRect(30,top+i*rowH,W-60,rowH);}
    c.fillStyle='#0B2447';c.fillText(e.entry_date,cols[0],y);
    var t=e.note||'';if(t.length>34)t=t.slice(0,33)+'…';c.fillText(t,cols[1],y);
    c.fillStyle='#0B7A3B';c.fillText(e.side==='in'?fmt(e.amount):'',cols[2],y);
    c.fillStyle='#B00020';c.fillText(e.side==='out'?fmt(e.amount):'',cols[3],y);
    c.fillStyle='#0B2447';c.fillText(fmt(e._run)+' '+e.ccy,cols[4],y);
    if(e.side==='in')tin[e.ccy]=(tin[e.ccy]||0)+ +e.amount;else tout[e.ccy]=(tout[e.ccy]||0)+ +e.amount;
  });
  var y2=top+rows.length*rowH+40;c.fillStyle='#0B2F70';c.fillRect(30,y2,W-60,3);
  c.font='700 22px "IBM Plex Sans Arabic",sans-serif';var yy=y2+40;
  Object.keys(run).forEach(function(cc){var net=run[cc],bt=balText(m.kind,net);
    c.fillStyle='#0B2447';c.fillText('قبض '+fmt(tin[cc]||0)+'   دفع '+fmt(tout[cc]||0)+'   '+bt.t+' '+fmt(Math.abs(net))+' '+cc,W-50,yy);yy+=34;});
  c.fillStyle='#5C7699';c.font='500 16px "IBM Plex Sans Arabic",sans-serif';c.fillText('صادر من دفاتر BDL — lbdal.com',W-50,H_-30);
  var img=cv.toDataURL('image/jpeg',.92);var pdf=new JS({unit:'pt',format:[W*.6,H_*.6]});pdf.addImage(img,'JPEG',0,0,W*.6,H_*.6);
  var fn='كشف-'+BK.name.replace(/[\\/:*?"<>|]/g,'')+'-'+todayISO()+'.pdf';
  try{var blob=pdf.output('blob');var file=new File([blob],fn,{type:'application/pdf'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fn}).catch(function(){});return;}}catch(e){}
  pdf.save(fn);
}

/* ---------- Excel ---------- */
function bookRows(b,ens){var run={};return ens.map(function(e){var a=+e.amount;run[e.ccy]=(run[e.ccy]||0)+(e.side==='in'?a:-a);
  return {'التاريخ':e.entry_date,'النوع':e.side==='in'?'قبض':'دفع','المبلغ':a,'العملة':e.ccy,'البيان':e.note||'','المرجع':e.ref||'','الرصيد بعده':run[e.ccy]};});}
function exportXLS(books){
  if(!window.XLSX){toast('مكتبة Excel لم تُحمّل بعد','bad');return;}
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.json_to_sheet(bookRows(BK,EN));ws['!cols']=[{wch:12},{wch:7},{wch:14},{wch:8},{wch:34},{wch:18},{wch:16}];
  XLSX.utils.book_append_sheet(wb,ws,BK.name.slice(0,28).replace(/[\\/?*\[\]:]/g,' '));
  XLSX.writeFile(wb,'دفتر-'+BK.name+'-'+todayISO()+'.xlsx');
}
async function exportAll(){
  if(!window.XLSX){toast('مكتبة Excel لم تُحمّل بعد','bad');return;}
  if(!BOOKS||!BOOKS.length){toast('لا دفاتر بعد','bad');return;}
  toast('جارٍ التجميع…');
  var r=await fetch(SB+'/bdl_book_entries?select=*&order=entry_date.asc,created_at.asc&limit=10000',{headers:H()});
  var all=r.ok?await r.json():[];
  var wb=XLSX.utils.book_new();
  var summary=BOOKS.map(function(b){var m=meta(b),n=netOf(b);return {'الدفتر':b.name,'النوع':KIND_L[m.kind],'الهاتف':m.phone||'','عدد القيود':b.n_entries||0,'الصافي':n?n.net:0,'العملة':n?n.ccy:'','الحالة':n?balText(m.kind,n.net).t:''};});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary),'الملخص');
  var used={};
  BOOKS.forEach(function(b){var ens=all.filter(function(e){return e.book_id===b.id;});if(!ens.length)return;
    var nm=b.name.slice(0,26).replace(/[\\/?*\[\]:]/g,' ');var k=nm,i=2;while(used[k]){k=nm+' '+(i++);}used[k]=1;
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bookRows(b,ens)),k);});
  XLSX.writeFile(wb,'دفاتري-'+todayISO()+'.xlsx');
}

/* ---------- واتساب ---------- */
function shareWA(){
  var m=meta(BK),run={};EN.forEach(function(e){run[e.ccy]=(run[e.ccy]||0)+(e.side==='in'?+e.amount:-e.amount);});
  var lines=Object.keys(run).map(function(c){var bt=balText(m.kind,run[c]);return bt.t+': '+fmt(Math.abs(run[c]))+' '+c;});
  var last=EN.slice(-5).reverse().map(function(e){return e.entry_date+'  '+(e.side==='in'?'قبض':'دفع')+' '+fmt(e.amount)+' '+e.ccy+(e.note?' — '+e.note:'');});
  var txt='كشف حساب '+BK.name+' بتاريخ '+todayISO()+'\n'+lines.join('\n')+(last.length?'\n\nآخر القيود:\n'+last.join('\n'):'')+'\n\nدفاتر BDL — lbdal.com';
  location.href='https://wa.me/'+(m.phone||'')+'?text='+encodeURIComponent(txt);
}
