<meta charset="UTF-8">

<style>
:root{
  --navy:#003B8F; --navy-2:#0058D9; --navy-3:#2E3A48; --ink:#0a1e4d;
  --red:#e74c3c; --orange:#0058D9; --amber:#0058D9; --blue:#0058D9;
  --grad:linear-gradient(120deg,#e74c3c 0%,#0058D9 30%,#0058D9 58%,#0058D9 100%);
  --grad-rev:linear-gradient(90deg,#0058D9,#0058D9,#0058D9,#e74c3c);
  --txt:#0a1e4d; --txt-2:#5a6a8f; --txt-3:#8b97b5;
  --page:#f6f8fc; --card:#ffffff; --stroke:#e3e9f4; --stroke-2:#cdd8ec;
  --up:#1e9e63; --down:#e74c3c; --r:20px; --r-sm:14px;
  --ff:'Manrope','IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:clip}
body{font-family:var(--ff);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased;
  background:var(--page);}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
.mono{font-family:var(--mono)}
.grad-text{color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.18)}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(16px);
  background:rgba(255,255,255,.92);border-bottom:1px solid var(--stroke)}
.nav .wrap{display:flex;align-items:center;gap:14px;height:68px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.04em;font-size:19px;color:var(--navy)}
.brand .mark{width:38px;height:38px;border-radius:0;display:grid;place-items:center;background:var(--grad);
  box-shadow:0 8px 22px -8px rgba(231,76,60,.55)}
.brand .mark svg{width:22px;height:22px;color:#fff}
.nav .links{display:flex;gap:26px;margin-inline-start:22px;font-size:14.5px;color:var(--txt-2)}
.nav .links a:hover{color:#fff}
.nav .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;border:0;cursor:pointer;
  padding:11px 20px;border-radius:0;transition:transform .18s,box-shadow .18s,border-color .18s}
.btn-grad{background:var(--navy);color:#fff;box-shadow:0 10px 26px -10px rgba(52,152,219,.6)}
.btn-grad:hover{transform:translateY(-1px);box-shadow:0 16px 34px -10px rgba(231,76,60,.55)}
.btn-ghost{background:#fff;border:1px solid var(--stroke-2);color:var(--navy)}
.btn-ghost:hover{border-color:var(--blue)}
.nav-toggle{display:none;width:42px;height:42px;border-radius:0;border:1px solid var(--stroke-2);
  background:#fff;color:var(--navy);cursor:pointer}

/* ---------- hero ---------- */
.hero{padding:64px 0 46px;text-align:center;position:relative;background:var(--grad);color:#fff;
  border-bottom-left-radius:34px;border-bottom-right-radius:34px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 18% 22%, rgba(255,255,255,.16) 1.6px, transparent 1.6px);
  background-size:26px 26px;opacity:.5}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.12em;
  text-transform:none;color:#fff;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);border-radius:0;padding:8px 17px;position:relative}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px rgba(46,204,113,.18)}
.hero h1{font-size:clamp(34px,7vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:22px auto 18px;max-width:15ch}
.hero p{color:rgba(255,255,255,.92);font-size:clamp(15px,2.6vw,19px);max-width:56ch;margin:0 auto 28px}
.hero .cta{display:flex;gap:13px;justify-content:center;flex-wrap:wrap}

/* ---------- africa network globe ---------- */
.network{margin:26px auto 0;max-width:960px}
.globe-card{position:relative;border-radius:0;overflow:hidden;border:1px solid var(--stroke);
  background:#fff;box-shadow:0 30px 70px -34px rgba(10,30,77,.25)}
.globe-card::before{content:"";position:absolute;inset:0;height:4px;background:var(--grad)}
.globe-head{display:flex;align-items:center;gap:12px;padding:18px 22px 6px}
.globe-head .k{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.globe-head h3{font-size:19px;font-weight:800;color:var(--navy)}
.globe-head .live{margin-inline-start:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--txt-2)}
.globe-head .live .d{width:8px;height:8px;border-radius:50%;background:var(--up);animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.globe-svg{display:block;width:100%;height:auto}
.node-label{font-family:var(--ff);font-weight:700;font-size:12px;fill:#fff}
.node-sub{font-family:var(--mono);font-size:10px;fill:rgba(219,228,255,.7)}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.7}80%,100%{transform:scale(2.4);opacity:0}}
.flow{stroke-dasharray:5 9;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--stroke)}
.stats-bar .s{padding:16px 14px;text-align:center;border-inline-start:1px solid var(--stroke)}
.stats-bar .s:first-child{border-inline-start:0}
.stats-bar .s .v{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--navy)}
.stats-bar .s .l{font-size:11.5px;color:var(--txt-3);margin-top:2px}

/* ---------- trust ---------- */
.trust{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:30px 0 8px;color:var(--txt-2);font-size:13.5px;font-weight:600}
.trust .t{display:inline-flex;align-items:center;gap:8px}
.trust .t svg{width:17px;height:17px;color:var(--blue)}

/* ---------- ticker ---------- */
.ticker{margin:26px 0;border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke);
  background:#fff;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker-track{display:flex;gap:38px;padding:12px 0;width:max-content;animation:tick 34s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.tk{display:inline-flex;align-items:center;gap:9px;font-size:14px;white-space:nowrap}
.tk b{font-weight:700}.tk .pr{font-family:var(--mono)}
.tk .up{color:var(--up)}.tk .dn{color:var(--down)}

/* ---------- sections ---------- */
.sec{padding:56px 0}
.sec-head{text-align:center;margin-bottom:34px}
.sec-head .k{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head h2{font-size:clamp(24px,4.4vw,40px);font-weight:800;letter-spacing:-.02em;margin-top:10px;color:var(--navy)}
.sec-head p{color:var(--txt-2);max-width:54ch;margin:12px auto 0}

.grid{display:grid;gap:16px}
.g-markets{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.g-3{grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}

/* card with gradient top */
.card{position:relative;background:#fff;border:1px solid var(--stroke);border-radius:0;
  padding:20px;overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);border-color:var(--stroke-2);box-shadow:0 26px 50px -26px rgba(10,30,77,.28)}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px}
.gt-1::before{background:linear-gradient(90deg,#e74c3c,#0058D9)}
.gt-2::before{background:linear-gradient(90deg,#0058D9,#0058D9)}
.gt-3::before{background:linear-gradient(90deg,#0058D9,#0058D9)}
.gt-4::before{background:linear-gradient(90deg,#0058D9,#003B8F)}
.gt-full::before{background:var(--grad)}
.gt-rainbow::before{background:linear-gradient(90deg,#e74c3c,#0058D9,#0058D9,#2ecc71,#0058D9,#9b59b6);
  background-size:200% 100%;animation:rainbow 6s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}

/* market card */
.mkt .top{display:flex;align-items:center;gap:11px}
.mkt .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-weight:600;font-size:12px;color:#fff}
.mkt .pair{font-weight:700;font-size:15px}.mkt .sub{font-size:11.5px;color:var(--txt-3)}
.mkt .chg{margin-inline-start:auto;font-family:var(--mono);font-size:13px;font-weight:600}
.mkt .price{font-family:var(--mono);font-weight:600;font-size:26px;margin:14px 0 2px;color:var(--navy)}
.mkt .vol{font-size:11.5px;color:var(--txt-3)}
.spark{width:100%;height:44px;margin-top:12px;display:block}

/* converter */
.conv{max-width:560px;margin:0 auto}
.conv .row{display:flex;align-items:center;gap:12px;background:var(--page);border:1px solid var(--stroke-2);
  border-radius:0;padding:15px 16px}
.conv .row label{font-size:11px;color:var(--txt-3);display:block;margin-bottom:4px;letter-spacing:.08em;text-transform:uppercase}
.conv .amt{background:none;border:0;color:var(--navy);font-family:var(--mono);font-size:26px;font-weight:600;width:100%;outline:none}
.conv .cur{display:flex;align-items:center;gap:8px;font-weight:700;background:#fff;color:var(--navy);
  border:1px solid var(--stroke-2);border-radius:0;padding:9px 13px;font-size:15px;white-space:nowrap}
.conv .swap{margin:8px auto;display:grid;place-items:center;width:44px;height:44px;border-radius:0;cursor:pointer;
  background:var(--navy);color:#fff;border:0;box-shadow:0 10px 24px -10px rgba(52,152,219,.6);transition:transform .3s}
.conv .swap:hover{transform:rotate(180deg)}
.conv .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--txt-2);margin:16px 4px 20px}
.conv .meta .mono{color:var(--navy)}

/* settlement steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative;margin-top:10px}
.steps::before{content:"";position:absolute;top:26px;left:12%;right:12%;height:2px;
  background:linear-gradient(90deg,#e74c3c,#0058D9,#0058D9,#0058D9)}
.step{text-align:center;position:relative;z-index:1;padding:0 8px}
.step .n{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:18px;color:#fff;border:4px solid var(--page)}
.step:nth-child(1) .n{background:#e74c3c}.step:nth-child(2) .n{background:#0058D9}
.step:nth-child(3) .n{background:#0058D9}.step:nth-child(4) .n{background:#0058D9}
.step h4{font-size:15px;font-weight:700;color:var(--navy)}.step p{font-size:12.5px;color:var(--txt-2);margin-top:5px}

/* wallet preview */
.wallet-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.wcard{position:relative;border-radius:0;padding:18px;overflow:hidden;border:1px solid var(--stroke);color:#04122e}
.wcard .c{font-family:var(--mono);font-weight:600;font-size:13px;opacity:.85}
.wcard .bal{font-family:var(--mono);font-weight:600;font-size:24px;margin-top:8px}
.wcard .d{font-size:12px;font-weight:600;margin-top:2px;opacity:.8}
.w1{background:linear-gradient(135deg,#e74c3c,#0058D9)}.w2{background:linear-gradient(135deg,#0058D9,#0058D9)}
.w3{background:linear-gradient(135deg,#0058D9,#0058D9)}.w4{background:linear-gradient(135deg,#0058D9,#003B8F);color:#eaf0ff}

/* ai features */
.feat{display:flex;gap:15px;align-items:flex-start}
.feat .ic{width:46px;height:46px;flex:none;border-radius:0;display:grid;place-items:center;color:#fff;background:var(--grad)}
.feat .ic svg{width:23px;height:23px}
.feat h4{font-size:16px;font-weight:700;color:var(--navy)}.feat p{font-size:13.5px;color:var(--txt-2);margin-top:4px}


/* ---------- visa card product ---------- */
.visa-wrap{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.vcard{position:relative;aspect-ratio:1.586;max-width:430px;margin:0 auto;border-radius:0;padding:24px;
  background:linear-gradient(125deg,#2E3A48 0%,#003B8F 45%,#0058D9 75%,#0058D9 130%);color:#fff;
  box-shadow:0 34px 70px -28px rgba(0,26,82,.55);overflow:hidden;width:100%}
.vcard::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 82% 18%, rgba(255,255,255,.14) 1.4px, transparent 1.4px);
  background-size:20px 20px;opacity:.55}
.vcard .row1{display:flex;justify-content:space-between;align-items:flex-start}
.vcard .bname{font-weight:800;letter-spacing:.06em;font-size:15px}
.vcard .chip{width:44px;height:32px;border-radius:0;background:linear-gradient(135deg,#f5d76b,#c9962c);margin-top:26px}
.vcard .num{font-family:var(--mono);font-size:clamp(16px,3.6vw,21px);letter-spacing:.14em;margin-top:14px}
.vcard .row2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:16px}
.vcard .lbl{font-size:9px;letter-spacing:.12em;opacity:.75}.vcard .val{font-size:13px;font-weight:600}
.vcard .visa{font-style:italic;font-weight:800;font-size:26px;letter-spacing:.02em}
.visa-info h3{font-size:clamp(22px,3.6vw,32px);font-weight:800;color:var(--navy);letter-spacing:-.02em}
.visa-price{display:flex;align-items:baseline;gap:9px;margin:14px 0}
.visa-price .p{font-family:var(--mono);font-weight:600;font-size:38px;color:var(--navy)}
.visa-price .c{font-weight:700;color:var(--txt-2)}
.visa-feats{list-style:none;margin:8px 0 22px;display:grid;gap:10px}
.visa-feats li{display:flex;gap:10px;align-items:center;font-size:14.5px;color:var(--txt-2)}
.visa-feats li svg{width:18px;height:18px;color:var(--up);flex:none}
@media(max-width:820px){.visa-wrap{grid-template-columns:1fr}}
/* footer */
footer{border-top:1px solid var(--stroke);padding:40px 0;margin-top:20px;color:var(--txt-3);font-size:13px;background:#fff}
footer .wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
footer .sp{flex:1}
footer a{color:var(--txt-2)}footer a:hover{color:#fff}

@media(max-width:820px){
  .nav .links{display:none}.nav-toggle{display:grid;place-items:center}
  .stats-bar{grid-template-columns:repeat(2,1fr)}.stats-bar .s:nth-child(3){border-inline-start:0}
  .stats-bar .s:nth-child(3),.stats-bar .s:nth-child(4){border-top:1px solid var(--stroke)}
  .steps{grid-template-columns:repeat(2,1fr);gap:26px 0}.steps::before{display:none}
}
</style>

<script>
/* ---- globe dots ---- */
(function(){
  const cx=360, cy=230, R=190, step=15; let s='';
  for(let y=cy-R;y<=cy+R;y+=step){
    const off=(Math.round((y-cy)/step)%2)?step/2:0;
    for(let x=cx-R;x<=cx+R;x+=step){
      const px=x+off, dx=px-cx, dy=(y-cy)*(R/ (R*0.82));
      const d=Math.sqrt((px-cx)**2+(y-cy)**2);
      if(d<=R){ const op=(0.10+0.5*(1-d/R)).toFixed(2);
        s+=`<circle cx="${px}" cy="${y}" r="1.5" fill="#dbe4ff" opacity="${op}"/>`; }
    }
  }
  document.getElementById('globeDots').innerHTML=s;
})();

/* ---- network nodes ---- */
(function(){
  const nodes=[
    {n:'Mauritania',c:'MRU',x:315,y:190,col:'#0058D9'},
    {n:'Senegal',c:'XOF',x:300,y:175,col:'#0058D9'},
    {n:'Angola',c:'AOA',x:380,y:320,col:'#e74c3c'},
    {n:'Congo',c:'XAF',x:430,y:292,col:'#9b59b6'},
    {n:'UAE',c:'AED',x:588,y:196,col:'#2ecc71'},
    {n:'China',c:'CNY',x:690,y:145,col:'#e74c3c'}
  ];
  let s='';
  for(const p of nodes){
    const anchor = p.x>520 ? 'start':'end'; const tx = p.x>520 ? p.x+14 : p.x-14;
    s+=`<g>
      <circle cx="${p.x}" cy="${p.y}" r="9" fill="${p.col}" opacity=".35" class="pulse"/>
      <circle cx="${p.x}" cy="${p.y}" r="6" fill="${p.col}" stroke="#fff" stroke-width="1.5"/>
      <text class="node-label" x="${tx}" y="${p.y-2}" text-anchor="${anchor}">${p.n}</text>
      <text class="node-sub" x="${tx}" y="${p.y+11}" text-anchor="${anchor}">${p.c}</text>
    </g>`;
  }
  document.getElementById('nodes').innerHTML=s;
})();

/* ---- ticker ---- */
(function(){
  const rows=[['USDT/AOA','843.50','+1.20','up'],['USDT/MRU','39.85','+0.08','up'],['EUR/AOA','920.30','+0.23','up'],
    ['CNY/AOA','118.40','-0.15','dn'],['BTC/USDT','67,420','+1.20','up'],['ETH/USDT','3,520','+0.85','up'],
    ['AED/MRU','10.86','+0.33','up'],['EUR/MRU','43.10','-0.05','dn']];
  const one=rows.map(r=>`<span class="tk"><b>${r[0]}</b><span class="pr">${r[1]}</span><span class="${r[3]}">${r[2]}%</span></span>`).join('');
  document.getElementById('ticker').innerHTML=one+one;
})();

/* ---- markets ---- */
(function(){
  const spark=(col,seed)=>{let d='M0 34';let y=34;for(let i=1;i<=11;i++){y+=(Math.sin(seed+i)*6)-(i*1.4);y=Math.max(6,Math.min(40,y));d+=` L${i*22} ${y.toFixed(0)}`;}return `<svg class="spark" viewBox="0 0 242 48" preserveAspectRatio="none"><polyline points="${d.replace(/[ML]/g,'').trim()}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;};
  const M=[
    {gt:'gt-1',bg:'linear-gradient(135deg,#e74c3c,#0058D9)',pair:'USDT / AOA',sub:'Angola',price:'843.50',chg:'+1.20',up:1,vol:'$2.4M',col:'#e74c3c'},
    {gt:'gt-2',bg:'linear-gradient(135deg,#0058D9,#0058D9)',pair:'USDT / MRU',sub:'Mauritania',price:'39.85',chg:'+0.08',up:1,vol:'$1.1M',col:'#0058D9'},
    {gt:'gt-3',bg:'linear-gradient(135deg,#0058D9,#0058D9)',pair:'EUR / AOA',sub:'Angola',price:'920.30',chg:'+0.23',up:1,vol:'$3.8M',col:'#0058D9'},
    {gt:'gt-4',bg:'linear-gradient(135deg,#0058D9,#003B8F)',pair:'CNY / AOA',sub:'China corridor',price:'118.40',chg:'-0.15',up:0,vol:'$1.9M',col:'#0058D9'},
    {gt:'gt-1',bg:'linear-gradient(135deg,#e74c3c,#0058D9)',pair:'BTC / USDT',sub:'Crypto',price:'67,420',chg:'+1.20',up:1,vol:'$8.2M',col:'#e74c3c'},
    {gt:'gt-3',bg:'linear-gradient(135deg,#0058D9,#0058D9)',pair:'AED / MRU',sub:'Gulf corridor',price:'10.86',chg:'+0.33',up:1,vol:'$0.9M',col:'#0058D9'}
  ];
  document.getElementById('markets-grid').innerHTML=M.map((m,i)=>`
    <div class="card mkt ${m.gt}">
      <div class="top">
        <div class="badge" style="background:${m.bg}">${m.pair.split(' ')[0]}</div>
        <div><div class="pair">${m.pair}</div><div class="sub">${m.sub}</div></div>
        <div class="chg" style="color:${m.up?'var(--up)':'var(--down)'}">${m.up?'▲':'▼'} ${m.chg}%</div>
      </div>
      <div class="price">${m.price}</div>
      <div class="vol">Vol ${m.vol} · spread 0.1%</div>
      ${spark(m.col,i*1.7)}
    </div>`).join('');
})();

/* ---- converter ---- */
(function(){
  const R={USDT:1,MRU:39.85,AOA:843.5,EUR:0.92,CNY:7.1,AED:3.67};
  const f=document.getElementById('fromAmt'),t=document.getElementById('toAmt'),
    fc=document.getElementById('fromCur'),tc=document.getElementById('toCur'),rt=document.getElementById('rateTxt');
  function calc(){const a=parseFloat(f.value.replace(/[^\d.]/g,''))||0;
    const rate=(R[tc.textContent]/R[fc.textContent]);
    t.value=(a*rate*0.997).toLocaleString('en-US',{maximumFractionDigits:2});
    rt.textContent=`1 ${fc.textContent} = ${rate.toLocaleString('en-US',{maximumFractionDigits:4})} ${tc.textContent}`;}
  f.addEventListener('input',calc);
  document.getElementById('swapBtn').addEventListener('click',()=>{const a=fc.textContent;fc.textContent=tc.textContent;tc.textContent=a;calc();});
  calc();
})();
</script>
