<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#F6FAFD">
<title>ARKAN Chat</title>
<style>
:root{--sky:#19A9F5;--blue:#0A56B8;--navy:#0B2F70;--paper:#F6FAFD;--ink:#0B1B33;--mut:#5B6B85;--line:rgba(11,47,112,.08);--grad:linear-gradient(135deg,#19A9F5,#0A56B8)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden;font-size:15px;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.top .av{width:40px;height:40px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.top .nm{font-weight:800;font-size:16px;color:var(--navy)}
.top .st{font-size:11.5px;color:var(--mut)}
.top .sp{flex:1}
.top button.ic{width:38px;height:38px;border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--navy)}
.top button.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#F6FAFD,#eef5fd)}
.b{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.5;word-wrap:break-word;position:relative;box-shadow:0 1px 2px rgba(11,47,112,.06)}
.b.me{align-self:flex-start;background:var(--grad);color:#fff;border-bottom-left-radius:5px}
.b.them{align-self:flex-end;background:#fff;border-bottom-right-radius:5px}
.b.sys{align-self:center;background:rgba(11,47,112,.06);color:var(--mut);font-size:12.5px;text-align:center;max-width:88%;border-radius:12px}
.b .t{font-size:10px;opacity:.6;margin-top:3px;text-align:left}
.b.me .t{color:rgba(255,255,255,.85)}
.day{align-self:center;background:rgba(11,47,112,.08);color:var(--mut);font-size:11px;padding:3px 12px;border-radius:20px;margin:6px 0}
.bar{background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;flex-shrink:0}
.bar input{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:11px 16px;font-size:15px;outline:none}
.bar button{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0}
.bar button svg{width:20px;height:20px;fill:#fff}
.bar button.att{background:var(--paper);color:var(--navy)}
.bar button.att svg{fill:none;stroke:currentColor;stroke-width:2}
.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper);flex-direction:column;gap:14px;padding:30px;text-align:center;z-index:100}
.spin{width:42px;height:42px;border:3px solid #cfe3ff;border-top-color:var(--sky);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.center h3{color:var(--navy);font-weight:800}
.center p{color:var(--mut);font-size:13px}
.center button{padding:12px 24px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800}
/* لوحة المالك */
.clist{flex:1;overflow-y:auto;background:var(--paper)}
.crow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
.crow .av{width:46px;height:46px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.crow .info{flex:1;min-width:0}
.crow .nm{font-weight:700;font-size:15px;color:var(--navy)}
.crow .pv{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .meta{text-align:left;flex-shrink:0}
.crow .tm{font-size:11px;color:var(--mut)}
.crow .un{background:var(--sky);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:inline-grid;place-items:center;padding:0 6px;margin-top:4px}
.hide{display:none!important}
</style></head>
<body>

<div class="center" id="loading">
  <div class="spin"></div>
  <p id="loadMsg">جارٍ التحميل…</p>
</div>

<div class="center hide" id="errBox">
  <h3>تعذّر التحميل</h3>
  <p id="errMsg"></p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</div>

<!-- لوحة المالك: قائمة المحادثات -->
<div class="top hide" id="ownerTop">
  <div class="av">A</div>
  <div><div class="nm">ARKAN Chat</div><div class="st">وضع المالك</div></div>
  <div class="sp"></div>
  <button class="ic" onclick="ownerLogout()" title="خروج"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
</div>
<div class="clist hide" id="clist"></div>

<!-- شاشة المحادثة -->
<div class="top hide" id="chatTop">
  <button class="ic hide" id="backBtn" onclick="backToList()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="av" id="chatAv">A</div>
  <div><div class="nm" id="chatName">ARKAN</div><div class="st" id="chatSt">متصل</div></div>
  <div class="sp"></div>
  <button class="ic hide" id="linkBtn" onclick="copyLink()" title="رابط العميل"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
</div>
<div class="msgs hide" id="msgs"></div>
<div class="bar hide" id="bar">
  <button class="att" onclick="document.getElementById('fileIn').click()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg></button>
  <input id="msgIn" placeholder="اكتب رسالة…" onkeydown="if(event.key==='Enter')sendText()">
  <button onclick="sendText()"><svg viewBox="0 0 24 24"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#fff" stroke-width="2" fill="none"/></svg></button>
</div>
<input type="file" id="fileIn" class="hide" accept="image/*,application/pdf" onchange="sendFile(this.files[0])">

<script>
const API='https://arkan-ai-site-production.up.railway.app';
let TOKEN=null, ROLE=null, MY_ID=null, CONV=null, CONVS=[], POLL=null;
const $=id=>document.getElementById(id);
function showErr(m){$('loading').classList.add('hide');$('errBox').classList.remove('hide');$('errMsg').textContent=m;}
function lmsg(m){$('loadMsg').textContent=m;}

async function boot(){
  const code=new URLSearchParams(location.search).get('c');
  const saved=JSON.parse(localStorage.getItem('arkan_chat2')||'null');

  // 1) رابط عميل ?c=CODE
  if(code){
    lmsg('فتح محادثتك…');
    try{
      const r=await fetch(API+'/chat-api/session?c='+encodeURIComponent(code));
      const txt=await r.text();
      if(!r.ok){showErr('رابط غير صالح ('+r.status+'): '+txt.slice(0,200));return;}
      const j=JSON.parse(txt);
      TOKEN=j.token;ROLE='customer';MY_ID=j.user_id;CONV=j.conversation;
      localStorage.setItem('arkan_chat2',JSON.stringify({token:j.token,role:'customer',conv:j.conversation,name:j.name}));
      return openCustomer(j.conversation,j.name);
    }catch(e){showErr('تعذّر الاتصال: '+e.message);return;}
  }

  // 2) جلسة عميل محفوظة
  if(saved&&saved.role==='customer'&&saved.token){
    TOKEN=saved.token;ROLE='customer';CONV=saved.conv;
    return openCustomer(saved.conv,saved.name);
  }

  // 3) جلسة مالك محفوظة
  if(saved&&saved.role==='owner'&&saved.token){
    TOKEN=saved.token;ROLE='owner';MY_ID=saved.user_id;
    return openOwner();
  }

  // 4) لا جلسة — نموذج دخول المالك
  showOwnerLogin();
}

/* ═══ العميل ═══ */
async function openCustomer(conv,name){
  CONV=conv;
  $('loading').classList.add('hide');
  $('chatTop').classList.remove('hide');$('msgs').classList.remove('hide');$('bar').classList.remove('hide');
  $('chatName').textContent='ARKAN';$('chatAv').textContent='A';$('chatSt').textContent='الدعم';
  await loadMessages();
  startPoll();
}

/* ═══ المالك ═══ */
function showOwnerLogin(){
  $('loading').classList.add('hide');
  const w=document.createElement('div');w.className='center';w.id='ownerLogin';
  w.innerHTML=`<div style="background:#fff;border-radius:24px;padding:30px 24px;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(11,47,112,.2)">
    <div style="width:56px;height:56px;margin:0 auto 14px;border-radius:16px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px">A</div>
    <h3 style="text-align:center;margin-bottom:4px">دخول المالك</h3>
    <p style="text-align:center;margin-bottom:18px">لوحة إدارة المحادثات</p>
    <input id="oPhone" inputmode="numeric" placeholder="رقم الهاتف" value="22236295050" style="width:100%;padding:12px;border:1.5px solid #cfe3ff;border-radius:12px;margin-bottom:10px;text-align:center;direction:ltr">
    <input id="oPin" inputmode="numeric" maxlength="4" placeholder="الرمز السري" style="width:100%;padding:12px;border:1.5px solid #cfe3ff;border-radius:12px;margin-bottom:6px;text-align:center;letter-spacing:8px;direction:ltr">
    <div id="oErr" style="color:#e2483d;font-size:12.5px;min-height:18px;text-align:center"></div>
    <button onclick="ownerLogin()" style="width:100%;padding:14px;border-radius:12px;background:var(--grad);color:#fff;font-weight:800">دخول</button>
  </div>`;
  document.body.appendChild(w);
  $('oPin').addEventListener('keydown',e=>{if(e.key==='Enter')ownerLogin();});
}
async function ownerLogin(){
  const phone=$('oPhone').value.replace(/\D/g,''),pin=$('oPin').value.replace(/\D/g,'');
  if(pin.length!==4){$('oErr').textContent='الرمز 4 أرقام';return;}
  $('oErr').textContent='جارٍ الدخول…';
  try{
    const r=await fetch(API+'/chat-api/owner-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,pin})});
    const j=await r.json();
    if(!r.ok){$('oErr').textContent=j.error==='auth'?'رقم أو رمز غير صحيح':'تعذّر الدخول';return;}
    TOKEN=j.token;ROLE='owner';MY_ID=j.user_id;
    localStorage.setItem('arkan_chat2',JSON.stringify({token:j.token,role:'owner',user_id:j.user_id}));
    const el=$('ownerLogin');if(el)el.remove();
    openOwner();
  }catch(e){$('oErr').textContent='تعذّر الاتصال';}
}
async function openOwner(){
  $('loading').classList.add('hide');
  $('ownerTop').classList.remove('hide');$('clist').classList.remove('hide');
  await loadConversations();
  startPoll();
}
async function loadConversations(){
  try{
    const r=await fetch(API+'/chat-api/conversations',{headers:{Authorization:'Bearer '+TOKEN}});
    const j=await r.json();
    CONVS=j.conversations||[];
    renderConvs();
  }catch(e){}
}
function renderConvs(){
  if(!CONVS.length){$('clist').innerHTML='<div style="padding:40px;text-align:center;color:var(--mut)">لا محادثات بعد.<br>ستظهر محادثات العملاء هنا.</div>';return;}
  $('clist').innerHTML=CONVS.map(c=>{
    const cu=c.customer||{};const nm=cu.full_name||cu.phone||'عميل';
    const un=c.unread_owner||0;
    return `<div class="crow" onclick="openConvOwner('${c.id}','${(nm+'').replace(/'/g,'')}','${cu.access_code||''}','${cu.phone||''}')">
      <div class="av">${(nm[0]||'ع').toUpperCase()}</div>
      <div class="info"><div class="nm">${nm}</div><div class="pv">${c.last_preview||''}</div></div>
      <div class="meta"><div class="tm">${c.last_message_at?fmtTime(c.last_message_at):''}</div>${un?`<div class="un">${un}</div>`:''}</div>
    </div>`;
  }).join('');
}
let CUR_CUST=null;
async function openConvOwner(convId,name,code,phone){
  CONV={id:convId};CUR_CUST={name,code,phone};
  $('ownerTop').classList.add('hide');$('clist').classList.add('hide');
  $('chatTop').classList.remove('hide');$('msgs').classList.remove('hide');$('bar').classList.remove('hide');
  $('backBtn').classList.remove('hide');$('linkBtn').classList.remove('hide');
  $('chatName').textContent=name;$('chatAv').textContent=(name[0]||'ع').toUpperCase();$('chatSt').textContent=phone||'';
  await loadMessages();
  fetch(API+'/chat-api/read',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify({conversation_id:convId})});
}
function backToList(){
  $('chatTop').classList.add('hide');$('msgs').classList.add('hide');$('bar').classList.add('hide');
  $('backBtn').classList.add('hide');$('linkBtn').classList.add('hide');
  $('ownerTop').classList.remove('hide');$('clist').classList.remove('hide');
  CONV=null;loadConversations();
}
async function copyLink(){
  if(!CUR_CUST||!CUR_CUST.code){alert('لا كود لهذا العميل');return;}
  const link=location.origin+'/chat2.html?c='+CUR_CUST.code;
  try{await navigator.clipboard.writeText(link);alert('نُسخ رابط العميل:\n'+link);}
  catch(e){prompt('رابط محادثة العميل:',link);}
}
function ownerLogout(){localStorage.removeItem('arkan_chat2');location.reload();}

/* ═══ الرسائل (مشترك) ═══ */
let MSGS=[];
async function loadMessages(){
  try{
    const r=await fetch(API+'/chat-api/messages?conv='+CONV.id,{headers:{Authorization:'Bearer '+TOKEN}});
    const j=await r.json();
    MSGS=j.messages||[];
    renderMsgs();
  }catch(e){}
}
function renderMsgs(){
  const box=$('msgs');const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let html='',lastDay='';
  for(const m of MSGS){
    const day=fmtDay(m.created_at);
    if(day!==lastDay){html+=`<div class="day">${day}</div>`;lastDay=day;}
    if(m.type==='system'){html+=`<div class="b sys">${esc(m.text)}</div>`;continue;}
    const mine=m.sender_id===MY_ID||(ROLE==='customer'&&m.sender_id!==null&&m.type!=='system'&&isCustomerMsg(m));
    const cls=(m.sender_id===MY_ID)?'me':'them';
    let body='';
    if(m.type==='text')body=esc(m.text);
    else if(m.type==='audio')body='🎤 رسالة صوتية';
    else if(m.type==='image')body='📷 صورة';
    else body='📎 '+(m.text||'ملف');
    html+=`<div class="b ${cls}">${body}<div class="t">${fmtTime(m.created_at)}</div></div>`;
  }
  box.innerHTML=html;
  if(near)box.scrollTop=box.scrollHeight;
}
function isCustomerMsg(m){return true;}
async function sendText(){
  const inp=$('msgIn');const t=inp.value.trim();if(!t)return;inp.value='';
  const tmp={sender_id:MY_ID,type:'text',text:t,created_at:new Date().toISOString()};
  MSGS.push(tmp);renderMsgs();
  try{
    const r=await fetch(API+'/chat-api/send',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({conversation_id:CONV.id,type:'text',text:t})});
    if(!r.ok){inp.value=t;}
    else{await loadMessages();}
  }catch(e){inp.value=t;}
}
async function sendFile(f){
  if(!f)return;
  alert('رفع الملفات سيُضاف قريبًا — استخدم النص حاليًا');
}

function startPoll(){
  if(POLL)clearInterval(POLL);
  POLL=setInterval(async()=>{
    if(ROLE==='owner'&&!CONV){loadConversations();}
    else if(CONV){loadMessages();}
  },4000);
}

/* أدوات */
function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function fmtTime(iso){try{return new Date(iso).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function fmtDay(iso){try{const d=new Date(iso),n=new Date();if(d.toDateString()===n.toDateString())return 'اليوم';const y=new Date(n);y.setDate(y.getDate()-1);if(d.toDateString()===y.toDateString())return 'أمس';return d.toLocaleDateString('ar');}catch(e){return '';}}

boot();
</script>
</body></html>
