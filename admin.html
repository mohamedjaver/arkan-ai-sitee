<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#070A14; --bg3:#131A2E; --panel:rgba(14,19,34,.62); --line:rgba(255,255,255,.07);
  --violet:#6C5CE7; --violet-2:#a78bfa; --cyan:#22d3ee; --cyan-2:#67e8f9;
  --gold:#f5d76e; --gold-2:#d4a94a; --txt:#eef0ff; --mute:#9aa0c0; --dim:#6b7096;
  --up:#34d399; --down:#f87171; --pend:#fbbf24; color-scheme:dark;
}
*{ box-sizing:border-box; }
body{ margin:0; color:var(--txt); font-family:'IBM Plex Sans Arabic',system-ui,sans-serif; min-height:100dvh;
  background:
    radial-gradient(60vw 50vw at 82% -8%, rgba(124,92,255,.24), transparent 62%),
    radial-gradient(50vw 44vw at 6% 10%, rgba(34,211,238,.14), transparent 64%),
    linear-gradient(180deg,#070A14,#12102a 60%,#0E1322);
  background-attachment:fixed; padding-bottom:90px; }
.mono{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:plaintext; }
.wrap{ max-width:820px; margin:0 auto; padding:20px 16px; }
.top{ display:flex; align-items:center; gap:12px; padding:6px 2px 18px; }
.logo{ width:44px; height:44px; border-radius:13px; display:grid; place-items:center; flex:0 0 auto;
  object-fit:cover; display:block;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 12px 34px -12px rgba(124,92,255,.85); }
.top h1{ margin:0; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:800; } .top h1 span{ color:var(--gold); }
.top .sub{ font-size:12px; color:var(--dim); margin-top:2px; }
.logout{ margin-inline-start:auto; width:42px; height:42px; border-radius:12px; border:1px solid var(--line);
  background:transparent; color:var(--mute); cursor:pointer; font-size:15px; }
.logout:hover{ color:var(--down); border-color:rgba(248,113,113,.35); }

/* KPIs */
.kpis{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
.kpi{ padding:16px; border-radius:16px; border:1px solid var(--line); background:var(--panel); backdrop-filter:blur(10px); }
.kpi .v{ font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:800; }
.kpi .l{ font-size:11.5px; color:var(--dim); margin-top:5px; }
.kpi.gold .v{ color:var(--gold); } .kpi.cyan .v{ color:var(--cyan-2); } .kpi.pend .v{ color:var(--pend); }

/* filters */
.filters{ display:flex; gap:6px; padding:5px; border-radius:14px; background:rgba(8,7,20,.5); border:1px solid var(--line); margin-bottom:14px; overflow-x:auto; }
.filters button{ flex:0 0 auto; padding:9px 16px; border:0; border-radius:10px; cursor:pointer; background:transparent; color:var(--mute); font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:700; font-size:13px; white-space:nowrap; transition:.2s; }
.filters button.on{ background:var(--violet); color:#fff; }

/* tx */
.tx{ border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(10px); padding:15px; margin-bottom:10px; }
.tx-top{ display:flex; align-items:center; gap:10px; }
.tx-main{ min-width:0; }
.tx-main .who{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tx-main .pair{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mute); margin-top:3px; }
.tx-amt{ margin-inline-start:auto; text-align:left; flex:0 0 auto; }
.tx-amt .n{ font-family:'JetBrains Mono',monospace; font-weight:800; font-size:15px; }
.tx-amt .prof{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--up); margin-top:2px; }
.badge{ padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:700; }
.badge.done{ background:rgba(52,211,153,.14); color:var(--up); }
.badge.pending{ background:rgba(251,191,36,.14); color:var(--pend); }
.badge.cancel{ background:rgba(248,113,113,.14); color:var(--down); }
.tx-actions{ display:flex; gap:7px; margin-top:12px; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); }
.tx-actions button{ flex:1; padding:9px; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:700; font-size:12.5px; color:var(--mute); transition:.2s; }
.tx-actions .ok:hover{ background:rgba(52,211,153,.14); color:var(--up); border-color:rgba(52,211,153,.3); }
.tx-actions .no:hover{ background:rgba(248,113,113,.14); color:var(--down); border-color:rgba(248,113,113,.3); }
.tx-actions .del:hover{ background:rgba(148,163,184,.14); color:var(--txt); }

.empty{ text-align:center; padding:44px 20px; color:var(--dim); } .empty i{ font-size:32px; opacity:.4; margin-bottom:12px; }
.skeleton{ height:74px; border-radius:16px; margin-bottom:10px; background:linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03)); background-size:200% 100%; animation:sh 1.4s linear infinite; }
@keyframes sh{ to{ background-position:-200% 0 } }

/* FAB */
.fab{ position:fixed; bottom:22px; inset-inline-end:22px; z-index:40; width:60px; height:60px; border-radius:50%; border:0; cursor:pointer;
  background:linear-gradient(180deg,var(--gold),var(--gold-2)); color:#1a1400; font-size:22px;
  box-shadow:0 16px 40px -12px rgba(245,215,110,.9); }
.fab:hover{ filter:brightness(1.08); transform:translateY(-2px); }

/* modal */
.modal{ position:fixed; inset:0; z-index:70; display:none; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); }
.modal.open{ display:flex; }
.sheet{ width:100%; max-width:520px; border-radius:24px 24px 0 0; background:rgba(15,13,36,.98); border:1px solid var(--line); padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:90dvh; overflow:auto; }
.sheet h3{ margin:0 0 16px; font-size:17px; font-weight:800; }
.fld{ margin-bottom:12px; } .fld label{ display:block; font-size:12px; color:var(--mute); margin-bottom:6px; }
.fld input, .fld select{ width:100%; background:rgba(8,7,20,.7); border:1px solid var(--line); border-radius:12px; padding:13px; color:var(--txt); font-size:15px; outline:0; font-family:'IBM Plex Sans Arabic',sans-serif; }
.fld input.mono{ font-family:'JetBrains Mono',monospace; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.save{ width:100%; margin-top:8px; padding:15px; border:0; border-radius:14px; cursor:pointer; background:linear-gradient(180deg,var(--gold),var(--gold-2)); color:#1a1400; font-weight:800; font-size:15px; }
.cancel{ width:100%; margin-top:8px; padding:13px; border:1px solid var(--line); border-radius:14px; background:transparent; color:var(--mute); cursor:pointer; font-weight:700; }

.toast{ position:fixed; bottom:96px; inset-inline:16px; z-index:80; display:none; align-items:center; gap:10px; max-width:600px; margin:0 auto;
  padding:13px 16px; border-radius:14px; background:rgba(23,20,50,.96); border:1px solid rgba(245,215,110,.3); font-size:14px; }
.toast.show{ display:flex; } .toast i{ color:var(--gold); }
@media (max-width:600px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

.main-tabs{ display:flex; gap:8px; margin-bottom:18px; }
.main-tabs .mt{ flex:1; padding:14px; border-radius:15px; border:1px solid var(--line); background:var(--panel);
  color:var(--mute); cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.2s; position:relative; }
.main-tabs .mt.on{ background:linear-gradient(135deg,var(--violet),#4f46e5); color:#fff; border-color:transparent; }
.mt-badge{ min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--pend); color:#1a1400;
  font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:800; display:none; align-items:center; justify-content:center; }
.mt-badge.on{ display:inline-flex; }
.acc{ border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(10px); padding:16px; margin-bottom:10px; }
.acc-top{ display:flex; align-items:center; gap:12px; }
.acc-ic{ width:44px; height:44px; border-radius:13px; display:grid; place-items:center; flex:0 0 auto;
  background:linear-gradient(135deg,var(--violet),#8B7BFF); color:#fff; font-weight:800; font-size:18px; }
.acc-main{ flex:1; min-width:0; }
.acc-main .nm{ font-size:15px; font-weight:700; }
.acc-main .meta{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--mute); margin-top:3px; direction:ltr; }
.acc-pin{ text-align:left; }
.acc-pin .k{ font-size:10px; color:var(--dim); }
.acc-pin .v{ font-family:'JetBrains Mono',monospace; font-weight:800; font-size:18px; color:var(--gold); letter-spacing:2px; }
.acc-actions{ display:flex; gap:8px; margin-top:13px; padding-top:13px; border-top:1px solid rgba(255,255,255,.06); }
.acc-actions button{ flex:1; padding:11px; border:1px solid var(--line); border-radius:11px; background:transparent;
  cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:700; font-size:13px; color:var(--mute); transition:.2s; }
.acc-actions .activate:hover{ background:rgba(52,211,153,.14); color:var(--up); border-color:rgba(52,211,153,.3); }
.acc-actions .suspend:hover{ background:rgba(251,191,36,.14); color:var(--pend); border-color:rgba(251,191,36,.3); }
.acc-actions .remove:hover{ background:rgba(248,113,113,.14); color:var(--down); border-color:rgba(248,113,113,.3); }
.acc-status{ padding:3px 10px; border-radius:99px; font-size:10.5px; font-weight:700; }
.acc-status.pending{ background:rgba(251,191,36,.14); color:var(--pend); }
.acc-status.active{ background:rgba(52,211,153,.14); color:var(--up); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="logo" src="arkan-logo.svg" alt="أركان">
    <div>
      <h1>ARKAN <span>ADMIN</span></h1>
      <div class="sub" id="adminEmail">…</div>
    </div>
    <button class="logout" id="logoutBtn" aria-label="خروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
  </div>

  <div class="main-tabs">
    <button class="mt on" data-mt="tx"><i class="fa-solid fa-right-left"></i> المعاملات <span class="mt-badge" id="mtTxBadge"></span></button>
    <button class="mt" data-mt="accounts"><i class="fa-solid fa-user-plus"></i> الحسابات الجديدة <span class="mt-badge" id="mtAccBadge"></span></button>
  </div>

  <!-- قسم المعاملات -->
  <div id="view-tx">
  <div class="kpis">
    <div class="kpi gold"><div class="v mono" id="kProfit">0</div><div class="l">ربح اليوم MRU</div></div>
    <div class="kpi cyan"><div class="v mono" id="kProfitW">0</div><div class="l">ربح الأسبوع</div></div>
    <div class="kpi"><div class="v mono" id="kProfitM">0</div><div class="l">ربح الشهر</div></div>
    <div class="kpi pend"><div class="v mono" id="kPending">0</div><div class="l">قيد الانتظار</div></div>
  </div>
  <div class="kpis" style="margin-top:-8px">
    <div class="kpi"><div class="v mono" id="kToday">0</div><div class="l">معاملات اليوم</div></div>
    <div class="kpi"><div class="v mono" id="kTotal">0</div><div class="l">إجمالي المعاملات</div></div>
    <div class="kpi"><div class="v mono" id="kDone">0</div><div class="l">مكتملة</div></div>
    <div class="kpi"><div class="v mono" id="kProfitAll">0</div><div class="l">ربح إجمالي</div></div>
  </div>

  <div class="filters" id="filters">
    <button data-f="all" class="on">الكل</button>
    <button data-f="pending">قيد الانتظار</button>
    <button data-f="done">مكتملة</button>
    <button data-f="cancel">ملغاة</button>
    <button data-f="today">اليوم</button>
  </div>

  <div id="txList"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </div><!-- /view-tx -->

  <!-- قسم الحسابات الجديدة -->
  <div id="view-accounts" style="display:none">
    <div class="kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi pend"><div class="v mono" id="kAccPending">0</div><div class="l">قيد التفعيل</div></div>
      <div class="kpi cyan"><div class="v mono" id="kAccActive">0</div><div class="l">مفعّلة</div></div>
      <div class="kpi"><div class="v mono" id="kAccTotal">0</div><div class="l">إجمالي العملاء</div></div>
    </div>
    <div class="filters" id="accFilters">
      <button data-af="pending" class="on">قيد التفعيل</button>
      <button data-af="active">مفعّلة</button>
      <button data-af="all">الكل</button>
    </div>
    <div id="accList"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div><!-- /view-accounts -->
</div>

<button class="fab" id="addBtn" aria-label="معاملة جديدة"><i class="fa-solid fa-plus"></i></button>

<!-- modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <h3>معاملة جديدة</h3>
    <div class="fld">
      <label>العميل (البريد أو الرقم المرجعي)</label>
      <input id="mClient" class="mono" placeholder="AK... أو البريد">
    </div>
    <div class="grid2">
      <div class="fld"><label>من عملة</label>
        <select id="mFrom"><option>USDT</option><option>AOA</option><option>CNY</option><option>AED</option><option>EUR</option><option>USD</option><option>MRU</option></select>
      </div>
      <div class="fld"><label>إلى عملة</label>
        <select id="mTo"><option>MRU</option><option>USDT</option><option>AOA</option><option>CNY</option><option>AED</option><option>EUR</option><option>USD</option></select>
      </div>
    </div>
    <div class="grid2">
      <div class="fld"><label>المبلغ المرسل</label><input id="mAmount" class="mono" inputmode="decimal" placeholder="0"></div>
      <div class="fld"><label>الربح (MRU)</label><input id="mProfit" class="mono" inputmode="decimal" placeholder="0"></div>
    </div>
    <div class="fld"><label>الحالة</label>
      <select id="mStatus"><option value="pending">قيد الانتظار</option><option value="done">مكتملة</option><option value="cancel">ملغاة</option></select>
    </div>
    <button class="save" id="saveBtn">حفظ المعاملة</button>
    <button class="cancel" id="cancelBtn">إلغاء</button>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, getDoc, getDocs, where, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCtL-OySTK9FeyD0h-31BiupYFtGBxbJ_U",
  authDomain: "arkan-rates-prod.firebaseapp.com",
  projectId: "arkan-rates-prod",
  storageBucket: "arkan-rates-prod.firebasestorage.app",
  messagingSenderId: "1039254650364",
  appId: "1:1039254650364:web:7972ce9eb77c24004d0679"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ADMIN_EMAILS = ["mohamedarbi0208@gmail.com"];
const isAdminEmail = e => !!e && ADMIN_EMAILS.includes(e.toLowerCase());

const $ = id => document.getElementById(id);
const fmt = (v,dp=0) => Number.isFinite(v) ? v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '0';
let ALL = [];
let filter = 'all';

function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2600); }
const isToday = ts => { if(!ts?.toDate) return false; const d=ts.toDate(), n=new Date(); return d.toDateString()===n.toDateString(); };

// حماية: أدمن فقط
onAuthStateChanged(auth, user => {
  if (!user){ showAdminLogin(); return; }
  if (!isAdminEmail(user.email)){ toast('هذا الحساب ليس أدمن'); signOut(auth); return; }
  $('adminEmail').textContent = user.email;
  const lg = document.getElementById('adminGate'); if(lg) lg.style.display='none';
  listen();
  listenAccounts();
});

// بوابة دخول الأدمن (بريد + كلمة مرور) — مدمجة
async function showAdminLogin(){
  if (document.getElementById('adminGate')) { document.getElementById('adminGate').style.display='grid'; return; }
  const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js");
  const g = document.createElement('div');
  g.id = 'adminGate';
  g.style.cssText = 'position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);padding:24px';
  g.innerHTML = `<div style="width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:30px 24px">
    <img src="arkan-logo.svg" alt="أركان" style="width:56px;height:56px;margin:0 auto 16px;border-radius:16px;object-fit:cover;display:block">
    <h2 style="text-align:center;margin:0 0 4px;font-size:19px">لوحة أركان</h2>
    <p style="text-align:center;margin:0 0 22px;font-size:13px;color:var(--mute)">دخول الأدمن</p>
    <input id="agEmail" type="email" placeholder="البريد" style="width:100%;box-sizing:border-box;background:rgba(8,7,20,.7);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);font-size:15px;outline:0;margin-bottom:12px">
    <input id="agPass" type="password" placeholder="كلمة المرور" style="width:100%;box-sizing:border-box;background:rgba(8,7,20,.7);border:1px solid var(--line);border-radius:12px;padding:13px;color:var(--txt);font-size:15px;outline:0;margin-bottom:16px">
    <button id="agBtn" style="width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,var(--gold),#d4a94a);color:#1a1400;font-weight:800;font-size:15px;font-family:'IBM Plex Sans Arabic',sans-serif">دخول</button>
    <div id="agErr" style="margin-top:12px;font-size:13px;color:#fca5a5;display:none;text-align:center"></div>
  </div>`;
  document.body.appendChild(g);
  document.getElementById('agBtn').onclick = async () => {
    const em = document.getElementById('agEmail').value.trim(), pw = document.getElementById('agPass').value;
    try { await signInWithEmailAndPassword(auth, em, pw); }
    catch(e){ const er=document.getElementById('agErr'); er.style.display='block'; er.textContent='بريد أو كلمة مرور غير صحيحة'; }
  };
  document.getElementById('agPass').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('agBtn').click(); });
}

function listen(){
  const q = query(collection(db,'transactions'), orderBy('createdAt','desc'));
  onSnapshot(q, snap => {
    ALL = []; snap.forEach(d => ALL.push({ id:d.id, ...d.data() }));
    computeKPIs(); render();
  }, err => {
    console.error(err);
    $('txList').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><div>تعذّر التحميل — تحقق من القواعد</div></div>';
  });
}

function inRange(ts, days){
  if(!ts?.toDate) return false;
  const d = ts.toDate(), now = new Date();
  return (now - d) <= days*86400000;
}
function computeKPIs(){
  const done = ALL.filter(t=>t.status==='done');
  const today = ALL.filter(t => isToday(t.createdAt));
  const sumP = arr => arr.reduce((s,t)=>s+(+t.profit||0),0);
  const profitToday = sumP(today.filter(t=>t.status==='done'));
  const profitWeek  = sumP(done.filter(t=>inRange(t.createdAt,7)));
  const profitMonth = sumP(done.filter(t=>inRange(t.createdAt,30)));
  const profitAll   = sumP(done);
  $('kProfit').textContent   = fmt(profitToday);
  $('kProfitW').textContent  = fmt(profitWeek);
  $('kProfitM').textContent  = fmt(profitMonth);
  $('kProfitAll').textContent= fmt(profitAll);
  $('kDone').textContent     = done.length;
  $('kToday').textContent    = today.length;
  $('kPending').textContent = ALL.filter(t=>t.status==='pending').length;
  $('kTotal').textContent   = ALL.length;
}

function apply(list){
  if (filter==='all') return list;
  if (filter==='today') return list.filter(t=>isToday(t.createdAt));
  return list.filter(t=>t.status===filter);
}

function render(){
  const list = apply(ALL);
  const box = $('txList');
  if (!list.length){ box.innerHTML='<div class="empty"><i class="fa-regular fa-folder-open"></i><div>لا توجد معاملات</div></div>'; return; }
  const badge = { done:['done','مكتملة'], pending:['pending','قيد الانتظار'], cancel:['cancel','ملغاة'] };
  box.innerHTML = list.map(t => {
    const st = badge[t.status]||badge.pending;
    const dt = t.createdAt?.toDate ? t.createdAt.toDate().toLocaleDateString('en-GB')+' '+t.createdAt.toDate().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '—';
    return `<div class="tx">
      <div class="tx-top">
        <div class="tx-main">
          <div class="who">${t.clientName||t.clientEmail||'عميل'} <span class="badge ${st[0]}">${st[1]}</span></div>
          <div class="pair mono">${t.from} → ${t.to} · ${dt} · ${(t.clientRef||t.id.slice(-6)).toUpperCase()}${t.tier?' · '+({w:'جملة',m:'وسيط',r:'تجزئة'}[t.tier]||''):''}</div>
        </div>
        <div class="tx-amt">
          <div class="n mono">${fmt(+t.amount,2)} ${t.from}</div>
          ${+t.profit ? `<div class="prof mono">+${fmt(+t.profit)} MRU</div>` : ''}
        </div>
      </div>
      <div class="tx-actions">
        <button class="ok"  data-act="done"   data-id="${t.id}"><i class="fa-solid fa-check"></i> إتمام</button>
        <button class="no"  data-act="cancel" data-id="${t.id}"><i class="fa-solid fa-xmark"></i> إلغاء</button>
        <button class="del" data-act="delete" data-id="${t.id}"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;
  }).join('');

  box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => action(b.dataset.act, b.dataset.id));
}

async function action(act, id){
  try {
    if (act==='delete'){ if(!confirm('حذف هذه المعاملة نهائياً؟')) return; await deleteDoc(doc(db,'transactions',id)); toast('حُذفت'); return; }
    await updateDoc(doc(db,'transactions',id), { status: act, updatedAt: serverTimestamp() });
    toast(act==='done' ? 'أُتمّت المعاملة' : 'أُلغيت المعاملة');
  } catch(e){ console.error(e); toast('فشلت العملية'); }
}

// الفلاتر
$('filters').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('filters').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); filter=b.dataset.f; render();
});

// نافذة الإضافة
$('addBtn').onclick   = () => $('modal').classList.add('open');
$('cancelBtn').onclick= () => $('modal').classList.remove('open');
$('modal').onclick = e => { if(e.target===$('modal')) $('modal').classList.remove('open'); };

$('saveBtn').onclick = async () => {
  const clientKey = $('mClient').value.trim();
  const amount = parseFloat($('mAmount').value)||0;
  if (!amount){ toast('أدخل المبلغ'); return; }

  // ابحث عن العميل بالبريد أو الرقم المرجعي
  let clientUid='', clientName='', clientEmail='', clientRef='';
  if (clientKey){
    try {
      const byRef = await getDocs(query(collection(db,'users'), where('ref','==',clientKey.toUpperCase())));
      const byMail= byRef.empty ? await getDocs(query(collection(db,'users'), where('email','==',clientKey))) : null;
      const hit = !byRef.empty ? byRef.docs[0] : (byMail && !byMail.empty ? byMail.docs[0] : null);
      if (hit){ const u=hit.data(); clientUid=hit.id; clientName=u.name||''; clientEmail=u.email||''; clientRef=u.ref||''; }
    } catch(e){ console.warn(e); }
  }

  $('saveBtn').disabled=true; $('saveBtn').textContent='...';
  try {
    await addDoc(collection(db,'transactions'), {
      uid: clientUid, clientName, clientEmail, clientRef,
      from: $('mFrom').value, to: $('mTo').value,
      amount, profit: parseFloat($('mProfit').value)||0,
      type: 'out', dp: 2,
      status: $('mStatus').value,
      createdAt: serverTimestamp()
    });
    toast('أُضيفت المعاملة');
    $('modal').classList.remove('open');
    ['mClient','mAmount','mProfit'].forEach(id=>$(id).value='');
    if (!clientUid && clientKey) toast('حُفظت لكن لم يُطابَق عميل');
  } catch(e){ console.error(e); toast('فشل الحفظ'); }
  finally { $('saveBtn').disabled=false; $('saveBtn').textContent='حفظ المعاملة'; }
};

// ═══ تبديل التبويبين الرئيسيين ═══
document.querySelectorAll('.main-tabs .mt').forEach(b => b.onclick = () => {
  document.querySelectorAll('.main-tabs .mt').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const mt = b.dataset.mt;
  document.getElementById('view-tx').style.display = mt==='tx' ? 'block' : 'none';
  document.getElementById('view-accounts').style.display = mt==='accounts' ? 'block' : 'none';
  document.getElementById('addBtn').style.display = mt==='tx' ? 'grid' : 'none';
});

// ═══ الحسابات الجديدة ═══
let ACCOUNTS = [];
let accFilter = 'pending';
function listenAccounts(){
  const q = query(collection(db,'users'), orderBy('createdAt','desc'));
  onSnapshot(q, snap => {
    ACCOUNTS = []; snap.forEach(d => ACCOUNTS.push({ id:d.id, ...d.data() }));
    computeAccKPIs(); renderAccounts();
  }, err => {
    console.error(err);
    document.getElementById('accList').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><div>تعذّر تحميل الحسابات</div></div>';
  });
}
function computeAccKPIs(){
  const pending = ACCOUNTS.filter(a=>a.status==='pending').length;
  const active  = ACCOUNTS.filter(a=>a.status==='active').length;
  $('kAccPending').textContent = pending;
  $('kAccActive').textContent  = active;
  $('kAccTotal').textContent   = ACCOUNTS.length;
  // شارة عدد الحسابات المعلّقة على التبويب
  const badge = $('mtAccBadge');
  if (pending>0){ badge.textContent = pending; badge.classList.add('on'); }
  else badge.classList.remove('on');
}
function renderAccounts(){
  const list = accFilter==='all' ? ACCOUNTS : ACCOUNTS.filter(a=>a.status===accFilter || (accFilter==='pending'&&!a.status));
  const box = $('accList');
  if (!list.length){ box.innerHTML='<div class="empty"><i class="fa-regular fa-user"></i><div>لا توجد حسابات</div></div>'; return; }
  box.innerHTML = list.map(a => {
    const st = (a.status==='active') ? ['active','مفعّل'] : ['pending','قيد التفعيل'];
    const dt = a.createdAt?.toDate ? a.createdAt.toDate().toLocaleDateString('en-GB') : '—';
    const isPending = a.status !== 'active';
    return `<div class="acc">
      <div class="acc-top">
        <div class="acc-ic">${(a.name||'؟').charAt(0)}</div>
        <div class="acc-main">
          <div class="nm">${a.name||'عميل'} <span class="acc-status ${st[0]}">${st[1]}</span></div>
          <div class="meta">+${a.phone||a.id} · ${a.ref||'—'} · ${dt}</div>
        </div>
        <div class="acc-pin"><div class="k">الرمز</div><div class="v">${a.pin||'••••'}</div></div>
      </div>
      <div class="acc-actions">
        ${isPending
          ? `<button class="activate" data-aact="active" data-id="${a.id}"><i class="fa-solid fa-check"></i> تفعيل الحساب</button>`
          : `<button class="suspend" data-aact="pending" data-id="${a.id}"><i class="fa-solid fa-pause"></i> تعليق</button>`}
        <button class="remove" data-aact="delete" data-id="${a.id}"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('[data-aact]').forEach(b => b.onclick = () => accAction(b.dataset.aact, b.dataset.id));
}
async function accAction(act, id){
  try {
    if (act==='delete'){
      if(!confirm('حذف هذا الحساب نهائياً؟ لا يمكن التراجع.')) return;
      await deleteDoc(doc(db,'users',id)); toast('حُذف الحساب'); return;
    }
    await updateDoc(doc(db,'users',id), { status: act, updatedAt: serverTimestamp() });
    toast(act==='active' ? 'تم تفعيل الحساب ✓' : 'عُلّق الحساب');
  } catch(e){ console.error(e); toast('فشلت العملية'); }
}
document.querySelectorAll('#accFilters button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#accFilters button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); accFilter=b.dataset.af; renderAccounts();
});

$('logoutBtn').onclick = async () => { await signOut(auth); location.reload(); };
</script>
