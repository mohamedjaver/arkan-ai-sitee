<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARKAN · حسابي</title>
<meta name="theme-color" content="#0a0918">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237c5cff'/><path d='M50 20 L74 78 H60 L50 52 L40 78 H26 Z' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#0a0918; --bg3:#1a1638; --panel:rgba(23,20,50,.62); --line:rgba(255,255,255,.08);
  --violet:#7c5cff; --violet-2:#a78bfa; --cyan:#22d3ee; --cyan-2:#67e8f9;
  --gold:#f5d76e; --gold-2:#d4a94a; --txt:#eef0ff; --mute:#9aa0c0; --dim:#6b7096;
  --up:#34d399; --down:#f87171; --pend:#fbbf24; color-scheme:dark;
}
*{ box-sizing:border-box; }
body{
  margin:0; color:var(--txt); font-family:'Tajawal',system-ui,sans-serif; min-height:100dvh;
  background:
    radial-gradient(60vw 50vw at 82% -8%, rgba(124,92,255,.26), transparent 62%),
    radial-gradient(50vw 44vw at 6% 10%, rgba(34,211,238,.15), transparent 64%),
    linear-gradient(180deg,#0a0918,#12102a 60%,#1a1638);
  background-attachment:fixed;
}
.mono{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:plaintext; }
.wrap{ max-width:640px; margin:0 auto; padding:20px 16px 60px; }
.top{ display:flex; align-items:center; gap:12px; padding:6px 2px 20px; }
.logo{ width:44px; height:44px; border-radius:13px; display:grid; place-items:center; flex:0 0 auto;
  background:linear-gradient(145deg,var(--violet),#4f46e5); color:#fff; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:21px;
  box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 12px 34px -12px rgba(124,92,255,.85); }
.top h1{ margin:0; font-size:15px; font-weight:800; } .top .sub{ font-size:12px; color:var(--dim); margin-top:2px; }
.logout{ margin-inline-start:auto; width:42px; height:42px; border-radius:12px; border:1px solid var(--line);
  background:transparent; color:var(--mute); cursor:pointer; font-size:15px; transition:.25s; }
.logout:hover{ color:var(--down); border-color:rgba(248,113,113,.35); }

.bal-card{ padding:1px; border-radius:24px; margin-bottom:16px;
  background:linear-gradient(160deg, rgba(245,215,110,.42), rgba(124,92,255,.26) 48%, transparent 78%); }
.bal-in{ border-radius:23px; background:rgba(13,11,32,.88); backdrop-filter:blur(18px); padding:24px; }
.bal-in .lbl{ font-size:13px; color:var(--mute); }
.bal-in .amt{ font-family:'JetBrains Mono',monospace; font-size:38px; font-weight:800; color:var(--gold); margin:8px 0 4px; }
.bal-in .cur{ font-size:15px; color:var(--dim); }
.ref-row{ margin-top:18px; display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:14px; background:rgba(8,7,20,.55); border:1px solid var(--line); }
.ref-row .k{ font-size:12px; color:var(--mute); }
.ref-row .v{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--cyan-2); margin-inline-start:auto; }
.ref-row button{ background:transparent; border:0; color:var(--dim); cursor:pointer; font-size:14px; }
.ref-row button:hover{ color:var(--gold); }

.cta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px; }
.btn{ padding:15px; border:0; border-radius:15px; cursor:pointer; font-family:'Tajawal',sans-serif; font-weight:800; font-size:14.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.25s; text-decoration:none; }
.btn-gold{ background:linear-gradient(180deg,var(--gold),var(--gold-2)); color:#1a1400; }
.btn-wa{ background:rgba(52,211,153,.14); border:1px solid rgba(52,211,153,.32); color:var(--up); }
.btn:hover{ filter:brightness(1.07); transform:translateY(-1px); }

.sec-h{ display:flex; align-items:center; justify-content:space-between; margin:8px 2px 12px; }
.sec-h h2{ margin:0; font-size:16px; font-weight:800; }
.sec-h .cnt{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--dim); }

.tx{ border:1px solid var(--line); border-radius:16px; background:var(--panel); backdrop-filter:blur(10px); padding:16px; margin-bottom:10px; }
.tx-top{ display:flex; align-items:center; gap:10px; }
.tx-ico{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; flex:0 0 auto; font-size:15px; }
.tx-ico.in{ background:rgba(52,211,153,.12); color:var(--up); } .tx-ico.out{ background:rgba(124,92,255,.14); color:var(--violet-2); }
.tx-main .pair{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; }
.tx-main .date{ font-size:11px; color:var(--dim); margin-top:2px; }
.tx-amt{ margin-inline-start:auto; text-align:left; }
.tx-amt .n{ font-family:'JetBrains Mono',monospace; font-weight:800; font-size:15px; }
.badge{ display:inline-block; margin-top:4px; padding:3px 9px; border-radius:99px; font-size:10.5px; font-weight:700; }
.badge.done{ background:rgba(52,211,153,.14); color:var(--up); }
.badge.pending{ background:rgba(251,191,36,.14); color:var(--pend); }
.badge.cancel{ background:rgba(248,113,113,.14); color:var(--down); }
.empty{ text-align:center; padding:40px 20px; color:var(--dim); }
.empty i{ font-size:32px; opacity:.4; margin-bottom:12px; }
.skeleton{ height:78px; border-radius:16px; margin-bottom:10px; background:linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.07), rgba(255,255,255,.03)); background-size:200% 100%; animation:sh 1.4s linear infinite; }
@keyframes sh{ to{ background-position:-200% 0 } }
.toast{ position:fixed; bottom:20px; inset-inline:16px; z-index:60; display:none; align-items:center; gap:10px; max-width:600px; margin:0 auto;
  padding:13px 16px; border-radius:14px; background:rgba(23,20,50,.95); border:1px solid rgba(245,215,110,.3); font-size:14px; }
.toast.show{ display:flex; } .toast i{ color:var(--gold); }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">A</div>
    <div>
      <h1 id="uName">…</h1>
      <div class="sub" id="uEmail">…</div>
    </div>
    <button class="logout" id="logoutBtn" aria-label="خروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
  </div>

  <div class="bal-card"><div class="bal-in">
    <div class="lbl">الرصيد الحالي</div>
    <div class="amt mono" id="balance">— <span class="cur">MRU</span></div>
    <div class="ref-row">
      <span class="k">رقمك المرجعي</span>
      <span class="v mono" id="ref">—</span>
      <button id="copyRef" aria-label="نسخ"><i class="fa-regular fa-copy"></i></button>
    </div>
  </div></div>

  <div class="cta">
    <a class="btn btn-gold" href="https://arkanrates.com" target="_blank" rel="noopener"><i class="fa-solid fa-chart-line"></i> أسعار اليوم</a>
    <button class="btn btn-wa" id="waBtn"><i class="fa-brands fa-whatsapp"></i> طلب تحويل</button>
  </div>

  <div class="sec-h">
    <h2>سجل المعاملات</h2>
    <span class="cnt mono" id="txCount"></span>
  </div>
  <div id="txList">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i><span id="toastMsg"></span></div>

<script type="module">
import {
  auth, db, ADMIN_EMAILS, onAuthStateChanged, signOut,
  doc, getDoc, collection, query, where, orderBy, onSnapshot
} from './firebase-init.js';

const WA = '22236295050';
const $ = id => document.getElementById(id);
const fmt = (v,dp=2) => Number.isFinite(v) ? v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}) : '—';
let userRef = '—';

function toast(m){ $('toastMsg').textContent=m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),2600); }

onAuthStateChanged(auth, async user => {
  if (!user){ location.href='login.html'; return; }
  // أدمن؟ حوّله للوحته
  if (ADMIN_EMAILS.includes(user.email)){ location.href='admin.html'; return; }

  // ملف العميل
  const snap = await getDoc(doc(db,'users',user.uid));
  const d = snap.exists() ? snap.data() : {};
  $('uName').textContent  = d.name  || 'عميل أركان';
  $('uEmail').textContent = user.email;
  $('balance').innerHTML  = fmt(d.balance||0) + ' <span class="cur">MRU</span>';
  userRef = d.ref || '—';
  $('ref').textContent = userRef;

  // سجل المعاملات (فوري)
  const q = query(collection(db,'transactions'), where('uid','==',user.uid), orderBy('createdAt','desc'));
  onSnapshot(q, snap => renderTx(snap), err => {
    console.error(err);
    $('txList').innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><div>تعذّر تحميل السجل</div></div>';
  });
});

function renderTx(snap){
  const list = $('txList');
  $('txCount').textContent = snap.size ? snap.size + ' عملية' : '';
  if (snap.empty){
    list.innerHTML = '<div class="empty"><i class="fa-regular fa-folder-open"></i><div>لا توجد معاملات بعد</div></div>';
    return;
  }
  const badge = { done:['done','مكتملة'], pending:['pending','قيد الانتظار'], cancel:['cancel','ملغاة'] };
  let html = '';
  snap.forEach(doc => {
    const t = doc.data();
    const st = badge[t.status] || badge.pending;
    const dt = t.createdAt?.toDate ? t.createdAt.toDate().toLocaleDateString('en-GB') : '—';
    const dir = (t.type === 'credit') ? 'in' : 'out';
    const arrow = dir==='in' ? 'fa-arrow-down' : 'fa-arrow-up';
    html += `<div class="tx"><div class="tx-top">
      <div class="tx-ico ${dir}"><i class="fa-solid ${arrow}"></i></div>
      <div class="tx-main">
        <div class="pair mono">${t.from||'?'} → ${t.to||'?'}</div>
        <div class="date mono">${dt} · ${doc.id.slice(-6).toUpperCase()}</div>
      </div>
      <div class="tx-amt">
        <div class="n mono">${fmt(t.amount||0, t.dp??2)} ${t.from||''}</div>
        <span class="badge ${st[0]}">${st[1]}</span>
      </div>
    </div></div>`;
  });
  list.innerHTML = html;
}

$('copyRef').onclick = () => { navigator.clipboard?.writeText(userRef); toast('نُسخ الرقم المرجعي'); };
$('waBtn').onclick = () => {
  const msg = `مرحباً، أريد طلب تحويل.\nرقمي المرجعي: ${userRef}`;
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
};
$('logoutBtn').onclick = async () => { await signOut(auth); location.href='login.html'; };
</script>
</body>
</html>
