<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2F70">
<title>BDL · مختبر المطابقة</title><link rel="icon" href="favicon.svg?v=bdl8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2F70;--ink:#0B2447;--mut:#5C7699;--line:#DCE5F1;--bg:#EEF2F8;--grn:#0E8F5B;--red:#B00020;--amb:#C77800}
*{box-sizing:border-box}html,body{margin:0}body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
button,input{font-family:inherit}button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.top{background:linear-gradient(100deg,#1AA3F5,#0A56B8 45%,#0B2F70);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;border-bottom:5px solid #F2B43A}
.top .r1{display:flex;align-items:center;gap:12px}.top img{width:46px;height:46px;border-radius:10px}.top h1{margin:0;font-size:19px;font-weight:700}.top p{margin:2px 0 0;font-size:12px;opacity:.85}
.top a{margin-inline-start:auto;color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;border:1px solid rgba(255,255,255,.5);padding:8px 12px;white-space:nowrap}
.flag{margin-top:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);padding:8px 12px;font-size:12.5px;font-weight:700}
main{padding:14px 14px 40px;max-width:640px;margin:0 auto}
section{background:#fff;border:1px solid var(--line);margin-bottom:12px;animation:up .25s ease}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sd{border-inline-start:6px solid var(--navy)}.sd.s{border-inline-start-color:var(--grn)}.sd header{padding:12px 14px 8px}.sd header b{display:block;font-size:16px}.sd header small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.pk{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 28px);margin:4px 14px 14px;min-height:70px;border:2px dashed #9DB5E3;background:#F7FAFF;color:var(--navy);font-weight:700;font-size:14px}.pk i{font-style:normal;font-size:22px}
.ld,.er{padding:14px;font-size:13px;font-weight:600}.er{color:var(--red)}
.nm{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:2px 14px 10px;align-items:center}.nm b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm span{grid-column:1;font-size:11.5px;color:var(--mut)}.nm button{grid-row:1/3;grid-column:2;height:34px;padding:0 12px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:700;font-size:12px}
.qk{display:flex;gap:6px;padding:0 14px 10px}.qk button{height:34px;padding:0 12px;border:1.5px solid #C9D6EA;background:#fff;color:var(--navy);font-weight:700;font-size:12px}.qk button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}.rg small{display:block;font-size:11px;font-weight:700;color:var(--mut);margin-bottom:3px}.rg input{width:100%;height:44px;border:1.5px solid #C9D6EA;background:#fff;padding:0 8px;font-size:14px;font-weight:600;color:var(--ink)}.rg input:disabled{opacity:.45}
.ct{padding:10px 14px 13px;font-size:13px;font-weight:600;color:var(--mut)}.ct b{font-family:"IBM Plex Mono",monospace;font-size:19px;color:var(--grn);margin-inline-end:4px}
.bt{display:block;width:100%;height:52px;border:0;background:var(--navy);color:#fff;font-weight:700;font-size:15px;margin-bottom:10px}.bt.go{background:var(--grn);height:56px}.bt:disabled{background:#B9C4D6}.bt.ln{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.how{font-size:12.5px;line-height:1.8;color:var(--mut);padding:4px 2px}.how b{display:block;color:var(--ink)}
.pg{padding:16px 14px}.st{display:flex;gap:6px;margin-bottom:12px}.st span{flex:1;text-align:center;font-size:12px;font-weight:700;color:#9AAAC2;padding:7px 0;border-bottom:3px solid #E3EAF4}.st span.on{color:var(--navy);border-color:var(--navy)}.st span.dn{color:var(--grn);border-color:var(--grn)}
.br{height:10px;background:#E3EAF4}.br i{display:block;height:100%;background:linear-gradient(90deg,#2F6FD0,#0B2F70);transition:width .3s}.tx{display:flex;gap:10px;align-items:baseline;margin:10px 0 2px;font-size:13px;font-weight:600}.tx b{font-family:"IBM Plex Mono",monospace;font-size:22px;color:var(--navy)}.fn{font-size:10.5px;color:#8A97AD;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:12px}
.sp{display:inline-block;width:16px;height:16px;border:2.5px solid #D5DEEC;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
.rs{padding:14px;border:0;background:none}.vd{padding:14px;color:#fff;margin-bottom:10px}.vd.ok{background:var(--grn)}.vd.no{background:var(--red)}.vd b{display:block;font-size:17px}.vd span{display:block;font-size:12.5px;opacity:.92;margin-top:3px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}.kp div{background:#fff;border:1.5px solid var(--line);padding:10px 6px;text-align:center}.kp b{display:block;font-family:"IBM Plex Mono",monospace;font-size:24px}.kp small{display:block;font-size:11px;font-weight:700}.kp i{display:block;font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--mut);margin-top:3px}
.kp .g{border-color:var(--grn);background:#E9F8EF;color:#0B7A3B}.kp .a{border-color:#E0A300;background:#FFF6E3;color:#8A6100}.kp .r{border-color:var(--red);background:#FFF1F2;color:var(--red)}
.tt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff;border:1px solid var(--line);padding:10px}.tt small{display:block;font-size:10.5px;color:var(--mut);font-weight:700}.tt b{display:block;font-family:"IBM Plex Mono",monospace;font-size:14px;direction:ltr;text-align:start;margin-top:2px}.tt .g b{color:#0B7A3B}.tt .r b{color:var(--red)}
.nt{font-size:12px;color:var(--mut);margin:8px 0}
h3{font-size:13.5px;margin:16px 0 8px}h3.a{color:#8A6100}h3.r{color:var(--red)}
.rw{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-inline-start:6px solid #E0A300;padding:8px;margin-bottom:6px}.rw.r{border-inline-start-color:var(--red)}
.th{flex:none;width:44px;height:44px;background:#EEF3FB;display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--navy);overflow:hidden;cursor:zoom-in}.th img{width:100%;height:100%;object-fit:cover}
.mn{flex:1;min-width:0}.mn b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;direction:ltr;text-align:start}.mn span{display:block;font-size:10.5px;color:var(--mut);direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw input{flex:none;width:96px;height:40px;border:1.5px solid #C9D6EA;padding:0 6px;font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700}.rw button{flex:none;height:40px;padding:0 10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:12px}
.mt{background:#fff;border:1px solid var(--line);margin:14px 0}.mt summary{padding:12px 14px;font-weight:700;font-size:13.5px;color:#0B7A3B;cursor:pointer}.pr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);background:#F3FBF6}.pr span{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:700;direction:ltr;cursor:zoom-in}.pr span small{display:block;font-size:10px;color:var(--mut);font-weight:500}.pr span:last-child{text-align:end}.pr em{font-style:normal;font-size:10px;font-weight:700;background:var(--grn);color:#fff;padding:3px 7px}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#lbToast{position:fixed;inset-inline:14px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:13px 16px;font-size:13.5px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s;z-index:60}#lbToast.on{opacity:1;transform:none}
#lbView{position:fixed;inset:0;z-index:50;background:#0A1220;display:none;flex-direction:column}#lbView.on{display:flex;animation:up .2s ease}#lbView header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff}#lbView header b{flex:1;min-width:0;font-size:12px;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#lbView header button{flex:none;height:44px;padding:0 18px;border:0;background:#fff;color:var(--navy);font-weight:700}
#lbView .bd{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}#lbView .bd img{width:100%;display:block}#lbView .bd iframe{width:100%;height:100%;border:0;background:#fff}
</style></head><body>
<div class="top"><div class="r1"><img src="arkan-icon-512.png" alt="BDL"><div><h1>مختبر المطابقة</h1><p>افحص إيصالات الزبون مقابل إيصالات المورد</p></div><a href="settle-v2.html">رجوع</a></div>
<div class="flag">وضع الاختبار — لا شيء يُحفظ ولا يُقيَّد في أي تسوية</div></div>
<main id="lbMain"></main>
<input type="file" id="lbFile" multiple style="display:none"><div id="lbToast"></div>
<div id="lbView"><header><b></b><button type="button">إغلاق</button></header><div class="bd"></div></div>
<script src="arkan-read.js?v=9"></script><script src="bdl-lab.js?v=1"></script>
</body></html>
