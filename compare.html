<style>
:root{--navy:#0B2F70;--blue:#1E63D6;--gold:#D4AF37;--ink:#0F1F3D;--muted:#5A6E92;--line:#D6E4F7;--bg:#EEF3FB;--red:#B00020;--green:#2E7D32;--amber:#ED6C02}
*{box-sizing:border-box}
.hero,.bc,.rep,.col{border-radius:22px!important;overflow:hidden}.r{border-radius:16px!important}.tools button,.btn,.bc button,.up button{border-radius:12px!important}.r input,.bc input,.tools input{border-radius:10px!important}.tag,.st,.m17d{border-radius:999px!important}#vw .vwh button{border-radius:10px!important}
html,body{overflow-x:hidden;max-width:100vw}
main,.big,.cols,.col,.bc,.hero,.rep,.tools{max-width:100%;min-width:0}
.r,.r .f,.r .t,.r .m{min-width:0;max-width:100%;overflow-wrap:anywhere}
.r .f input,.bc input,.tools input{min-width:0;max-width:100%}
.rep>div[style*='overflow']{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Inter",-apple-system,sans-serif;padding-bottom:110px}
.num{font-family:"Inter",sans-serif;font-weight:700}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .nav{flex-basis:100%;display:flex;gap:6px;margin-top:8px}header .nav .tag{flex:1;text-align:center;padding:7px 4px;text-decoration:none;white-space:nowrap}
header img{width:36px;height:36px}
header h1{margin:0;font-size:16px;font-weight:800;flex:1;min-width:0}
header small{font-size:10.5px;opacity:.85;display:block;font-weight:700}
.tag{border:1px solid var(--gold);color:var(--gold);font-size:10.5px;font-weight:800;padding:5px 8px;white-space:nowrap;border-radius:99px}
#tag{max-width:46%;overflow:hidden;text-overflow:ellipsis}
main{padding:12px}
.hero{background:radial-gradient(120% 90% at 85% 0%,#1A4A9C 0%,#0B2F70 45%,#071E4A 100%);color:#fff;padding:24px 16px 18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero>*{position:relative}
.g{width:250px;height:250px;position:relative;margin:0 auto 18px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}.g svg{width:250px;height:250px;transform:rotate(-90deg)}

.gc b{font:800 34px/1 "Inter",sans-serif;letter-spacing:-.5px}.gc small{font-size:12px;opacity:.85;margin-top:8px;font-weight:700;line-height:1.35}.gc em{font-style:normal;font:800 11px "Inter",sans-serif;letter-spacing:2px;opacity:.6;margin-bottom:8px}

.tools{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;align-items:center}
.hk{text-align:center;padding:6px 0 14px}.hk small{display:block;font-size:12px;color:#B9C7E6;font-weight:700}.hk b{display:block;font:800 clamp(30px,8.5vw,44px)/1.15 "Inter",sans-serif;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:4px 0}.hk b span{font-size:14px;color:#B9C7E6;font-weight:600;margin-inline-start:6px}.hk u{text-decoration:none;font-size:11px;color:#B9C7E6;font-weight:600}
.hc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hc>div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-top:3px solid var(--c);border-radius:14px;padding:10px 6px;text-align:center}.hc b{display:block;font:800 22px/1.2 "Inter",sans-serif;color:var(--c)}.hc span{display:block;font-size:11px;font-weight:700;color:#fff;margin-top:2px}.hc u{display:block;text-decoration:none;font-size:10px;color:#B9C7E6;font-variant-numeric:tabular-nums;margin-top:2px}
.more{margin:4px 0}.more summary{cursor:pointer;font-size:12px;font-weight:800;color:var(--muted);padding:6px 4px;list-style:none;display:flex;align-items:center;gap:6px}.more summary::-webkit-details-marker{display:none}.more summary:before{content:"▸";transition:transform .15s}.more[open] summary:before{transform:rotate(90deg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0!important;border-radius:0!important;padding:8px 10px!important;font-size:12px!important;background:#fff}.seg button.on{background:var(--navy);color:#fff}
html[data-btn=s] .tools button,html[data-btn=s] .btn{font-size:11px;padding:7px 9px}html[data-btn=l] .tools button,html[data-btn=l] .btn{font-size:14px;padding:13px 16px}
.tools button,.btn{border:1px solid var(--line);background:#fff;color:var(--navy);font:800 12px inherit;font-family:inherit;padding:10px 12px;cursor:pointer}
.tools button.pri,.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.tools button.on{background:var(--navy);color:#fff}

.tools button.danger{color:var(--red);border-color:#F1C4CA}
.tools input{width:60px;border:1px solid var(--line);padding:8px;font:700 12px "Inter",sans-serif;text-align:center;color:var(--navy)}
.cols{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.col{background:#fff;border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.ic{width:34px;height:34px;display:grid;place-items:center;color:#fff;font:800 10px "Inter",sans-serif}
.ic.b{background:var(--blue)}.ic.g{background:var(--green)}
.ch b{font-size:13.5px}.ch span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.up{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.up button{flex:1;border:0;background:var(--navy);color:#fff;font:800 12px inherit;font-family:inherit;padding:11px;cursor:pointer}
.up button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.r{padding:10px 12px;border-bottom:1px solid var(--line);position:relative;cursor:pointer}
.r.sel{outline:3px solid var(--gold);outline-offset:-3px}
/* لون الجهة: الزبائن أزرق · الموردون أخضر — لون الحالة: مطابَق أخضر فاتح · بلا مقابل أحمر فاتح · مراجعة كهرماني */
.col.cust{border-top:4px solid var(--blue)}.col.sup{border-top:4px solid var(--green)}
.col.cust .ch{background:#EAF1FF}.col.sup .ch{background:#E8F6EE}
.col.cust .up button:first-child{background:var(--blue)}.col.sup .up button:first-child{background:var(--green)}
.r{border-inline-start:6px solid var(--line)}
.r.cust{border-inline-start-color:var(--blue)}.r.sup{border-inline-start-color:var(--green)}
.r.ok{background:#EEF9F2}.r.ok .a{color:var(--green)}
.r.pend{background:#FFF1F1}.r.pend .a{color:var(--red)}
.r.rev{background:#FFF6E5}.r.rev .a{color:#9A4B00}
.r .st.pend{background:#FBDADA;color:var(--red)}.r .st.ok{background:#CDEFD9;color:var(--green)}
.r.cust .st{outline:1px solid rgba(30,99,214,.25)}.r.sup .st{outline:1px solid rgba(46,125,50,.25)}
.r input{background:#fff}
.r .acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.r .acts button{border:1px solid var(--line);background:#fff;color:var(--navy);font:800 11.5px inherit;font-family:inherit;padding:9px 6px;cursor:pointer}
.r .acts button.mv{color:#9A4B00;border-color:#F2D2A8}.r .acts button.del{color:var(--red);border-color:#F1C4CA}
.r .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r .a{font:800 16px "Inter",sans-serif}.r .st{font-size:10.5px;font-weight:800;padding:3px 7px}
.r .st.ok{background:#E3F7EE;color:var(--green)}.r .st.pend{background:#FFF1E0;color:#9A4B00}
.r .f{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.r input{border:1px solid var(--line);padding:7px 8px;font:600 12px "Inter",sans-serif;width:100%;min-width:0;color:var(--ink);background:#fff}
.r input.ar{font-family:inherit}
.r .m{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px}
.r .x{border:0;background:transparent;color:var(--red);font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:0 6px}
.r img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);float:inline-end;margin-inline-start:8px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.rep{background:#fff;border:1px solid var(--line);margin-top:12px}
.rep h4{margin:0;padding:12px;font-size:14px;color:var(--navy);display:flex;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum div{background:#fff;padding:10px 6px;text-align:center}.sum span{display:block;font-size:10.5px;color:var(--muted);font-weight:700}.sum b{font:800 15px "Inter",sans-serif;display:block;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#F3F7FD;color:var(--muted);font-size:10.5px;padding:8px 6px;text-align:right}td{padding:9px 6px;border-top:1px solid var(--line)}
.d{display:inline-block;width:10px;height:10px;border-radius:50%!important;vertical-align:middle;margin-inline-end:5px}
.bar{position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:var(--navy);color:#fff;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);border-top:2px solid var(--gold);display:none}
.bar .rr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:10px}.bar .rr span{display:block;font-size:10.5px;opacity:.8;font-weight:700}.bar .rr b{font:800 16px "Inter",sans-serif}
.bar .aa{display:flex;gap:8px}.bar .aa button{flex:1;border:0;padding:12px;font:800 13px inherit;font-family:inherit;cursor:pointer;background:#fff;color:var(--navy)}.bar .aa button.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
#vw{position:fixed;inset:0;z-index:100000;background:#0B2F70;display:none;flex-direction:column}#vw .vwh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;color:#fff;font-size:12.5px;font-weight:800}#vw .vwh span{flex:1;font-family:Inter,sans-serif}#vw .vwh a{color:#D4AF37;font-size:12px;font-weight:800;text-decoration:none}#vw .vwh button{border:0;background:#D4AF37;color:#0B2F70;font:800 13px inherit;font-family:inherit;padding:10px 14px}#vw .vwb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#111;display:flex;align-items:flex-start;justify-content:center}#vw .vwb img{max-width:100%;height:auto;touch-action:pinch-zoom}#vw .vwb iframe{width:100%;height:100%;border:0;background:#fff}
/* البطاقتان الكبيرتان */
.big{display:grid;grid-template-columns:1fr;gap:14px;margin:8px 0 14px}
.bc{position:relative;color:#fff;padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden;box-shadow:0 16px 34px rgba(7,30,74,.25)}
.bc:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.07);top:-110px;left:-60px;pointer-events:none}
.bc .big-n{font:800 40px/1 Inter,sans-serif;letter-spacing:-.5px;margin-top:4px}.bc .big-n small{font:800 16px Inter,sans-serif;margin-inline-start:6px;opacity:.9}
.bc .row{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;margin-top:4px}.bc .row div{text-align:center}.bc .row span{display:block;font-size:11px;opacity:.85;font-weight:700}.bc .row b{display:block;font:800 18px Inter,sans-serif;margin-top:3px}.bc .row div+div{border-inline-start:1px solid rgba(255,255,255,.25)}
.bc .eye{position:absolute;top:16px;left:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font:800 11px Inter,sans-serif}
.bc.cust{background:linear-gradient(135deg,#123B85 0%,#0B2F70 55%,#071E4A 100%)}

<body>
<header><img src="favicon.svg?v=bdl7" alt=""><div><h1>مقارنة الإيصالات</h1><small>الزبائن مقابل الموردين — دفتر دائم</small></div><span class="tag" id="tag">الدفتر</span></header>
<main>
<div class="hero" id="hero"></div>
<div class="tools" id="prim">
  <button class="pri" style="background:var(--green);border-color:var(--green)" onclick="partyPanel()">حفظ الإيصالات إلى الدفتر</button>
  <button class="pri" onclick="syncLedger(false)">مزامنة مع الدفتر</button>
  <button style="border-color:var(--gold);color:var(--gold)" onclick="location.href='accountant.html'">المحاسب</button>
  <button style="border-color:var(--navy)" onclick="aiMatch()">مطابقة Claude</button>
  <button onclick="exportPDF()">تقرير PDF</button>
  <button id="rsm" style="display:none;background:#ED6C02;color:#fff;border-color:#ED6C02" onclick="resume()">متابعة القراءة</button>
  <span style="flex:1"></span>
  <span class="seg" title="حجم الأزرار"><button onclick="setBtn('s')" data-b="s">ص</button><button onclick="setBtn('m')" data-b="m">م</button><button onclick="setBtn('l')" data-b="l">ك</button></span>
</div>
<details class="more" id="more"><summary>المزيد من الأدوات</summary>
<div class="tools">
  <button class="pri" onclick="rematch()">إعادة المطابقة</button>
  <button onclick="freeLocal()">تحرير مساحة الجهاز</button>
  <button onclick="const v=prompt('التوازي (2–8) — 4 للحساب المجاني، 8 للحساب المدفوع:',localStorage.getItem('gemPar')||'4');if(v)localStorage.setItem('gemPar',String(Math.max(2,Math.min(8,parseInt(v)||4))));const m=prompt('نموذج Gemini:\ngemini-2.5-flash (دقيق)\ngemini-2.5-flash-lite (أسرع)',GEM_MODEL());if(m)localStorage.setItem('gemModel',m.trim());toast('حُفظت إعدادات السرعة');">سرعة القراءة</button>
  <button style="border-color:var(--red);color:var(--red)" onclick="aiAudit()">تفتيش Claude</button>
  <button onclick="audit()">تفتيش بالقواعد</button>
  <button onclick="const k=prompt('مفتاح Gemini (يُحفظ على هذا الجهاز فقط):',localStorage.getItem('gemKey')||'');if(k!=null&&k.trim()){localStorage.setItem('gemKey',k.trim());toast('حُفظ المفتاح');}">مفتاح Gemini</button>
  <button id="lkb" onclick="linkMode()">ربط يدوي ١:١</button>
  <span style="font-size:11px;color:var(--muted);font-weight:700">هامش %</span><input id="tol" inputmode="decimal" value="0.5" onchange="rematch()">
  <button onclick="shareText()">نسخ للواتساب</button>
  <button class="danger" onclick="clearAll()">مسح الجلسة (الجهاز)</button>
  <button class="danger" style="background:var(--red);color:#fff;border-color:var(--red)" onclick="wipeAll()">مسح كامل — الجهاز والدفتر</button>
</div>
</details>
<div class="tools" id="rng" style="margin-top:0">
  <span style="font-size:11px;color:var(--muted);font-weight:700">الفترة</span><input type="date" id="rf" onchange="setRange(this.value,$('#rt').value)"><span style="font-size:11px;color:var(--muted)">→</span><input type="date" id="rt" onchange="setRange($('#rf').value,this.value)">
  <button onclick="quick(0)">هذا الشهر</button><button onclick="quick(2)">٣ أشهر</button><button onclick="quick(5)">٦ أشهر</button><button onclick="quick(-1)">الكل</button>
</div>
<div class="tools" style="margin:6px 0 4px"><input id="q" placeholder="بحث: اسم / هاتف / مرجع / مبلغ / بنك" style="flex:1;min-width:160px;width:auto;text-align:right" oninput="S.q=this.value;render(true)"></div>

const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const q=indexedDB.open('bdl_compare',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');};q.onsuccess=()=>{this.db=q.result;res(this.db);};q.onerror=()=>rej(q.error);});},
  async put(st,k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(st,k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async del(st,k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async clear(){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(['files','state'],'readwrite');t.objectStore('files').clear();t.objectStore('state').clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});}};
async function thumbOf(f){try{const bm=await createImageBitmap(f);const k=Math.min(1,220/Math.max(bm.width,bm.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*k));cv.height=Math.max(1,Math.round(bm.height*k));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);bm.close&&bm.close();return await new Promise(r=>cv.toBlob(r,'image/jpeg',.7));}catch(e){return null;}}
const SESSION_MS=24*36e5;
function ser(r){return {id:r.id,side:r.side,amount:r.amount,ccy:r.ccy,rccy:r.rccy||null,amountRead:r.amountRead||null,flags:r.flags||[],why:r.why||'',waDate:r.waDate||null,fileDate:r.fileDate||null,manual:!!r.manual,led:!!r.led,phone:r.phone||'',receipt_url:r.receipt_url||null,book_entry_id:r.book_entry_id||null,ref:r.ref,who:r.who,bank:r.bank,date:r.date.getTime(),src:r.src||'',note:r.note||'',fp:r.fp||null,hasFile:!!(r.file||r.hasFile),isPdf:!!r.pdf,reading:!!r.reading,fail:!!r.fail,unsure:!!r.unsure,edit:!!r.edit,excl:!!r.excl,srv:r.srv||null,verified:!!r.verified,review:!!r.review,alt:r.alt||null,audited:!!r.audited,auditNote:r.auditNote||'',matchedId:r.matched?r.matched.id:null,how:r.how||'',name:r.name||''};}
/* ───── سعة التخزين: طلب تخزين دائم من النظام + عرض الاستهلاك + تحرير الأصول المرفوعة للدفتر ───── */
async function storageInfo(){try{if(navigator.storage&&navigator.storage.persist&&!S.persisted){S.persisted=await navigator.storage.persist();}

let _pt=null;function persist(){clearTimeout(_pt);_pt=setTimeout(async()=>{try{if(S.busy&&S.cust.length+S.sup.length>3000)return;const st={ts:S.ts||Date.now(),seq:S.seq,rows:S.cust.concat(S.sup).map(ser),excl:(S.excl||[]).map(ser),tol:$('#tol').value,range:S.range,party:S.party,jobs:(S.jobs||[]).map(j=>({id:j.id,side:j.side,total:j.total,done:j.done,next:j.next,status:j.status,name:j.name}))};S.ts=st.ts;await IDB.put('state','session',st);

  const mk=async o=>{const r={id:o.id,side:o.side,amount:o.amount,ccy:o.ccy||'AOA',rccy:o.rccy,amountRead:o.amountRead||null,flags:o.flags||[],why:o.why||'',waDate:o.waDate||null,fileDate:o.fileDate||null,manual:!!o.manual,led:!!o.led,phone:o.phone||'',receipt_url:o.receipt_url||null,book_entry_id:o.book_entry_id||null,ref:o.ref||'',who:o.who||'',bank:o.bank||'',date:new Date(o.date),src:o.src,note:o.note,fp:o.fp,hasFile:o.hasFile,pdf:o.isPdf,fail:o.fail,unsure:o.unsure,edit:o.edit,srv:o.srv||null,verified:o.verified,review:o.review,alt:o.alt,audited:o.audited,auditNote:o.auditNote||'',excl:o.excl,how:o.how,name:o.name,file:null,url:null,reading:!!o.reading,matched:null,_mid:o.matchedId};
    try{const t=await IDB.get('files',r.id+'_t');if(t){r.thumb=t;r.tSaved=true;r.url=URL.createObjectURL(t);}}catch(e){}return r;};
  for(const o of st.rows){const r=await mk(o);all.push(r);(r.side==='sup'?S.sup:S.cust).push(r);}

/* عارض داخل الصفحة — iOS يمنع window.open بعد انتظار غير متزامن، لذا نعرض الإيصال في طبقة فوق الصفحة */
function viewer(u,pdf,title){let v=$('#vw');if(!v){v=document.createElement('div');v.id='vw';v.innerHTML='<div class="vwh"><button onclick="closeViewer()">✕ إغلاق — العودة للمبلغ</button><span id="vwt"></span><a id="vwo" target="_blank" rel="noopener">فتح في تبويب</a></div><div class="vwb" id="vwb"></div>';document.body.appendChild(v);}

async function openFile(id){const r=find(id)||(S.excl||[]).find(x=>x.id===id);if(!r)return;const t=(r.who||'')+' · '+(r.amount?fmt(r.amount)+' '+r.ccy:'');

/* ───── نقل جهة (أو إيصال) بين عمود الزبائن وعمود الموردين — لتصحيح اللخبطة ───── */
function flipRow(r){const from=r.side==='sup'?S.sup:S.cust,to=r.side==='sup'?S.cust:S.sup;const i=from.indexOf(r);if(i>=0)from.splice(i,1);
  if(r.matched){r.matched.matched=null;r.matched.how='';r.matched=null;}r.how='';r.side=r.side==='sup'?'cust':'sup';to.push(r);
  try{LED.patch(r,{side:r.side});}catch(e){}}
function moveRow(id){const r=find(id);if(!r)return;if(!confirm('نقل هذا الإيصال إلى عمود '+(r.side==='sup'?'الزبائن':'الموردين')+'؟'))return;flipRow(r);toast('نُقل ✓');rematch();}
function moveParty(side){const rows=side==='sup'?S.sup:S.cust;const names=[...new Set(rows.map(r=>(r.who||'').trim()).filter(Boolean))];if(!names.length){toast('لا إيصالات في هذا العمود');return;}
  const pick=prompt('اسم الجهة المطلوب نقلها إلى عمود '+(side==='sup'?'الزبائن':'الموردين')+':\n'+names.map((n,i)=>(i+1)+'. '+n+' ('+rows.filter(r=>(r.who||'').trim()===n).length+')').join('\n')+'\n\nاكتب الرقم أو الاسم:');if(!pick)return;
  const nm=/^\d+$/.test(pick.trim())?names[+pick.trim()-1]:names.find(n=>n.toLowerCase()===pick.trim().toLowerCase())||names.find(n=>n.toLowerCase().includes(pick.trim().toLowerCase()));if(!nm){toast('لم أجد هذا الاسم');return;}
  const sel=rows.filter(r=>(r.who||'').trim()===nm);if(!confirm('نقل '+sel.length+' إيصال لـ «'+nm+'» إلى عمود '+(side==='sup'?'الزبائن':'الموردين')+'؟ ستُفكّ مطابقاتها وتُعاد المطابقة.'))return;
  sel.forEach(flipRow);toast('نُقل '+sel.length+' إيصال — أُعيدت المطابقة');rematch();}
function pickParty(side,title,extra){const rows=(side==='sup'?S.sup:S.cust).concat((S.excl||[]).filter(r=>r.side===side));if(!rows.length){toast('لا إيصالات في هذا العمود');return null;}
  /* التجميع بالهاتف أولًا (اسم الجهة المقروء من الإيصال قد يكون اسم المستفيد لا المورد) */
  const kOf=r=>{const p=String(r.phone||'').replace(/\D/g,'');return p.length>=8?'p:'+p:'n:'+(r.who||'').trim().toLowerCase();};
  const G={};rows.forEach(r=>{const k=kOf(r);(G[k]=G[k]||{k,rows:[],names:{}}).rows.push(r);const n=(r.who||'').trim()||'—';G[k].names[n]=(G[k].names[n]||0)+1;});
  const groups=Object.values(G).sort((a,b)=>b.rows.length-a.rows.length).map(g=>{g.label=Object.entries(g.names).sort((a,b)=>b[1]-a[1])[0][0];g.phone=g.k.startsWith('p:')?'+'+g.k.slice(2):'';return g;});
  const lines=groups.map((g,i)=>(i+1)+'. '+g.label+(g.phone?' · '+g.phone:'')+' ('+g.rows.length+' إيصال)');lines.push('0. كل إيصالات هذا العمود ('+rows.length+')'+(extra?' / '+extra:''));
  const pick=prompt(title+'\n'+lines.join('\n')+'\n\nاكتب الرقم أو الاسم أو الهاتف:');if(!pick)return null;const t=pick.trim(),td=t.replace(/\D/g,'');
  if(t==='0')return {all:true,name:'كل العمود',rows};
  let g=/^\d{1,3}$/.test(t)?groups[+t-1]:null;if(!g&&td.length>=8)g=groups.find(x=>x.k==='p:'+td)||groups.find(x=>x.k.startsWith('p:')&&x.k.endsWith(td.slice(-8)));
  if(!g)g=groups.find(x=>x.label.toLowerCase()===t.toLowerCase())||groups.find(x=>x.label.toLowerCase().includes(t.toLowerCase()));if(!g){toast('لم أجد هذه الجهة');return null;}
  return {name:g.label+(g.phone?' '+g.phone:''),rows:g.rows};}
/* حذف جهة كاملة: الجهاز + الدفتر الدائم + الأصول في Storage + فكّ المطابقات (قيود الدفاتر تُحذف فقط إذا كانت كل إيصالاتها ضمن المحذوف) */
async function delParty(side){const P=pickParty(side,'حذف جهة نهائيًا من عمود '+(side==='sup'?'الموردين':'الزبائن')+':');if(!P)return;const sel=P.rows;const booked=sel.filter(r=>r.book_entry_id).length;

  let n=0,b=0,st=0,err='';if(tokenOf()){try{const eids=[...new Set(sel.map(r=>r.book_entry_id).filter(Boolean))];const fpSet=new Set(fps);
      await wipeFps(fps);n=fps.length;b=eids.length;st=0; /* السلة 30 يومًا + سجل تدقيق — الصور تبقى في Storage للاستعادة */
      LED.refs={};Object.values(LED.idx).forEach(x=>{if(x.ref)LED.refs[x.side+'|'+x.ref.replace(/\s+/g,'').toLowerCase()]=x;});}catch(e){err=String(e.message||e).slice(0,100);}}

/* إعادة قراءة جهة (أو كل بطاقات المراجعة) من الأصل: الجهاز أولًا ثم Supabase Storage — بلا حذف ولا إعادة رفع */
async function rereadParty(side){const P=pickParty(side,'إعادة قراءة إيصالات جهة في عمود '+(side==='sup'?'الموردين':'الزبائن')+':','كل بطاقات «يحتاج مراجعة» في هذا العمود');if(!P)return;
  let rows=P.rows.filter(r=>!r.excl&&!r.reading&&!r.book_entry_id&&!r.manual);if(P.all){const rev=rows.filter(r=>(r.review||r.fail||!r.amount)&&!r.matched);if(rev.length&&confirm('العمود كامل: إعادة قراءة بطاقات «يحتاج مراجعة» فقط ('+rev.length+')؟\nإلغاء = إعادة قراءة كل الإيصالات ('+rows.length+')'))rows=rev;}

function dealOf(c,s){if(!c||!s||!c.fp||!s.fp||!tokenOf())return;const k=c.fp+'|'+s.fp;S.dealt=S.dealt||{};if(S.dealt[k])return;S.dealt[k]=1;fetch(SRV+'/accountant/deal',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tokenOf()},body:JSON.stringify({cust_fp:c.fp,sup_fp:s.fp,amount_aoa:c.amount,source:'compare'})}).catch(()=>{});}

  else{S.cust.forEach(c=>{if(c.how!=='manual'){c.matched=null;c.how='';}});S.sup.forEach(s=>{if(!(s.matched&&s.matched.how==='manual'))s.matched=null;});}

  render();
}

                ['إيصالات بلا مبلغ — تحتاج إدخال',['التاريخ','الجهة','العمود','ملاحظة'],na.slice(0,300).map(r=>['<span class="num">'+dGB(r.date)+'</span>',esc(nm(r)),r.side==='cust'?'زبون':'مورد',esc((r.flags||[])[0]||(r.review?'يحتاج مراجعة':'لم تُقرأ'))]),null]];}
  else if(k==='six'){const M=monthly();const now=new Date();const keys=[];for(let i=0;i<6;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(mKey(d));}out.title='كشف آخر 6 أشهر';
    const rows=keys.map(k2=>{const m=M.find(x=>x.k===k2)||{k:k2,label:mLbl(k2),nC:0,nS:0,vC:0,vS:0,vOk:0,vD:0,vE:0,net:0};return [m.label+' <small>('+m.nC+'/'+m.nS+')</small>',m.vC,m.vS,m.vOk,m.vD,m.vE,m.net];});
    const tot=i=>sumT(rows,i);out.sum=[['زبائن 6 أشهر',tot(1),'var(--blue)'],['موردون 6 أشهر',tot(2),'var(--green)'],['نقص تراكمي',tot(4),'var(--red)'],['فائض تراكمي',tot(5),'var(--green)'],['صافي 6 أشهر',tot(6),tot(6)>=0?'var(--green)':'var(--red)']];
    out.blocks=[['',['الشهر','زبائن','موردون','مطابَق','نقص','فائض','صافي'],rows,['المجموع',tot(1),tot(2),tot(3),tot(4),tot(5),tot(6)]]];}
  return out;}
function cmdHTML(){const d=cmdData();
  let h='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px">'+CMDS.map(c=>'<button class="x" style="position:static;color:'+(S.cmd.k===c[0]?'#fff':'var(--navy)')+';background:'+(S.cmd.k===c[0]?'var(--navy)':'#fff')+';border:1px solid var(--navy);padding:7px 10px;border-radius:8px" onclick="setCmd(\'k\',\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div>';
  if(S.cmd.k==='pair')h+='<div style="display:flex;gap:8px;padding:0 12px 10px;flex-wrap:wrap">'+selHTML('sup',names(S.sup),'اختر المورد')+selHTML('cust',names(S.cust),'اختر الزبون')+'</div>';
  if(S.cmd.k==='month')h+='<div style="padding:0 12px 10px">'+selHTML('m',d.months||[],'اختر الشهر').replace(/<option value="([^"]+)"([^>]*)>[^<]*<\/option>/g,(m0,v,a)=>'<option value="'+v+'"'+a+'>'+mLbl(v)+'</option>')+'</div>';
  h+='<h4 style="padding:4px 12px 8px"><span>'+esc(d.title)+'</span></h4>';
  if(d.sum.length)h+='<div class="sum" style="grid-template-columns:repeat(3,1fr)">'+d.sum.map(x=>'<div><span>'+esc(x[0])+'</span><b style="color:'+x[2]+'">'+(typeof x[1]==='number'&&Math.abs(x[1])>=1000?fmt(x[1]):fmt(x[1]))+'</b></div>').join('')+'</div>';
  if(d.note)h+='<div class="empty" style="color:var(--amber)">'+esc(d.note)+'</div>';
  (d.blocks||[]).forEach(b=>{if(b[0])h+='<h4 style="font-size:12.5px;padding:10px 12px 4px">'+b[0]+'</h4>';h+=b[2].length?T(b[1],b[2],b[3]):'<div class="empty">لا بيانات</div>';});
  return h;}
function cmdLines(){const d=cmdData();const strip=x=>String(x).replace(/<[^>]+>/g,'');const L=['— '+d.title+' —'];d.sum.forEach(x=>L.push(x[0]+': '+fmt(x[1])));if(d.note)L.push(d.note);
  (d.blocks||[]).forEach(b=>{L.push('');if(b[0])L.push('▪ '+b[0]);b[2].forEach(r=>L.push('• '+r.map(c=>typeof c==='number'?fmt(c):strip(c)).join(' · ')));if(b[3])L.push('= '+b[3].map(c=>typeof c==='number'?fmt(c):strip(c)).join(' · '));});return L;}
/* ───── التصدير ───── */
function rangeLbl(){return S.range.from||S.range.to?' · الفترة '+(S.range.from?new Date(S.range.from).toLocaleDateString('en-GB'):'…')+' → '+(S.range.to?new Date(S.range.to).toLocaleDateString('en-GB'):'اليوم'):'';}
function lines(){const cc=VC(),ss=VS();const def=cc.filter(r=>!r.matched),exc=ss.filter(r=>!r.matched),ok=cc.filter(r=>r.matched);const net=sum(exc)-sum(def);
  const L=['BDL — مقارنة الإيصالات · '+new Date().toLocaleDateString('en-GB')+rangeLbl(),'إيصالات الزبائن: '+cc.length+' · '+fmt(sum(cc))+' AOA','إيصالات الموردين: '+ss.length+' · '+fmt(sum(ss))+' AOA','مطابَق: '+ok.length+' · '+fmt(sum(ok))+' AOA','نقص (بلا مورد): '+def.length+' · '+fmt(sum(def))+' AOA','فائض موردين: '+exc.length+' · '+fmt(sum(exc))+' AOA','صافي الفرق: '+(net>=0?'+':'−')+fmt(Math.abs(net))+' AOA',''];
  if(def.length){L.push('— نقص (زبائن بلا إيصال مورد):');def.forEach(r=>L.push('• '+(r.who||'—')+' · '+fmt(r.amount)+' '+r.ccy+' · '+(r.ref||'بلا مرجع')+' · '+r.date.toLocaleDateString('en-GB')));L.push('');}
  if(exc.length){L.push('— فائض (موردون بلا زبون):');exc.forEach(r=>L.push('• '+(r.who||'—')+' · '+fmt(r.amount)+' '+r.ccy+' · '+(r.ref||'بلا مرجع')+' · '+r.date.toLocaleDateString('en-GB')));L.push('');}
  if(ok.length){L.push('— المطابَق:');ok.forEach(r=>L.push('• '+(r.who||'—')+' '+fmt(r.amount)+' / '+(r.matched.who||'—')+' '+fmt(r.matched.amount)+' · '+(HOW[r.how]||'')));}
  if(S.rep==='month')return L.slice(0,8).concat(monthlyLines());
  if(S.rep==='cmd')return L.slice(0,1).concat(cmdLines());
  return L;}
async function shareText(){const t=lines().join('\n');try{await navigator.clipboard.writeText(t);toast('نُسخ التقرير — الصقه في واتساب');}catch(e){prompt('انسخ النص:',t);}}
function exportPDF(){const JS=window.jspdf&&window.jspdf.jsPDF;if(!JS){toast('مكتبة PDF لم تُحمّل بعد');return;}
  const cc=VC(),ss=VS();const def=cc.filter(r=>!r.matched&&r.amount),exc=ss.filter(r=>!r.matched&&r.amount),ok=cc.filter(r=>r.matched);
  const grp=arr=>{const g={};arr.forEach(r=>{const k=(r.who||'—')+(r.phone?' · '+r.phone:'');(g[k]=g[k]||[]).push(r);});return Object.entries(g).sort((a,b)=>sum(b[1])-sum(a[1]));};
  const pages=[];let cur=[];const push=(t,st)=>{cur.push({t,st});if(cur.length>=34){pages.push(cur);cur=[];}};
  const title='BDL · تقرير المطابقة — '+({today:'اليوم','7d':'٧ أيام','30d':'٣٠ يومًا',all:'كل الفترة'}[S.range&&S.range.k]||((S.range&&S.range.from)||'')+' → '+((S.range&&S.range.to)||''))+' · '+new Date().toLocaleDateString('en-GB');
  push('الملخص','h');push('إيصالات الزبائن: '+cc.length+' · '+fmt(sum(cc))+' AOA','');push('إيصالات الموردين: '+ss.length+' · '+fmt(sum(ss))+' AOA','');push('مطابَق: '+ok.length+' · '+fmt(sum(ok))+' AOA','');
  push('نقص — إيصالات زبائن لم تصل الموردين: '+def.length+' · '+fmt(sum(def))+' AOA','r');push('فائض — إيصالات موردين بلا زبون: '+exc.length+' · '+fmt(sum(exc))+' AOA','g');const net=sum(exc)-sum(def);push('صافي الفرق: '+(net>=0?'+':'−')+fmt(Math.abs(net))+' AOA',net>=0?'g':'r');push('','');
  push('١) إيصالات الزبائن التي لم تصل الموردين — الأهم','h');
  if(!def.length)push('لا يوجد ✓','g');grp(def).forEach(([k,rs])=>{push(k+' — '+rs.length+' إيصال · '+fmt(sum(rs))+' AOA','sub');rs.sort((a,b)=>a.date-b.date).forEach(r=>push(dGB(r.date)+'   '+fmt(r.amount)+' AOA   '+(r.ref?'#'+r.ref:'بلا مرجع')+'   '+(r.bank||'')+'   منذ '+days(r.date)+' يوم','r'));});
  push('','');push('٢) إيصالات الموردين بلا زبون (فائض)','h');
  if(!exc.length)push('لا يوجد ✓','g');grp(exc).forEach(([k,rs])=>{push(k+' — '+rs.length+' إيصال · '+fmt(sum(rs))+' AOA','sub');rs.sort((a,b)=>a.date-b.date).forEach(r=>push(dGB(r.date)+'   '+fmt(r.amount)+' AOA   '+(r.ref?'#'+r.ref:'بلا مرجع')+'   '+(r.bank||''),'g'));});
  push('','');push('٣) المطابَق — زبون / مورد','h');grp(ok).forEach(([k,rs])=>{push(k+' — '+rs.length+' · '+fmt(sum(rs))+' AOA','sub');rs.sort((a,b)=>a.date-b.date).forEach(r=>push(dGB(r.date)+'   '+fmt(r.amount)+'   '+(r.ref?'#'+r.ref:'')+'   ⇐   '+(r.matched.who||'—')+' '+fmt(r.matched.amount)+' '+(r.matched.ref?'#'+r.matched.ref:''),''));});
  if(cur.length)pages.push(cur);
  const W=1000,H=1414;const pdf=new JS({unit:'pt',format:[W*0.75,H*0.75]});
  pages.forEach((pg,pi)=>{const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const x=cv.getContext('2d');x.scale(2,2);x.fillStyle='#fff';x.fillRect(0,0,W,H);
    x.fillStyle='#0B2F70';x.fillRect(0,0,W,80);x.fillStyle='#D4AF37';x.fillRect(0,80,W,2);x.fillStyle='#fff';x.font='800 24px Cairo, Inter, sans-serif';x.textAlign='right';x.direction='rtl';x.fillText(title,W-30,50);x.textAlign='left';x.font='700 14px Inter, sans-serif';x.fillText('page '+(pi+1)+' / '+pages.length,30,50);x.textAlign='right';
    let y=120;pg.forEach(l=>{if(l.st==='h'){x.fillStyle='#0B2F70';x.font='800 22px Cairo, Inter, sans-serif';}else if(l.st==='sub'){x.fillStyle='#123B85';x.font='800 18px Cairo, Inter, sans-serif';x.fillStyle='#EEF3FB';x.fillRect(30,y-24,W-60,34);x.fillStyle='#123B85';}else{x.fillStyle=l.st==='r'?'#B00020':l.st==='g'?'#2E7D32':'#0F1F3D';x.font='700 17px Cairo, Inter, sans-serif';}x.fillText(l.t,W-40,y);y+=36;});
    x.fillStyle='#5A6E92';x.font='700 12px Inter, sans-serif';x.textAlign='center';x.fillText('lbdal.com · BDL Exchange · '+new Date().toISOString().slice(0,16).replace('T',' '),W/2,H-24);
    if(pi)pdf.addPage([W*0.75,H*0.75]);pdf.addImage(cv.toDataURL('image/jpeg',.9),'JPEG',0,0,W*0.75,H*0.75);});
  pdf.save('BDL-matching-'+new Date().toISOString().slice(0,10)+'.pdf');}
