<style>
:root{--navy:#0B2F70;--blue:#1E63D6;--gold:#D4AF37;--ink:#0F1F3D;--muted:#5A6E92;--line:#D6E4F7;--bg:#EEF3FB;--red:#B00020;--green:#2E7D32;--amber:#ED6C02}
*{box-sizing:border-box;border-radius:0!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Inter",-apple-system,sans-serif;padding-bottom:110px}
.num{font-family:"Inter",sans-serif;font-weight:700}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}

.hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.035) 39px 40px)}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero>*{position:relative}
.g{width:250px;height:250px;position:relative;margin:0 auto 18px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.35))}.g svg{width:250px;height:250px;transform:rotate(-90deg)}
.gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 34px}
.gc b{font:800 34px/1 "Inter",sans-serif;letter-spacing:-.5px}.gc small{font-size:12px;opacity:.85;margin-top:8px;font-weight:700;line-height:1.35}.gc em{font-style:normal;font:800 11px "Inter",sans-serif;letter-spacing:2px;opacity:.6;margin-bottom:8px}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.lg .net{grid-column:1/-1;background:linear-gradient(90deg,rgba(212,175,55,.22),rgba(212,175,55,.06));border-color:rgba(212,175,55,.45);--c:var(--gold);flex-direction:row;align-items:center;justify-content:space-between;min-height:0;padding:14px}

@media(min-width:760px){.hero{display:grid;grid-template-columns:270px 1fr;gap:20px;align-items:center}.g{margin:0}}
.tools{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;align-items:center}

.tools button.pri,.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}

.cols{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.col{background:#fff;border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line)}
.ic{width:34px;height:34px;display:grid;place-items:center;color:#fff;font:800 10px "Inter",sans-serif}
.ic.b{background:var(--blue)}.ic.g{background:var(--green)}
.ch b{font-size:13.5px}.ch span{display:block;font-size:11px;color:var(--muted);font-weight:700}

.r .a{font:800 16px "Inter",sans-serif}.r .st{font-size:10.5px;font-weight:800;padding:3px 7px}
.r .st.ok{background:#E3F7EE;color:var(--green)}.r .st.pend{background:#FFF1E0;color:#9A4B00}
.r .f{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.r input{border:1px solid var(--line);padding:7px 8px;font:600 12px "Inter",sans-serif;width:100%;min-width:0;color:var(--ink);background:#fff}
.r input.ar{font-family:inherit}
.r .m{font-size:11px;color:var(--muted);font-weight:700;margin-top:6px}
.r .x{border:0;background:transparent;color:var(--red);font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;padding:0 6px}
.r img{width:44px;height:44px;object-fit:cover;border:1px solid var(--line);float:inline-end;margin-inline-start:8px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:12px;font-weight:700}
.rep{background:#fff;border:1px solid var(--line);margin-top:12px}
.rep h4{margin:0;padding:12px;font-size:14px;color:var(--navy);display:flex;justify-content:space-between}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sum div{background:#fff;padding:10px 6px;text-align:center}.sum span{display:block;font-size:10.5px;color:var(--muted);font-weight:700}.sum b{font:800 15px "Inter",sans-serif;display:block;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12px}th{background:#F3F7FD;color:var(--muted);font-size:10.5px;padding:8px 6px;text-align:right}td{padding:9px 6px;border-top:1px solid var(--line)}
.d{display:inline-block;width:10px;height:10px;border-radius:50%!important;vertical-align:middle;margin-inline-end:5px}
.bar{position:fixed;left:10px;right:10px;bottom:16px;z-index:60;background:var(--navy);color:#fff;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.35);border-top:2px solid var(--gold);display:none}
.bar .rr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center;margin-bottom:10px}.bar .rr span{display:block;font-size:10.5px;opacity:.8;font-weight:700}.bar .rr b{font:800 16px "Inter",sans-serif}
.bar .aa{display:flex;gap:8px}.bar .aa button{flex:1;border:0;padding:12px;font:800 13px inherit;font-family:inherit;cursor:pointer;background:#fff;color:var(--navy)}.bar .aa button.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
#vw{position:fixed;inset:0;z-index:100000;background:#0B2F70;display:none;flex-direction:column}#vw .vwh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;color:#fff;font-size:12.5px;font-weight:800}#vw .vwh span{flex:1;font-family:Inter,sans-serif}#vw .vwh a{color:#D4AF37;font-size:12px;font-weight:800;text-decoration:none}#vw .vwh button{border:0;background:#D4AF37;color:#0B2F70;font:800 13px inherit;font-family:inherit;padding:10px 14px}#vw .vwb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#111;display:flex;align-items:flex-start;justify-content:center}#vw .vwb img{max-width:100%;height:auto;touch-action:pinch-zoom}#vw .vwb iframe{width:100%;height:100%;border:0;background:#fff}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:#fff;padding:10px 14px;font-size:12.5px;font-weight:700;opacity:0;transition:.2s;z-index:99;pointer-events:none}#toast.on{opacity:1}
.prog{height:3px;background:var(--line)}.prog i{display:block;height:3px;background:var(--gold);width:0;transition:.3s}
</style>

<body>
<header><img src="favicon.svg?v=bdl7" alt=""><div><h1>مقارنة الإيصالات</h1><small>الزبائن مقابل الموردين — جلسة مؤقتة</small></div><span class="tag" id="tag">حفظ محلي ٢٤ ساعة</span></header>
<main>
<div class="hero" id="hero"></div>
<div class="tools">
  <button class="pri" onclick="rematch()">إعادة المطابقة</button>
  <button id="rsm" style="display:none;background:#ED6C02;color:#fff;border-color:#ED6C02" onclick="resume()">متابعة القراءة</button>
  <button id="lkb" onclick="linkMode()">ربط يدوي ١:١</button>
  <span style="font-size:11px;color:var(--muted);font-weight:700">هامش %</span><input id="tol" inputmode="decimal" value="0.5" onchange="rematch()">
  <button onclick="exportPDF()">تقرير PDF</button>
  <button onclick="shareText()">نسخ للواتساب</button>
  <button class="danger" onclick="clearAll()">مسح الجلسة</button>
</div>
<div class="cols"><div id="c-cust"></div><div id="c-sup"></div></div>
<div class="rep" id="rep"></div>
</main>
<div class="bar" id="bar"></div>
<div id="toast"></div>
<input type="file" id="fi" multiple accept="image/*,application/pdf" style="display:none">
<input type="file" id="fw" accept=".zip,.txt,application/zip,text/plain" style="display:none">
<input type="file" id="fs" accept=".zip,image/*,application/pdf,application/zip" style="display:none">
<script>
'use strict';
const $=s=>document.querySelector(s);
const S={cust:[],sup:[],excl:[],link:false,selC:null,selS:null,seq:0,side:null,lim:{},rep:'period'};
let _rt=null;function renderSoon(){if(_rt)return;_rt=setTimeout(()=>{_rt=null;render();},350);}
const fmt=(n,d)=>{n=Number(n);return isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:d==null?0:d}):'—';};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200);};
const AOA=r=>r.ccy==='AOA'?Number(r.amount)||0:0;const sum=a=>a.reduce((s,x)=>s+AOA(x),0);
const days=d=>Math.max(0,Math.floor((Date.now()-d.getTime())/864e5));
const ageC=n=>n<=1?'#B00020':n<=7?'#ED6C02':n<=30?'#E6B800':'#1E63D6';const ageL=n=>n<=1?'يوم — عاجل':n<=7?'أسبوع — متابعة':n<=30?'شهر — تنبيه':'قديم';
const fx=v=>{v=Number(v)||0;return v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'K':fmt(v);};
const norm=c=>{c=String(c||'AOA').toUpperCase();return /KZ|AKZ|AOA/.test(c)?'AOA':/UM|MRU/.test(c)?'MRU':c;};
const key=r=>String(r.ref||'').replace(/\s+/g,'').toLowerCase();


/* ───── حفظ محلي (IndexedDB على هذا الجهاز فقط، ٢٤ ساعة) ───── */
const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const q=indexedDB.open('bdl_compare',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');};q.onsuccess=()=>{this.db=q.result;res(this.db);};q.onerror=()=>rej(q.error);});},
  async put(st,k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(st,k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async del(st,k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async clear(){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(['files','state'],'readwrite');t.objectStore('files').clear();t.objectStore('state').clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});}};
async function thumbOf(f){try{const bm=await createImageBitmap(f);const k=Math.min(1,220/Math.max(bm.width,bm.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*k));cv.height=Math.max(1,Math.round(bm.height*k));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);bm.close&&bm.close();return await new Promise(r=>cv.toBlob(r,'image/jpeg',.7));}catch(e){return null;}}
const SESSION_MS=24*36e5;
function ser(r){return {id:r.id,side:r.side,amount:r.amount,ccy:r.ccy,rccy:r.rccy||null,ref:r.ref,who:r.who,bank:r.bank,date:r.date.getTime(),src:r.src||'',note:r.note||'',fp:r.fp||null,hasFile:!!(r.file||r.hasFile),isPdf:!!r.pdf,reading:!!r.reading,fail:!!r.fail,unsure:!!r.unsure,edit:!!r.edit,excl:!!r.excl,srv:r.srv||null,verified:!!r.verified,review:!!r.review,alt:r.alt||null,matchedId:r.matched?r.matched.id:null,how:r.how||'',name:r.name||''};}
let _pt=null;function persist(){clearTimeout(_pt);_pt=setTimeout(async()=>{try{const st={ts:S.ts||Date.now(),seq:S.seq,rows:S.cust.concat(S.sup).map(ser),excl:(S.excl||[]).map(ser),tol:$('#tol').value,jobs:(S.jobs||[]).map(j=>({id:j.id,side:j.side,total:j.total,done:j.done,next:j.next,status:j.status,name:j.name}))};S.ts=st.ts;await IDB.put('state','session',st);
  for(const r of S.cust.concat(S.sup,S.excl||[])){if(r.thumb&&!r.tSaved){await IDB.put('files',r.id+'_t',r.thumb);r.tSaved=true;}}
  $('#tag').textContent='محفوظ محليًا · حتى '+new Date(st.ts+SESSION_MS).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){console.warn('persist',e);}},900);}
async function restoreSession(){try{const st=await IDB.get('state','session');if(!st)return false;
  if(Date.now()-st.ts>SESSION_MS){await IDB.clear();toast('انتهت صلاحية الجلسة السابقة (٢٤ ساعة) — بدأنا جلسة جديدة');return false;}
  S.ts=st.ts;S.seq=st.seq||0;if(st.tol)$('#tol').value=st.tol;S.jobs=st.jobs||[];const all=[];
  const mk=async o=>{const r={id:o.id,side:o.side,amount:o.amount,ccy:o.ccy||'AOA',rccy:o.rccy,ref:o.ref||'',who:o.who||'',bank:o.bank||'',date:new Date(o.date),src:o.src,note:o.note,fp:o.fp,hasFile:o.hasFile,pdf:o.isPdf,fail:o.fail,unsure:o.unsure,edit:o.edit,srv:o.srv||null,verified:o.verified,review:o.review,alt:o.alt,excl:o.excl,how:o.how,name:o.name,file:null,url:null,reading:!!o.reading,matched:null,_mid:o.matchedId};
    try{const t=await IDB.get('files',r.id+'_t');if(t){r.thumb=t;r.tSaved=true;r.url=URL.createObjectURL(t);}}catch(e){}return r;};
  for(const o of st.rows){const r=await mk(o);all.push(r);(r.side==='sup'?S.sup:S.cust).push(r);}
  S.excl=[];for(const o of st.excl||[]){S.excl.push(await mk(o));}
  all.forEach(r=>{if(r._mid){const o=all.find(x=>x.id===r._mid);if(o){r.matched=o;}}delete r._mid;});
  const pend=S.cust.concat(S.sup).filter(r=>r.reading).length;toast('استُعيدت الجلسة: '+S.cust.length+' زبائن · '+S.sup.length+' موردون'+(pend?' · '+pend+' بانتظار القراءة — اضغط «متابعة القراءة»':''));return true;}catch(e){console.warn('restore',e);return false;}}
/* عارض داخل الصفحة — iOS يمنع window.open بعد انتظار غير متزامن، لذا نعرض الإيصال في طبقة فوق الصفحة */
function viewer(u,pdf,title){let v=$('#vw');if(!v){v=document.createElement('div');v.id='vw';v.innerHTML='<div class="vwh"><button onclick="closeViewer()">✕ إغلاق — العودة للمبلغ</button><span id="vwt"></span><a id="vwo" target="_blank" rel="noopener">فتح في تبويب</a></div><div class="vwb" id="vwb"></div>';document.body.appendChild(v);}
  $('#vwt').textContent=title||'';$('#vwo').href=u;$('#vwb').innerHTML=pdf?'<iframe src="'+u+'"></iframe>':'<img src="'+u+'" alt="">';v.style.display='flex';document.body.style.overflow='hidden';S.vwUrl=u;
  /* زر الرجوع / سحب iOS للخلف يغلق العارض ولا يغادر الصفحة */
  if(!S.vwHist){try{history.pushState({vw:1},'');S.vwHist=true;}catch(e){}}}
function closeViewer(fromPop){const v=$('#vw');if(!v||v.style.display==='none')return;v.style.display='none';document.body.style.overflow='';if(S.vwUrl&&S.vwUrl.startsWith('blob:'))setTimeout(()=>URL.revokeObjectURL(S.vwUrl),1000);S.vwUrl=null;
  if(S.vwHist&&!fromPop){S.vwHist=false;try{history.back();}catch(e){}}else S.vwHist=false;}
window.addEventListener('popstate',()=>{closeViewer(true);});
async function openFile(id){const r=find(id)||(S.excl||[]).find(x=>x.id===id);if(!r)return;const t=(r.who||'')+' · '+(r.amount?fmt(r.amount)+' '+r.ccy:'');
  if(r.srv){viewer(r.srv,r.pdf,t);return;}
  let b=r.file;if(!b){try{b=await IDB.get('files',r.id);}catch(e){}}
  if(!b){toast('الملف الأصلي غير متاح (جلسة قديمة)');return;}
  viewer(URL.createObjectURL(b),r.pdf||isPdf(b),t);}
/* ───── الإدخال ───── */
function pick(side){S.side=side;$('#fi').value='';$('#fi').click();}
async function addFiles(side,list,tag){let dup=0;const arr=side==='sup'?S.sup:S.cust,added=[];
  for(const f of list){const fp=await fpOf(f);
    if(fp&&arr.some(x=>x.fp===fp)){dup++;continue;}
    const r={id:'r'+(++S.seq),side,file:f,fp,url:null,amount:null,ccy:'AOA',ref:'',who:'',bank:tag||'',date:new Date(f.lastModified||Date.now()),reading:true,matched:null,how:'',src:tag?'wa-img':'file',name:f.name,pdf:isPdf(f),hasFile:true};
    if(f._waDate)r.date=f._waDate;if(f._waWho)r.who=f._waWho;
    try{await IDB.put('files',r.id,f);}catch(e){}
    if(!r.pdf){r.thumb=await thumbOf(f);if(r.thumb)r.url=URL.createObjectURL(r.thumb);}
    arr.push(r);added.push(r);if(added.length%10===0)render();}
  if(dup)toast('رُفض '+dup+' ملف مكرر في نفس العمود');

const BATCH=50;

function render(){

  const R=104,C=2*Math.PI*R;let off=0;const arc=(v,col)=>{if(!tot||!v)return '';const d=v/tot*C;const s='<circle cx="125" cy="125" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="16" stroke-dasharray="'+Math.max(0,d-3)+' '+C+'" stroke-dashoffset="'+(-off)+'"/>';off+=d;return s;};
  const pct=tot?Math.round(vO/tot*100):0;

    '<div class="lg"><div style="--c:#FF4D6D"><span><i></i>نقص من الموردين</span><b>'+fx(vD)+'</b><u>'+def.length+' إيصال زبون بلا مقابل</u></div>'+
    '<div style="--c:#2ECC8A"><span><i></i>فائض إيصالات موردين</span><b>'+fx(vE)+'</b><u>'+exc.length+' إيصال مورد بلا زبون</u></div>'+
    '<div style="--c:#4F8BFF"><span><i></i>مطابَق</span><b>'+fx(vO)+'</b><u>'+ok.length+' زوج · '+pct+'%</u></div>'+
    '<div style="--c:#fff"><span><i></i>الإجمالي</span><b>'+fx(sum(S.cust))+'</b><u>'+S.cust.length+' زبون · '+S.sup.length+' مورد</u></div>'+
    '<div class="net"><span><i></i>صافي الفرق · AOA</span><b>'+(net>=0?'+':'−')+fx(Math.abs(net))+'</b></div></div>';
  (S.jobs||[]).forEach(j=>{const el=$('#srvp-'+j.side);if(el)el.textContent='الخادم يقرأ '+j.name+': '+j.done+' / '+j.total+(j.warn?' — '+j.warn:'');});
  {const n=S.cust.concat(S.sup).filter(r=>r.reading).length;const b=$('#rsm');b.style.display=n&&!S.busy?'':'none';b.textContent='متابعة القراءة ('+n+' متبقٍ)';}
  $('#lkb').className=S.link?'on':'';$('#lkb').textContent=S.link?'إنهاء الربط اليدوي':'ربط يدوي ١:١';
  $('#c-cust').innerHTML=col('cust');$('#c-sup').innerHTML=col('sup');
  const rows=def.map(r=>({r,side:'زبون',kind:'نقص',v:-AOA(r),c:'#B00020'})).concat(exc.map(r=>({r,side:'مورد',kind:'فائض',v:AOA(r),c:'#2E7D32'}))).sort((a,b)=>days(b.r.date)-days(a.r.date)||Math.abs(b.v)-Math.abs(a.v));
  const tg='<span><button class="x" style="color:'+(S.rep==='period'?'#fff':'var(--navy)')+';background:'+(S.rep==='period'?'var(--navy)':'#fff')+';border:1px solid var(--navy);padding:5px 9px" onclick="S.rep=\'period\';render()">الفترة</button><button class="x" style="color:'+(S.rep==='month'?'#fff':'var(--navy)')+';background:'+(S.rep==='month'?'var(--navy)':'#fff')+';border:1px solid var(--navy);padding:5px 9px" onclick="S.rep=\'month\';render()">شهري مفصّل</button></span>';
  if(S.rep==='month')$('#rep').innerHTML='<h4><span>التقرير الشهري المفصّل</span>'+tg+'</h4>'+monthlyHTML();
  else $('#rep').innerHTML='<h4><span>تقرير الفروقات</span>'+tg+'</h4>'+
    '<div class="sum"><div><span>إجمالي النقص (موردون)</span><b style="color:var(--red)">'+fmt(vD)+'</b></div><div><span>إجمالي الفائض (موردون)</span><b style="color:var(--green)">'+fmt(vE)+'</b></div><div><span>صافي الرصيد</span><b style="color:'+(net>=0?'var(--green)':'var(--red)')+'">'+(net>=0?'+':'−')+fmt(Math.abs(net))+'</b></div></div>'+
    (rows.length?'<div style="overflow:auto"><table><thead><tr><th>الحالة</th><th>التاريخ</th><th>النوع</th><th>الجهة</th><th>المبلغ</th><th>الفرق</th></tr></thead><tbody>'+rows.slice(0,200).map(x=>{const n=days(x.r.date),c=x.kind==='نقص'?ageC(n):'#1E63D6';return '<tr><td><span class="d" style="background:'+c+'"></span><span style="font-size:10.5px;font-weight:800;color:'+c+'">'+(x.kind==='نقص'?ageL(n):'فائض')+'</span></td><td class="num">'+x.r.date.toLocaleDateString('en-GB')+'</td><td style="color:'+x.c+';font-weight:800">'+x.side+'</td><td style="font-weight:700">'+esc(x.r.who||'—')+'</td><td class="num">'+fmt(x.r.amount)+' '+esc(x.r.ccy)+'</td><td class="num" style="color:'+x.c+'">'+(x.v>0?'+':'−')+fmt(Math.abs(x.v))+'</td></tr>';}).join('')+'</tbody></table></div>':'<div class="empty">'+(tot?'كل الإيصالات متطابقة ✓':'لا بيانات بعد')+'</div>');
  const b=$('#bar');const c=find(S.selC),s=find(S.selS);

    b.style.display='';b.innerHTML='<div class="rr"><div><span>فرق المبلغ</span><b style="color:'+(Math.abs(dA)<1?'#5CE0A3':'#FF7A8A')+'">'+(dA>=0?'+':'−')+fmt(Math.abs(dA))+'</b></div><div><span>فرق الأيام</span><b>'+dD+'</b></div><div><span>نسبة التطابق</span><b style="color:#D4AF37">'+pct.toFixed(1)+'%</b></div></div><div class="aa"><button onclick="link()">ربط الإيصالين ✓</button><button class="g" onclick="S.selC=S.selS=null;render()">إلغاء</button></div>';}
  else b.style.display='none';

}
/* ───── التقرير الشهري: كل شهر، كل مورد وكل زبون على حدة، والمبالغ مجمّعة ───── */
function monthly(){const M={};const mk=r=>{const k=r.date.getFullYear()+'-'+String(r.date.getMonth()+1).padStart(2,'0');return M[k]=M[k]||{k,cust:[],sup:[]};};
  S.cust.forEach(r=>mk(r).cust.push(r));S.sup.forEach(r=>mk(r).sup.push(r));
  return Object.values(M).sort((a,b)=>b.k.localeCompare(a.k)).map(m=>{const g=(arr)=>{const P={};arr.forEach(r=>{const n=(r.who||'بلا اسم').trim();const p=P[n]=P[n]||{name:n,n:0,tot:0,ok:0,okv:0,pend:0,pendv:0};p.n++;p.tot+=AOA(r);if(r.matched){p.ok++;p.okv+=AOA(r);}else{p.pend++;p.pendv+=AOA(r);}});return Object.values(P).sort((a,b)=>b.tot-a.tot);};
    const def=m.cust.filter(r=>!r.matched),exc=m.sup.filter(r=>!r.matched),ok=m.cust.filter(r=>r.matched);
    return {k:m.k,label:new Date(m.k+'-01').toLocaleDateString('ar',{month:'long',year:'numeric'}),nC:m.cust.length,nS:m.sup.length,vC:sum(m.cust),vS:sum(m.sup),vOk:sum(ok),vD:sum(def),vE:sum(exc),net:sum(exc)-sum(def),sups:g(m.sup),custs:g(m.cust)};});}
function monthlyHTML(){const L=monthly();if(!L.length)return '<div class="empty">لا بيانات بعد</div>';

    '<div class="sum" style="grid-template-columns:repeat(3,1fr)"><div><span>إيصالات الزبائن</span><b style="color:var(--blue)">'+fmt(m.vC)+'</b></div><div><span>إيصالات الموردين</span><b style="color:var(--green)">'+fmt(m.vS)+'</b></div><div><span>مطابَق</span><b>'+fmt(m.vOk)+'</b></div><div><span>نقص (زبائن بلا مورد)</span><b style="color:var(--red)">'+fmt(m.vD)+'</b></div><div><span>فائض موردين</span><b style="color:var(--green)">'+fmt(m.vE)+'</b></div><div><span>صافي الشهر</span><b style="color:'+(m.net>=0?'var(--green)':'var(--red)')+'">'+(m.net>=0?'+':'−')+fmt(Math.abs(m.net))+'</b></div></div>'+

function monthlyLines(){const L=[];monthly().forEach(m=>{L.push('',('— '+m.label+' —'),'إيصالات الزبائن: '+m.nC+' · '+fmt(m.vC)+' AOA','إيصالات الموردين: '+m.nS+' · '+fmt(m.vS)+' AOA','مطابَق: '+fmt(m.vOk)+' · نقص: '+fmt(m.vD)+' · فائض: '+fmt(m.vE)+' · صافي: '+(m.net>=0?'+':'−')+fmt(Math.abs(m.net)));

  const pdf=new JS({unit:'pt',format:[W*0.75,Math.min(H,14400)*0.75]});pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,W*0.75,H*0.75);pdf.save('BDL-compare-'+new Date().toISOString().slice(0,10)+'.pdf');}
