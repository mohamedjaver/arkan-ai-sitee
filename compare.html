<style>

.bar .aa{display:flex;gap:8px}.bar .aa button{flex:1;border:0;padding:12px;font:800 13px inherit;font-family:inherit;cursor:pointer;background:#fff;color:var(--navy)}.bar .aa button.g{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
#vw{position:fixed;inset:0;z-index:100000;background:#0B2F70;display:none;flex-direction:column}#vw .vwh{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;color:#fff;font-size:12.5px;font-weight:800}#vw .vwh span{flex:1;font-family:Inter,sans-serif}#vw .vwh a{color:#D4AF37;font-size:12px;font-weight:800;text-decoration:none}#vw .vwh button{border:0;background:#D4AF37;color:#0B2F70;font:800 13px inherit;font-family:inherit;padding:10px 14px}#vw .vwb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#111;display:flex;align-items:flex-start;justify-content:center}#vw .vwb img{max-width:100%;height:auto;touch-action:pinch-zoom}#vw .vwb iframe{width:100%;height:100%;border:0;background:#fff}

<body>
<header><img src="favicon.svg?v=bdl7" alt=""><div><h1>مقارنة الإيصالات</h1><small>الزبائن مقابل الموردين — دفتر دائم</small></div><span class="tag" id="tag">الدفتر</span><a class="tag" href="settle-v2.html" style="text-decoration:none;margin-inline-start:6px">مركز المطابقة</a><a class="tag" href="books.html" style="text-decoration:none;margin-inline-start:6px">دفاتري</a></header>
<main>
<div class="hero" id="hero"></div>
<div class="tools">
  <button class="pri" onclick="rematch()">إعادة المطابقة</button>

  <button id="lkb" onclick="linkMode()">ربط يدوي ١:١</button>
  <span style="font-size:11px;color:var(--muted);font-weight:700">هامش %</span><input id="tol" inputmode="decimal" value="0.5" onchange="rematch()">
  <button onclick="exportPDF()">تقرير PDF</button>

  <button onclick="quick(0)">هذا الشهر</button><button onclick="quick(2)">٣ أشهر</button><button onclick="quick(5)">٦ أشهر</button><button onclick="quick(-1)">الكل</button>
  <button class="pri" onclick="loadLedger()">تحميل من الدفتر</button>

<script>
'use strict';
const $=s=>document.querySelector(s);
const S={cust:[],sup:[],excl:[],link:false,selC:null,selS:null,seq:0,side:null,lim:{},rep:'period',range:{from:null,to:null}};
const inR=r=>{const t=r.date.getTime();return (!S.range.from||t>=S.range.from)&&(!S.range.to||t<S.range.to+864e5);};
const VC=()=>S.cust.filter(inR),VS=()=>S.sup.filter(inR);
let _rt=null;function typing(){const a=document.activeElement;return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&a.closest('.r');}
function renderSoon(){if(_rt)return;_rt=setTimeout(()=>{_rt=null;if(typing()){S.dirty=true;return;}render();},1200);}
document.addEventListener('focusout',()=>{if(S.dirty){S.dirty=false;setTimeout(render,150);}});
const fmt=(n,d)=>{n=Number(n);return isFinite(n)?n.toLocaleString('en-US',{maximumFractionDigits:d==null?0:d}):'—';};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2200);};
const AOA=r=>r.ccy==='AOA'?Number(r.amount)||0:0;const sum=a=>a.reduce((s,x)=>s+AOA(x),0);
const days=d=>Math.max(0,Math.floor((Date.now()-d.getTime())/864e5));
const ageC=n=>n<=1?'#B00020':n<=7?'#ED6C02':n<=30?'#E6B800':'#1E63D6';const ageL=n=>n<=1?'يوم — عاجل':n<=7?'أسبوع — متابعة':n<=30?'شهر — تنبيه':'قديم';
const fx=v=>{v=Number(v)||0;return v>=1e6?(v/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'K':fmt(v);};
const norm=c=>{c=String(c||'AOA').toUpperCase();return /KZ|AKZ|AOA/.test(c)?'AOA':/UM|MRU/.test(c)?'MRU':c;};
const key=r=>String(r.ref||'').replace(/\s+/g,'').toLowerCase();


/* ───── حفظ محلي (IndexedDB على هذا الجهاز فقط، ٢٤ ساعة) ───── */
const IDB={db:null,open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const q=indexedDB.open('bdl_compare',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files');if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');};q.onsuccess=()=>{this.db=q.result;res(this.db);};q.onerror=()=>rej(q.error);});},
  async put(st,k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(st,k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async del(st,k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async clear(){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(['files','state'],'readwrite');t.objectStore('files').clear();t.objectStore('state').clear();t.oncomplete=res;t.onerror=()=>rej(t.error);});}};
async function thumbOf(f){try{const bm=await createImageBitmap(f);const k=Math.min(1,220/Math.max(bm.width,bm.height));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(bm.width*k));cv.height=Math.max(1,Math.round(bm.height*k));cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);bm.close&&bm.close();return await new Promise(r=>cv.toBlob(r,'image/jpeg',.7));}catch(e){return null;}}
const SESSION_MS=24*36e5;
function ser(r){return {id:r.id,side:r.side,amount:r.amount,ccy:r.ccy,rccy:r.rccy||null,amountRead:r.amountRead||null,flags:r.flags||[],why:r.why||'',waDate:r.waDate||null,fileDate:r.fileDate||null,manual:!!r.manual,led:!!r.led,receipt_url:r.receipt_url||null,book_entry_id:r.book_entry_id||null,ref:r.ref,who:r.who,bank:r.bank,date:r.date.getTime(),src:r.src||'',note:r.note||'',fp:r.fp||null,hasFile:!!(r.file||r.hasFile),isPdf:!!r.pdf,reading:!!r.reading,fail:!!r.fail,unsure:!!r.unsure,edit:!!r.edit,excl:!!r.excl,srv:r.srv||null,verified:!!r.verified,review:!!r.review,alt:r.alt||null,matchedId:r.matched?r.matched.id:null,how:r.how||'',name:r.name||''};}
let _pt=null;function persist(){clearTimeout(_pt);_pt=setTimeout(async()=>{try{const st={ts:S.ts||Date.now(),seq:S.seq,rows:S.cust.concat(S.sup).map(ser),excl:(S.excl||[]).map(ser),tol:$('#tol').value,range:S.range,jobs:(S.jobs||[]).map(j=>({id:j.id,side:j.side,total:j.total,done:j.done,next:j.next,status:j.status,name:j.name}))};S.ts=st.ts;await IDB.put('state','session',st);
  for(const r of S.cust.concat(S.sup,S.excl||[])){if(r.thumb&&!r.tSaved){await IDB.put('files',r.id+'_t',r.thumb);r.tSaved=true;}}
  $('#tag').textContent='محفوظ محليًا · حتى '+new Date(st.ts+SESSION_MS).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}catch(e){console.warn('persist',e);}},900);}
async function restoreSession(){try{const st=await IDB.get('state','session');if(!st)return false;
  if(Date.now()-st.ts>SESSION_MS){await IDB.clear();toast('انتهت صلاحية الجلسة السابقة (٢٤ ساعة) — بدأنا جلسة جديدة');return false;}
  S.ts=st.ts;S.seq=st.seq||0;if(st.tol)$('#tol').value=st.tol;if(st.range){S.range=st.range;$('#rf').value=st.range.from?new Date(st.range.from).toISOString().slice(0,10):'';$('#rt').value=st.range.to?new Date(st.range.to).toISOString().slice(0,10):'';}S.jobs=st.jobs||[];const all=[];
  const mk=async o=>{const r={id:o.id,side:o.side,amount:o.amount,ccy:o.ccy||'AOA',rccy:o.rccy,amountRead:o.amountRead||null,flags:o.flags||[],why:o.why||'',waDate:o.waDate||null,fileDate:o.fileDate||null,manual:!!o.manual,led:!!o.led,receipt_url:o.receipt_url||null,book_entry_id:o.book_entry_id||null,ref:o.ref||'',who:o.who||'',bank:o.bank||'',date:new Date(o.date),src:o.src,note:o.note,fp:o.fp,hasFile:o.hasFile,pdf:o.isPdf,fail:o.fail,unsure:o.unsure,edit:o.edit,srv:o.srv||null,verified:o.verified,review:o.review,alt:o.alt,excl:o.excl,how:o.how,name:o.name,file:null,url:null,reading:!!o.reading,matched:null,_mid:o.matchedId};
    try{const t=await IDB.get('files',r.id+'_t');if(t){r.thumb=t;r.tSaved=true;r.url=URL.createObjectURL(t);}}catch(e){}return r;};
  for(const o of st.rows){const r=await mk(o);all.push(r);(r.side==='sup'?S.sup:S.cust).push(r);}
  S.excl=[];for(const o of st.excl||[]){S.excl.push(await mk(o));}
  all.forEach(r=>{if(r._mid){const o=all.find(x=>x.id===r._mid);if(o){r.matched=o;}}delete r._mid;});
  const pend=S.cust.concat(S.sup).filter(r=>r.reading).length;toast('استُعيدت الجلسة: '+S.cust.length+' زبائن · '+S.sup.length+' موردون'+(pend?' · '+pend+' بانتظار القراءة — اضغط «متابعة القراءة»':''));return true;}catch(e){console.warn('restore',e);return false;}}
/* عارض داخل الصفحة — iOS يمنع window.open بعد انتظار غير متزامن، لذا نعرض الإيصال في طبقة فوق الصفحة */
function viewer(u,pdf,title){let v=$('#vw');if(!v){v=document.createElement('div');v.id='vw';v.innerHTML='<div class="vwh"><button onclick="closeViewer()">✕ إغلاق — العودة للمبلغ</button><span id="vwt"></span><a id="vwo" target="_blank" rel="noopener">فتح في تبويب</a></div><div class="vwb" id="vwb"></div>';document.body.appendChild(v);}

function cmdHTML(){const d=cmdData();
  let h='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px">'+CMDS.map(c=>'<button class="x" style="position:static;color:'+(S.cmd.k===c[0]?'#fff':'var(--navy)')+';background:'+(S.cmd.k===c[0]?'var(--navy)':'#fff')+';border:1px solid var(--navy);padding:7px 10px;border-radius:8px" onclick="setCmd(\'k\',\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div>';
  if(S.cmd.k==='pair')h+='<div style="display:flex;gap:8px;padding:0 12px 10px;flex-wrap:wrap">'+selHTML('sup',names(S.sup),'اختر المورد')+selHTML('cust',names(S.cust),'اختر الزبون')+'</div>';
  if(S.cmd.k==='month')h+='<div style="padding:0 12px 10px">'+selHTML('m',d.months||[],'اختر الشهر').replace(/<option value="([^"]+)"([^>]*)>[^<]*<\/option>/g,(m0,v,a)=>'<option value="'+v+'"'+a+'>'+mLbl(v)+'</option>')+'</div>';
  h+='<h4 style="padding:4px 12px 8px"><span>'+esc(d.title)+'</span></h4>';
  if(d.sum.length)h+='<div class="sum" style="grid-template-columns:repeat(3,1fr)">'+d.sum.map(x=>'<div><span>'+esc(x[0])+'</span><b style="color:'+x[2]+'">'+(typeof x[1]==='number'&&Math.abs(x[1])>=1000?fmt(x[1]):fmt(x[1]))+'</b></div>').join('')+'</div>';
  if(d.note)h+='<div class="empty" style="color:var(--amber)">'+esc(d.note)+'</div>';
  (d.blocks||[]).forEach(b=>{if(b[0])h+='<h4 style="font-size:12.5px;padding:10px 12px 4px">'+b[0]+'</h4>';h+=b[2].length?T(b[1],b[2],b[3]):'<div class="empty">لا بيانات</div>';});
  return h;}
function cmdLines(){const d=cmdData();const strip=x=>String(x).replace(/<[^>]+>/g,'');const L=['— '+d.title+' —'];d.sum.forEach(x=>L.push(x[0]+': '+fmt(x[1])));if(d.note)L.push(d.note);
  (d.blocks||[]).forEach(b=>{L.push('');if(b[0])L.push('▪ '+b[0]);b[2].forEach(r=>L.push('• '+r.map(c=>typeof c==='number'?fmt(c):strip(c)).join(' · ')));if(b[3])L.push('= '+b[3].map(c=>typeof c==='number'?fmt(c):strip(c)).join(' · '));});return L;}
/* ───── التصدير ───── */
function rangeLbl(){return S.range.from||S.range.to?' · الفترة '+(S.range.from?new Date(S.range.from).toLocaleDateString('en-GB'):'…')+' → '+(S.range.to?new Date(S.range.to).toLocaleDateString('en-GB'):'اليوم'):'';}
function lines(){const cc=VC(),ss=VS();const def=cc.filter(r=>!r.matched),exc=ss.filter(r=>!r.matched),ok=cc.filter(r=>r.matched);const net=sum(exc)-sum(def);
  const L=['BDL — مقارنة الإيصالات · '+new Date().toLocaleDateString('en-GB')+rangeLbl(),'إيصالات الزبائن: '+cc.length+' · '+fmt(sum(cc))+' AOA','إيصالات الموردين: '+ss.length+' · '+fmt(sum(ss))+' AOA','مطابَق: '+ok.length+' · '+fmt(sum(ok))+' AOA','نقص (بلا مورد): '+def.length+' · '+fmt(sum(def))+' AOA','فائض موردين: '+exc.length+' · '+fmt(sum(exc))+' AOA','صافي الفرق: '+(net>=0?'+':'−')+fmt(Math.abs(net))+' AOA',''];
  if(def.length){L.push('— نقص (زبائن بلا إيصال مورد):');def.forEach(r=>L.push('• '+(r.who||'—')+' · '+fmt(r.amount)+' '+r.ccy+' · '+(r.ref||'بلا مرجع')+' · '+r.date.toLocaleDateString('en-GB')));L.push('');}
  if(exc.length){L.push('— فائض (موردون بلا زبون):');exc.forEach(r=>L.push('• '+(r.who||'—')+' · '+fmt(r.amount)+' '+r.ccy+' · '+(r.ref||'بلا مرجع')+' · '+r.date.toLocaleDateString('en-GB')));L.push('');}
  if(ok.length){L.push('— المطابَق:');ok.forEach(r=>L.push('• '+(r.who||'—')+' '+fmt(r.amount)+' / '+(r.matched.who||'—')+' '+fmt(r.matched.amount)+' · '+(HOW[r.how]||'')));}
  if(S.rep==='month')return L.slice(0,8).concat(monthlyLines());
  if(S.rep==='cmd')return L.slice(0,1).concat(cmdLines());
  return L;}
async function shareText(){const t=lines().join('\n');try{await navigator.clipboard.writeText(t);toast('نُسخ التقرير — الصقه في واتساب');}catch(e){prompt('انسخ النص:',t);}}
function exportPDF(){const JS=window.jspdf&&window.jspdf.jsPDF;if(!JS){toast('مكتبة PDF لم تُحمّل بعد');return;}
  const L=lines(),W=1000,lh=34,H=140+L.length*lh;const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const x=cv.getContext('2d');x.scale(2,2);
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#0B2F70';x.fillRect(0,0,W,90);x.fillStyle='#D4AF37';x.fillRect(0,90,W,2);
  x.fillStyle='#fff';x.font='800 30px Cairo, Inter, sans-serif';x.textAlign='right';x.direction='rtl';x.fillText('BDL · مقارنة الإيصالات — جلسة بلا حفظ',W-30,56);
  x.fillStyle='#0F1F3D';x.font='700 20px Cairo, Inter, sans-serif';
  L.forEach((s,i)=>{if(/^— /.test(s)){x.fillStyle='#0B2F70';x.font='800 22px Cairo, Inter, sans-serif';}else{x.fillStyle=/^نقص/.test(s)?'#B00020':/^فائض/.test(s)?'#2E7D32':'#0F1F3D';x.font='700 20px Cairo, Inter, sans-serif';}x.fillText(s,W-30,130+i*lh);});
  const pdf=new JS({unit:'pt',format:[W*0.75,Math.min(H,14400)*0.75]});pdf.addImage(cv.toDataURL('image/jpeg',.92),'JPEG',0,0,W*0.75,H*0.75);pdf.save('BDL-compare-'+new Date().toISOString().slice(0,10)+'.pdf');}
(async()=>{await restoreSession();render();pollJobs();await LED.index();render(true);})();
</script>
