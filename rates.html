<style>
:root{--bg:#F6FAFD;--card:#FFFFFF;--acc:#0058D9;--acc2:#0058D9;--gold:#0058D9;--gold2:#0058D9;--txt:#06133A;--dim:#3C4C74;--green:#0F9D6B;--stroke:#D9E2F2}

.card h2{font-size:15px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--dim);margin:12px 0 6px;font-weight:600}
input,select{width:100%;background:#FFFFFF;border:1px solid var(--stroke);border-radius:0;padding:15px;color:var(--txt);font-size:18px;font-family:'IBM Plex Mono';outline:none;text-align:center}
input:focus,select:focus{border-color:var(--acc)}
select{font-family:'Cairo';font-size:16px}
.res{background:linear-gradient(135deg,rgba(13,58,160,.16),rgba(0,39,118,.06));border:1px solid rgba(13,58,160,.3);border-radius:0;padding:18px;margin-top:16px;text-align:center}
.res .lbl{font-size:12px;color:var(--acc2);font-weight:700;margin-bottom:4px}

.res .rate{font-size:11px;color:var(--dim);margin-top:6px;font-family:'IBM Plex Mono'}
.tier{display:flex;gap:8px;margin-top:12px}
.tierbox{flex:1;background:#EEF3FB;border:1px solid var(--stroke);border-radius:0;padding:12px;text-align:center}

.tierbox .v{font-size:16px;font-weight:800;font-family:'IBM Plex Mono';margin-top:3px}
.go{width:100%;margin-top:18px;padding:17px;border:none;border-radius:0;font-size:16px;font-weight:800;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;cursor:pointer;font-family:'Cairo';box-shadow:0 10px 28px rgba(37,211,102,.3)}
.rateGrid{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;font-size:13px;align-items:center}
.rateGrid .h{font-size:11px;color:var(--dim);font-weight:700;padding-bottom:4px;border-bottom:1px solid var(--stroke)}
.rateGrid .cc{font-weight:800;font-family:'IBM Plex Mono'}
.rateGrid .pw{font-family:'IBM Plex Mono';color:var(--gold2);font-weight:700;text-align:center}
.rateGrid .pr{font-family:'IBM Plex Mono';color:var(--txt);text-align:center}

})();</script>

<script>
const $=id=>document.getElementById(id);
function fmt(n,d=0){return Number(n).toLocaleString('en-US',{maximumFractionDigits:d});}
const SYM={AOA:'Kz',MRU:'UM',CNY:'¥',AED:'AED',EUR:'€',USD:'$',USDT:'₮',MAD:'MAD'};
const NAMES={AOA:'كوانزا أنغولية',MRU:'أوقية موريتانية',CNY:'يوان صيني',AED:'درهم إماراتي',EUR:'يورو',USD:'دولار',USDT:'تيثر',MAD:'درهم مغربي'};

let DATA=null;
async function loadData(){
  /* أولًا: hash (رابط سريع) */
  try{
    const hash=location.hash.slice(1);
    if(hash){DATA=JSON.parse(decodeURIComponent(escape(atob(hash))));return;}
  }catch(e){}
  /* ثانيًا: الملف الثابت (الرابط الثابت للبايو) */
  try{
    const r=await fetch('rates-data.json?t='+Date.now());
    if(r.ok)DATA=await r.json();
  }catch(e){}
}
function render(){
  const app=$('app');
  if(!DATA||!DATA.r||!DATA.r.length){
    app.innerHTML='<div class="card"><div class="empty">لا توجد أسعار.<br>اطلب الرابط المحدّث من BDL.</div></div>';
    return;
  }
  const rows=DATA.r.filter(x=>+(x.bank)>0).map(x=>{
      const isA=x.ccy==='AOA';
      const pair=isA?'USD → AOA':`${x.ccy==='USDT'?'USD':x.ccy} → MRU`;
      const val=isA?`${x.bank} Kz`:`${x.bank} MRU`;
      const old=isA?`لكل دولار`:`${fmt(x.bank*10,1)} MRO`;
      return `<div class="cc">${SYM[x.ccy]||x.ccy} ${pair}</div><div class="pw">${val}</div><div class="pr" style="grid-column:span 2;text-align:center;color:#5A7396">${old}</div>`;
    }).join('');
  const _whoP=window.arkanT?arkanT('اسمك (اختياري)'):'اسمك (اختياري)';
  app.innerHTML=`
    <div class="card">
      <h2>أسعار البنوك المركزية اليوم — مرجعية</h2>
      <div class="rateGrid" style="grid-template-columns:1fr auto auto auto">
        <div class="h">العملة</div><div class="h" style="text-align:center">المرجع الرسمي</div><div class="h" style="grid-column:span 2;text-align:center">بالقديمة</div>
        ${rows}
      </div>
      <div class="note">أسعار رسمية للمعلومة فقط — أدخل مبلغك في الحاسبة لمعرفة ما تستلمه</div>
    </div>
    <div class="card">
      <h2>احسب تحويلك</h2>
      <label>العملة التي تريد تحويلها</label>
      <select id="cc" onchange="calc()">${DATA.r.map(x=>`<option value="${x.ccy}">${SYM[x.ccy]||x.ccy} — ${window.arkanT?arkanT(NAMES[x.ccy]||x.ccy):(NAMES[x.ccy]||x.ccy)}</option>`).join('')}</select>
      <div id="modeToggle" style="display:flex;gap:8px;margin:14px 0 4px">
        <button id="btnFwd" onclick="setMode('fwd')" style="flex:1;padding:10px;border-radius:0;border:1px solid rgba(61,220,151,.5);background:rgba(61,220,151,.12);color:#3DDC97;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer">أدفع عملة ← أستلم أوقية</button>
        <button id="btnRev" onclick="setMode('rev')" style="flex:1;padding:10px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:transparent;color:#8B8FA8;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer">أريد أوقية ← كم عملة؟</button>
      </div>
      <label id="amtLabel">المبلغ</label>
      <input id="amt" inputmode="decimal" placeholder="1000000" oninput="calc()">
      <div class="res">
        <div class="lbl" id="resLbl">تستلم بالأوقية</div>
        <div class="big" id="out">0</div>
        <div class="cur" id="resCur">MRU · أوقية</div>
        <div class="rate" id="usedRate"></div>
      </div>
      <input id="who" placeholder="${_whoP}" style="margin-top:14px;text-align:right;font-family:Tajawal;font-size:15px">
      <button class="go" onclick="send()">أرسل الطلب عبر واتساب</button>
      <div class="note">بعد الإرسال، أكّد الدفع وسنحوّل لك المبلغ فورًا.</div>
    </div>`;
  setMode('fwd');
}
let _mode='fwd';
function setMode(m){
  _mode=m;
  const cc=$('cc')?$('cc').value:'AOA';
  const cSym=SYM[cc]||cc;
  const T=window.arkanT||function(s){return s;};
  const bF=$('btnFwd'),bR=$('btnRev');
  if(!bF||!bR)return;
  if(m==='fwd'){
    bF.style.cssText='flex:1;padding:10px;border-radius:0;border:1px solid rgba(61,220,151,.5);background:rgba(61,220,151,.12);color:#3DDC97;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer';
    bR.style.cssText='flex:1;padding:10px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:transparent;color:#8B8FA8;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer';
    bF.textContent=T('أدفع عملة ← أستلم أوقية');
    bR.textContent=T('أريد أوقية ← كم عملة؟');
    if($('amtLabel'))$('amtLabel').textContent=T('المبلغ بـ')+' '+cSym;
  } else {
    bR.style.cssText='flex:1;padding:10px;border-radius:0;border:1px solid rgba(13,58,160,.5);background:rgba(13,58,160,.12);color:#0058D9;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer';
    bF.style.cssText='flex:1;padding:10px;border-radius:0;border:1px solid rgba(255,255,255,.08);background:transparent;color:#8B8FA8;font-family:Cairo;font-size:13px;font-weight:700;cursor:pointer';
    bF.textContent=T('أدفع عملة ← أستلم أوقية');
    bR.textContent=T('أريد أوقية ← كم عملة؟');
    if($('amtLabel'))$('amtLabel').textContent=T('كم أوقية تريد استلامها؟');
  }
  /* translate who placeholder */
  if($('who'))$('who').placeholder=T('اسمك (اختياري)');
  calc();
}
function calc(){
  if(window.arkanTrack)arkanTrack('calculate',{page:'rates'});
  if(!DATA)return;
  const cc=$('cc').value, raw=parseFloat(String($('amt').value||'').replace(/[^0-9.]/g,''))||0;
  const row=DATA.r.find(x=>x.ccy===cc);if(!row)return;
  const cName=NAMES[cc]||cc, cSym=SYM[cc]||cc;
  const thr=row.thr||0, thrM=row.thrM||0;
  if(_mode==='fwd'){
    /* عادي: أدفع عملة → أستلم أوقية */
    let tier,rate,tierLbl;
    if(raw>=thr){tier='w';rate=row.w;tierLbl=window.arkanT?arkanT('جملة'):'جملة';}
    else if(row.m&&raw>=thrM){tier='m';rate=row.m;tierLbl=window.arkanT?arkanT('الأعمال'):'الأعمال';}
    else{tier='r';rate=row.r;tierLbl=window.arkanT?arkanT('تجزئة'):'تجزئة';}
    const out=raw*rate;
    $('out').textContent=fmt(out,0);
    $('usedRate').textContent=tierLbl?`شريحة: ${tierLbl}`:'';
    if($('resLbl'))$('resLbl').textContent=window.arkanT?arkanT('تستلم بالأوقية'):'تستلم بالأوقية';
    if($('resCur'))$('resCur').innerHTML=`<span style="opacity:.5;font-size:12px">${cSym} ← </span>${window.arkanT?arkanT('MRU · أوقية'):'MRU · أوقية'}`;
  } else {
    /* عكسي: أريد X أوقية → أحتاج كم عملة؟ */
    if(cc==='AOA'&&+row.out){  /* بيع كوانزا: سعر موحّد */
      const q=raw/ +row.out;
      $('out').textContent=fmt(q,0);
      $('usedRate').textContent='';
      const _tL=window.arkanT?arkanT('تحتاج من'):'تحتاج من';
      if($('resLbl'))$('resLbl').textContent=_tL+' '+cName;
      if($('resCur'))$('resCur').innerHTML=`<span style="opacity:.5;font-size:12px">${window.arkanT?arkanT('MRU · أوقية'):'MRU ←'} </span>${cSym} · ${cName}`;
      return;
    }
    const rR=row.r, rM=row.m||null, rW=row.w;
    const qR=raw/rR, qM=rM?raw/rM:null, qW=raw/rW;
    let rate,bestOut,tierLbl;
    if(qW>=thr){rate=rW;bestOut=qW;tierLbl='جملة';}
    else if(rM&&qM&&qM>=thrM){rate=rM;bestOut=qM;tierLbl='الأعمال';}
    else{rate=rR;bestOut=qR;tierLbl='تجزئة';}
    $('out').textContent=fmt(bestOut,0);
    $('usedRate').textContent=tierLbl?`شريحة: ${tierLbl}`:'';
    const _tLabel=window.arkanT?arkanT('تحتاج من'):'تحتاج من';
    if($('resLbl'))$('resLbl').textContent=_tLabel+' '+cName;
    if($('resCur'))$('resCur').innerHTML=`<span style="opacity:.5;font-size:12px">${window.arkanT?arkanT('MRU · أوقية'):'MRU ←'} </span>${cSym} · ${cName}`;
  }
}
function send(){
  if(window.arkanTrack)arkanTrack('submit_order',{page:'rates'});
  const cc=$('cc').value, raw=parseFloat(String($('amt').value||'').replace(/[^0-9.]/g,''))||0;
  if(!raw){alert('أدخل المبلغ');return;}
  const row=DATA.r.find(x=>x.ccy===cc);
  const cSym=SYM[cc]||cc;
  const thr=row.thr||0, thrM=row.thrM||0;
  let rate,tierLbl,amtFgn,amtMRU;
  if(_mode==='fwd'){
    if(raw>=thr){rate=row.w;tierLbl='جملة';}
    else if(row.m&&raw>=thrM){rate=row.m;tierLbl='الأعمال';}
    else{rate=row.r;tierLbl='تجزئة';}
    amtFgn=raw; amtMRU=raw*rate;
  } else {
    const rR=row.r,rM=row.m,rW=row.w;
    const qR=raw/rR,qM=rM?raw/rM:null,qW=raw/rW;
    if(qW>=thr){rate=rW;tierLbl='جملة';amtFgn=qW;}
    else if(rM&&qM&&qM>=thrM){rate=rM;tierLbl='الأعمال';amtFgn=qM;}
    else{rate=rR;tierLbl='تجزئة';amtFgn=qR;}
    amtMRU=raw;
  }
  const who=$('who').value.trim();
  const ref='REQ-'+Date.now().toString().slice(-6);
  const msg=`BDL — طلب تحويل\n${ref}\n━━━━━━━━━━\n${who?'الاسم: '+who+'\n':''}المدفوع: ${fmt(amtFgn,0)} ${cSym} (${cc})\nالسعر: ${rate} (${tierLbl})\n━━━━━━━━━━\nالمستلَم: ${fmt(amtMRU,0)} أوقية (MRU)\n━━━━━━━━━━\nأؤكد رغبتي في التحويل.`;
  window.open('https://wa.me/'+DATA.wa+'?text='+encodeURIComponent(msg),'_blank');
}
function _oldSend_unused(){
  const cc=$('cc').value, amt=parseFloat(String($('amt').value||'').replace(/[^0-9.]/g,''))||0;
  if(!amt){alert('أدخل المبلغ');return;}
  const row=DATA.r.find(x=>x.ccy===cc);
  const thr=row.thr||0, thrM=row.thrM||0;
  let rate,tierLbl;
  if(amt>=thr){rate=row.w;tierLbl=window.arkanT?arkanT('جملة'):'جملة';}
  else if(row.m&&amt>=thrM){rate=row.m;tierLbl=window.arkanT?arkanT('الأعمال'):'الأعمال';}
  else{rate=row.r;tierLbl=window.arkanT?arkanT('تجزئة'):'تجزئة';}
  const out=amt*rate;
  const who=$('who').value.trim();
  const ref='REQ-'+Date.now().toString().slice(-6);
  const L=window.arkanLang?arkanLang():'ar';
  const T={ar:{h:'BDL — طلب تحويل',n:'الاسم',a:'المبلغ',r:'السعر',d:'المطلوب استلامه',c:'أؤكد رغبتي في التحويل.',u:'أوقية'},
           fr:{h:'BDL — Demande de transfert',n:'Nom',a:'Montant',r:'Taux',d:'À recevoir',c:'Je confirme ma demande de transfert.',u:'Ouguiya'},
           pt:{h:'BDL — Pedido de transferência',n:'Nome',a:'Montante',r:'Taxa',d:'A receber',c:'Confirmo o meu pedido de transferência.',u:'Ouguiya'}}[L]||{};
  const msg=
`${T.h}
${ref}
━━━━━━━━━━
${who?T.n+': '+who+'\n':''}${T.a}: ${fmt(amt)} ${SYM[cc]||cc} (${cc})
${T.r}: ${rate} (${tierLbl})
━━━━━━━━━━
${T.d}: ${fmt(out,0)} ${T.u} (MRU)
━━━━━━━━━━
${T.c}`;
  window.open('https://wa.me/'+DATA.wa+'?text='+encodeURIComponent(msg),'_blank');
}
loadData().then(render);
/* re-translate dynamic content on language switch */
document.addEventListener('arkan:lang',function(){
  /* update select options */
  var cc_el=$('cc');
  if(cc_el&&DATA){
    Array.from(cc_el.options).forEach(function(opt){
      var ccy=opt.value;
      var tName=window.arkanT?arkanT(NAMES[ccy]||ccy):(NAMES[ccy]||ccy);
      opt.textContent=(SYM[ccy]||ccy)+' — '+tName;
    });
  }
