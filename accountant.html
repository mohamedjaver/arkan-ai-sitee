<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المحاسب — BDL</title>
<script>/* صفحة المالك: جلسة محلية بهاتف المالك تكفي فورًا — بلا انتظار Firebase ولا شاشة بيضاء */(function(){try{var s=JSON.parse(localStorage.getItem('arkan_session')||'null');var ph=String(s&&s.phone||'').replace(/\D/g,'');if(!/36295050$/.test(ph)&&localStorage.getItem('arkan_admin_dev')!=='1')location.replace('account.html?next=accountant.html');}catch(e){location.replace('index.html');}})();</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213d; --paper:#f6f4ee; --card:#ffffff; --line:#e2ddd0;
  --gold:#b8892e; --red:#c0392b; --amber:#d08a15; --green:#2f8f5b; --mute:#6b6f7b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:560px;margin:0 auto;padding:16px 16px 60px;font-size:15px;line-height:1.6}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* رأس الصفحة */
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header h1{font-size:22px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:#eae7de;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%;background:#b9b9b9}
.chip.ok{background:#e3f3ea;color:var(--green)} .chip.ok i{background:var(--green)}
.chip.bad{background:#f9e5e2;color:var(--red)} .chip.bad i{background:var(--red)}

/* الرقم الأهم: بلا مقابل */
.hero{background:var(--ink);color:#fff;border-radius:18px;padding:22px 20px 18px;margin-bottom:12px}
.hero small{display:block;color:#c9cfdd;font-size:14px}
.hero .big{font-size:38px;font-weight:600;letter-spacing:-.5px;line-height:1.2;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .big span{font-size:16px;font-weight:400;color:#c9cfdd;margin-inline-start:6px}
.hero .sub{color:#c9cfdd;font-size:13px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.counts div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.counts b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.counts small{color:var(--mute);font-size:12px}
.counts .r b{color:var(--red)} .counts .a b{color:var(--amber)} .counts .g b{color:var(--green)}

/* الأزرار */
.actions{display:flex;gap:8px;margin-bottom:22px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:600;font-size:15px;background:var(--gold);color:#fff;transition:opacity .15s}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}

/* الأقسام */
section{margin-bottom:26px}
section h2{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
section h2 span{color:var(--mute);font-weight:400;font-size:13px}
.party{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.party .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.party .name{font-weight:600}
.party .meta{color:var(--mute);font-size:12px;margin-top:2px}
.party .sum{color:var(--red);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.party .tools{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);gap:8px}
.party.open .tools{display:flex}
.party .tools button{font-size:13px;padding:7px 12px;border-radius:10px;background:#eae7de}
.party .tools .wa{background:#e3f3ea;color:var(--green)}
.rc{font-size:12px;color:var(--mute);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;font-variant-numeric:tabular-nums}
.rc span{background:#f6f4ee;padding:2px 8px;border-radius:6px}

.report{background:var(--card);border:1px solid var(--line);border-right:4px solid var(--gold);border-radius:14px;padding:14px 16px;white-space:pre-wrap;line-height:1.75}
.report.empty{color:var(--mute);border-right-color:var(--line)}

/* التشخيص */
.diag{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px}
.diag div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.diag div:last-child{border:0}
.diag .bad{color:var(--red)} .diag .ok{color:var(--green)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>المحاسب <a href="compare.html" style="font-size:13px;font-weight:400;color:var(--gold);text-decoration:none;margin-inline-start:8px">المطابقة</a></h1>
  <span class="chip" id="chip"><i></i><span>جارٍ الفحص</span></span>
</header>


<div id="app">
  <div class="hero">
    <small>إيصالات زبائن لم يصل مقابلها لأي مورد</small>
    <div class="big" id="openSum">—<span>AOA</span></div>
    <div class="sub" id="openMeta"></div>
  </div>

  <div class="counts">
    <div class="r"><b id="cOpen">—</b><small>بلا مقابل</small></div>
    <div class="a"><b id="cRev">—</b><small>تحتاج مراجعة</small></div>
    <div class="g"><b id="cMat">—</b><small>مطابق</small></div>
  </div>

  <div class="actions">
    <button class="btn" id="runBtn" onclick="run()">اكتب تقرير اليوم</button>
    <button class="btn ghost" onclick="load(true)">تحديث</button>
  </div>

  <section>
    <h2>تقرير المحاسب <span id="repAt"></span></h2>
    <div class="report empty" id="report">لا يوجد تقرير بعد. اضغط «اكتب تقرير اليوم».</div>
  </section>

  <section>
    <h2>حسب الجهة <span id="pCount"></span></h2>
    <div id="parties"></div>
  </section>

  <section>
    <h2>حالة الاتصال</h2>
    <div class="diag" id="diag"></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://arkan-ai-site-production.up.railway.app';
function tokenOf(){try{const j=JSON.parse(localStorage.getItem('arkan_sb_jwt')||'null');if(j&&j.token&&j.exp>Math.floor(Date.now()/1000)+60)return j.token;}catch(e){}return null;}
const H = () => ({ Authorization: 'Bearer ' + (tokenOf() || ''), 'content-type': 'application/json' });
const $ = id => document.getElementById(id);
const fmt = n => Math.round(Number(n)||0).toLocaleString('en-US');
const dt = s => s ? String(s).slice(0,10) : '';
let toastT; const toast = m => { $('toast').textContent = m; $('toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(()=>$('toast').classList.remove('show'), 2600); };

async function api(p, opt={}) {
  const r = await fetch(API + p, { ...opt, headers: H() });
  const j = await r.json().catch(()=>({}));
  if (r.status === 401) { location.replace('account.html?next=accountant.html'); }
  if (r.status === 404) throw new Error('الخادم لم يُحدَّث بعد — Railway لم ينشر آخر إصدار (تحقق من Deployments)');
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function setChip(cls, txt){ const c = $('chip'); c.className = 'chip ' + cls; c.lastElementChild.textContent = txt; }

async function status(){
  const s = await api('/accountant/status');
  $('diag').innerHTML = Object.entries(s.checks).map(([k,v]) =>
    `<div><span>${{anthropic_key:'مفتاح Claude',claude_call:'اختبار Claude',ledger:'قراءة الدفتر',telegram:'تيليجرام'}[k]||k}</span><span class="${/ناقص|فشل/.test(v)?'bad':'ok'}">${v}</span></div>`
  ).join('') + `<div><span>النموذج</span><span>${s.model}</span></div>`;
  setChip(s.ok ? 'ok' : 'bad', s.ok ? 'متصل' : 'يوجد خلل — انظر أسفل');
  $('runBtn').disabled = !s.ok;
  if (!s.ok) $('report').textContent = 'أصلح الخلل في «حالة الاتصال» أسفل الصفحة ثم اضغط تحديث.';
  return s.ok;
}

async function load(refresh){
  const s = await api('/accountant/summary');
  $('openSum').innerHTML = fmt(s.openSum) + '<span>AOA</span>';
  $('openMeta').textContent = `${s.open} إيصال · ${s.parties.length} جهة · من أصل ${s.total} إيصال بقيمة ${fmt(s.sum)}`;
  $('cOpen').textContent = s.open; $('cRev').textContent = s.review; $('cMat').textContent = s.matched;
  $('pCount').textContent = s.parties.length ? `${s.parties.length} جهة` : '';
  $('parties').innerHTML = s.parties.length ? s.parties.map((p,i) => `
    <div class="party" id="p${i}">
      <div class="row" onclick="this.parentNode.classList.toggle('open')">
        <div><div class="name">${esc(p.party)}</div><div class="meta">${p.count} إيصال${p.phone ? ' · ' + esc(p.phone) : ''}${p.oldest ? ' · أقدمها ' + dt(p.oldest) : ''}</div></div>
        <div class="sum">${fmt(p.sum)}</div>
      </div>
      <div class="rc">${p.receipts.map(r => `<span>${fmt(r.amount)} · ${dt(r.date)}${r.bank ? ' · ' + esc(r.bank) : ''}</span>`).join('')}</div>
      <div class="tools">
        <button class="wa" onclick="wa(${i})">رسالة واتساب</button>
        <button onclick="copy(${i})">نسخ التفاصيل</button>
      </div>
    </div>`).join('') : '<div class="report empty">لا توجد إيصالات بلا مقابل. الدفتر متوازن.</div>';
  window._parties = s.parties;
  if (refresh) toast('تم التحديث');
}

async function showReport(){
  const r = await api('/accountant/report');
  if (r.text) { $('report').textContent = r.text; $('report').classList.remove('empty'); $('repAt').textContent = r.date || ''; }
}
async function run(){
  const b = $('runBtn'); b.disabled = true; b.textContent = 'Claude يكتب…';
  try { await api('/accountant/run', { method:'POST', body:'{}' }); await showReport(); toast('تم كتابة التقرير'); }
  catch(e){ toast(e.message); }
  b.disabled = false; b.textContent = 'اكتب تقرير اليوم';
}
function partyText(p){
  return `الجهة: ${p.party}${p.phone?' ('+p.phone+')':''}\nإيصالات بلا مقابل: ${p.count}\nالإجمالي: ${fmt(p.sum)} AOA\n` +
    p.receipts.map(r => `- ${fmt(r.amount)} AOA · ${dt(r.date)}${r.ref?' · '+r.ref:''}`).join('\n');
}
function wa(i){
  const p = window._parties[i];
  const msg = `السلام عليكم ${p.party}،\nلدينا ${p.count} إيصال بقيمة ${fmt(p.sum)} AOA لم يصل مقابلها بعد. نرجو التأكيد أو الإفادة.\n\n` +
    p.receipts.slice(0,10).map(r => `- ${fmt(r.amount)} AOA · ${dt(r.date)}`).join('\n') + '\n\nBDL — لبدال';
  const ph = (p.phone||'').replace(/\D/g,'');
  location.href = `https://wa.me/${ph}?text=${encodeURIComponent(msg)}`;
}
async function copy(i){ await navigator.clipboard.writeText(partyText(window._parties[i])); toast('تم النسخ'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

(async () => {
  if (!tokenOf()) { location.replace('account.html?next=accountant.html'); return; }
  try {
    const ok = await status();
    if (ok) { await Promise.all([load(), showReport()]); }
  } catch(e) { setChip('bad', e.message); }
})();
</script>
</body>
</html>
